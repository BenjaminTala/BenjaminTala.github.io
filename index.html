<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0c1d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>CRYPT OF THE CHAMPION</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0c1d; --panel:#16142b; --panel2:#1f1c3a; --ink:#e8e6f5;
    --green:#5cff8f; --amber:#ffcf4d; --red:#ff5c6a; --blue:#6cb8ff;
    --purple:#c06cff; --dim:#6f6a9a; --line:#3a356b; --teal:#4ce0d0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Press Start 2P',monospace;font-size:12px;line-height:1.8;
    display:flex;justify-content:center;align-items:flex-start;padding:18px 10px 40px;image-rendering:pixelated;-webkit-font-smoothing:none;}
  #app{width:100%;max-width:680px}
  h1,h2,h3{margin:0;font-weight:400}
  .title{text-align:center;color:var(--amber);font-size:22px;line-height:1.5;text-shadow:3px 3px 0 #000,0 0 14px rgba(255,207,77,.35);margin:14px 0 6px;}
  .subtitle{text-align:center;color:var(--dim);font-size:9px;margin-bottom:22px}
  .blink{animation:blink 1s steps(2,start) infinite}@keyframes blink{to{visibility:hidden}}
  .panel{background:var(--panel);border:3px solid var(--line);box-shadow:0 0 0 3px #000,6px 6px 0 rgba(0,0,0,.5);padding:16px;margin-bottom:14px;}
  .panel.tight{padding:12px}
  .center{text-align:center}.muted{color:var(--dim)}
  .green{color:var(--green)}.amber{color:var(--amber)}.red{color:var(--red)}.blue{color:var(--blue)}.purple{color:var(--purple)}.teal{color:var(--teal)}
  pre.sprite{margin:0;font-family:'Press Start 2P',monospace;line-height:1.25;font-size:11px;white-space:pre;text-align:center;color:var(--green);text-shadow:0 0 6px rgba(92,255,143,.4);}
  .btn{display:block;width:100%;text-align:left;cursor:pointer;font-family:inherit;font-size:11px;color:var(--ink);background:var(--panel2);border:3px solid var(--line);padding:12px 14px;margin:8px 0;line-height:1.5;transition:transform .05s,background .1s,border-color .1s;}
  .btn:hover{background:#2a265080;border-color:var(--amber);color:#fff}
  .btn:active{transform:translate(2px,2px)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn .k{color:var(--amber);margin-right:8px}
  .btn small{display:block;color:var(--dim);font-size:9px;margin-top:6px;line-height:1.6}
  .btn:hover small{color:#b9b4e6}
  .row{display:flex;gap:10px;flex-wrap:wrap}.row .btn{flex:1;min-width:120px}
  .grid3{display:flex;gap:10px;flex-wrap:wrap}.grid3 .card{flex:1;min-width:150px}
  .bar{margin:6px 0}
  .bar .lbl{font-size:9px;display:flex;justify-content:space-between;margin-bottom:3px}
  .bar .track{background:#000;border:2px solid var(--line);height:14px;padding:1px}
  .bar.mini .track{height:9px}.bar.xp .track{height:7px}
  .bar .fill{height:100%;transition:width .35s ease}
  .fill.hp{background:linear-gradient(var(--green),#2faf5a)}
  .fill.mp{background:linear-gradient(var(--blue),#356fbf)}
  .fill.boss{background:linear-gradient(var(--red),#a82f3a)}
  .fill.xpf{background:linear-gradient(var(--amber),#b88a1f)}
  .fill.chg{background:linear-gradient(var(--purple),var(--blue))}
  .fill.chg.ready{background:linear-gradient(#fff,var(--amber));animation:chgpulse .7s ease-in-out infinite}
  @keyframes chgpulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.6)}}
  .btn.ult{border-color:var(--purple);background:linear-gradient(90deg,#2a1c4a,#1f1c3a)}
  .btn.ult.ready{border-color:var(--amber);color:#fff;text-shadow:0 0 6px var(--amber);animation:chgpulse 1s ease-in-out infinite}
  .stats{font-size:9px;line-height:2;color:var(--dim)}.stats b{color:var(--ink)}
  .chip{display:inline-block;background:#000;border:2px solid var(--line);padding:3px 7px;margin:3px 3px 3px 0;font-size:8px}
  .relics{margin-top:6px}.relics .chip{border-color:var(--purple);color:var(--purple)}
  .r-com{color:#cfcbef}.r-unc{color:var(--green)}.r-rare{color:var(--blue)}.r-epic{color:var(--purple)}.r-leg{color:var(--amber)}
  .slot{border:2px solid var(--line);background:#00000055;padding:8px 10px;margin:6px 0;font-size:10px;text-align:left;line-height:1.7}
  .invtabs{display:flex;gap:6px;margin:4px 0 12px}
  .invtabs button{flex:1;font-family:inherit;font-size:9px;padding:9px 4px;background:var(--panel2);color:var(--dim);border:2px solid var(--line);cursor:pointer;touch-action:manipulation;letter-spacing:1px}
  .invtabs button.on{color:var(--amber);border-color:var(--amber);background:#2a1c1a40}
  .invtabs button:hover{border-color:var(--amber)}
  .cur-row{text-align:center;font-size:10px;margin:2px 0 10px;letter-spacing:1px}
  .ivh{font-size:11px;margin:12px 0 4px}
  .best-row{display:flex;justify-content:space-between;align-items:center;border:2px solid var(--line);background:#00000055;padding:7px 9px;margin:5px 0;font-size:9px;gap:8px}
  .best-bar{flex:0 0 78px;height:9px;background:#000;border:2px solid var(--line)}
  .best-bar>i{display:block;height:100%;background:linear-gradient(var(--red),#a82f3a)}
  .c-burn{border-color:var(--amber);color:var(--amber)}.c-pois{border-color:var(--green);color:var(--green)}
  .c-weak{border-color:var(--purple);color:var(--purple)}.c-vuln{border-color:var(--red);color:var(--red)}
  .c-stun{border-color:var(--teal);color:var(--teal)}.c-guard{border-color:var(--blue);color:var(--blue)}
  .enemies-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:flex-end}
  .enemy-cell{flex:1;min-width:118px;max-width:200px;border:3px solid transparent;padding:6px;transition:border-color .1s;position:relative}
  .fxlayer{position:absolute;left:0;right:0;top:26%;pointer-events:none;text-align:center;z-index:6;line-height:1}
  .dmgfloat{display:inline-block;margin:0 2px;font-size:13px;color:var(--red);text-shadow:2px 2px 0 #000;animation:floatUp .9s ease-out forwards}
  .dmgfloat.crit{color:var(--purple);font-size:18px;text-shadow:0 0 8px var(--purple),2px 2px 0 #000}
  @keyframes floatUp{0%{opacity:0;transform:translateY(8px) scale(.7)}18%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-30px) scale(1)}}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:150;opacity:0;transition:opacity .3s;box-shadow:inset 0 0 110px 36px rgba(255,30,50,.55)}
  #vignette.on{opacity:1;animation:vigpulse 1.1s ease-in-out infinite}
  @keyframes vigpulse{0%,100%{opacity:.5}50%{opacity:.95}}
  .enemy-cell.target{border-color:var(--amber);background:#00000055}
  .enemy-cell.dead{opacity:.25;filter:grayscale(1)}
  .enemy-cell pre.sprite{font-size:9px;color:var(--red)}
  .enemy-cell.elite pre.sprite{color:var(--amber);text-shadow:0 0 8px rgba(255,207,77,.6)}
  .tgt{width:100%;font-family:inherit;font-size:8px;cursor:pointer;color:var(--ink);background:#000;border:2px solid var(--line);padding:4px;margin-top:4px}
  .tgt.on{border-color:var(--amber);color:var(--amber)}.tgt:hover{border-color:var(--amber)}
  .log{background:#000;border:3px solid var(--line);padding:10px;height:112px;overflow:hidden;font-size:9px;line-height:1.7;margin:12px 0;display:flex;flex-direction:column;justify-content:flex-end;}
  .log div{opacity:.5}.log div:last-child{opacity:1;color:#fff}
  .log .dmg{color:var(--red)}.log .heal{color:var(--green)}.log .info{color:var(--amber)}.log .crit{color:var(--purple)}.log .lvl{color:var(--teal)}
  .shake{animation:shake .3s}@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-4px,1px)}80%{transform:translate(4px,-1px)}}
  .flash{animation:flash .3s}@keyframes flash{0%,100%{filter:none}50%{filter:brightness(2.2) sepia(1) hue-rotate(-50deg) saturate(6)}}
  .hitpop{animation:hitpop .25s}@keyframes hitpop{0%{transform:scale(1)}50%{transform:scale(1.14)}100%{transform:scale(1)}}
  .fade{animation:fade .4s}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .floortag{text-align:center;font-size:9px;letter-spacing:1px;margin-bottom:10px}
  .omentag{text-align:center;font-size:8px;color:var(--teal);margin-bottom:8px}
  .hr{border:none;border-top:2px dashed var(--line);margin:14px 0}
  .menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.menu-grid .btn{margin:0}
  .footer{text-align:center;color:var(--dim);font-size:8px;margin-top:8px}
  .evtext{font-size:10px;line-height:2;color:#cfcbef;margin:10px 0}
  ::selection{background:var(--amber);color:#000}
  /* mobile/touch */
  .btn,.tgt,.btn *{touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  @media (hover:none){.btn:hover{background:var(--panel2);border-color:var(--line);color:var(--ink)}.btn:hover small{color:var(--dim)}}
  .btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  /* audio toggles */
  #audio-toggles{position:fixed;top:6px;right:6px;z-index:200;display:flex;gap:4px;font-family:'Press Start 2P',monospace}
  #inv-fab{position:fixed;top:6px;left:6px;z-index:200;font-family:'Press Start 2P',monospace}
  #inv-fab button{font-family:inherit;font-size:8px;background:var(--panel);color:var(--amber);border:2px solid var(--line);padding:6px 8px;cursor:pointer;letter-spacing:1px;touch-action:manipulation}
  #inv-fab button:hover{border-color:var(--amber)}
  .coinbar{display:flex;justify-content:center;gap:14px;align-items:center;margin:6px 0 12px;font-size:14px;letter-spacing:1px}
  .coinbar .amber{text-shadow:0 0 10px rgba(255,207,77,.6)}
  .coinbar .teal{text-shadow:0 0 10px rgba(76,224,208,.5)}
  #audio-toggles button{font-family:inherit;font-size:8px;background:var(--panel);color:var(--ink);
    border:2px solid var(--line);padding:6px 8px;cursor:pointer;line-height:1;letter-spacing:1px;touch-action:manipulation}
  #audio-toggles button:hover{border-color:var(--amber)}
  #audio-toggles button.off{color:var(--dim);border-color:#2a2748;text-decoration:line-through}
  /* narrow screens */
  @media (max-width:560px){
    body{padding:42px 4px 24px;font-size:11px}
    #app{max-width:100%}
    .title{font-size:18px;margin:8px 0 4px}
    .subtitle{font-size:8px;margin-bottom:14px}
    .panel{padding:10px;border-width:2px;margin-bottom:10px;box-shadow:0 0 0 2px #000,4px 4px 0 rgba(0,0,0,.5)}
    .panel.tight{padding:8px}
    .btn{font-size:10px;padding:12px 10px;line-height:1.4;min-height:44px;margin:6px 0}
    .btn small{font-size:8px;margin-top:5px;line-height:1.6}
    .menu-grid{grid-template-columns:1fr;gap:6px}
    .row{gap:6px}.row .btn{min-width:0;flex-basis:calc(50% - 3px)}
    .grid3{flex-direction:column;gap:8px}.grid3 .card{min-width:0}
    .enemies-row{gap:4px}
    .enemy-cell{min-width:0;flex:1 1 calc(50% - 4px);max-width:none;padding:4px}
    .enemy-cell pre.sprite{font-size:8px;line-height:1.15}
    pre.sprite{font-size:9px;line-height:1.2}
    .log{height:104px;font-size:8px;padding:8px;line-height:1.6}
    .floortag{font-size:8px;margin-bottom:6px}
    .omentag{font-size:7px}
    .stats{font-size:8px;line-height:1.9}
    .chip{font-size:7px;padding:2px 5px;margin:2px 2px 2px 0}
    .bar .lbl{font-size:8px}
    .slot{padding:6px 8px;font-size:9px;line-height:1.6}
    .evtext{font-size:9px;line-height:1.9}
    .tgt{font-size:7px;padding:5px 3px}
    .footer{font-size:7px;line-height:1.7}
    #audio-toggles button{font-size:7px;padding:5px 6px}
  }
  @media (max-width:380px){
    .title{font-size:15px}
    .row .btn{flex-basis:100%}
    .enemy-cell{flex-basis:100%}
    pre.sprite{font-size:8px}
  }
  /* ==== sprites (PNG art, with ASCII fallback) ==== */
  /* Native canvas sizes vary wildly (zombie 110x120, demonlord 256x256, dragon 256x152).
     We constrain by max-height so the on-screen *creature* feels consistent, then tune per-monster. */
  .sprite-enemy{display:block;margin:4px auto;image-rendering:pixelated;image-rendering:crisp-edges;
    width:auto;height:auto;max-width:100%;max-height:96px}
  .sprite-enemy.spr-slime    {max-height:66px}
  .sprite-enemy.spr-zombie   {max-height:84px}
  .sprite-enemy.spr-condor   {max-height:82px}
  .sprite-enemy.spr-demon    {max-height:84px}
  .sprite-enemy.spr-ghost    {max-height:88px}
  .sprite-enemy.spr-goblin   {max-height:88px}
  .sprite-enemy.spr-sahagin  {max-height:92px}
  .sprite-enemy.spr-golem    {max-height:104px}
  .sprite-enemy.spr-dragon   {max-height:108px;max-width:170px}
  .sprite-enemy.spr-demonlord{max-height:110px}
  /* Bosses are 1.5x and override per-key for those that need extra mass */
  .sprite-enemy.boss              {max-height:150px;max-width:200px}
  .sprite-enemy.boss.spr-golem    {max-height:160px}
  .sprite-enemy.boss.spr-dragon   {max-height:160px;max-width:220px}
  .sprite-enemy.boss.spr-demonlord{max-height:170px}
  /* In room-preview cells they shrink uniformly so the row line up */
  .enemy-cell .sprite-enemy     {max-height:72px;max-width:90px}
  .enemy-cell .sprite-enemy.boss{max-height:104px;max-width:130px}
  .enemy-cell.elite .sprite-enemy{filter:drop-shadow(0 0 6px #ffcf4d)}
  /* zone tiers — escalating menace after each boss */
  .sprite-enemy.tier-1{filter:drop-shadow(0 0 5px #4ce0d0) drop-shadow(0 0 2px #4ce0d0)}
  .sprite-enemy.tier-2{filter:drop-shadow(0 0 6px #ff5c6a) drop-shadow(0 0 3px #ff5c6a) saturate(1.15)}
  .sprite-enemy.tier-3{filter:drop-shadow(0 0 8px #c06cff) drop-shadow(0 0 4px #c06cff) saturate(1.3) contrast(1.05)}
  .enemy-cell.elite .sprite-enemy.tier-1{filter:drop-shadow(0 0 6px #ffcf4d) drop-shadow(0 0 5px #4ce0d0)}
  .enemy-cell.elite .sprite-enemy.tier-2{filter:drop-shadow(0 0 7px #ffcf4d) drop-shadow(0 0 5px #ff5c6a)}
  .enemy-cell.elite .sprite-enemy.tier-3{filter:drop-shadow(0 0 8px #ffcf4d) drop-shadow(0 0 6px #c06cff)}
  .sprite-enemy.boss{filter:drop-shadow(0 0 10px #ff5c6a) drop-shadow(0 0 18px rgba(255,92,106,.5))}
  .sprite-enemy.boss.tier-1{filter:drop-shadow(0 0 10px #4ce0d0) drop-shadow(0 0 20px rgba(76,224,208,.6))}
  .sprite-enemy.boss.tier-2{filter:drop-shadow(0 0 12px #ff5c6a) drop-shadow(0 0 22px rgba(255,92,106,.6))}
  .sprite-enemy.boss.tier-3{filter:drop-shadow(0 0 14px #c06cff) drop-shadow(0 0 26px rgba(192,108,255,.7)) saturate(1.3)}
  /* player class portraits (cropped from JRPG sheet, 98x98 native, character fills ~60% of canvas).
     Display big so the hero feels heroic, not tiny. Soft idle bob for life. */
  .sprite-player{display:block;margin:8px auto;image-rendering:pixelated;
    width:144px;height:144px;background-repeat:no-repeat;background-size:contain;background-position:center;
    animation:idleBob 2.2s ease-in-out infinite}
  .sprite-player.warrior{background-image:url('assets/players/warrior.png');
    filter:drop-shadow(0 0 8px rgba(255,92,106,.55))}
  .sprite-player.ranger{background-image:url('assets/players/ranger.png');
    filter:drop-shadow(0 0 8px rgba(92,255,143,.5))}
  .sprite-player.mage{background-image:url('assets/players/mage.png');
    filter:drop-shadow(0 0 10px rgba(192,108,255,.65))}
  @keyframes idleBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .sprite-player.dead{filter:grayscale(1) brightness(.5);animation:none}
  /* title-screen centerpiece */
  .title-art{display:block;margin:8px auto 14px;image-rendering:pixelated;
    max-width:220px;max-height:170px;width:auto;height:auto;
    filter:drop-shadow(0 0 14px rgba(255,92,106,.5)) drop-shadow(0 0 22px rgba(255,207,77,.3));
    animation:idleBob 3s ease-in-out infinite}
  /* info modal (popup explanations for concepts + tappable chips) */
  #info-modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;
    display:flex;align-items:center;justify-content:center;padding:20px;
    font-family:'Press Start 2P',monospace}
  #info-modal.hidden{display:none}
  .info-card{background:var(--panel);border:3px solid var(--amber);
    padding:18px;max-width:460px;width:100%;
    box-shadow:0 0 0 3px #000,8px 8px 0 rgba(0,0,0,.5);
    animation:fade .15s ease-out}
  .info-card h3{font-size:12px;color:var(--amber);margin:0 0 12px;line-height:1.6}
  .info-card .body{font-size:10px;line-height:1.9;color:var(--ink);margin-bottom:14px;max-height:60vh;overflow-y:auto}
  .info-card .body b{color:var(--amber)}
  .info-card .body .muted{color:var(--dim)}
  .info-card .btn{margin:0}
  .info-btn{display:inline-block;width:16px;height:16px;
    border:2px solid var(--dim);background:transparent;color:var(--dim);
    font-family:inherit;font-size:8px;border-radius:50%;
    cursor:pointer;line-height:1;padding:0;margin-left:8px;
    vertical-align:middle;font-style:italic;font-weight:bold;
    touch-action:manipulation}
  .info-btn:hover{border-color:var(--amber);color:var(--amber);background:rgba(255,207,77,.12)}
  .chip.clickable,.tipline{cursor:help}
  .chip.clickable:hover{background:#0a0a14;filter:brightness(1.3)}
  .tipline:hover{filter:brightness(1.3)}
  @media (max-width:560px){
    .info-card{padding:14px;border-width:2px}
    .info-card h3{font-size:11px}.info-card .body{font-size:9px}
  }
  /* event illustration (sprite-based, with CSS recolors for variety) */
  .ev-sprite{display:block;margin:8px auto;image-rendering:pixelated;
    width:auto;height:auto;max-width:120px;max-height:120px;
    animation:idleBob 2.6s ease-in-out infinite}
  .ev-sprite.tint-grey  {filter:grayscale(.7) brightness(.75) drop-shadow(0 0 6px rgba(180,180,200,.5))}
  .ev-sprite.tint-gold  {filter:hue-rotate(40deg) saturate(1.3) drop-shadow(0 0 10px rgba(255,207,77,.7))}
  .ev-sprite.tint-green {filter:hue-rotate(95deg) saturate(1.2) drop-shadow(0 0 8px rgba(92,255,143,.55))}
  .ev-sprite.tint-purple{filter:hue-rotate(255deg) saturate(1.2) drop-shadow(0 0 8px rgba(192,108,255,.6))}
  .ev-sprite.tint-blue  {filter:hue-rotate(180deg) saturate(1.1) drop-shadow(0 0 8px rgba(108,184,255,.55))}
  .ev-sprite.tint-red   {filter:hue-rotate(330deg) saturate(1.3) drop-shadow(0 0 8px rgba(255,92,106,.6))}
  .ev-sprite.tint-amber {filter:sepia(.6) saturate(1.4) hue-rotate(-15deg) drop-shadow(0 0 8px rgba(255,207,77,.55))}
  .ev-sprite.tint-shadow{filter:brightness(.35) contrast(1.2) drop-shadow(0 0 8px rgba(50,40,80,.8))}
  /* ==== item icons from 16x16 sheets ==== */
  .iicon{box-sizing:content-box;display:inline-block;vertical-align:middle;image-rendering:pixelated;background-repeat:no-repeat;
    background-origin:content-box;background-clip:content-box;
    width:24px;height:24px;padding:5px;margin-right:8px;border:2px solid var(--line);background-color:#0a0a16;border-radius:3px}
  .iicon.lg{width:32px;height:32px;padding:6px}
  .iicon.wpn{background-image:url('assets/items/wpns.png');background-size:288px 240px}
  .iicon.arm{background-image:url('assets/items/armr.png');background-size:240px 96px}
  .iicon.lg.wpn{background-size:384px 320px}
  .iicon.lg.arm{background-size:320px 128px}
  /* weapon cells: 12 cols x 10 rows, picks per type */
  .iicon.wpn.melee {background-position:0 0}
  .iicon.wpn.melee2{background-position:-24px -24px}
  .iicon.wpn.magic {background-position:-72px -24px}
  .iicon.wpn.magic2{background-position:-96px -24px}
  .iicon.wpn.ranged{background-position:-120px 0}
  .iicon.lg.wpn.melee {background-position:0 0}
  .iicon.lg.wpn.melee2{background-position:-32px -32px}
  .iicon.lg.wpn.magic {background-position:-96px -32px}

<script>
"use strict";
/* ============================================================
   CRYPT OF THE CHAMPION  —  text roguelike  (v3)
   zones · packs · relics · omens · events · statuses · levels
   ============================================================ */
const $=id=>document.getElementById(id);
const app=$('app');
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const chance=p=>Math.random()*100<p;
const shuffle=a=>[...a].sort(()=>Math.random()-.5);

/* ============================================================
   AUDIO  —  chiptune SFX + music (WebAudio synth, no assets)
   ============================================================ */
const SFX=(()=>{
  const sg=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
  const ss=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
  let ctx=null,master=null,musicGain=null,musicWet=null,sfxGain=null;
  let muted=sg('crypt_muted')==='1', musicMuted=sg('crypt_music_muted')==='1';
  let currentMusic=null,musicTimer=null;
  const init=()=>{
    if(ctx){if(ctx.state==='suspended')ctx.resume();return;}
    try{
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
      ctx=new AC();
      master=ctx.createGain();master.gain.value=0.55;master.connect(ctx.destination);
      musicGain=ctx.createGain();musicGain.gain.value=musicMuted?0:0.16;musicGain.connect(master);
      sfxGain=ctx.createGain();sfxGain.gain.value=muted?0:0.45;sfxGain.connect(master);
      /* synthesized reverb impulse — music sends through this, SFX stays dry */
      const sr=ctx.sampleRate, irLen=Math.floor(sr*1.6);
      const ir=ctx.createBuffer(2,irLen,sr);
      for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);
        for(let i=0;i<irLen;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/irLen,2.6);}
      const conv=ctx.createConvolver(); conv.buffer=ir;
      musicWet=ctx.createGain(); musicWet.gain.value=0.32;
      conv.connect(musicWet); musicWet.connect(master);
      musicGain.connect(conv);
      if(ctx.state==='suspended')ctx.resume();
    }catch(e){ctx=null;}
  };
  const tone=(freq,dur,o)=>{
    if(!ctx)return; o=o||{};
    const t0=o.when||ctx.currentTime, type=o.type||'square';
    const osc=ctx.createOscillator();osc.type=type;osc.frequency.setValueAtTime(freq,t0);
    if(o.slide)osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.slide),t0+dur);
    const g=ctx.createGain(); const v=o.vol!=null?o.vol:0.3;
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(v,t0+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    osc.connect(g);g.connect(o.dest||sfxGain);
    osc.start(t0);osc.stop(t0+dur+0.03);
  };
  const noise=(dur,vol)=>{
    if(!ctx)return; vol=vol||0.2;
    const bs=Math.max(1,Math.floor(ctx.sampleRate*dur));
    const buf=ctx.createBuffer(1,bs,ctx.sampleRate); const d=buf.getChannelData(0);
    for(let i=0;i<bs;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/bs,1.6);
    const s=ctx.createBufferSource();s.buffer=buf;
    const g=ctx.createGain();g.gain.value=vol;
    s.connect(g);g.connect(sfxGain);s.start();
  };
  const aft=(ms,fn)=>setTimeout(fn,ms);
  const DEFS={
    click:  ()=>tone(1100,0.03,{type:'square',vol:0.12}),
    hit:    ()=>{tone(220,0.06,{type:'square',vol:0.3,slide:90});noise(0.08,0.18);},
    crit:   ()=>{tone(660,0.06,{type:'square',vol:0.3});aft(40,()=>tone(1175,0.1,{type:'square',vol:0.3}));noise(0.14,0.22);},
    hurt:   ()=>{tone(160,0.18,{type:'sawtooth',vol:0.28,slide:70});noise(0.18,0.18);},
    dodge:  ()=>tone(660,0.06,{type:'sine',vol:0.22,slide:1320}),
    heal:   ()=>{[523,659,784].forEach((f,i)=>aft(i*55,()=>tone(f,0.1,{type:'sine',vol:0.25})));},
    potion: ()=>{[440,659,880].forEach((f,i)=>aft(i*55,()=>tone(f,0.08,{type:'triangle',vol:0.26})));},
    skill:  ()=>{[440,587,740].forEach((f,i)=>aft(i*40,()=>tone(f,0.07,{type:'square',vol:0.26})));},
    fire:   ()=>{noise(0.35,0.22);tone(180,0.35,{type:'sawtooth',vol:0.18,slide:60});},
    frost:  ()=>{[1175,988,784,659].forEach((f,i)=>aft(i*50,()=>tone(f,0.1,{type:'triangle',vol:0.22})));},
    arrow:  ()=>{tone(1320,0.05,{type:'square',vol:0.2,slide:660});noise(0.06,0.12);},
    kill:   ()=>{tone(196,0.18,{type:'sawtooth',vol:0.22,slide:80});noise(0.16,0.12);},
    levelup:()=>{[523,659,784,1046,1318].forEach((f,i)=>aft(i*70,()=>tone(f,0.14,{type:'square',vol:0.3})));},
    death:  ()=>{[440,392,349,294,247,196,165].forEach((f,i)=>aft(i*120,()=>tone(f,0.22,{type:'sawtooth',vol:0.3})));},
    win:    ()=>{[523,659,784,1046,1318,1568].forEach((f,i)=>aft(i*110,()=>tone(f,0.18,{type:'square',vol:0.3})));},
    gold:   ()=>{tone(1568,0.05,{type:'square',vol:0.22});aft(50,()=>tone(2093,0.08,{type:'square',vol:0.22}));},
    chest:  ()=>{tone(659,0.07,{type:'square',vol:0.25});aft(60,()=>tone(880,0.07,{type:'square',vol:0.25}));aft(120,()=>tone(1175,0.12,{type:'square',vol:0.25}));},
    relic:  ()=>{[659,880,1046,1318,1568].forEach((f,i)=>aft(i*70,()=>tone(f,0.13,{type:'triangle',vol:0.27})));},
    status: ()=>tone(330,0.08,{type:'sawtooth',vol:0.18,slide:220}),
    door:   ()=>{tone(110,0.12,{type:'square',vol:0.2,slide:70});noise(0.05,0.1);},
    fail:   ()=>tone(220,0.15,{type:'square',vol:0.24,slide:110}),
    upgrade:()=>{[523,659,880].forEach((f,i)=>aft(i*55,()=>tone(f,0.1,{type:'square',vol:0.25})));},
  };
  const play=(name)=>{if(!ctx)return; const fn=DEFS[name]; if(fn)fn();};
  /* music tracks: melody (square) + bass arp (triangle) + optional kick.
     Dead Cells "Prisoner's Awakening" style: rolling 16th-note arpeggios that
     never stop, sparse held lead on top, minor-key questing vibe. */
  /* arp helper: 8 sixteenths over 2 beats for one chord [root, fifth, octave] */
  const arp2=(c)=>[
    [c[0],0.25],[c[1],0.25],[c[2],0.25],[c[1],0.25],
    [c[0],0.25],[c[1],0.25],[c[2],0.25],[c[1],0.25]];
  /* 16ths for 1 beat */
  const arp1=(c)=>[[c[0],0.25],[c[1],0.25],[c[2],0.25],[c[1],0.25]];
  const M={
    /* TITLE — A minor adventure call, sparse held lead (138 BPM) */
    title:{bpm:138,
      melody:[
        [440,1.5],[523,0.5],[659,2],
        [349,1.5],[440,0.5],[523,2],
        [392,1],[440,1],[523,0.5],[587,0.5],[659,1],
        [587,1],[523,1],[440,2]],
      bass:[
        ...arp2([110,165,220]),  // Am
        ...arp2([87,131,174]),   // F
        ...arp2([131,196,262]),  // C
        ...arp2([98,147,196])],  // G
      kick:0},
    /* EXPLORE — the main "questing" track, C minor cycle (142 BPM) */
    explore:{bpm:142,
      melody:[
        [523,1.5],[466,0.5],
        [392,1.5],[466,0.5],
        [523,1],[622,0.5],[698,0.5],
        [622,1],[466,1],
        [698,1],[622,0.5],[523,0.5],
        [466,1],[523,0.5],[622,0.5],
        [415,1],[466,0.5],[523,0.5],
        [392,1],[349,1]],
      bass:[
        ...arp2([131,196,311]),  // Cm   (C Eb G)
        ...arp2([117,175,294]),  // Bb   (Bb D F)
        ...arp2([104,156,262]),  // Ab   (Ab C Eb)
        ...arp2([156,233,392]),  // Eb   (Eb G Bb)
        ...arp2([131,196,311]),  // Cm
        ...arp2([117,175,294]),  // Bb
        ...arp2([104,156,262]),  // Ab
        ...arp2([156,233,392])], // Eb
      kick:0},
    /* BATTLE — pressing D minor charge, faster arps (160 BPM) */
    battle:{bpm:160,
      melody:[
        [587,0.5],[698,0.5],[880,1],
        [932,0.5],[880,0.5],[698,1],
        [698,0.5],[587,0.5],[523,1],
        [587,1],[440,1],
        [880,0.5],[1046,0.5],[1175,1],
        [1046,0.5],[880,0.5],[698,1],
        [587,0.5],[523,0.5],[440,1],
        [392,2]],
      bass:[
        ...arp2([147,220,294]),  // Dm
        ...arp2([117,175,233]),  // Bb
        ...arp2([87,131,174]),   // F
        ...arp2([110,165,220]),  // A
        ...arp2([147,220,294]),
        ...arp2([117,175,233]),
        ...arp2([87,131,174]),
        ...arp2([110,165,220])],
      kick:2},  // soft kick every half-measure (downbeat)
    /* BOSS — heavy heroic descent, C minor / Eb major (148 BPM) */
    boss:{bpm:148,
      melody:[
        [523,1],[622,1],
        [587,0.5],[698,0.5],[784,1],
        [831,1],[698,0.5],[622,0.5],
        [466,1],[523,1],
        [622,1],[784,0.5],[932,0.5],
        [1046,1],[932,0.5],[784,0.5],
        [698,0.5],[622,0.5],[523,1],
        [466,1],[523,1]],
      bass:[
        ...arp2([131,196,311]),  // Cm
        ...arp2([98,147,196]),   // G
        ...arp2([104,156,262]),  // Ab
        ...arp2([156,233,392]),  // Eb
        ...arp2([131,196,311]),
        ...arp2([98,147,196]),
        ...arp2([104,156,262]),
        ...arp2([156,233,392])],
      kick:1},  // kick every beat for boss intensity
    /* VICTORY — bright C major fanfare with arp continuation (152 BPM) */
    victory:{bpm:152,
      melody:[
        [523,0.5],[659,0.5],[784,1],
        [880,0.5],[1046,0.5],[1318,1],
        [1568,0.5],[1318,0.5],[1046,1],
        [1568,2]],
      bass:[
        ...arp1([131,196,262]),  // C
        ...arp1([87,131,174]),   // F
        ...arp1([98,147,196]),   // G
        ...arp1([131,196,262])], // C
      kick:1},
  };
  const stopMusic=()=>{if(musicTimer){clearTimeout(musicTimer);musicTimer=null;}currentMusic=null;};
  /* piano-style note: layered triangle+sine oscillators with low-pass + piano envelope.
     Replaces the chiptune square/triangle "tone" for music — gives a softer, resonant timbre
     that feeds the reverb send for spatial depth. */
  const piano=(freq,dur,when,vol,dest)=>{
    if(!ctx||!dest)return;
    const o1=ctx.createOscillator(); o1.type='triangle'; o1.frequency.setValueAtTime(freq,when);
    const o2=ctx.createOscillator(); o2.type='sine';     o2.frequency.setValueAtTime(freq*2,when);
    const o3=ctx.createOscillator(); o3.type='sine';     o3.frequency.setValueAtTime(freq*3,when);
    const o4=ctx.createOscillator(); o4.type='sine';     o4.frequency.setValueAtTime(freq*0.5,when);
    /* harmonic mix */
    const h2=ctx.createGain(); h2.gain.value=0.30;
    const h3=ctx.createGain(); h3.gain.value=0.12;
    const h4=ctx.createGain(); h4.gain.value=0.18;
    /* low-pass for warmth, brighter for high notes */
    const lp=ctx.createBiquadFilter(); lp.type='lowpass';
    lp.frequency.setValueAtTime(Math.min(7000,freq*7.5),when); lp.Q.value=0.6;
    /* piano envelope: instant attack, fast initial decay, long tail */
    const g=ctx.createGain();
    g.gain.setValueAtTime(0.0001,when);
    g.gain.exponentialRampToValueAtTime(vol,when+0.006);
    g.gain.exponentialRampToValueAtTime(vol*0.55,when+Math.min(0.12,dur*0.25));
    g.gain.exponentialRampToValueAtTime(0.0001,when+dur+0.05);
    o1.connect(lp);
    o2.connect(h2); h2.connect(lp);
    o3.connect(h3); h3.connect(lp);
    o4.connect(h4); h4.connect(lp);
    lp.connect(g); g.connect(dest);
    const stop=when+dur+0.12;
    o1.start(when); o2.start(when); o3.start(when); o4.start(when);
    o1.stop(stop); o2.stop(stop); o3.stop(stop); o4.stop(stop);
  };
  /* schedule a short kick drum at time t (low sine + noise burst) */
  const kickAt=(t)=>{
    if(!ctx||!musicGain)return;
    const o=ctx.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(45,t+0.09);
    const g=ctx.createGain();
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.13,t+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.12);
    o.connect(g); g.connect(musicGain);
    o.start(t); o.stop(t+0.14);
    /* tiny noise click for snap */
    const bs=Math.max(1,Math.floor(ctx.sampleRate*0.02));
    const buf=ctx.createBuffer(1,bs,ctx.sampleRate); const d=buf.getChannelData(0);
    for(let i=0;i<bs;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/bs,3);
    const s=ctx.createBufferSource(); s.buffer=buf;
    const ng=ctx.createGain(); ng.gain.value=0.025;
    s.connect(ng); ng.connect(musicGain); s.start(t);
  };
  const setMusic=(name)=>{
    if(!ctx)return;
    if(currentMusic===name)return;
    stopMusic();
    if(!name||!M[name])return;
    currentMusic=name;
    const track=M[name], beat=60/track.bpm;
    let mi=0,bi=0,ki=0;
    let mNext=ctx.currentTime+0.1, bNext=ctx.currentTime+0.1, kNext=ctx.currentTime+0.1;
    const tick=()=>{
      if(currentMusic!==name)return;
      const look=ctx.currentTime+0.3;
      while(mNext<look){
        const n=track.melody[mi%track.melody.length], f=n[0], d=n[1];
        if(f>0)piano(f,d*beat*1.4,mNext,0.18,musicGain);  /* lead piano */
        mNext+=d*beat; mi++;
      }
      while(bNext<look){
        const n=track.bass[bi%track.bass.length], f=n[0], d=n[1];
        if(f>0)piano(f,d*beat*1.1,bNext,0.10,musicGain);  /* arp piano */
        bNext+=d*beat; bi++;
      }
      if(track.kick){
        while(kNext<look){ kickAt(kNext); kNext+=track.kick*beat; ki++; }
      }
      musicTimer=setTimeout(tick,80);
    };
    tick();
  };
  const refreshUI=()=>{
    try{
      const m=document.getElementById('btn-music'), s=document.getElementById('btn-sfx');
      if(m){m.innerHTML=musicMuted?'♪ OFF':'♪ ON'; m.classList.toggle('off',musicMuted);}
      if(s){s.textContent=muted?'SFX OFF':'SFX ON'; s.classList.toggle('off',muted);}
    }catch(e){}
  };
  const toggleSfx=()=>{muted=!muted; ss('crypt_muted',muted?'1':'0');
    if(sfxGain)sfxGain.gain.value=muted?0:0.45; refreshUI(); if(!muted)play('click');};
  const toggleMusic=()=>{musicMuted=!musicMuted; ss('crypt_music_muted',musicMuted?'1':'0');
    if(musicGain)musicGain.gain.value=musicMuted?0:0.13; refreshUI();};
  return {init,play,setMusic,stopMusic,toggleSfx,toggleMusic,refreshUI,
          isMuted:()=>muted, isMusicMuted:()=>musicMuted};
})();
function toggleSfx(){ SFX.init(); SFX.toggleSfx(); }
function toggleMusic(){ SFX.init(); SFX.toggleMusic(); setMusicForScreen(); }
function setMusicForScreen(){
  if(typeof SFX==='undefined')return;
  const s=G&&G.screen;
  if(s==='battle'&&G.battle&&G.battle.hadBoss)return SFX.setMusic('boss');
  if(s==='battle')return SFX.setMusic('battle');
  if(s==='victory')return SFX.setMusic('victory');
  if(s==='gameover')return SFX.setMusic(null);
  if(s==='title'||s==='class'||s==='omen')return SFX.setMusic('title');
  SFX.setMusic('explore');
}

};
const AFFIX_TAGS=['Armored','Frenzied','Vampiric','Toxic','Brutal'];
function stripAffix(name){
  for(const t of AFFIX_TAGS) if(name.startsWith(t+' ')) return name.slice(t.length+1);
  return name;
}
function spriteKeyFor(name){
  const s=stripAffix(name);
  return BOSS_SPRITE[s]||BOSS_SPRITE[name]||ENEMY_SPRITE[s]||ENEMY_SPRITE[name]||null;
}
function enemySpriteHtml(e,depth){
  const key=spriteKeyFor(e.name); if(!key) return null;
  const cls=['sprite-enemy'];
  if(e.boss) cls.push('boss');
  const z=typeof depth==='number'?zoneOf(depth):(G&&G.depth?zoneOf(G.depth):0);
  if(z>0) cls.push('tier-'+z);
  return `<img class="${cls.join(' ')}" src="assets/monsters/${key}.png" alt="${e.name}" draggable="false">`;
}
const CLASS_SPRITE_CLASS={warrior:'sprite-player warrior',ranger:'sprite-player ranger',mage:'sprite-player mage'};
function playerSpriteHtml(p,opts){
  const cls=CLASS_SPRITE_CLASS[p.cls]; if(!cls) return null;
  const dead=opts&&opts.dead?' dead':'';
  return `<div class="${cls}${dead}" role="img" aria-label="${p.cls}"></div>`;
}
/* item icons — pick a cell by slot/type/passive */
function iconClassesFor(item){
  if(!item) return null;
  const r=RARITY[item.rarity]?'r-'+['com','unc','rare','epic','leg'][item.rarity]:'';
  if(item.slot==='weapon'){
    const t=item.type||'melee';
    const key=t==='magic'?(item.rarity>=3?'magic2':'magic'):t==='ranged'?'ranged':(item.rarity>=3?'melee2':'melee');
    return `iicon wpn ${key} ${r}`;
  }
  if(item.slot==='ring'){
    const n=(item.name||'').toLowerCase();
    let key='ring';
    if(n.includes('amulet')||n.includes('pendant')||n.includes('orb')) key='amulet';
    else if(n.includes('cloak')) key='cloak';
    return `iicon arm ${key} ${r}`;
  }
  if(item.slot==='head'||item.slot==='chest'||item.slot==='legs'||item.slot==='boots'){
    const n=(item.name||'').toLowerCase();
    let key='light';
    if(item.slot==='boots') key='cloak';
    else if(n.includes('robe')||n.includes('archmage')||n.includes('mage')||n.includes('cloth')||n.includes('wizard')||n.includes('hood')) key='robe';
    else if(n.includes('plate')||n.includes('chain')||n.includes('iron')||n.includes('bloodforged')||n.includes('breast')) key='heavy';
    return `iicon arm ${key} ${r}`;
  }
  return null;
}
function itemIconHtml(item,lg){
  const c=iconClassesFor(item); if(!c) return '';
  return `<span class="${c}${lg?' lg':''}"></span>`;
}

   STATE
   ============================================================ */
let G=null;
function defaultMods(){ return {eDmg:1,eHp:1,pDmg:1,goldMul:1,skillCost:1,essMul:1,greedy:0,luck:0,eliteMul:1,packBonus:0,roamRegen:0,slayFast:0,ultFast:0}; }
function newGame(){ G={screen:'title',player:null,depth:0,abyss:0,doors:[],room:null,battle:null,pending:null,log:[],omen:null,mods:defaultMods(),omenChoices:[],seenEvents:[],
  heat:0,miasma:0,collapsed:0,dmgBy:{},debt:0,collectorEta:0,_forceCollector:0}; }
newGame();

/* ============================================================
   WORLD SYSTEMS — Temperature Arc (Heat -> cold collapse -> Miasma)
   Heat answers "how fast can I push?"; Miasma answers "how long can I survive?"
   ============================================================ */
function heatActive(){ return !G.abyss && !G.collapsed && zoneOf(G.depth)===1; }       // the Furnace
function miasmaActive(){ return G.abyss || G.collapsed || zoneOf(G.depth)>=2; }          // Frozen Below + Silent Deep
function heatTier(){ const h=G.heat; return h>=100?4:h>=75?3:h>=50?2:h>=25?1:0; }
function miasmaTier(){ const m=G.miasma; return m>=60?6:m>=50?5:m>=40?4:m>=30?3:m>=20?2:m>=10?1:0; }
function healFactor(){ const t=miasmaTier(); return t>=2?0.5:t>=1?0.78:1; }              // wounds stop closing in the cold
function addHeat(n){ if(heatActive())G.heat=clamp(G.heat+n,0,140); }
function addMiasma(n){ if(miasmaActive())G.miasma=clamp(G.miasma+n,0,99); }
function coolHeat(n){ G.heat=clamp(G.heat-n,0,140); }
function cleanse(n){ G.miasma=clamp(G.miasma-n,0,99); }
function attrib(src,amt){ if(amt>0)G.dmgBy[src]=(G.dmgBy[src]||0)+amt; }
/* damage the player from a tracked source; returns true if it killed them */
function hurt(p,amt,src){ amt=Math.max(0,Math.round(amt)); if(!amt)return false; const before=p.hp; p.hp=clamp(p.hp-amt,0,p.maxHp); attrib(src,before-p.hp); return p.hp<=0; }
/* TIME DEBT — borrow power now, pay survival later. Answers "how much future do I sacrifice?" */
function addDebt(n){ G.debt=clamp((G.debt||0)+n,0,150); if(G.debt>=50&&!G.collectorEta&&!G.abyss){ G.collectorEta=4; } }
function debtMul(){ return 1+Math.min(G.debt||0,150)*0.0035; }   // every point of debt feeds the crypt's hunger
function tickDebt(){ if(!G.debt)return; const interest=Math.floor(G.debt/30); if(interest>0)G.debt=clamp(G.debt+interest,0,150);
  addMiasma(Math.floor(G.debt/25));               // borrowed time rots the soul
  if(G.collectorEta>0){ G.collectorEta--; if(G.collectorEta<=0){ G._forceCollector=1; } } }

function makePlayer(key){
  const c=CLASSES[key];
  const sw={slot:'weapon',name:c.weapon.name,type:c.weapon.type,rarity:0,ilvl:1,stats:{dmg:c.weapon.dmg},dmg:c.weapon.dmg,aff:null,set:null};
  return {cls:key,color:c.color,sprite:c.sprite,affinity:c.affinity,
    hp:c.hp,maxHp:c.hp,mana:c.mana,maxMana:c.mana,
    atk:c.atk,def:c.def,dodge:c.dodge,crit:c.crit,lifesteal:c.lifesteal,regen:c.regen,
    weapon:sw,equip:{weapon:sw,head:null,chest:null,legs:null,boots:null,ring:null},skills:c.skills.map(s=>({...s})),
    potions:1,gold:0,essence:0,kills:0,slayer:{},relics:[],flags:{},flagRefs:{},_setApplied:{},sets:[],level:1,xp:0,
    affBase:{w:0,g:0,v:0},aff:{w:0,g:0,v:0},affTier:{w:0,g:0,v:0},synergies:[]};
}
/* ---- refcounted flags (so relics + gear + sets can share a flag safely) ---- */
function addFlag(p,f){ p.flagRefs[f]=(p.flagRefs[f]||0)+1; p.flags[f]=1; }
function removeFlag(p,f){ if(!p.flagRefs[f])return; p.flagRefs[f]--; if(p.flagRefs[f]<=0){ delete p.flagRefs[f]; delete p.flags[f]; } }
function addAffinity(p,aff){ if(aff){ if(aff.w)p.affBase.w+=aff.w; if(aff.g)p.affBase.g+=aff.g; if(aff.v)p.affBase.v+=aff.v; } recomputeAffinity(p); }
function recomputeAffinity(p){
  p.aff={w:p.affBase.w,g:p.affBase.g,v:p.affBase.v};
  SLOTS.forEach(s=>{ const it=p.equip[s]; if(it&&it.aff){ if(it.aff.w)p.aff.w+=it.aff.w; if(it.aff.g)p.aff.g+=it.aff.g; if(it.aff.v)p.aff.v+=it.aff.v; } });
  checkAffinityTiers(p);
}
function affTagText(aff){ if(!aff)return''; const t=[]; if(aff.w)t.push('Wrath +'+aff.w); if(aff.g)t.push('Guile +'+aff.g); if(aff.v)t.push('Veil +'+aff.v); return t.join(', '); }
function checkAffinityTiers(p){ ['w','g','v'].forEach(k=>{ while(p.affTier[k]<3 && p.aff[k]>=AFF_THRESH[p.affTier[k]]){ p.affTier[k]++; unlockAffinity(p,k,p.affTier[k]); } }); }
function unlockAffinity(p,k,t){
  if(k==='v'&&t===1){ p.maxHp+=18; heal(p,18); p.maxMana+=12; p.mana+=12; }
  const msg=AFF_TIER_TITLE[k][t];
  if(G.screen==='battle') blog(msg.split(':')[0]+' UNLOCKED!','lvl'); else G._affMsg=msg;
}
function recomputeSynergies(p){ p.synergies=[];
  SYNERGIES.forEach(s=>{ if(s.need.every(n=>p.relics.includes(n))){ p.synergies.push(s.name);
    if(!p.flags[s.flag]){ addFlag(p,s.flag); if(s.onForm)s.onForm(p);
      if(G.screen==='battle') blog(`SYNERGY: ${s.name}!`,'lvl'); else G._affMsg=`Synergy unlocked: ${s.name} — ${s.desc}`; } } }); }
function gainRelic(p,rl){ if(!rl||p.relics.includes(rl.name))return false; rl.apply(p); p.relics.push(rl.name); addAffinity(p,rl.aff); recomputeSynergies(p); SFX.play('relic'); return true; }
function gainUpgrade(p,up){ up.apply(p); addAffinity(p,up.aff); }
function affCritBonus(p){ let c=0; if(p.affTier.g>=1)c+=12; if(p.affTier.g>=2)c+=8; if(p.affTier.w>=2)c+=8; return c; }
function affDodgeBonus(p){ return p.affTier.g>=1?10:0; }
function effCrit(p){ return p.crit+affCritBonus(p); }
function effDodge(p){ return p.dodge+affDodgeBonus(p); }
function statusBonusTurns(st){ if(G.battle&&st===G.battle.pst) return 0; return G.player&&G.player.affTier.g>=2?1:0; }
function heal(p,n){ p.hp=clamp(p.hp+Math.round(n*healFactor()),0,p.maxHp); }
function xpNeeded(lvl){ return 18+lvl*14; }
function gainXp(p,n){ if(p.flags.scholar) n=Math.round(n*1.5); p.xp+=n; let ups=0;
  while(p.xp>=xpNeeded(p.level)){ p.xp-=xpNeeded(p.level); levelUp(p); ups++; } return ups; }
function levelUp(p,silent){ p.level++; p.maxHp+=11; p.atk+=2; p.maxMana+=5; p.mana+=5; heal(p,14);
  if(!silent){ SFX.play('levelup'); if(G.screen==='battle') blog(`LEVEL UP! You are now level ${p.level}.`,'lvl'); } }
function relicPool(p){ return RELICS.filter(r=>(!r.cls||r.cls===p.cls)&&!p.relics.includes(r.name)); }
function grantRandomRelic(p){ const avail=relicPool(p); if(!avail.length)return null; const r=pick(avail); gainRelic(p,r); return r.name; }
/* ---- equipment engine ---- */
function applyItemStats(p,item,sign){ if(!item||!item.stats)return;
  for(const k in item.stats){ if(k==='dmg')continue; p[k]=(p[k]||0)+sign*item.stats[k]; }
  p.hp=clamp(p.hp,0,p.maxHp); p.mana=clamp(p.mana,0,p.maxMana); }
function equipItem(p,item){ const slot=item.slot; const old=p.equip[slot];
  if(old){ applyItemStats(p,old,-1); if(old.passiveFlag)removeFlag(p,old.passiveFlag); }
  p.equip[slot]=item; applyItemStats(p,item,+1); if(item.passiveFlag)addFlag(p,item.passiveFlag);
  if(slot==='weapon')p.weapon=item;
  recomputeSets(p); recomputeAffinity(p); }
function recomputeSets(p){
  for(const sn in p._setApplied){ const ap=p._setApplied[sn]; for(const k in ap.stats)p[k]-=ap.stats[k]; ap.flags.forEach(f=>removeFlag(p,f)); }
  p._setApplied={};
  const counts={}; SLOTS.forEach(s=>{ const it=p.equip[s]; if(it&&it.set)counts[it.set]=(counts[it.set]||0)+1; });
  p.sets=[];
  for(const sn in counts){ const set=SETS[sn]; if(set&&counts[sn]>=set.pieces){ p.sets.push(sn);
    const stats=set.stats||{}; for(const k in stats)p[k]=(p[k]||0)+stats[k]; (set.flags||[]).forEach(f=>addFlag(p,f));
    p._setApplied[sn]={stats:{...stats},flags:[...(set.flags||[])]}; } }
  p.hp=clamp(p.hp,0,p.maxHp); p.mana=clamp(p.mana,0,p.maxMana);
}
/* ---- item generation ---- */
function rollRarity(depth){ let w=[Math.max(3,42-depth*2.2),30,13+depth*0.7,4+depth*0.6,Math.max(0,depth*0.45-1)];
  if(G.mods&&G.mods.luck)w=w.map((x,i)=>i>=2?x*1.8:x*0.7);
  const ht=heatTier(); if(ht>=1)w=w.map((x,i)=>i>=2?x*(1+ht*0.35):x*(1-ht*0.12)); // the Furnace forges richer spoils
  let tot=w.reduce((a,b)=>a+b,0),r=Math.random()*tot; for(let i=0;i<5;i++){ if(r<w[i])return i; r-=w[i]; } return 0; }
function rollIlvl(depth){ return clamp(depth+rnd(3)-1,1,30); }
function makeItem(slot,cls,depth,opts){ opts=opts||{};
  let rarity=opts.rarity!=null?opts.rarity:rollRarity(depth);
  const ilvl=opts.ilvl!=null?opts.ilvl:rollIlvl(depth);
  let base,set=null; const setsForSlot=SET_ITEMS.filter(si=>si.slot===slot);
  if(slot!=='weapon'&&rarity>=3&&setsForSlot.length&&chance(50)){ base=pick(setsForSlot); set=base.set; }
  else base=slot==='weapon'?pick(WEAPON_BASES[cls]):slot==='ring'?pick(TRINKET_BASES):pick(ARMOR_BASES[slot]);
  const rk=RARITY[rarity],im=1+(ilvl-1)*0.10,stats={};
  for(const k in base.stats)stats[k]=Math.max(1,Math.round(base.stats[k]*im*rk.mult));
  let passive=null,name=base.name; const pp=PASSIVES[passPool(slot)];
  if(rk.passive&&!set&&pp){ passive=pick(pp);
    if(passive.stat)for(const k in passive.stat)stats[k]=(stats[k]||0)+passive.stat[k];
    name=(passive.prefix||'')+name+(passive.suffix||''); }
  const item={slot,name,type:base.type,rarity,ilvl,stats,aff:base.aff||null,set:set||base.set||null};
  if(slot==='weapon'){ item.dmg=stats.dmg||0; if(passive&&passive.proc)item.proc=passive.proc; }
  if(passive&&passive.flag)item.passiveFlag=passive.flag;
  if(passive)item.passiveDesc=passive.desc;
  return item;
}
const STAT_LBL={dmg:'DMG',atk:'ATK',def:'DEF',maxHp:'HP',maxMana:'MP',crit:'CRIT',dodge:'DODGE',lifesteal:'LS',regen:'RGN'};
function itemExtraText(it){ let s=''; if(it.passiveDesc)s+=` &middot; <span class="amber">${it.passiveDesc}</span>`; if(it.set)s+=` &middot; <span class="teal">${it.set} set</span>`; return s; }
function gearCompareHtml(it,cur){ const keys=[...new Set([...Object.keys(it.stats||{}),...(cur?Object.keys(cur.stats||{}):[])])];
  const parts=keys.map(k=>{ const nv=it.stats[k]||0, ov=(cur&&cur.stats[k])||0, d=nv-ov;
    const dt=!cur?'':d>0?` <span class="green">&#9650;${d}</span>`:d<0?` <span class="red">&#9660;${-d}</span>`:'';
    return `${STAT_LBL[k]||k} <b>${nv}</b>${dt}`; });
  return parts.join(' &middot; ')+itemExtraText(it); }
function itemLabel(it){ return `<span class="${RARITY[it.rarity].cls}">${it.name}</span> <span class="muted">Lv${it.ilvl}</span>`; }
function itemStatsText(it){ const parts=[]; const lbl={dmg:'DMG',atk:'ATK',def:'DEF',maxHp:'HP',maxMana:'MP',crit:'CRIT%',dodge:'DODGE%',lifesteal:'LS%',regen:'RGN'};
  for(const k in it.stats){ parts.push(`+${it.stats[k]} ${lbl[k]||k}`); }
  let s=parts.join(', ');
  if(it.passiveDesc)s+=` &middot; <span class="amber">${it.passiveDesc}</span>`;
  if(it.set)s+=` &middot; <span class="teal">${it.set} set</span>`;
  return s; }

  const ib=$('inv-fab'); if(ib&&ib.style){ ib.style.display=(G.player&&['corridor','room','event','reward','triumph'].includes(G.screen))?'block':'none'; }
}

/* ============================================================
   DUNGEON GENERATION
   ============================================================ */
function depthFactor(){ const d=Math.max(0,G.depth-1); return 1+d*0.18+d*d*0.011; }
function scaleHpVal(base){ return Math.round(base*depthFactor()*G.mods.eHp); }
function depthLabel(){ if(G.abyss){ return `<span class="purple">THE ABYSS</span> &middot; DEPTH ${G.depth-RUN_LENGTH}`; } const z=ZONES[zoneOf(G.depth)]; return `<span class="${z.color}">${z.name}</span> &middot; CHAMBER ${G.depth}/${RUN_LENGTH}`; }
function omenTag(){ return G.omen&&G.omen.id!=='none'?`<div class="omentag">&#10022; OMEN: ${G.omen.name}</div>`:''; }
function worldBar(){ const parts=[];

function statusFooter(){ const p=G.player; return `<div class="footer">LV ${p.level} &middot; HP ${p.hp}/${p.maxHp} &middot; MP ${p.mana}/${p.maxMana} &middot; ${p.potions} potion(s) &middot; <span class="amber">${p.gold}g</span> &middot; <span class="teal">${p.essence} ${ESS}</span> &middot; ${p.relics.length} relic(s)</div>`; }
function openDoor(i){ SFX.play('door'); G.room=G.doors[i];
  // crossing a threshold stokes the Furnace / lets the cold seep deeper / debt compounds
  addHeat(1); addMiasma(1); tickDebt();
  if(worldOnEnter()){ return; }   // environmental hazards can be lethal
  if(G.room.type==='event'){ G.room.outcome=null; G.screen='event'; } else G.screen='room'; render(); playTransition(G.room.boss?'#6e0d1a':(ROOM_TINT[G.room.type]||'#1c1c30')); }
/* environmental pressure applied on entering a chamber; returns true if it killed you */
function worldOnEnter(){ const p=G.player; if(!p)return false; let dead=false,msg='';
  if(heatActive()){ const t=heatTier();
    if(t>=4){ dead=hurt(p,8+rnd(6),'heat'); msg='The walls pulse — molten air scorches you!'; }
    else if(t>=3){ dead=hurt(p,4+rnd(4),'heat'); msg='The Furnace bakes you as you enter.'; } }
  if(!dead && miasmaActive()){ const t=miasmaTier();
    if(t>=4){ const rot=2+Math.floor(t/2); p.maxHp=Math.max(24,p.maxHp-rot); p.hp=clamp(p.hp,0,p.maxHp); msg='Soul Rot — the crypt gnaws at what you are.'; }
    if(t>=5){ dead=hurt(p,5+rnd(5),'miasma')||dead; msg='The cold drinks your soul.'; } }
  if(msg){ G._worldMsg=msg; }
  if(p.hp<=0||dead){ SFX.play('death'); G.screen='gameover'; render(); return true; }
  return false; }

/* ============================================================
   ENEMY BUILD / SCALING
   ============================================================ */
function newStatus(){ return {burn:0,burnT:0,poison:0,poisonT:0,weak:0,weakT:0,vuln:0,vulnT:0,stunT:0,regen:0,regenT:0}; }
function freshEnemy(o){ return Object.assign({st:newStatus(),_dead:false},o); }
function applyAffix(e,affix){
  if(!affix) return e;
  e.name=affix.tag+' '+e.name; e.elite=true;
  e.maxHp=Math.round(e.maxHp*affix.hp); e.hp=e.maxHp;
  e.atk=Math.round(e.atk*affix.atk); e.def=(e.def||0)+(affix.def||0);
  if(affix.leech)e.leech=true; if(affix.poison)e.poison=affix.poison;
  e.xp=(e.xp||6)+12; e.goldBonus=(e.goldBonus||0)+10;
  return e;
}
function scaleEnemy(unit,depth){
  const b=unit.base||unit; const f=depthFactor()*debtMul();
  let e=freshEnemy({name:b.name,sprite:b.sprite,hp:Math.round(b.hp*f*G.mods.eHp),maxHp:Math.round(b.hp*f*G.mods.eHp),
    atk:Math.round(b.atk*f),def:b.def||0,dodgy:b.dodgy,caster:b.caster,poison:b.poison,burnAtk:b.burnAtk,xp:b.xp||6,boss:false});
  if(unit.affix) applyAffix(e,unit.affix);
  // FURNACE: high heat ignites the locals (molten variants)
  if(heatActive()&&heatTier()>=1&&!e.burnAtk){ e.burnAtk=[3+heatTier()*2,2,30+heatTier()*12]; if(heatTier()>=3)e.atk=Math.round(e.atk*1.1); }
  // FROZEN BELOW / DEEP: enemies are armored, hardier, and shrug off flame
  if(miasmaActive()){ e.frozen=true; e.def=(e.def||0)+3; e.maxHp=Math.round(e.maxHp*1.15); e.hp=e.maxHp; }
  return e;
}
function cloneBoss(key){ const b=BOSSES[key]; const e=Math.max(0,G.depth-5); const dm=debtMul();
  const hpF=(1+e*0.07+e*e*0.0072)*dm, atkF=(1+e*0.05+e*e*0.0034)*dm;
  return freshEnemy({...b,hp:Math.round(b.hp*hpF),maxHp:Math.round(b.hp*hpF),atk:Math.round(b.atk*atkF),cry:BOSS_CRY[key]}); }
function findBase(n){ return ENEMIES.find(e=>e.name===n); }
function buildEnemies(room){
  let list;
  if(room.boss){ list=[cloneBoss(room.boss)];
    (BOSSES[room.boss].adds||[]).forEach(n=>list.push(scaleEnemy({base:findBase(n)},Math.max(1,G.depth-3)))); }
  else list=room.group.map(u=>scaleEnemy(u,G.depth));
  // ADJACENCY: a forge next door tempers them in metal; nearby fire ignites them
  if(room.metal) list.forEach(e=>{ e.def=(e.def||0)+4; e.name='Iron-Clad '+e.name; });
  if(room.ignited) list.forEach(e=>{ if(!e.burnAtk)e.burnAtk=[6,3,55]; });
  return list;
}

function avoidRoom(){ const p=G.player,extra=(G.room.group?G.room.group.length-1:0);

function buy(kind){ const p=G.player,st=G.room.stock; let bought=false; const mc=b=>Math.round(b*(st.pm||1));
  if(kind==='potion'&&p.gold>=mc(25)){p.gold-=mc(25);p.potions++;SFX.play('potion');bought=true;}
  else if(kind==='heal'&&p.gold>=mc(18)){p.gold-=mc(18);heal(p,Math.round(p.maxHp*0.5));SFX.play('heal');bought=true;}
  else if(kind==='mana'&&p.gold>=mc(14)){p.gold-=mc(14);p.mana=p.maxMana;SFX.play('heal');bought=true;}
  else if(kind==='upgrade'&&p.gold>=mc(40)){p.gold-=mc(40);gainUpgrade(p,pick(UPGRADES));SFX.play('upgrade');bought=true;}
  else if(kind==='gear'&&st.gear){const c=mc(40+st.gear.rarity*22);if(p.gold>=c){p.gold-=c;equipItem(p,st.gear);st.gear=null;SFX.play('upgrade');bought=true;}}
  else if(kind==='relic'&&p.gold>=mc(70)&&st.relic){p.gold-=mc(70);gainRelic(p,st.relic);st.relic=null;bought=true;}
  if(!bought)SFX.play('fail');

}

/* ---------- THE FORGE (spend Soul Essence to grow OP) ---------- */
function upgradeGear(p,slot){ const it=p.equip[slot]; if(!it)return false;
  applyItemStats(p,it,-1);
  const oldIl=it.ilvl,newIl=oldIl+2,f=(1+(newIl-1)*0.10)/(1+(oldIl-1)*0.10);
  for(const k in it.stats) it.stats[k]=Math.max(it.stats[k]+1,Math.round(it.stats[k]*f));
  it.ilvl=newIl; if(slot==='weapon')it.dmg=it.stats.dmg||it.dmg;
  applyItemStats(p,it,+1); recomputeSets(p); recomputeAffinity(p); return true; }
function forgeUpgrade(slot){ const p=G.player,it=p.equip[slot]; if(!it)return false;
  const cost=14+it.ilvl*2; if(p.essence<cost)return false; p.essence-=cost; return upgradeGear(p,slot); }
function forgeReforge(slot){ const p=G.player,it=p.equip[slot]; if(!it||it.rarity>=4)return false;
  const cost=30+it.rarity*16; if(p.essence<cost)return false; p.essence-=cost;
  applyItemStats(p,it,-1);
  const oldR=it.rarity,newR=oldR+1,f=RARITY[newR].mult/RARITY[oldR].mult;
  for(const k in it.stats) it.stats[k]=Math.max(it.stats[k]+1,Math.round(it.stats[k]*f));
  it.rarity=newR; let newFlag=null;
  if(RARITY[newR].passive&&!it.passiveFlag&&!it.proc&&!it.set&&PASSIVES[passPool(slot)]){
    const pas=pick(PASSIVES[passPool(slot)]);
    if(pas.stat)for(const k in pas.stat)it.stats[k]=(it.stats[k]||0)+pas.stat[k];
    if(pas.proc&&slot==='weapon')it.proc=pas.proc;
    if(pas.flag){it.passiveFlag=pas.flag;newFlag=pas.flag;}
    it.passiveDesc=pas.desc; it.name=(pas.prefix||'')+it.name+(pas.suffix||''); }
  if(slot==='weapon')it.dmg=it.stats.dmg||it.dmg;
  applyItemStats(p,it,+1); if(newFlag)addFlag(p,newFlag); recomputeSets(p); recomputeAffinity(p); return true; }
function forgeImbue(){ const p=G.player,w=p.weapon,cost=24; if(p.essence<cost||w.proc)return false; p.essence-=cost;
  const o=pick([{proc:{burn:[7,3,55]},name:'Flaming',d:'hits may BURN'},{proc:{poison:[7,3,55]},name:'Venomous',d:'hits may POISON'},{proc:{vuln:[2]},name:'Sundering',d:'hits apply VULNERABLE'}]);
  w.proc=o.proc; w.passiveDesc=o.d; if(!/^(Flaming|Venomous|Sundering)/.test(w.name))w.name=o.name+' '+w.name; return true; }
function fUpgrade(s){ SFX.play(forgeUpgrade(s)?'upgrade':'fail'); renderForge(); }
function fReforge(s){ SFX.play(forgeReforge(s)?'upgrade':'fail'); renderForge(); }
function fImbue(){ SFX.play(forgeImbue()?'upgrade':'fail'); renderForge(); }
function leaveForge(){ leaveRoom(); }
function renderForge(){ const p=G.player;

  const slots=SLOTS;
  const up=slots.map(s=>{const it=p.equip[s];if(!it)return '';const c=14+it.ilvl*2;
    return fb(`Upgrade ${s.toUpperCase()}: ${itemLabel(it)}`,c,`+2 item levels &middot; ${itemStatsText(it)}`,`fUpgrade('${s}')`,p.essence>=c);}).join('');
  const im=p.weapon.proc?'':fb('Imbue weapon with an element',24,'add a random on-hit effect (BURN / POISON / VULN)',`fImbue()`,p.essence>=24);
  const re=slots.map(s=>{const it=p.equip[s];if(!it||it.rarity>=4)return '';const c=30+it.rarity*16;
    return fb(`Reforge ${s.toUpperCase()}: <span class="${RARITY[it.rarity].cls}">${RARITY[it.rarity].name}</span> &rarr; <span class="${RARITY[it.rarity+1].cls}">${RARITY[it.rarity+1].name}</span>`,c,'raise rarity; may grant a passive',`fReforge('${s}')`,p.essence>=c);}).join('');
  app.innerHTML=`<div class="floortag">${depthLabel()}</div>${omenTag()}${worldBar()}${playerBar(p)}
    <div class="panel fade room-in">
      <pre class="sprite amber">  ( ) ( )\n  )_____(\n  |[#=#]|\n  |_____|</pre>

/* ----- status application ----- */
function addBurn(st,a,t){ t+=statusBonusTurns(st); st.burn=Math.max(st.burn,a); st.burnT=Math.max(st.burnT,t); }
function addPoison(st,a,t){ t+=statusBonusTurns(st); st.poison=Math.max(st.poison,a); st.poisonT=Math.max(st.poisonT,t); }
function addWeak(st,t){ t+=statusBonusTurns(st); st.weak=0.4; st.weakT=Math.max(st.weakT,t); }
function addVuln(st,t){ t+=statusBonusTurns(st); st.vuln=0.25; st.vulnT=Math.max(st.vulnT,t); }
function addStun(st,t){ st.stunT=Math.max(st.stunT,t); }
/* ----- damage ----- */
function playerDamageMult(e){ const p=G.player,f=p.flags; let m=G.mods.pDmg;
  if(f.glassCannon)m*=1.5; if(f.stoneSkin)m*=0.8;
  if(f.berserker)m*=1+(1-p.hp/p.maxHp)*0.8;
  const et=f.synReaper?0.45:0.30;
  if(f.executioner&&e.hp<=e.maxHp*et)m*=2;
  if(p.affTier.w>=1)m*=1.12; if(p.affTier.w>=2)m*=1.12; if(p.affTier.w>=3)m*=1.15;
  m*=slayerMult(e);

  return m; }
function rollCrit(){ return chance(effCrit(G.player)); }
function critMult(){ return G.player.flags.bigCrit?2.1:1.8; }
/* ----- 8-bit combat FX (pixel particle bursts + slash glyphs) ----- */
let _fxKind=null;   // set by the current attack so dealToEnemy tags the right effect
const FX_COLOR={hit:['#ffffff','#ffe6a0'],crit:['#ffd54a','#c06cff'],fire:['#ff8a3c','#ffd23c'],
  frost:['#9fe0ff','#ffffff'],poison:['#7cff6b','#aaff00'],arcane:['#c06cff','#e6b3ff'],
  arrow:['#dfe6ff','#9fb0d0'],pdmg:['#ff5c6a','#ff9aa0'],heal:['#5cff8f','#aaffcc']};
const FX_GLYPH={hit:'&#10006;',crit:'&#10022;',fire:'&#10042;',frost:'&#10052;',poison:'&#9763;',
  arcane:'&#10038;',arrow:'&#10142;',pdmg:'&#10006;',heal:'&#10010;'};
function fxHtml(kind){ const cols=FX_COLOR[kind]||FX_COLOR.hit; const n=kind==='crit'?10:6; let parts='';
  for(let k=0;k<n;k++){ const a=Math.random()*6.283,dist=16+Math.random()*24,dx=Math.round(Math.cos(a)*dist),dy=Math.round(Math.sin(a)*dist-6),c=cols[k%cols.length],sz=kind==='crit'?6:5;
    parts+=`<i class="particle" style="--dx:${dx}px;--dy:${dy}px;width:${sz}px;height:${sz}px;background:${c};color:${c}"></i>`; }
  return `<div class="fxwrap"><span class="slashfx ${kind==='crit'?'big':''}" style="color:${cols[0]};text-shadow:0 0 8px ${cols[0]},2px 2px 0 #000">${FX_GLYPH[kind]||'&#10006;'}</span>${parts}</div>`; }

function dealToEnemy(idx,dmg,label,crit){ const b=G.battle,e=b.enemies[idx],p=G.player; if(!e||e.hp<=0)return 0;

function basicHit(idx,isExtra){ const p=G.player,b=G.battle; let d=p.atk+p.weapon.dmg+rnd(4); let c=rollCrit(); if(b.shadowCrit){c=true;b.shadowCrit=0;} if(c)d*=critMult();

function stormfury(crit,isExtra){ const p=G.player,b=G.battle;

  if(p.cls==='ranger'?chance(85):chance(55)){ blog('You break away and flee!','info'); b.over=true; render(); setTimeout(()=>proceed('You escaped — no loot.'),700); }
  else { blog('You failed to flee!','info'); enemyTurn(); } }

function tickDoT(entity,st,name){ // returns false if entity died
  const isPlayer=(name==='you');
  if(st.burnT>0){ entity.hp=clamp(entity.hp-st.burn,0,entity.maxHp||entity.hp+st.burn); if(isPlayer)attrib('burn',st.burn); blog(`Burn sears ${name} for ${st.burn}.`,'dmg'); st.burnT--; }
  if(st.poisonT>0){ entity.hp=clamp(entity.hp-st.poison,0,entity.maxHp||entity.hp+st.poison); if(isPlayer)attrib('poison',st.poison); blog(`Poison wracks ${name} for ${st.poison}.`,'dmg'); st.poisonT--; }
  if(st.regenT>0 && entity.hp>0){ const before=entity.hp; entity.hp=clamp(entity.hp+st.regen,0,entity.maxHp); if(entity.hp>before)blog(`${name} regenerates ${entity.hp-before}.`,'heal'); st.regenT--; }
  return entity.hp>0;
}
function afterPlayer(){ const b=G.battle;
  b.enemies.forEach(e=>{ if(e.hp>0){ tickDoT(e,e.st,e.name); if(e.hp<=0)onEnemyDeath(e); } });
  if(allDead()){ winBattle(); return; }
  render(); setTimeout(enemyTurn,560); }
function enemyTurn(){ const p=G.player,b=G.battle; if(b.over)return;
  for(const e of b.enemies){
    if(e.hp<=0)continue; if(p.hp<=0)break;
    if(e.st.stunT>0){ blog(`${e.name} is stunned and cannot act!`,'info'); e.st.stunT--; continue; }
    let dmg=e.atk+rnd(5),label=`${e.name} attacks`;
    if(e.caster&&chance(45)){dmg=Math.round(e.atk*1.55);label=`${e.name} casts dark magic`;}
    if(e.boss&&chance(38)){dmg=Math.round(e.atk*1.75);label=`${e.name} unleashes a savage blow`;}
    if(e.boss&&e.hp<=e.maxHp*0.35){dmg=Math.round(dmg*1.4);}            // enrage
    if(e.st.weakT>0)dmg=Math.round(dmg*(1-e.st.weak));
    dmg=Math.round(dmg*G.mods.eDmg);
    const dodgeChance=Math.min(66,effDodge(p)+(b.evadeTurns>0?b.evade:0));
    if(chance(dodgeChance)){ SFX.play('dodge'); blog(`You dance aside — ${e.name} misses!`,'info'); if(p.flags.shadowDodge)b.shadowCrit=1; continue; }
    let red=(b.pdefTurns>0?b.pdef:0);
    dmg=Math.round(dmg*(1-red)); dmg=Math.max(1, dmg-Math.min(p.def,Math.floor(dmg*0.7)));
    if(b.guardDown>0)dmg=Math.round(dmg*1.3);
    if(b.pst.vulnT>0)dmg=Math.round(dmg*1.25);
    if(b.barrier>0&&dmg>0){ const ab=Math.min(b.barrier,dmg); b.barrier-=ab; dmg-=ab; blog(`Barrier absorbs ${ab}.`,'info'); }
    if((p.cls==='mage'||p.flags.gearManaShield)&&p.mana>0){ const ab=Math.min(p.mana,Math.ceil(dmg*0.6)); if(ab>0){p.mana-=ab;dmg-=ab;blog(`Mana Shield soaks ${ab}.`,'info'); if(dmg<=0&&p.flags.aegisStun&&e.hp>0){addStun(e.st,1);blog(`Aegis! ${e.name} is STUNNED!`,'info');}} }
    let lethal=p.hp-dmg<=0;
    if(lethal&&p.flags.secondWind&&!b.usedSecond){ b.usedSecond=true; p.hp=Math.max(1,Math.round(p.maxHp*0.25)); SFX.play('levelup'); blog('PHOENIX FEATHER! You cheat death!','lvl'); }
    else { p.hp=clamp(p.hp-dmg,0,p.maxHp); attrib('enemy',dmg); SFX.play(dmg>0?'hurt':'dodge'); blog(`${label} for ${dmg}!`,'dmg'); if(dmg>0){gainCharge(9);(b.floats=b.floats||[]).push({idx:-1,text:'-'+dmg,cls:'pdmg'});pushFx(-1,'pdmg');} }
    if(e.leech){ const h=Math.max(1,Math.round(dmg*0.4)); e.hp=clamp(e.hp+h,0,e.maxHp); blog(`${e.name} drains ${h} HP.`,'heal'); }
    if(e.poison&&chance(e.poison[2])){ addPoison(b.pst,e.poison[0],e.poison[1]); blog(`You are POISONED!`,'info'); }
    if(e.burnAtk&&chance(e.burnAtk[2])){ addBurn(b.pst,e.burnAtk[0],e.burnAtk[1]); blog(`You are set ABLAZE!`,'info'); }
    if(p.flags.thorns&&e.hp>0){ const rf=Math.max(1,Math.round(dmg*0.3)); e.hp=clamp(e.hp-rf,0,e.maxHp); blog(`Thorns reflect ${rf} to ${e.name}.`,'heal'); if(p.flags.synFrost)addWeak(e.st,2); if(e.hp<=0)onEnemyDeath(e); }
    if(p.hp<=0)break;
  }
  // player DoT + regen tick
  tickDoT(p,b.pst,'you');
  b.enemies.forEach(e=>{ if(e.st.weakT>0)e.st.weakT--; if(e.st.vulnT>0)e.st.vulnT--; });
  if(b.pst.vulnT>0)b.pst.vulnT--;
  if(b.pdefTurns>0)b.pdefTurns--; if(b.evadeTurns>0)b.evadeTurns--; if(b.guardDown>0)b.guardDown--;
  p.mana=clamp(p.mana+p.regen,0,p.maxMana);
  flash('playerHit');
  if(p.hp<=0){ b.over=true; SFX.play('death'); render(); setTimeout(()=>{G.screen='gameover';render();},800); return; }
  if(allDead()){ winBattle(); return; }
  render(); }
function flash(kind){ const scene=$('scene');
  if(kind==='enemyHit'){ G.battle.anim=''; }
  else { G.battle.anim='shake flash'; if(scene){scene.classList.remove('shake','flash');void scene.offsetWidth;scene.classList.add('shake','flash');} }
  setTimeout(()=>{ if(G.battle){G.battle.anim='';G.battle.animIdx=-1;} },300); }
function winBattle(){ const b=G.battle,p=G.player; b.over=true;
  let gold=(8+rnd(12))+G.depth*2+(b.enemies.length-1)*6;
  b.enemies.forEach(e=>{ if(e.goldBonus)gold+=e.goldBonus; });
  gold=Math.round(gold*G.mods.goldMul); p.gold+=gold;
  // fighting stokes the Furnace / deepens the cold's hold
  const elites=b.enemies.filter(e=>e.elite).length;
  addHeat(2+elites); addMiasma(3+elites);
  // Dragon Warden's death collapses the world into the cold
  if(!G.collapsed && b.enemies.some(e=>e.name===BOSSES.warden.name)){ G.collapsed=1; blog(BOSS_DEATHCRY.warden,'crit'); blog('The warmth dies with it. A cold older than fire floods in from below...','lvl'); }
  // Defeating the Collector burns away your debt
  if(b.enemies.some(e=>e._collector)){ G.debt=0; G.collectorEta=0; blog('The Collector shatters — your debt dies with it.','lvl'); }
  SFX.play(b.hadBoss?'win':'gold');
  blog('The chamber is clear!','info'); render();
  setTimeout(()=>{ if(b.isFinal){ SFX.play('win'); p.won=true; G.screen='triumph'; return render(); }
    G.pending={source:'battle',boss:b.hadBoss,gold}; G.screen='reward'; buildRewards(); render(); playTransition('#5a4410'); },900); }

function buildRewards(){ const p=G.player,isBoss=G.pending&&G.pending.boss,blessed=G.pending&&G.pending.blessed; const d=G.depth; const opts=[];
  // two gear picks of differing slots — the rarity-vs-level dilemma emerges from random rolls
  const slots=shuffle(SLOTS); const bump=(isBoss||blessed)?{rarity:clamp(rollRarity(d)+1,0,4)}:{};
  opts.push({kind:'gear',data:makeItem(slots[0],p.cls,d,bump)});
  opts.push({kind:'gear',data:makeItem(slots[1],p.cls,d,blessed?{rarity:clamp(rollRarity(d)+1,0,4)}:{})});
  opts.push({kind:'upgrade',data:shuffle(UPGRADES)[0]});
  if(isBoss){ const rp=relicPool(p); if(rp.length)opts.push({kind:'relic',data:pick(rp)}); }
  let n=3; if(G.mods.luck||blessed)n=4;
  G.pending.options=shuffle(opts).slice(0,Math.min(n,opts.length)); }
function renderReward(){ const p=G.player,pd=G.pending;
  const src=pd.source==='chest'?'THE CHEST CONTAINS':'SPOILS OF BATTLE';
  const gold=pd.gold?`<p class="center amber" style="font-size:9px">+${pd.gold} gold &middot; ${p.gold}g total</p>`:'';
  const tag=a=>a?` &middot; <span class="teal">&#10022; ${affTagText(a)}</span>`:'';
  const icon={weapon:'&#9876;',head:'&#9651;',chest:'&#128737;',legs:'&#9646;',boots:'&#128094;',ring:'&#9883;'};
  const cards=pd.options.map((o,i)=>{
    if(o.kind==='gear'){ const it=o.data; const cur=p.equip[it.slot];
      const curTxt=cur?`<br><span class="muted">replaces ${cur.name} Lv${cur.ilvl}</span>`:'<br><span class="green">empty slot</span>';
      return `<button class="btn" onclick="takeReward(${i})">${itemIconHtml(it)}<span class="k amber">${icon[it.slot]}</span>${it.slot.toUpperCase()}: ${itemLabel(it)}<small>${gearCompareHtml(it,cur)}${tag(it.aff)}${curTxt}</small></button>`; }
    if(o.kind==='relic')return `<button class="btn" onclick="takeReward(${i})"><span class="k purple">&#9670;</span>${o.data.name} (relic)<small>${o.data.note}${tag(o.data.aff)}</small></button>`;
    return `<button class="btn" onclick="takeReward(${i})"><span class="k green">&#9650;</span>${o.data.name}<small>${o.data.note}${tag(o.data.aff)}</small></button>`;}).join('');
  app.innerHTML=`<div class="floortag">${depthLabel()}</div>${omenTag()}${worldBar()}${playerBar(p)}
    <div class="panel fade room-in"><h3 class="center amber" style="margin-bottom:6px">${src}</h3>${gold}
      <p class="muted center" style="font-size:9px">Choose one reward:</p>${cards}
      ${(pd.options&&pd.options.length>1&&!G.abyss)?`<button class="btn center" style="border-left-color:var(--amber)" onclick="takeAllRewards()"><span class="k">&#8987;</span>BORROW — TAKE EVERYTHING<small>claim all of it now &middot; +Time Debt (the Collector will come for it)</small></button>`:''}
      <button class="btn muted center" onclick="takeReward(-1)">${pd.source==='chest'?'Leave it all':'Skip (take nothing)'}</button></div>`;
}
function takeReward(i){ const p=G.player,pd=G.pending;
  if(i>=0){ const o=pd.options[i];
    if(o.kind==='gear'){equipItem(p,o.data); SFX.play('upgrade');}
    else if(o.kind==='relic')gainRelic(p,o.data);
    else {gainUpgrade(p,o.data); SFX.play('upgrade');} }
  else SFX.play('door');
  if(pd.boss)p.potions++;
  G.pending=null; proceed(); }

      <div class="track"><div class="fill hp" style="width:${clamp(p.hp/p.maxHp*100,0,100)}%"></div></div></div>
    <div class="bar"><div class="lbl"><span class="blue">MP</span><span>${p.mana}/${p.maxMana}</span></div>
      <div class="track"><div class="fill mp" style="width:${p.maxMana?clamp(p.mana/p.maxMana*100,0,100):0}%"></div></div></div>
    <div class="bar xp"><div class="track"><div class="fill xpf" style="width:${xpPct}%"></div></div></div>
    ${affinityBar(p)}
    ${full?`<div class="stats">ATK <b>${p.atk+p.weapon.dmg}</b> &middot; DEF <b>${p.def}</b> &middot; DODGE <b>${ed}%</b> &middot; CRIT <b>${ec}%</b>${p.lifesteal?' &middot; LS <b>'+p.lifesteal+'%</b>':''} &middot; <span class="teal">${p.essence}${ESS}</span></div>`:''}
    ${full?relics:''}</div>`;
}
/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if((e.key==='i'||e.key==='I')&&G.player){ if(G.screen==='inventory')closeInventory(); else if(['corridor','room','event','reward','triumph'].includes(G.screen))openInventory(); return; }
  const btns=[...document.querySelectorAll('.btn:not([disabled])')];
  const n=parseInt(e.key,10); if(!isNaN(n)&&n>=1&&n<=btns.length){btns[n-1].click();return;}
  if(e.key==='Enter'&&btns.length)btns[0].click(); });

/* ---------- audio init on first gesture + subtle click sfx ---------- */
function _audioGo(){ SFX.init(); SFX.refreshUI(); setMusicForScreen();
  document.removeEventListener('pointerdown',_audioGo,true);
  document.removeEventListener('keydown',_audioGo,true);
  document.removeEventListener('touchstart',_audioGo,true); }
document.addEventListener('pointerdown',_audioGo,true);
document.addEventListener('keydown',_audioGo,true);
document.addEventListener('touchstart',_audioGo,true);
document.addEventListener('click',e=>{
  const t=e.target.closest('.btn:not([disabled])'); if(t) SFX.play('click');
});
/* delegated handler for chip/info-button clicks (tap-friendly on mobile) */
document.addEventListener('click',e=>{
  const r=e.target.closest('[data-info-relic]');
  if(r){ showRelicInfo(r.getAttribute('data-info-relic')); return; }
  const s=e.target.closest('[data-info-synergy]');
  if(s){ showSynergyInfo(s.getAttribute('data-info-synergy')); return; }
  const p=e.target.closest('[data-info-path]');
  if(p){ showPathInfo(p.getAttribute('data-info-path')); return; }
});
/* Escape closes the info modal */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ const m=document.getElementById('info-modal'); if(m&&!m.classList.contains('hidden')){ m.classList.add('hidden'); } }
});
SFX.refreshUI();

render();
</script>
</body>
</html>
