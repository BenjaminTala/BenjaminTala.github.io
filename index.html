/* ============================================================
   BATTLE
   ============================================================ */
function startBattle(intro){
  const r=G.room; const enemies=r._enemies?r._enemies:buildEnemies(r);
  // Ultimate charge persists across fights — saving up matters.
  const carriedCharge=(G.player&&G.player._charge!=null)?G.player._charge:0;
  G.battle={enemies,target:0,pdef:0,pdefTurns:0,evade:0,evadeTurns:0,guardDown:0,barrier:0,charge:carriedCharge,
    over:false,anim:'',animIdx:-1,usedSecond:false,floats:[],fx:[],
    pst:newStatus(),hadBoss:enemies.some(e=>e.boss),isFinal:!G.abyss&&enemies.some(e=>BOSSES.dragon.name===e.name||BOSSES.king.name===e.name)&&G.depth>=RUN_LENGTH};
  const p=G.player;
  if(p.flags.combatRegen||p.affTier.v>=2){ G.battle.pst.regen=Math.max(2,Math.round(p.maxHp*(p.affTier.v>=2?0.045:0.04))); G.battle.pst.regenT=999; }
  let bar=0; if(p.affTier.v>=3)bar+=Math.round(p.maxHp*0.22); if(p.flags.gearBarrier)bar+=Math.round(p.maxHp*0.12); G.battle.barrier=bar;
  G.log=[];
  if(intro) blog(intro,'info');
  blog(enemies.length>1?`${enemies.length} foes block your path!`:`A ${enemies[0].name} appears!`,'info');
  const bossE=enemies.find(e=>e.boss&&e.cry); if(bossE){ blog(bossE.cry,'crit'); if(bossE._key)showBossIntro(bossE._key); }
  const heatFed=enemies.find(e=>e._heatFed); if(heatFed){ blog(`&#128293; The Furnace howls &mdash; its keeper feeds on the heat you carried in. (+${Math.round((heatFed-2)*20)}% HP & ATK)`,'crit'); }
  G.battle.intro=true;
  // First-round intents — the player sees what every foe plans before they act.
  G.battle.enemies.forEach(e=>{ e._alive=0; planIntent(e,G.battle); });
  G.screen='battle'; render(); playTransition(G.battle.hadBoss?'#6e0d1a':'#3a1622');
}
function blog(t,c=''){ G.log.push({text:t,cls:c}); if(G.log.length>40)G.log.shift(); }
function living(){ return G.battle.enemies.filter(e=>e.hp>0); }
function allDead(){ return G.battle.enemies.every(e=>e.hp<=0); }
function ensureTarget(){ const b=G.battle; if(!b.enemies[b.target]||b.enemies[b.target].hp<=0){ const i=b.enemies.findIndex(e=>e.hp>0); b.target=i<0?0:i; } }

/* ============================================================
   ENEMY INTENT — every foe telegraphs its next move so the player
   can decide who to silence, burst, or stun.  Roles fall out of the
   stats: casters cast, low-HP enemies enrage, bosses occasionally
   charge a big attack over two turns.
   ============================================================ */
const INTENT_DISPLAY={
  attack: {ico:'&#9876;', cls:''},
  heavy:  {ico:'&#9888;', cls:'i-danger'},
  charge: {ico:'&#9889;', cls:'i-charge'},
  unleash:{ico:'&#9760;', cls:'i-danger'},
  burn:   {ico:'&#128293;', cls:'i-cast'},
  poison: {ico:'&#9763;', cls:'i-cast'},
  weak:   {ico:'&#8595;', cls:'i-cast'},
  vuln:   {ico:'&#10687;', cls:'i-cast'},
  stun:   {ico:'&#9889;', cls:'i-cast'},
  heal:   {ico:'&#10010;', cls:'i-heal'},
  armor:  {ico:'&#128737;', cls:'i-armor'},
  enrage: {ico:'!!', cls:'i-enrage'},
  manaburn:{ico:'&#8709;', cls:'i-cast'},
};
function planIntent(e,b){
  if(!e || e.hp<=0){ e.intent=null; return; }
  // If a multi-turn charge is locked in, advance it.
  if(e.intent && e.intent.kind==='charge' && e.intent.turns>1){
    e.intent={kind:'charge', label:`CHARGING &mdash; ${e.intent.turns-1} turn(s)`, value:e.intent.value, turns:e.intent.turns-1};
    return;
  }
  if(e.intent && e.intent.kind==='charge' && e.intent.turns===1){
    e.intent={kind:'unleash', label:`UNLEASH ${e.intent.value}`, value:e.intent.value};
    return;
  }
  // Bosses can begin a cataclysm — once per fight, telegraphed 2 turns.

/* ----- status application ----- */
function addBurn(st,a,t){ t+=statusBonusTurns(st); st.burn=Math.max(st.burn,a); st.burnT=Math.max(st.burnT,t); }
function addPoison(st,a,t){ t+=statusBonusTurns(st); st.poison=Math.max(st.poison,a); st.poisonT=Math.max(st.poisonT,t); }
function addWeak(st,t){ t+=statusBonusTurns(st); st.weak=0.4; st.weakT=Math.max(st.weakT,t); }
function addVuln(st,t){ t+=statusBonusTurns(st); st.vuln=0.25; st.vulnT=Math.max(st.vulnT,t); }
function addStun(st,t){ st.stunT=Math.max(st.stunT,t); }

function playerDamageMult(e){ const p=G.player,f=p.flags; let m=G.mods.pDmg;

  if(f.berserker)m*=1+(1-p.hp/p.maxHp)*0.8;

  if(f.executioner&&e.hp<=e.maxHp*et)m*=2;
  if(p.affTier.w>=1)m*=1.12; if(p.affTier.w>=2)m*=1.12; if(p.affTier.w>=3)m*=1.15;

function rollCrit(){ return chance(effCrit(G.player)); }
function critMult(){ return G.player.flags.bigCrit?2.1:1.8; }

const FX_COLOR={hit:['#ffffff','#ffe6a0'],crit:['#ffd54a','#c06cff'],fire:['#ff8a3c','#ffd23c'],
  frost:['#9fe0ff','#ffffff'],poison:['#7cff6b','#aaff00'],arcane:['#c06cff','#e6b3ff'],
  arrow:['#dfe6ff','#9fb0d0'],pdmg:['#ff5c6a','#ff9aa0'],heal:['#5cff8f','#aaffcc']};
const FX_GLYPH={hit:'&#10006;',crit:'&#10022;',fire:'&#10042;',frost:'&#10052;',poison:'&#9763;',

function fxHtml(kind){ const cols=FX_COLOR[kind]||FX_COLOR.hit; const n=kind==='crit'?10:6; let parts='';
  for(let k=0;k<n;k++){ const a=Math.random()*6.283,dist=16+Math.random()*24,dx=Math.round(Math.cos(a)*dist),dy=Math.round(Math.sin(a)*dist-6),c=cols[k%cols.length],sz=kind==='crit'?6:5;

    b.enemies.forEach((o,j)=>{ if(j!==idx&&o.hp>0){ o.hp=clamp(o.hp-cl,0,o.maxHp); blog(`Cleave hits ${o.name} for ${cl}.`,'dmg'); if(o.hp<=0)onEnemyDeath(o); } }); }

function stormfury(crit,isExtra){ const p=G.player,b=G.battle;

function ultMeta(cls){ return {mage:{name:'ARCANE SUPERNOVA',desc:'Blast ALL foes for massive magic + heavy BURN'},

function executeIntent(e,p,b){

      e.atk += it.value;
      blog(`${e.name} ENRAGES &mdash; +${it.value} ATK for the rest of the fight!`,'crit');
      return;
    case 'armor':
      e.def = (e.def||0)+it.value;
      blog(`${e.name} hardens its stance (+${it.value} DEF).`,'info');
      return;
    case 'heal': {
      const t=b.enemies[it.targetIdx]||e;
      if(t && t.hp>0){ const h=Math.min(it.value, t.maxHp-t.hp); if(h>0){ t.hp+=h; blog(`${e.name} heals ${t===e?'itself':t.name} (+${h} HP).`,'heal'); } else { blog(`${e.name} tries to heal &mdash; nothing to mend.`,'info'); } }
      return;

    case 'poison':addPoison(b.pst,it.value[0], it.value[1]); blog(`${e.name} POISONS you. (PSN ${it.value[0]}/${it.value[1]}t)`,'dmg'); return;
    case 'weak':  addWeak(b.pst, it.value); blog(`${e.name} WEAKENS your strikes!`,'info'); return;
    case 'vuln':  addVuln(b.pst, it.value); blog(`${e.name} marks you VULNERABLE!`,'info'); return;
    case 'manaburn':{ const mb=Math.min(p.mana,Math.round(p.maxMana*0.20)+4); if(mb>0){p.mana-=mb; blog(`${e.name} BURNS ${mb} mana from you!`,'dmg');} else blog(`${e.name} reaches for mana you do not have.`,'info'); return; }

    if(zone>=2 && e._alive>=3 && !e.boss){
      const ramp=Math.min(0.50, (e._alive-2)*0.10);
      e._frostRamp=ramp;
    }
    if(!e.intent) planIntent(e,b);
    executeIntent(e,p,b);
    // Late-game bosses follow up after a real hit (combo phase)
    if(p.hp>0 && e.boss && G.depth>=26 && e.hp<=e.maxHp*0.40 && (e.intent&&(e.intent.kind==='attack'||e.intent.kind==='heavy'||e.intent.kind==='unleash')) && chance(35)){
      applyEnemyHit(e,p,b,Math.round(e.atk*1.0),`${e.name} follows up`);
    }
    if(p.hp<=0)break;
  }
  // player DoT + regen tick
  tickDoT(p,b.pst,'you');
  b.enemies.forEach(e=>{ if(e.st.weakT>0)e.st.weakT--; if(e.st.vulnT>0)e.st.vulnT--; });
  if(b.pst.vulnT>0)b.pst.vulnT--;
  if(b.pdefTurns>0)b.pdefTurns--; if(b.evadeTurns>0)b.evadeTurns--; if(b.guardDown>0)b.guardDown--;
  if(b.lastStand>0){ b.lastStand--; if(b.lastStand===0 && b.lastVuln>0){ addVuln(b.pst,b.lastVuln); b.lastVuln=0; blog('Last Stand fades — you are VULNERABLE.','info'); } }
  p.mana=clamp(p.mana+p.regen,0,p.maxMana);
  flash('playerHit');
  if(p.hp<=0){ b.over=true; SFX.play('death'); render(); setTimeout(()=>{G.screen='gameover';render();},800); return; }
  if(allDead()){ winBattle(); return; }
  // Plan the next round of intents so the player can see what is coming on their turn.
  b.enemies.forEach(e=>{ if(e.hp>0) planIntent(e,b); else e.intent=null; });
  render(); }
function flash(kind){ const scene=$('scene');
  if(kind==='enemyHit'){ G.battle.anim=''; }
  else { G.battle.anim='shake flash'; if(scene){scene.classList.remove('shake','flash');void scene.offsetWidth;scene.classList.add('shake','flash');} }
  setTimeout(()=>{ if(G.battle){G.battle.anim='';G.battle.animIdx=-1;} },300); }
function winBattle(){ const b=G.battle,p=G.player; b.over=true;
  // carry ultimate charge to the next fight
  p._charge=clamp(b.charge||0,0,100);
  // ECHO LOOT — if you killed an Echo, the gear it carried (and its relic) drops to you.
  // Weapons from a different class are reskinned to your own, same rarity/ilvl.
  const echoEnemyKilled=b.enemies.find(e=>e._echo);
  if(echoEnemyKilled){ const ec=echoEnemyKilled._echo;
    if(ec.item){ let it=null; try{ it=JSON.parse(JSON.stringify(ec.item)); }catch(e){}
      if(it&&it.slot==='weapon'&&ec.cls&&ec.cls!==p.cls){ it=makeItem('weapon',p.cls,Math.max(1,it.ilvl),{rarity:it.rarity,ilvl:it.ilvl}); }
      if(it){ equipItem(p,it); blog(`You loot the echo's ${it.name} (Lv${it.ilvl}).`,'lvl'); } }
    if(ec.relic){ const r=RELICS.find(x=>x.name===ec.relic); if(r){ const gained=gainRelic(p,r); if(gained) blog(`You take the echo's relic: ${ec.relic}.`,'lvl'); } }
  }
  let gold=(8+rnd(12))+G.depth*2+(b.enemies.length-1)*6;
  b.enemies.forEach(e=>{ if(e.goldBonus)gold+=e.goldBonus; });
  gold=Math.round(gold*G.mods.goldMul); p.gold+=gold;
  // fighting stokes the Furnace / deepens the cold's hold
  const elites=b.enemies.filter(e=>e.elite).length;
  addHeat(4+elites*2); addMiasma(3+elites);
  // Dragon Warden's death collapses the world into the cold
  if(!G.collapsed && b.enemies.some(e=>e.name===BOSSES.warden.name)){ G.collapsed=1; blog(BOSS_DEATHCRY.warden,'crit'); blog('The warmth dies with it. A cold older than fire floods in from below...','lvl'); discoverLore('l4'); discoverLore('l5'); G._pendingBossDeath='warden'; }
  if(b.enemies.some(e=>e.name===BOSSES.dragon.name)){ blog(BOSS_DEATHCRY.dragon,'crit'); discoverLore('l4'); if(!p.memory||p.memory.id!=='hoard') grantMemory(p,'hoard'); G._pendingBossDeath='dragon'; }
  if(b.enemies.some(e=>e.name===BOSSES.king.name)){ blog(BOSS_DEATHCRY.king,'crit'); discoverLore('l13'); if(!p.memory||p.memory.id!=='decree') grantMemory(p,'decree'); G._pendingBossDeath='king'; }
  if(b.enemies.some(e=>e.name===BOSSES.devourer.name)){ blog(BOSS_DEATHCRY.devourer,'crit'); discoverLore('l10'); discoverLore('l15'); if(!p.memory||p.memory.id!=='devour') grantMemory(p,'devour'); G._pendingBossDeath='devourer'; }
  if(b.enemies.some(e=>e.name===BOSSES.remembered.name)){ blog(BOSS_DEATHCRY.remembered,'crit'); discoverLore('l15'); discoverLore('l16'); G._rememberedSlain=1; if(!p.memory||p.memory.id!=='curse') grantMemory(p,'curse'); G._pendingBossDeath='remembered'; }
  if(b.enemies.some(e=>e.name===BOSSES.paledevourer.name)){ blog('The thing in the room is gone. The room is colder for having held it.','crit'); discoverLore('l19'); discoverLore('l20'); G._paleSlain=1; }
  if(b.enemies.some(e=>e.name===BOSSES.warden.name) && (!p.memory||p.memory.id!=='ember')){ grantMemory(p,'ember'); }
  // Whoever the chamber-20 boss was — king, dragon, or otherwise — the lie cracks here. The Triumph screen reflects it.
  if(b.isFinal){ discoverLore('l15'); blog('Something in the stone exhales. The story you were told... is not the story.','crit'); }
  // Defeating the Collector burns away your debt
  if(b.enemies.some(e=>e._collector)){ G.debt=0; G.collectorEta=0; blog('The Collector shatters — your debt dies with it.','lvl'); discoverLore('l8'); }
  SFX.play(b.hadBoss?'win':'gold');
  blog('The chamber is clear!','info'); render();
  setTimeout(()=>{
    if(G._pendingBossDeath){ showBossDeath(G._pendingBossDeath); G._pendingBossDeath=null; }
    if(b.isFinal){ SFX.play('win'); p.won=true; G.screen='triumph'; return render(); }
    G.pending={source:'battle',boss:b.hadBoss,gold}; G.screen='reward'; buildRewards(); render(); playTransition('#5a4410');
    // Drain fragment / build popups that queued during the fight.
    // Fragments fire first so the player picks their Devour evolution before the loot screen takes focus.
    setTimeout(()=>{
      const m=document.getElementById('info-modal'); const open=m&&!m.classList.contains('hidden');
      if(open)return;
      if(G._fragQueue && G._fragQueue.length){ showFragmentChoice(); }
      else if(G._buildQueue && G._buildQueue.length){ drainBuildQueue(); }
    }, 350);
  },900); }

function buildRewards(){ const p=G.player,isBoss=G.pending&&G.pending.boss,blessed=G.pending&&G.pending.blessed; const d=G.depth; const opts=[];
  // two gear picks of differing slots — the rarity-vs-level dilemma emerges from random rolls
  const slots=shuffle(SLOTS); const bump=(isBoss||blessed)?{rarity:clamp(rollRarity(d)+1,0,4)}:{};
  opts.push({kind:'gear',data:makeItem(slots[0],p.cls,d,bump)});
  opts.push({kind:'gear',data:makeItem(slots[1],p.cls,d,blessed?{rarity:clamp(rollRarity(d)+1,0,4)}:{})});
  opts.push({kind:'upgrade',data:shuffle(UPGRADES)[0]});
  if(isBoss){ const rp=relicPool(p); if(rp.length)opts.push({kind:'relic',data:pick(rp)}); }
  let n=3; if(G.mods.luck||blessed)n=4;
  G.pending.options=shuffle(opts).slice(0,Math.min(n,opts.length)); }
function renderReward(){ const p=G.player,pd=G.pending;
  const src=pd.source==='chest'?'THE CHEST CONTAINS':'SPOILS OF BATTLE';
  const gold=pd.gold?`<p class="center amber" style="font-size:9px">+${pd.gold} gold &middot; ${p.gold}g total</p>`:'';
  const tag=a=>a?` &middot; <span class="teal">&#10022; ${affTagText(a)}</span>`:'';
  const icon={weapon:'&#9876;',head:'&#9651;',chest:'&#128737;',legs:'&#9646;',boots:'&#128094;',ring:'&#9883;'};
  const cards=pd.options.map((o,i)=>{
    if(o.kind==='gear'){ const it=o.data; const cur=p.equip[it.slot];
      const curTxt=cur?`<br><span class="muted">replaces ${cur.name} Lv${cur.ilvl}</span>`:'<br><span class="green">empty slot</span>';
      return `<button class="btn" onclick="takeReward(${i})">${itemIconHtml(it)}<span class="k amber">${icon[it.slot]}</span>${it.slot.toUpperCase()}: ${itemLabel(it)}<small>${gearCompareHtml(it,cur)}${tag(it.aff)}${curTxt}</small></button>`; }
    if(o.kind==='relic')return `<button class="btn" onclick="takeReward(${i})"><span class="k purple">&#9670;</span>${o.data.name} (relic)<small>${o.data.note}${tag(o.data.aff)}</small></button>`;
    return `<button class="btn" onclick="takeReward(${i})"><span class="k green">&#9650;</span>${o.data.name}<small>${o.data.note}${tag(o.data.aff)}</small></button>`;}).join('');
  app.innerHTML=`<div class="floortag">${depthLabel()}</div>${omenTag()}${worldBar()}${playerBar(p)}
    <div class="panel fade room-in"><h3 class="center amber" style="margin-bottom:6px">${src}</h3>${gold}
      <p class="muted center" style="font-size:9px">Choose one reward:</p>${cards}
      ${(pd.options&&pd.options.length>1&&!G.abyss)?`<button class="btn center" style="border-left-color:var(--amber)" onclick="takeAllRewards()"><span class="k">&#8987;</span>BORROW — TAKE EVERYTHING<small>claim all of it now &middot; +Time Debt (the Collector will come for it)</small></button>`:''}
      <button class="btn muted center" onclick="takeReward(-1)">${pd.source==='chest'?'Leave it all':'Skip (take nothing)'}</button>
      <button class="btn muted center" onclick="openInventory()"><span class="k">&#9776;</span>INVENTORY (i)</button></div>`;
}
function takeReward(i){ const p=G.player,pd=G.pending;
  if(i>=0){ const o=pd.options[i];
    if(o.kind==='gear'){equipItem(p,o.data); SFX.play('upgrade');}
    else if(o.kind==='relic')gainRelic(p,o.data);
    else {gainUpgrade(p,o.data); SFX.play('upgrade');} }
  else SFX.play('door');
  if(pd.boss)p.potions++;
  G.pending=null; proceed(); }

function proceed(msg){

  // Otherwise the chamber-20 boss reappears and you must face it.
  if(!G.abyss && G.depth>=RUN_LENGTH && G.player.won){ SFX.play('win'); G.screen='triumph'; return render(); }
  if(G.mods.roamRegen){ heal(G.player,Math.round(G.player.maxHp*0.05)); }
  nextCorridor(); G.screen='corridor'; render(); playTransition('#16183a');

function showInfo(key){
  const i=typeof key==='object'?key:INFO_TEXT[key];
  if(!i)return;
  const m=document.getElementById('info-modal');
  document.getElementById('info-title').textContent=i.title;
  document.getElementById('info-text').innerHTML=i.body;
  if(m)m.classList.remove('hidden');
  SFX.play('chest');
}
function closeInfo(e){
  if(e&&e.target&&e.target.id!=='info-modal'&&!e.target.closest('.btn'))return;
  const m=document.getElementById('info-modal');
  if(m)m.classList.add('hidden');
  SFX.play('click');
  // Drain the build-popup queue — if more achievements were stacked while a modal was open, show the next one.
  setTimeout(()=>{ if(G && G._buildQueue && G._buildQueue.length && (!G.battle||G.battle.over)) drainBuildQueue(); }, 180);
}
/* BUILD PROGRESSION POPUPS — every meaningful upgrade interrupts the player so they see what
   their character just earned. Queued during battle, drained at battle end so combat is not
   constantly broken by modals. */
function popupBuild(title, body, kind){
  G._buildQueue=G._buildQueue||[];
  const styled=`<div class="build-pop ${kind||''}">${body}</div>`;
  G._buildQueue.push({title, body:styled});
  const m=document.getElementById('info-modal');
  const modalOpen=m && !m.classList.contains('hidden');
  if(!modalOpen && (!G.battle || G.battle.over)) drainBuildQueue();
}
function drainBuildQueue(){
  if(!G._buildQueue || !G._buildQueue.length) return;
  const next=G._buildQueue.shift();
  showInfo(next);
}
function relicNoteFor(name){const r=RELICS.find(x=>x.name===name);return r?r.note:'';}
function synergyDescFor(name){const s=SYNERGIES.find(x=>x.name===name);return s?s.desc:'';}
function affinityTipFor(p,k){
  const m=AFF_META[k],t=p.affTier[k];
  let s=`${m.name} — ${p.aff[k]} points.\n`;
  for(let tier=1;tier<=3;tier++){
    const reached=t>=tier;
    const marker=reached?'[✓]':(tier===t+1?'[next]':'[ ]');
    const at=tier<=AFF_THRESH.length?` (${AFF_THRESH[tier-1]} pts)`:'';
    s+=`\n${marker} ${AFF_TIER_TITLE[k][tier]}${at}`;
  }
  return s;
}
function showRelicInfo(name){ showInfo({title:name,body:relicNoteFor(name)||'A relic of unknown power.'}); }
function showSynergyInfo(name){ const s=SYNERGIES.find(x=>x.name===name); showInfo({title:name,body:s?`${s.desc}<br><br><span class="muted">Formed by: ${s.need.join(' + ')}</span>`:'A relic synergy.'}); }
function showPathInfo(k){ if(!G.player)return; showInfo({title:AFF_META[k].name+' PATH',body:affinityTipFor(G.player,k)}); }
/* HTML-attr-safe escape */
const escAttr=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function infoBtnHtml(key){
  return `<button class="info-btn" onclick="showInfo('${key}')" aria-label="What is this?" type="button">i</button>`;
}

function affinityBar(p){
  const earned=['w','g','v'].filter(k=>p.aff[k]>0);
  if(!earned.length && !(p.synergies&&p.synergies.length)) return '';
  const seg=k=>{ const m=AFF_META[k],t=p.affTier[k]; const roman=t>0?['I','II','III'][t-1]:'';
    const next=t<3?AFF_THRESH[t]:null; const prog=next?` ${p.aff[k]}/${next}`:' MAX';
    return `<span class="${m.color} tipline" title="${escAttr(affinityTipFor(p,k))}" data-info-path="${k}">${m.name}${t>0?' '+roman:''}${prog}</span>`; };
  let s=earned.length?`<div class="stats" style="font-size:8px">PATHS &middot; ${earned.map(seg).join(' &middot; ')}</div>`:'';
  if(p.synergies&&p.synergies.length) s+=`<div>${p.synergies.map(n=>
    `<span class="chip clickable" style="border-color:var(--teal);color:var(--teal)" title="${escAttr(synergyDescFor(n))}" data-info-synergy="${escAttr(n)}">&#10022; ${n}</span>`
  ).join('')}</div>`;
  return s;
}
function playerBar(p,full){
  const relics=p.relics.length?`<div class="relics">${p.relics.map(r=>
    `<span class="chip clickable" title="${escAttr(relicNoteFor(r))}" data-info-relic="${escAttr(r)}">&#9670; ${r}</span>`
  ).join('')}</div>`:'';
  const xpPct=clamp(p.xp/xpNeeded(p.level)*100,0,100);
  const ec=effCrit(p),ed=effDodge(p);
  const ch=p._charge||0;
  return `<div class="panel tight">
    <div class="bar"><div class="lbl"><span class="green">HP ${CLASSES[p.cls].name} &middot; LV${p.level}</span><span>${p.hp}/${p.maxHp}</span></div>
      <div class="track"><div class="fill hp" style="width:${clamp(p.hp/p.maxHp*100,0,100)}%"></div></div></div>
    <div class="bar"><div class="lbl"><span class="blue">MP</span><span>${p.mana}/${p.maxMana}</span></div>
      <div class="track"><div class="fill mp" style="width:${p.maxMana?clamp(p.mana/p.maxMana*100,0,100):0}%"></div></div></div>
    <div class="bar"><div class="lbl"><span class="purple">&#10022; ULT (carries between fights)</span><span>${ch>=100?'READY':Math.floor(ch)+'%'}</span></div>
      <div class="track"><div class="fill chg ${ch>=100?'ready':''}" style="width:${clamp(ch,0,100)}%"></div></div></div>
    <div class="bar xp"><div class="track"><div class="fill xpf" style="width:${xpPct}%"></div></div></div>
    ${affinityBar(p)}
    ${full?`<div class="stats">ATK <b>${p.atk+p.weapon.dmg}</b> &middot; DEF <b>${p.def}</b> &middot; DODGE <b>${ed}%</b> &middot; CRIT <b>${ec}%</b>${p.lifesteal?' &middot; LS <b>'+p.lifesteal+'%</b>':''} &middot; <span class="teal">${p.essence}${ESS}</span></div>`:''}
    ${full?relics:''}</div>`;
}
/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if((e.key==='i'||e.key==='I')&&G.player){ if(G.screen==='inventory')closeInventory(); else if(['corridor','room','event','reward','triumph'].includes(G.screen))openInventory(); return; }
  const btns=[...document.querySelectorAll('.btn:not([disabled])')];
  const n=parseInt(e.key,10); if(!isNaN(n)&&n>=1&&n<=btns.length){btns[n-1].click();return;}
  if(e.key==='Enter'&&btns.length)btns[0].click(); });

/* ---------- audio init on first gesture + subtle click sfx ---------- */
function _audioGo(){ SFX.init(); SFX.refreshUI(); setMusicForScreen();
  document.removeEventListener('pointerdown',_audioGo,true);
  document.removeEventListener('keydown',_audioGo,true);
  document.removeEventListener('touchstart',_audioGo,true); }
document.addEventListener('pointerdown',_audioGo,true);
document.addEventListener('keydown',_audioGo,true);
document.addEventListener('touchstart',_audioGo,true);
document.addEventListener('click',e=>{
  const t=e.target.closest('.btn:not([disabled])'); if(t) SFX.play('click');
});
/* delegated handler for chip/info-button clicks (tap-friendly on mobile) */
document.addEventListener('click',e=>{
  const ic=e.target.closest('[data-info-concept]');
  if(ic){ showInfo(ic.getAttribute('data-info-concept')); return; }
  const r=e.target.closest('[data-info-relic]');
  if(r){ showRelicInfo(r.getAttribute('data-info-relic')); return; }
  const s=e.target.closest('[data-info-synergy]');
  if(s){ showSynergyInfo(s.getAttribute('data-info-synergy')); return; }
  const p=e.target.closest('[data-info-path]');
  if(p){ showPathInfo(p.getAttribute('data-info-path')); return; }
});
/* Escape closes the info modal */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ const m=document.getElementById('info-modal'); if(m&&!m.classList.contains('hidden')){ m.classList.add('hidden'); } }
});
SFX.refreshUI();

render();
</script>
</body>
</html>
