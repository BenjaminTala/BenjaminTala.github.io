    if(o.kind==='gear'){equipItem(p,o.data); SFX.play('upgrade');}
    else if(o.kind==='relic')gainRelic(p,o.data);
    else {gainUpgrade(p,o.data); SFX.play('upgrade');} }
  else SFX.play('door');
  if(pd.boss)p.potions++;
  G.pending=null; proceed(); }

/* ============================================================
   FLOW / END
   ============================================================ */
function proceed(msg){
  // Truth-of-the-throne reveal fires here instead of inside winBattle so the final boss's
  // own death-cry has a moment of air before the meta-reveal lands on top of it.
  if(G._pendingTruth){ G._pendingTruth=0; discoverLore('l15'); blog('Something in the stone exhales. The story you were told... is not the story.','crit'); }
  // Triumph requires the throne to actually fall — winBattle sets player.won on isFinal.
  // Otherwise the chamber-20 boss reappears and you must face it.
  if(!G.abyss && G.depth>=RUN_LENGTH && G.player.won){ SFX.play('win'); G.screen='triumph'; return render(); }
  if(G.mods.roamRegen){ heal(G.player,Math.round(G.player.maxHp*0.05)); }
  nextCorridor(); G.screen='corridor'; render(); playTransition('#16183a');
  if(msg){ const f=document.querySelector('.footer'); if(f)f.innerHTML=`<span class="amber">${msg}</span>`; }
}
function renderTriumph(){
  app.innerHTML=`<h1 class="title" style="color:var(--amber)">THE THRONE FALLS</h1>
    <div class="subtitle">YOU WON &middot; Chamber ${G.depth}/${RUN_LENGTH}</div>
    <div class="panel center fade">
      <pre class="sprite amber">  \\o/   \\o/\n   |     |\n  / \\   / \\</pre>
      <p class="evtext center"><b class="amber">The crypt's last guardian lies broken at your feet.</b> Your run is over — you can retire as a legend, with everything you carry.<br><br>
        Below the throne, a stair that should not exist spirals down into the dark. The Abyss. Bottomless. Optional. <b class="red">Choose only if you want to gamble what you just earned.</b></p>
      <p class="center purple fade" style="font-size:9px;letter-spacing:.6px;margin:10px 4px 4px;opacity:.85"><i>&#9763; You have done this many times. You will do it again.</i></p>
      <button class="btn center amber" onclick="claimVictory()"><span class="k">&#9819;</span>&#9654; RETIRE A LEGEND <span class="muted">(end the run, keep your glory)</span><small>RECOMMENDED &middot; the proper ending</small></button>
      <button class="btn center" onclick="confirmAbyss()"><span class="k purple">&#10549;</span>DESCEND INTO THE ABYSS<small>OPTIONAL ENDLESS MODE &middot; no exit, no win, only how deep you fall</small></button>
    </div>`;
}
function confirmAbyss(){
  if(!confirm('THE ABYSS IS ENDLESS. There is no final boss, no victory screen — only escalating bosses until you die. You will lose everything you have built when it kills you. Are you sure?')) return;
  startAbyss();
}
function claimVictory(){ SFX.play('win'); discoverLore('l12'); G.screen='victory'; render(); }
function startAbyss(){ const p=G.player; G.abyss=1; p.won=true;
  G.mods.essMul=(G.mods.essMul||1)*1.6; G.mods.luck=1; G.mods.goldMul*=1.3;
  discoverLore('l14');
  SFX.play('door'); G._affMsg='You step off the throne into THE ABYSS. There is no floor here — only how deep you dare to fall.';
  nextCorridor(); G.screen='corridor'; render(); }
function causeOfDeathHtml(){ const d=G.dmgBy||{}; const labels={enemy:'Enemy Damage',miasma:'Miasma',burn:'Burn',poison:'Poison',heat:'Furnace Heat',hazard:'Hazards',debt:'Time Debt',self:'Self-Inflicted'};
  const entries=Object.keys(d).filter(k=>d[k]>0).map(k=>[k,d[k]]).sort((a,b)=>b[1]-a[1]);
  const tot=entries.reduce((s,e)=>s+e[1],0); if(!tot)return '';
  const rows=entries.map(([k,v])=>`<div style="display:flex;justify-content:space-between;font-size:10px;line-height:2"><span class="muted">${labels[k]||k}</span><span class="red">${Math.round(v/tot*100)}%</span></div>`).join('');
  return `<h3 class="red center" style="font-size:11px;margin:10px 0 4px">CAUSE OF DEATH</h3><div class="slot" style="border-left-color:var(--red)">${rows}</div>`; }
function renderEnd(win){ const p=G.player;
  if(!win&&!G._echoSaved){ G._echoSaved=1; try{saveEcho();}catch(e){} }
  if(!G._recSaved){ G._recSaved=1; try{recordRun(win||(p&&p.won));}catch(e){} }
  const gear=SLOTS.map(s=>{const it=p.equip[s];return it?`<div class="slot">${itemIconHtml(it,true)}<span class="muted">${s.toUpperCase()}</span> ${itemLabel(it)}<br><span class="muted" style="font-size:8px">${itemStatsText(it)}</span></div>`:`<div class="slot muted">${s.toUpperCase()}: empty</div>`;}).join('');
  const paths=['w','g','v'].filter(k=>p.affTier[k]>0).map(k=>`${AFF_META[k].name} ${['I','II','III'][p.affTier[k]-1]}`).join(', ')||'none';
  const wonAbyss=!win&&p.won; const head=win?'VICTORY!':(wonAbyss?'THE ABYSS TAKES YOU':'YOU DIED'); const col=win?'green':(wonAbyss?'purple':'red');
  const tellTale=win?'You conquered the Crypt of the Champion and retired a legend!':(wonAbyss?`You broke the crypt's throne, then plunged into the Abyss and reached <b class="purple">depth ${G.depth-RUN_LENGTH}</b> before the dark closed over you.`:'Your journey ends in the dark.');
  app.innerHTML=`<h1 class="title" style="color:var(--${col})">${head}</h1>
    <div class="panel center fade"><pre class="sprite ${col}">${win?"  \\o/   \\o/\n   |     |\n  / \\   / \\\n THE THRONE IS YOURS":"   _____\n  /     \\\n | x   x |\n  \\  _  /\n   |||||\n   R.I.P"}</pre>
      <p style="font-size:10px;line-height:2">
        ${tellTale}<br>
        <span class="muted">Class:</span> ${CLASSES[p.cls].name} &middot; <span class="muted">Lv</span> ${p.level} &middot; <span class="muted">Omen:</span> ${G.omen?G.omen.name:'-'}<br>
        <span class="muted">Chamber:</span> ${G.depth}/${RUN_LENGTH} &middot; <span class="muted">Kills:</span> ${p.kills} &middot; <span class="muted">Gold:</span> ${p.gold}</p>
      ${win?'':causeOfDeathHtml()}
      <h3 class="amber center" style="font-size:11px;margin:6px 0">YOUR BUILD</h3>
      ${gear}
      <p style="font-size:9px;line-height:2"><span class="muted">Paths:</span> ${paths}<br>
        ${p.sets&&p.sets.length?`<span class="teal">Sets: ${p.sets.join(', ')}</span><br>`:''}
        ${p.synergies&&p.synergies.length?`<span class="teal">Synergies: ${p.synergies.join(', ')}</span><br>`:''}
        <span class="muted">Relics:</span> ${p.relics.length?p.relics.join(', '):'none'}</p>
      <button class="btn center" onclick="restart()"><span class="k">&#8635;</span>PLAY AGAIN</button></div>`;
}
function restart(){ newGame(); render(); }

/* ---------- shared UI ---------- */
/* ---------- info popups (concept explanations + chip tooltips) ---------- */
const INFO_TEXT={
  heat:{title:'HEAT — THE FURNACE',body:
    `In the Furnace, every door you open and every fight stokes the <b style="color:var(--red)">HEAT</b>. Heat answers <b>"how fast can I push?"</b><br><br>
     <span class="muted">The risk:</span> at 25 enemies catch fire; at 50 merchants gouge you; at 75+ the walls themselves <b>burn you each chamber</b>.<br>
     <span class="muted">The reward:</span> the hotter it runs, the <b class="amber">richer the loot</b> the Furnace forges.<br><br>
     Push for better gear — but cool down at a fountain or shrine before the walls pulse. When the Dragon Warden falls, the fire dies and Heat no longer matters.`},
  miasma:{title:'MIASMA — THE COLD',body:
    `Below the Furnace, a cold older than fire seeps in. <b class="purple">MIASMA</b> rises as you open doors and fight, and answers <b>"how long can I survive?"</b><br><br>
     It is not damage — it is <b>corruption</b>. At 20 your wounds stop closing (all healing is halved). At 40 it rots your max HP. At 50+ it draws blood every chamber.<br><br>
     <b>Normal healing no longer saves you down here — you must CLEANSE.</b> Fountains and the altar's prayer purge Miasma. Healing becomes survival management, not topping off HP.`},
  timedebt:{title:'TIME DEBT — BORROWED POWER',body:
    `When you <b>BORROW</b> at a reward (take everything at once), you gain <b class="amber">TIME DEBT</b>. It answers <b>"how much future do I sacrifice?"</b><br><br>
     Debt is a loan against your own survival. While you carry it:<br>
     &bull; every enemy and boss hits <b>harder</b> (the crypt feeds on what you owe),<br>
     &bull; it <b>compounds</b> — debt grows a little each chamber (interest),<br>
     &bull; it feeds <b>Miasma</b> in the cold.<br><br>
     At 50 debt the <b>COLLECTOR</b> is summoned (you'll see its ETA counting down). When it arrives you must <b>surrender your best item</b>, <b>pay tribute</b> (all gold, half essence, 15% HP), or <b>fight it</b> — winning burns the whole debt away. Borrow when a reward will win you the run now; the bill always comes due.`},
  synergies:{title:'SYNERGIES',body:
    `<b>Named combos that fire automatically</b> when you collect both required relics. Each grants an extra bonus on top of the relics themselves.<br><br>
     <span class="muted">Examples:</span><br>
     &bull; <b>Sanguine Pact</b> = Vampiric Aura + Blood Pact &rarr; +10% lifesteal; kills heal twice.<br>
     &bull; <b>Stormfury</b> = Twin Fang + Eagle Eye &rarr; critical hits trigger an extra strike.<br>
     &bull; <b>Glass Reaper</b> = Glass Cannon + Executioner &rarr; execute foes below 30% HP.<br><br>
     Earned synergies appear as <span class="teal">teal chips</span>. Hover a chip to see its exact effect.`},
  affinity:{title:'AFFINITY PATHS',body:
    `Every relic and gear piece grants <b>affinity points</b> in one of three colors. As your totals grow, you unlock <b>tier capstones</b> that reshape how your hero fights.<br><br>
     <span class="red">&#9670; WRATH</span> &mdash; raw damage. Capstones: +dmg, +crit, AVATAR OF WRATH (hits cleave).<br>
     <span class="teal">&#9670; GUILE</span> &mdash; crit, dodge, status. Capstones: +crit/dodge, longer statuses, TRICKSTER (random status per basic hit + crits refund mana).<br>
     <span class="blue">&#9670; VEIL</span> &mdash; survival. Capstones: +HP/MP, combat regen, WARDEN (start each battle with a damage barrier).<br><br>
     Tiers unlock at <b>3 / 6 / 9</b> points. Mix two paths or commit to one &mdash; build identity emerges from what you take.`},
  sets:{title:'SET COLLECTIONS',body:
    `Special <b>armor + trinket pairs</b> that grant a build-defining 2-piece bonus when both are equipped together. Set pieces drop at Rare or higher rarity, and replace the normal item passive on that slot.<br><br>
     &bull; <span class="teal">Shadowdancer</span> &mdash; cloak + band &rarr; +15% dodge; a dodge guarantees your next hit crits.<br>
     &bull; <span class="purple">Archmage</span> &mdash; robes + orb &rarr; mana shield for any class; full block stuns the attacker.<br>
     &bull; <span class="red">Bloodforged</span> &mdash; plate + pendant &rarr; +14% lifesteal, +1 ATK; kills heal you.<br><br>
     Look for set pieces from chests, relic rooms, and the merchant.`},
  relics:{title:'RELICS',body:
    `<b>Permanent run-defining artifacts</b> that change how you play. Most modify damage formulas, grant new effects on hit, or give powerful conditional bonuses.<br><br>
     Earned from <b>boss fights</b>, the <b>Pedestal of Power</b> room, the <b>merchant</b>, and certain <b>events</b>. Some pair up into <b>synergies</b> &mdash; collect the right combo to unlock extras. <b>Keystone</b> relics (one per class) transform a class skill.<br><br>
     Hover any owned relic to read its effect.`},
};
function showInfo(key){
  const i=typeof key==='object'?key:INFO_TEXT[key];
  if(!i)return;
  const m=document.getElementById('info-modal');
  // Serialize — if a modal is already open, queue this one instead of overwriting it.
  if(m && !m.classList.contains('hidden')){ G._modalQueue=G._modalQueue||[]; G._modalQueue.push(i); return; }
  // Titles are authored with HTML entities (&mdash;, &#10022; etc) — textContent would
  // render them literally as "&mdash;". Use innerHTML so the entities resolve.
  document.getElementById('info-title').innerHTML=i.title;
  document.getElementById('info-text').innerHTML=i.body;
  if(m)m.classList.remove('hidden');
  SFX.play('chest');
}
function closeInfo(e){
  if(e&&e.target&&e.target.id!=='info-modal'&&!e.target.closest('.btn'))return;
  const m=document.getElementById('info-modal');
  if(m)m.classList.add('hidden');
  SFX.play('click');
  // Re-drain in priority order so a backdrop dismissal never orphans a Devour pick or a queued popup.
  // Multi-essence choice first, then per-fragment choice, then the build-progression queue.
  setTimeout(()=>{
    if(!G) return;
    const md=document.getElementById('info-modal'); if(md && !md.classList.contains('hidden')) return;
    if(G._modalQueue && G._modalQueue.length){ showInfo(G._modalQueue.shift()); }
    else if(G._multiEssenceFams && G._multiEssenceFams.length){ showMultiEssenceChoice(); }
    else if(G._fragQueue && G._fragQueue.length){ showFragmentChoice(); }
    else if(G._buildQueue && G._buildQueue.length && (!G.battle||G.battle.over)){ drainBuildQueue(); }
  }, 180);
}
/* BUILD PROGRESSION POPUPS — every meaningful upgrade interrupts the player so they see what
   their character just earned. Queued during battle, drained at battle end so combat is not
   constantly broken by modals. */
function popupBuild(title, body, kind, flashSub){
  G._buildQueue=G._buildQueue||[];
  const styled=`<div class="build-pop ${kind||''}">${body}</div>`;
  G._buildQueue.push({title, body:styled});
  // In-combat: fire a transient celebratory banner so the moment is FELT immediately.
  // The full modal still waits for battle end (no blocking modal mid-fight).
  if(G.battle && !G.battle.over){
    const fk={aff:'aff',synergy:'synergy',set:'set',relic:'relic',memory:'devour',level:'level'}[kind]||'synergy';
    (G.battle._buildFlash=G.battle._buildFlash||[]).push({label:title, sub:flashSub||'', kind:fk});
    SFX.play('levelup');
  }
  const m=document.getElementById('info-modal');
  const modalOpen=m && !m.classList.contains('hidden');
  if(!modalOpen && (!G.battle || G.battle.over)) drainBuildQueue();
}
// Clear the in-combat build-flash banners — called at the start of each player action so a
// celebration persists from when it was earned, through the enemy turn, until the player acts.
function clearBuildFlash(){ if(G.battle) G.battle._buildFlash=null; }
// Flash-only build celebration (no queued end-of-battle modal). For frequent events like level-up.
function flashBuild(label, sub, kind){
  if(G.battle && !G.battle.over){ (G.battle._buildFlash=G.battle._buildFlash||[]).push({label, sub:sub||'', kind:kind||'level'}); }
}
function drainBuildQueue(){
  if(!G._buildQueue || !G._buildQueue.length) return;
  const next=G._buildQueue.shift();
  showInfo(next);
}
function relicNoteFor(name){const r=RELICS.find(x=>x.name===name);return r?r.note:'';}
function synergyDescFor(name){const s=SYNERGIES.find(x=>x.name===name);return s?s.desc:'';}
function affinityTipFor(p,k){
  const m=AFF_META[k],t=p.affTier[k];
  let s=`${m.name} — ${p.aff[k]} points.\n`;
  for(let tier=1;tier<=3;tier++){
    const reached=t>=tier;
    const marker=reached?'[✓]':(tier===t+1?'[next]':'[ ]');
    const at=tier<=AFF_THRESH.length?` (${AFF_THRESH[tier-1]} pts)`:'';
    s+=`\n${marker} ${AFF_TIER_TITLE[k][tier]}${at}`;
  }
  return s;
}
function showRelicInfo(name){ showInfo({title:name,body:relicNoteFor(name)||'A relic of unknown power.'}); }
function showSynergyInfo(name){ const s=SYNERGIES.find(x=>x.name===name); showInfo({title:name,body:s?`${s.desc}<br><br><span class="muted">Formed by: ${s.need.join(' + ')}</span>`:'A relic synergy.'}); }
function showPathInfo(k){ if(!G.player)return; showInfo({title:AFF_META[k].name+' PATH',body:affinityTipFor(G.player,k)}); }
/* HTML-attr-safe escape */
const escAttr=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function infoBtnHtml(key){
  return `<button class="info-btn" onclick="showInfo('${key}')" aria-label="What is this?" type="button">i</button>`;
}

function affinityBar(p){
  const earned=['w','g','v'].filter(k=>p.aff[k]>0);
  if(!earned.length && !(p.synergies&&p.synergies.length)) return '';
  const seg=k=>{ const m=AFF_META[k],t=p.affTier[k]; const roman=t>0?['I','II','III'][t-1]:'';
    const next=t<3?AFF_THRESH[t]:null; const prog=next?` ${p.aff[k]}/${next}`:' MAX';
    return `<span class="${m.color} tipline" title="${escAttr(affinityTipFor(p,k))}" data-info-path="${k}">${m.name}${t>0?' '+roman:''}${prog}</span>`; };
  let s=earned.length?`<div class="stats" style="font-size:8px">PATHS &middot; ${earned.map(seg).join(' &middot; ')}</div>`:'';
  if(p.synergies&&p.synergies.length) s+=`<div>${p.synergies.map(n=>
    `<span class="chip clickable" style="border-color:var(--teal);color:var(--teal)" title="${escAttr(synergyDescFor(n))}" data-info-synergy="${escAttr(n)}">&#10022; ${n}</span>`
  ).join('')}</div>`;
  return s;
}
function playerBar(p,full){
  const relics=p.relics.length?`<div class="relics">${p.relics.map(r=>
    `<span class="chip clickable" title="${escAttr(relicNoteFor(r))}" data-info-relic="${escAttr(r)}">&#9670; ${r}</span>`
  ).join('')}</div>`:'';
  const xpPct=clamp(p.xp/xpNeeded(p.level)*100,0,100);
  const ec=effCrit(p),ed=effDodge(p);
  const ch=p._charge||0;
  return `<div class="panel tight">
    <div class="bar"><div class="lbl"><span class="green">HP ${CLASSES[p.cls].name} &middot; LV${p.level}</span><span>${p.hp}/${p.maxHp}</span></div>
      <div class="track"><div class="fill hp" style="width:${clamp(p.hp/p.maxHp*100,0,100)}%"></div></div></div>
    <div class="bar"><div class="lbl"><span class="blue">MP</span><span>${p.mana}/${p.maxMana}</span></div>
      <div class="track"><div class="fill mp" style="width:${p.maxMana?clamp(p.mana/p.maxMana*100,0,100):0}%"></div></div></div>
    <div class="bar"><div class="lbl"><span class="purple">&#10022; ULT (carries between fights)</span><span>${ch>=100?'READY':Math.floor(ch)+'%'}</span></div>
      <div class="track"><div class="fill chg ${ch>=100?'ready':''}" style="width:${clamp(ch,0,100)}%"></div></div></div>
    <div class="bar xp"><div class="track"><div class="fill xpf" style="width:${xpPct}%"></div></div></div>
    ${affinityBar(p)}
    ${full?`<div class="stats">ATK <b>${p.atk+p.weapon.dmg}</b> &middot; DEF <b>${p.def}</b> &middot; DODGE <b>${ed}%</b> &middot; CRIT <b>${ec}%</b>${p.lifesteal?' &middot; LS <b>'+p.lifesteal+'%</b>':''} &middot; <span class="teal">${p.essence}${ESS}</span></div>`:''}
    ${full?relics:''}</div>`;
}
/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if((e.key==='i'||e.key==='I')&&G.player){ if(G.screen==='inventory')closeInventory(); else if(['corridor','room','event','reward','triumph'].includes(G.screen))openInventory(); return; }
  const btns=[...document.querySelectorAll('.btn:not([disabled])')];
  const n=parseInt(e.key,10); if(!isNaN(n)&&n>=1&&n<=btns.length){btns[n-1].click();return;}
  if(e.key==='Enter'&&btns.length)btns[0].click(); });

/* ---------- audio init on first gesture + subtle click sfx ---------- */
function _audioGo(){ SFX.init(); SFX.refreshUI(); setMusicForScreen();
  document.removeEventListener('pointerdown',_audioGo,true);
  document.removeEventListener('keydown',_audioGo,true);
  document.removeEventListener('touchstart',_audioGo,true); }
document.addEventListener('pointerdown',_audioGo,true);
document.addEventListener('keydown',_audioGo,true);
document.addEventListener('touchstart',_audioGo,true);
document.addEventListener('click',e=>{
  const t=e.target.closest('.btn:not([disabled])'); if(t) SFX.play('click');
});
/* delegated handler for chip/info-button clicks (tap-friendly on mobile) */
document.addEventListener('click',e=>{
  const ic=e.target.closest('[data-info-concept]');
  if(ic){ showInfo(ic.getAttribute('data-info-concept')); return; }
  const r=e.target.closest('[data-info-relic]');
  if(r){ showRelicInfo(r.getAttribute('data-info-relic')); return; }
  const s=e.target.closest('[data-info-synergy]');
  if(s){ showSynergyInfo(s.getAttribute('data-info-synergy')); return; }
  const p=e.target.closest('[data-info-path]');
  if(p){ showPathInfo(p.getAttribute('data-info-path')); return; }
});
/* Escape closes the info modal — through closeInfo so the queue drains */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ const m=document.getElementById('info-modal'); if(m&&!m.classList.contains('hidden')){ closeInfo(); } }
});
SFX.refreshUI();

render();
</script>
