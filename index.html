/* ============================================================
   ENEMY INTENT — every foe telegraphs its next move so the player
   can decide who to silence, burst, or stun.  Roles fall out of the
   stats: casters cast, low-HP enemies enrage, bosses occasionally
   charge a big attack over two turns.
   ============================================================ */
const INTENT_DISPLAY={
  attack: {ico:'&#9876;', cls:''},
  heavy:  {ico:'&#9888;', cls:'i-danger'},
  charge: {ico:'&#9889;', cls:'i-charge'},
  unleash:{ico:'&#9760;', cls:'i-danger'},
  burn:   {ico:'&#128293;', cls:'i-cast'},
  poison: {ico:'&#9879;', cls:'i-cast'},   // alembic — ☣ is reserved for MIASMA so the two DoT systems don't read as one
  weak:   {ico:'&#8595;', cls:'i-cast'},
  vuln:   {ico:'&#10687;', cls:'i-cast'},
  stun:   {ico:'&#128171;', cls:'i-cast'},   // dizzy-stars — was sharing lightning with CHARGE
  heal:   {ico:'&#10010;', cls:'i-heal'},
  armor:  {ico:'&#128737;', cls:'i-armor'},
  enrage: {ico:'!!', cls:'i-enrage'},
  manaburn:{ico:'&#8709;', cls:'i-cast'},
};
function planIntent(e,b){
  if(!e || e.hp<=0){ e.intent=null; return; }
  // If a multi-turn charge is locked in, advance it.
  if(e.intent && e.intent.kind==='charge' && e.intent.turns>1){
    e.intent={kind:'charge', label:`CHARGING &mdash; ${e.intent.turns-1} turn(s)`, value:e.intent.value, turns:e.intent.turns-1};
    return;
  }
  if(e.intent && e.intent.kind==='charge' && e.intent.turns===1){
    e.intent={kind:'unleash', label:`UNLEASH ${e.intent.value}`, value:e.intent.value};
    return;
  }
  // Bosses can begin a cataclysm — telegraphed 2 turns.
  // Sim showed bosses folded to a single ult window (99% kill rate). Cataclysm now RE-ARMS
  // at <40% HP for a phase-2 spike, so bosses can't be safely whittled down.
  if(e.boss && e._alive>=2){
    const wantPhase2 = e._chargedOnce && !e._chargedTwice && e.hp <= e.maxHp*0.40 && chance(50);
    const wantPhase1 = !e._chargedOnce && chance(28);
    if(wantPhase2 || wantPhase1){
      if(wantPhase2) e._chargedTwice=true; else e._chargedOnce=true;
      const dmg=Math.round(e.atk*(wantPhase2?3.0:2.6));
      e.intent={kind:'charge', label:`CATACLYSM ${dmg} &mdash; 2 turns`, value:dmg, turns:2};
      return;
    }
  }
  // Caster healing a wounded ally (PRIEST role).
  if(e.caster){
    const wounded=(b.enemies||[]).find(x=>x.hp>0 && x.hp<x.maxHp*0.55 && x!==e);
    if(wounded && chance(45)){
      // Priest heals are now a real threat (30% of ally maxHP, was 20%) so killing the healer
      // FIRST becomes a genuine target-priority decision instead of always hitting lowest HP.
      const h=Math.max(10,Math.round(wounded.maxHp*0.30));
      e.intent={kind:'heal', label:`HEAL ally +${h}`, value:h, targetIdx:b.enemies.indexOf(wounded)};
      return;
    }
  }
  // Wounded — chance to enrage (CULTIST / boss enrage phase).
  if(e.hp <= e.maxHp*0.45 && !e._enraged && chance(30 + (e.boss?20:0))){
    e._enraged=true;
    const buff=Math.max(2,Math.round(e.atk*0.30));
    e.intent={kind:'enrage', label:`ENRAGE +${buff} ATK`, value:buff};
    return;
  }
  // Healthy heavy-armor types throw up a guard (GUARDIAN role).
  if(e.hp > e.maxHp*0.6 && (e.def||0)<10 && chance(15 + (e.boss?10:0))){
    e.intent={kind:'armor', label:'+6 DEF', value:6};

  // Casters lean toward statuses.

    if(e.burnAtk||e.poison){ if(e.burnAtk) choices.push({kind:'burn', label:`BURN ${e.burnAtk[0]}/${e.burnAtk[1]}t`, value:[e.burnAtk[0],e.burnAtk[1]]}); if(e.poison) choices.push({kind:'poison', label:`PSN ${e.poison[0]}/${e.poison[1]}t`, value:[e.poison[0],e.poison[1]]}); }
    choices.push({kind:'weak', label:'WEAKEN 2t', value:2});
    choices.push({kind:'vuln', label:'VULN 2t',  value:2});
    if(e.manaburn) choices.push({kind:'manaburn', label:'BURN MANA', value:1});
    e.intent=pick(choices);
    return;
  }

  const willHeavy=(e.boss && chance(38)) || chance(16);
  const dmg=willHeavy?Math.round(e.atk*1.6+rnd(4)):e.atk+rnd(5);

// Project what an enemy's announced raw atk will actually DO to the player after dodge expectation,
// pdef, def, mana shield, barrier. Used by the intent badge to show "~14 to you" instead of "ATK 19"
// so the player decides, not calculates. Mirrors applyEnemyHit's formula but at expected value.
function projectIncomingDmg(e, b, p, baseDmg){
  let dmg = baseDmg;
  if(e.st && e.st.weakT>0) dmg = Math.round(dmg*(1-e.st.weak));
  if(e._frostRamp) dmg = Math.round(dmg*(1+e._frostRamp));
  dmg = Math.round(dmg*(G.mods.eDmg||1));
  const mt = miasmaActive()?miasmaTier():0;
  if(mt>=2) dmg = Math.round(dmg*(1+Math.min(0.25,mt*0.045)));
  // Dodge expectation reduces expected damage by chance proportion
  const dodge = Math.max(0,Math.min(55,effDodge(p)+(b.evadeTurns>0?b.evade:0))-(e.pierceDodge||0));
  let exp = dmg * (1 - dodge/100);
  if(p.cls==='ranger' && b.evadeTurns>0) exp = Math.max(1, exp-(4+Math.floor(p.level/2)));
  // Reduction: pdef factor + linear def cap
  let red = b.pdefTurns>0?b.pdef:0;
  exp = exp*(1-red); exp = exp - Math.min(p.def, exp*0.6);
  // Barrier and mana shield expectations
  let absorb = b.barrier||0;
  if(p.cls==='mage' || p.flags.gearManaShield){
    const frac = 0.52;
    absorb += Math.min(p.mana||0, Math.ceil(Math.max(exp,1)*frac));
  }
  exp = Math.max(1, exp - absorb);
  return Math.round(exp);
}
// STANCE SYSTEM (research #12) — three combat stances the player can switch
// freely each turn.  Default is BALANCED (no modifier), so non-engagement is
// identical to the pre-stance game.  AGGRESSIVE trades incoming DR for outgoing
// damage; GUARDED is the inverse.  Per-battle state, resets to BALANCED on
// startBattle.  Hooked into playerDamageMult (out) and the incoming-damage
// path (DR).
const STANCES={
  bal:{name:'BALANCED',short:'BAL',cls:'st-bal', dmgOut:1.00, drIn:0.00, note:'feet planted, no risk'},
  agg:{name:'AGGRESSIVE',short:'AGG',cls:'st-agg', dmgOut:1.25, drIn:-0.15, note:'all teeth — you hit harder, and so do they'},
  grd:{name:'GUARDED',short:'GRD',cls:'st-grd', dmgOut:0.85, drIn:0.25, note:'turtle up — blows glance off, but yours soften too'},
};
function curStance(){ const b=G.battle; if(!b) return STANCES.bal; return STANCES[b.stance||'bal']||STANCES.bal; }
// Switching a stance COMMITS you to it for 2 of your own turns (decremented in afterPlayer).
// Without commitment cost, stance is free min-max — you'd always swap to AGG on the kill swing and
// GRD on the take-the-hit turn with no downside. The lock makes the choice mean something.
function setStance(key){ const b=G.battle; if(!b||b.over||battleBusy()) return; if(!STANCES[key])return;
  if(b.stance===key) return;   // no-op
  if((b.stanceLock||0)>0){ SFX.play('fail'); blog(`Your ${STANCES[b.stance].name} stance is still set (${b.stanceLock} more turn${b.stanceLock===1?'':'s'}).`,'muted'); render(); return; }
  b.stance=key; b.stanceLock=2; SFX.play('click'); render();
}
function stanceRowHtml(b){
  const cur=b.stance||'bal'; const lock=b.stanceLock||0;
  const btn=(k)=>{ const s=STANCES[k]; const active=cur===k;
    const locked = lock>0 && !active;
    const dis = locked?' disabled':'';

    const title = locked ? `${s.name} — locked for ${lock} more turn${lock===1?'':'s'}` : `${s.name} — ${s.note}`;
    return `<button class="cmd st-btn ${s.cls} ${active?'active':''} ${locked?'st-locked':''}"${dis} onclick="setStance('${k}')" title="${escAttr(title)}"><span class="lbl"><b>${s.short}</b>${lockTag}<small>${s.note}</small></span></button>`; };
  return `<div class="stance-row" style="grid-column:1/-1">${btn('agg')}${btn('bal')}${btn('grd')}</div>`;

function intentBadgeHtml(e){
  if(!e||!e.intent||e.hp<=0)return '';

  if(kind==='heavy') kind='heavy';

// the small chip with something the player CANNOT miss. Shown only when there's a turn count.
function bossChargeBanner(e){
  if(!e || !e.intent || e.hp<=0) return '';
  const k=e.intent.kind; if(k!=='charge' && k!=='unleash') return '';
  const imm = (k==='unleash') || /1 turn/i.test(e.intent.label||'');
  const which = (k==='unleash') ? 'CATACLYSM UNLEASHED' : (/cataclysm/i.test(e.intent.label||'')?'CATACLYSM CHARGING':'A CHARGE IS COMING');
  // Try to surface a count from the existing label ("CATACLYSM in 2 turns")
  const m = (e.intent.label||'').match(/(\d+)\s*turns?/i);
  const count = imm ? 'NOW' : (m?m[1]:'•');

// Project player damage on a skill against the current target (rough expected value, not a crit).
// Honest approximation: uses the same base formulas as the cases inside playerSkill. Boss/elite
// armor and slayer/affinity multipliers are NOT modeled here — would over-promise. The chip is a
// FEELING ("hits hard / hits very hard / AOE"), not a guarantee.
function projectSkillDmg(p, skillId, e){
  if(!e||e.hp<=0) return null;
  const mm = Math.min(180, p.maxMana);
  const wdmg = p.weapon ? p.weapon.dmg : 0;
  const atk = p.atk + wdmg;
  switch(skillId){
    case 'attack': return Math.round(atk + 2);   // basic strike expected (no crit)
    case 'bolt':   return Math.round(16 + mm*0.30 + wdmg + p.level*2);
    case 'fire':   return Math.round(14 + mm*0.14 + wdmg + p.level);   // per-foe AOE
    case 'frost':  return Math.round(6  + mm*0.16 + Math.round(p.level*0.5));   // per-foe AOE
    case 'power':  return Math.round(atk*1.95);
    case 'reck':   return Math.round(atk*1.45);                          // per-foe AOE
    case 'aim':    return Math.round(atk*1.70);
    case 'volley': return Math.round((p.atk*0.6+wdmg)+Math.round(p.level*0.5));
    case 'devour': { const d=p.memory; const dm=(d&&d.dmgMult)||1.5; return Math.round(atk*dm); }
    default: return null;
  }
}

/* ----- status application ----- */
function addBurn(st,a,t){ t+=statusBonusTurns(st); st.burn=Math.max(st.burn,a); st.burnT=Math.max(st.burnT,t); }
function addPoison(st,a,t){ t+=statusBonusTurns(st); st.poison=Math.max(st.poison,a); st.poisonT=Math.max(st.poisonT,t); }
function addWeak(st,t){ t+=statusBonusTurns(st); st.weak=0.4; st.weakT=Math.max(st.weakT,t); }
function addVuln(st,t){ t+=statusBonusTurns(st); st.vuln=0.25; st.vulnT=Math.max(st.vulnT,t); }
function addStun(st,t){ st.stunT=Math.max(st.stunT,t); }
/* ----- damage ----- */
function playerDamageMult(e){ const p=G.player,f=p.flags; let m=G.mods.pDmg;
  // Glass Cannon was 1.5x — too strong stacked with Executioner. Trim to 1.35.
  if(f.glassCannon)m*=1.35; if(f.stoneSkin)m*=0.8;
  if(f.berserker)m*=1+(1-p.hp/p.maxHp)*0.8;
  // Executioner threshold tightened: 0.20 base / 0.30 with Glass Reaper synergy.
  // The old 0.30/0.45 stacked with Wrath capstones to a sustained 5-7x.
  const et=f.synReaper?0.30:0.20;
  if(f.executioner&&!G._noExecute&&e.hp<=e.maxHp*et)m*=2;   // ult sets _noExecute so it doesn't double-dip its own missing-HP scaling
  if(p.affTier.w>=1)m*=1.12; if(p.affTier.w>=2)m*=1.12; if(p.affTier.w>=3)m*=1.15; if(p.affTier.w>=4)m*=1.18;
  m*=slayerMult(e);
  m*=weaponTraitMult(p);
  if(e.st.vulnT>0)m*=1.25;
  // ---- DUAL ARTIFACTS ----
  // Iron Memory (WRATH+VEIL): above 70% HP grants +20% damage; DEF half handled in playerDef().
  if(f.ironMemory && p.hp >= p.maxHp*0.70) m*=1.20;
  // Tri-Star Brand (all three paths): +2% damage per affinity tier reached.
  if(f.triStar){ const t=(p.affTier.w|0)+(p.affTier.g|0)+(p.affTier.v|0); m *= (1 + t*0.02); }
  // Bone Crown stacks: per-battle +1 ATK per kill is folded into p.atk in onEnemyDeath;
  // this is a no-op here but documented so future edits don't add it twice.
  // STANCE — Aggressive +25% / Guarded -15% / Balanced no change.
  const st = curStance(); if(st && st.dmgOut!=null) m *= st.dmgOut;
  return m; }

function tickDoT(entity,st,name){ // returns false if entity died
  const isPlayer=(name==='you'); const ward=(!isPlayer&&entity.statusWard)?0.5:1;   // Warded enemies shrug off DoT
  // Phoenix Feather guard: if a DoT tick would kill the player and the relic is unused, leave
  // them at 1 HP and burn the second-wind charge — same contract the physical-hit path honours
  // in applyEnemyHit, just for the DoT timing window (burn/poison expiring at end-of-turn).
  const phx=(rawDmg)=>{ if(!isPlayer||!entity.flags||!entity.flags.secondWind||entity._phoenixUsed)return rawDmg;
    if(entity.hp-rawDmg>0) return rawDmg;
    entity._phoenixUsed=1; const heal=Math.max(1,Math.round(entity.maxHp*0.30));
    blog('PHOENIX FEATHER — the wound that would have closed your eyes leaves them open. (+'+heal+' HP)','crit');
    setTimeout(()=>showInfo({title:'PHOENIX FEATHER',body:'<p class="shout-red" style="font-size:11px">The end came for you and your relic answered. You are at <b>1 HP</b>, and then the feather burns to dust and gives you <b>'+heal+' HP</b>.</p>'}),0);
    return entity.hp-1;   // leave them at exactly 1 HP, then heal below
  };
  if(st.burnT>0){ let d=Math.max(1,Math.round(st.burn*ward)); d=phx(d); const bf=entity.hp; entity.hp=clamp(entity.hp-d,0,entity.maxHp||entity.hp+d); if(isPlayer)attrib('burn',bf-entity.hp); blog(`Burn sears ${name} for ${d}.`,'dmg'); st.burnT--; }
  if(st.poisonT>0){ let d=Math.max(1,Math.round(st.poison*ward)); d=phx(d); const bf=entity.hp; entity.hp=clamp(entity.hp-d,0,entity.maxHp||entity.hp+d); if(isPlayer)attrib('poison',bf-entity.hp); blog(`Poison wracks ${name} for ${d}.`,'dmg'); st.poisonT--; }
  // If Phoenix fired, restore the heal now (player sits at 1 HP after the tick, jump to ~30% maxHp).
  if(isPlayer && entity._phoenixUsed && entity.hp<=1 && entity.flags && entity.flags.secondWind){
    entity.hp=Math.min(entity.maxHp, 1+Math.max(1,Math.round(entity.maxHp*0.30)));
  }
  if(st.regenT>0 && entity.hp>0){ const before=entity.hp; entity.hp=clamp(entity.hp+st.regen,0,entity.maxHp); if(entity.hp>before)blog(`${name} regenerates ${entity.hp-before}.`,'heal'); st.regenT--; }
  return entity.hp>0;
}

function afterPlayer(){ const b=G.battle;
  if(b.stanceLock>0) b.stanceLock--;   // stance commitment counts down per player turn
  b.enemies.forEach(e=>{ if(e.hp>0){ tickDoT(e,e.st,e.name); if(e.hp<=0)onEnemyDeath(e); } });
  if(allDead()){ winBattle(); return; }
  // Hallucinations measured at ~1.77/run — frequent enough to feel like a mechanic rather than a
  // creeping dread. Trimmed to ~7%/turn (~1/run) so they stay unsettling-but-rare. Heat ambience
  // (0.37/run) was already fine; left as-is. Still one-or-the-other per turn, never both.
  if(miasmaActive() && miasmaTier()>=3 && chance(7)) blog(pick(HALLUCINATIONS),'info');
  else if(heatActive() && heatTier()>=3 && chance(11)) blog(pick(HEAT_AMBIENT),'info');
  // Pause before the enemy answers — long enough to read your own hit, snappy enough to keep
  // rhythm. Same delay for boss and normal turns: the prior boss bias added ~120ms per turn and
  // compounded badly on 10+ turn fights (especially at high Heat).
  render(); setTimeout(enemyTurn, 520); }

  // review found ranger's only mitigation was the dodge coin-flip, so a defensively-played ranger
  // still rotted out to variance. A small guaranteed reduction while Evade is up gives skilled,
  // careful ranger play a real floor without raising the dodge cap (which would make it un-hittable).

function executeIntent(e,p,b){

      return;
    case 'enrage':
      e.atk += it.value;
      blog(`${e.name} ENRAGES &mdash; +${it.value} ATK for the rest of the fight!`,'crit');
      return;
    case 'armor':
      e.def = (e.def||0)+it.value;
      blog(`${e.name} hardens its stance (+${it.value} DEF).`,'info');
      return;
    case 'heal': {
      const t=b.enemies[it.targetIdx]||e;

    case 'poison':addPoison(b.pst,it.value[0], it.value[1]); blog(`${e.name} POISONS you. (PSN ${it.value[0]}/${it.value[1]}t)`,'dmg'); return;
    case 'weak':  addWeak(b.pst, it.value); blog(`${e.name} WEAKENS your strikes!`,'info'); return;
    case 'vuln':  addVuln(b.pst, it.value); blog(`${e.name} marks you VULNERABLE!`,'info'); return;

  app.innerHTML=`<div class="floortag">${depthLabel()}</div>${omenTag()}${worldBar()}${playerBar(p)}
    <div class="panel fade room-in"><h3 class="center amber" style="margin-bottom:4px">${src}</h3>${gold}

function takeReward(i){ const p=G.player,pd=G.pending; if(navBusy()||!pd)return; navLock();
  if(i>=0){ const o=pd.options[i];

function proceed(msg){

  // Triumph requires the throne to actually fall — winBattle sets player.won on isFinal.

  if(!G.abyss && G.depth>=RUN_LENGTH && G.player.won){ SFX.play('win'); G.screen='triumph'; return render(); }
  if(G.mods.roamRegen){ heal(G.player,Math.round(G.player.maxHp*0.05)); }
  nextCorridor(); G.screen='corridor'; render(); playTransition('#16183a');
  if(msg){ const f=document.querySelector('.footer'); if(f)f.innerHTML=`<span class="amber">${msg}</span>`; }
}

    </div>` : '';

  app.innerHTML=`<h1 class="title" style="color:var(--amber)">THE THRONE FALLS</h1>
    <div class="subtitle">YOU WON &middot; Chamber ${G.depth}/${RUN_LENGTH}${G.ascension?` &middot; <span class="red">ASC ${G.ascension}</span>`:''}</div>
    ${ascBanner}
    <div class="panel center fade triumph-panel">
      <div class="triumph-halo">${champSprite}</div>
      ${statHtml}
      <p class="evtext center"><b class="amber">The crypt's last guardian lies broken at your feet.</b> Your run is over &mdash; you can retire as a legend, with everything you carry.<br><br>
        Below the throne, a stair that should not exist spirals down into the dark. The Abyss. Bottomless. Optional. <b class="red">Choose only if you want to gamble what you just earned.</b></p>

      <button class="btn center" onclick="confirmAbyss()"><span class="k purple">&#10549;</span>DESCEND INTO THE ABYSS<small>see what lies beneath the throne</small></button>

}

function startAbyss(){ const p=G.player; G.abyss=1; p.won=true; G._abyssOffer=0;
  G.mods.essMul=(G.mods.essMul||1)*1.6; G.mods.luck=1; G.mods.goldMul*=1.3;

function causeOfDeathHtml(){
  const labels={enemy:'Enemy Damage',miasma:'Miasma',burn:'Burn',poison:'Poison',heat:'Furnace Heat',deepcold:'The Deep Cold',hazard:'Hazards',debt:'Debt Pressure',self:'Self-Inflicted'};
  const colors={enemy:'#ff6b6b',miasma:'#d9b8ff',burn:'#ff9b4d',poison:'#9be86b',heat:'#ffcf4d',deepcold:'#bcd4ff',hazard:'#cfcfe0',debt:'#ffd27a',self:'#cfcfe0'};
  // Weigh the RECENT ledger (what brought the run down) over lifetime totals — so a run that fights
  // 40 clean chambers then collapses to the Deep Cold in a Pale fight reads as a cold death, not as
  // "100% enemy" from all that earlier combat. Fall back to lifetime only if recent is empty.
  let src=G.dmgRecent||{}, tot=0; for(const k in src)tot+=src[k];
  if(tot<=0){ src=G.dmgBy||{}; tot=0; for(const k in src)tot+=src[k]; }
  if(tot<=0) return '';
  const entries=Object.keys(src).filter(k=>src[k]>0).map(k=>[k,src[k]]).sort((a,b)=>b[1]-a[1]);
  const rows=entries.filter(([k,v])=>v/tot>=0.04).map(([k,v])=>{ const pct=Math.round(v/tot*100); const c=colors[k]||'#ccc';
    return `<div style="display:flex;align-items:center;gap:6px;font-size:9px;line-height:1.6;margin:2px 0">
      <span style="flex:0 0 96px;text-align:left;color:${c}">${labels[k]||k}</span>
      <span style="flex:1;height:7px;background:#15151f;border-radius:3px;overflow:hidden"><span style="display:block;height:100%;width:${pct}%;background:${c}"></span></span>
      <span style="flex:0 0 30px;text-align:right;color:${c}">${pct}%</span></div>`; }).join('');
  // Killing blow: the source of the FINAL lethal hit. Enemy/boss blows name WHO; environmental blows
  // name the system (The Deep Cold / Miasma / Debt Pressure). Don't auto-blame the boss for a tick.
  const kb=G._killingBlow;
  const kbLabel = kb==='enemy' ? (G._killingBlowName||'Enemy Damage') : (kb ? (labels[kb]||kb) : null);
  const kbColor = colors[kb]||'#fff';
  // Contributing pressure: the biggest NON-killing-blow, non-plain-enemy source (>=12%) — surfaces the
  // environmental clock that set up the kill ("the boss landed it, but the Deep Cold wore you down").
  const press=entries.find(([k,v])=>k!==kb && k!=='enemy' && v/tot>=0.12);
  const kbBlock = kb ? `<div style="margin-top:9px;font-size:9px;line-height:1.5">
      <span class="muted" style="font-size:8px;letter-spacing:.5px">KILLING BLOW</span><br><b style="color:${kbColor}">${kbLabel}</b>${press?`<br><span class="muted" style="font-size:8px;letter-spacing:.5px">CONTRIBUTING PRESSURE</span><br><span style="color:${colors[press[0]]}">${labels[press[0]]||press[0]}</span>`:''}</div>` : '';
  // The bar chart shows the WHY; we trust the player to draw the lesson themselves.
  return `<h3 class="red center" style="font-size:11px;margin:10px 0 4px">CAUSE OF DEATH</h3><div class="slot" style="border-left-color:var(--red)">${rows}${kbBlock}</div>`; }
// ABYSS EPITAPHS — when the player dies BELOW the throne (G.abyss && depth past RUN_LENGTH), the
// crypt's last word should acknowledge they went somewhere most never reach. Terse, present-tense.
const ABYSS_EPITAPHS = [
  'You reached depth %D% before the cold knew your name.',
  'The deep took you in pieces. The largest piece kept walking another two chambers.',
  'You did not come up. The crypt counts you as something else now.',
  'Past the throne, the dark stops keeping records. Yours ends at chamber %D%.',
  'You went further than the door was built to close behind. It closed anyway.',
  'The throne is above you now. So is everything else you used to call yours.'
];
// EPITAPH HOOK — at the end of every run, the crypt remembers ONE new thing about you. The data
// already exists (loadRecords + crypt_npc + per-run memoir flags); this just surfaces it as the last
// breath before the player decides whether to start again. Push, not closure.
function deathEpitaphHtml(p, win){
  const m = G._memoir || memoir(); const r = loadRecords();
  // Abyss deaths get their own pool — the standard "the crypt remembers" beats are tuned for the
  // surface run; below the throne we want a register that acknowledges what they did, not what they
  // collected. Win short-circuits both pools (legend line always wins).
  if(!win && G.abyss && G.depth > RUN_LENGTH){
    const ap = ABYSS_EPITAPHS[Math.floor(Math.random()*ABYSS_EPITAPHS.length)].replace(/%D%/g,G.depth);
    return `<div class="epitaph"><div class="ep-tag">THE CRYPT REMEMBERS</div><p>${ap}</p></div>`;
  }
  const lines = []; const npcNames = {lantern:'The Lantern Keeper', cartog:'The Cartographer', cardinal:'The Cardinal', scholar:'The Frozen Scholar', wsmith:'The Weeping Smith', watcher:'The Watchful Prisoner'};
  // Priority pool — strongest beat first; we pick ONE so it lands.
  if(win) lines.push('The crypt has a new legend tonight. It does not forget legends.');
  if(m.devourRevealed) lines.push('The skill in your fourth slot finally said its real name today. The crypt heard it.');
  if(m.bosses.indexOf('paledevourer')>=0) lines.push('You set eyes on the thing the dragon refused to look at. The world tilts a little, where you walked.');
  if(m.bosses.indexOf('remembered')>=0) lines.push('You met the one who came before, and you outlasted them. That is no small thing down here.');
  if(m.wentDeeper) lines.push(`You went further than any version of you has gone — chamber ${G.depth}. The crypt has a new high-water mark with your name on it.`);
  if(m.collectorMet){ const cm = (r.collectorMet||0); lines.push(cm>=3 ? 'The Collector has stopped expecting the arrangement to end. So have you.' : 'The Collector knows your debt now. It will not forget the shape of you.'); }
  else if(m.collectorMarked) lines.push('Your debt grew heavy enough to be noticed. Somewhere far below, an account opens in your name.');
  if(m.rumors>=3) lines.push('You heard the Pale named in pieces, in three places today. None of them said it the same way.');
  else if(m.rumors>=1) lines.push('You heard a fragment of a name no one above ground would speak.');
  if(m.met.length>=2) lines.push(`${npcNames[m.met[0]]||'A familiar face'} and ${npcNames[m.met[1]]||'another'} both have a little more of you in their ledgers tonight.`);
  else if(m.met.length===1){ const id=m.met[0]; const st=npcState(id); const name=npcNames[id]||'Someone';
    lines.push(st.met>=3 ? `${name} has stopped pretending you might not come back.` : st.met===2 ? `${name} recognised you this time. They will recognise you faster, next.` : `${name} learned your face today.`); }
  // Fallback — every run leaves SOMETHING.
  if(!lines.length){ const r2=loadRecords(); lines.push(r2.runs>=3 ? 'The crypt has gotten used to you. That should worry you.' : 'The crypt closes its door behind you, gently, the way you close a book on a familiar page.'); }
  const pick = lines[0];
  return `<div class="epitaph"><div class="ep-tag">THE CRYPT REMEMBERS</div><p>${pick}</p></div>`;
}

        <span class="muted">Chamber:</span> ${G.depth}/${RUN_LENGTH} &middot; <span class="muted">Kills:</span> ${p.kills} &middot; <span class="muted">Gold:</span> ${p.gold}</p>

  timedebt:{title:'TIME DEBT — BORROWED POWER',body:

  deepcold:{title:'THE DEEP COLD — THE ABYSS ITSELF',body:

  synergies:{title:'SYNERGIES',body:

  relics:{title:'RELICS',body:

  // Concepts referenced from the glossary that didn't have a dedicated entry yet.

  pathG:{title:'GUILE PATH', body:`<b class="teal">GUILE</b> rewards finesse.<br>&bull; <b>Tier I (3 pts):</b> +12% crit, +10% dodge. The strike right after Shield Wall is a guaranteed crit.<br>&bull; <b>Tier II (6 pts):</b> Status effects last longer, +8% crit.<br>&bull; <b>Tier III (9 pts):</b> Trickster — basic hits inflict random statuses, crits refund mana.`},
  pathV:{title:'VEIL PATH', body:`<b class="blue">VEIL</b> rewards endurance.<br>&bull; <b>Tier I (3 pts):</b> +18 max HP, +12 mana. Every 3rd hit you take heals you (Steady Heart).<br>&bull; <b>Tier II (6 pts):</b> Regenerate HP each combat turn.<br>&bull; <b>Tier III (9 pts):</b> Warden — begin each battle with a damage barrier.`},
  devour:{title:'DEVOUR (4TH SKILL)', body:`Every champion has a hidden fourth skill called <b>Harvest Essence</b>.<br><br>When you kill an enemy with this skill, you consume a <b>Fragment</b> of their family (Demon / Undead / Construct / Dragon / Humanoid / Beast). Fragments let you <b>Empower</b>, <b>Evolve</b>, or <b>Replace</b> the skill — building toward a unique ability nobody else has.<br><br>The skill renames itself to <b>DEVOUR</b> once you learn the truth about what it really does.`},

  intent:{title:'ENEMY INTENT', body:`Every enemy telegraphs its next move at the top of its cell:<br>&bull; <b class="red">ATK / HEAVY</b> with a projected damage number.<br>&bull; <b class="purple">CAST / STATUS</b> — burn, poison, weak, vulnerable.<br>&bull; <b class="amber">CHARGE / UNLEASH</b> — multi-turn windups.<br>&bull; <b class="amber">DOZING / ENRAGED</b> — your free turn or a cornered foe.<br><br>The intent shows the EXPECTED damage to you, accounting for your DEF and any buff/debuff active. Use it to decide who to focus, when to guard, when to potion.`},
  statuses:{title:'STATUS EFFECTS', body:`&bull; <b class="red">BURN</b> — damage at end of every turn for N turns.<br>&bull; <b class="green">POISON</b> — damage at end of every turn for N turns.<br>&bull; <b>WEAK</b> — target deals reduced damage.<br>&bull; <b>VULNERABLE</b> — target takes +25% damage.<br>&bull; <b>STUN</b> — target skips its next turn.<br><br>Re-applying a status takes the MAX of the old and new durations — never the SUM. Guile II lengthens the statuses you apply.`},
  ultimate:{title:'ULTIMATE', body:`Charge fills as you attack, get hit, cast, and kill. At <b>100</b> the ULT button glows.<br><br>Each class has its own ULT:<br>&bull; <b class="red">Warrior — Earthshatter</b>: massive AoE that stuns survivors.<br>&bull; <b class="purple">Mage — Mind Bolt</b>: a single nuclear bolt.<br>&bull; <b class="teal">Ranger — Death Volley</b>: hits every foe twice.<br><br>Charge carries between fights — saving up for a boss is real.`},
  stance:{title:'STANCE', body:`Three combat stances:<br><br>&bull; <b style="color:#ff7c50">AGGRESSIVE</b> — +25% damage out, you take +15% damage. Burst windows when the enemy is stunned or weakened.<br>&bull; <b style="color:#9fbcff">BALANCED</b> — no modifier. The default; never wrong.<br>&bull; <b style="color:#5cff8f">GUARDED</b> — -15% damage out, you take -25% damage. Sit out a HEAVY intent without losing a turn to Shield Wall.<br><br>Each battle starts BALANCED. Switching <b>commits you for 2 of your own turns</b> — the active stance shows a countdown badge, and the others stay locked until it expires. Read the intent, then commit.`},

// Build the glossary card grid lazily (used in the GLOSSARY info card).
function buildGlossaryHtml(){
  return GLOSSARY_GROUPS.map(g=>{
    const items = g.items.map(it=>
      `<button class="gloss-btn" data-info-concept="${it.k}"><span class="gloss-name">${it.name}</span><span class="gloss-blurb">${it.blurb}</span></button>`
    ).join('');
    return `<div class="gloss-group"><div class="gloss-head">${g.title}</div>${items}</div>`;
  }).join('');
}
function showGlossary(){ showInfo({title:INFO_TEXT.glossary.title, body: buildGlossaryHtml()}); }
function showInfo(key){
  const i=typeof key==='object'?key:INFO_TEXT[key];
  if(!i)return;
  const m=document.getElementById('info-modal');
  // Serialize — if a modal is already open, queue this one instead of overwriting it.
  if(m && !m.classList.contains('hidden')){ G._modalQueue=G._modalQueue||[]; G._modalQueue.push(i); return; }
  // Titles are authored with HTML entities (&mdash;, &#10022; etc) — textContent would
  // render them literally as "&mdash;". Use innerHTML so the entities resolve.
  document.getElementById('info-title').innerHTML=i.title;
  document.getElementById('info-text').innerHTML=i.body;
  if(m)m.classList.remove('hidden');
  SFX.play('chest');
}
function closeInfo(e){
  if(e&&e.target&&e.target.id!=='info-modal'&&!e.target.closest('.btn'))return;
  const m=document.getElementById('info-modal');
  if(m)m.classList.add('hidden');
  SFX.play('click');
  // Re-drain in priority order so a backdrop dismissal never orphans a Devour pick or a queued popup.
  // Multi-essence choice first, then per-fragment choice, then the build-progression queue.
  setTimeout(()=>{
    if(!G) return;
    const md=document.getElementById('info-modal'); if(md && !md.classList.contains('hidden')) return;
    if(G._modalQueue && G._modalQueue.length){ showInfo(G._modalQueue.shift()); }
    else if(G._multiEssenceFams && G._multiEssenceFams.length){ showMultiEssenceChoice(); }
    else if(G._fragQueue && G._fragQueue.length){ showFragmentChoice(); }
    else if(G._buildQueue && G._buildQueue.length && (!G.battle||G.battle.over)){ drainBuildQueue(); }
  }, 180);
}
/* BUILD PROGRESSION POPUPS — every meaningful upgrade interrupts the player so they see what
   their character just earned. Queued during battle, drained at battle end so combat is not
   constantly broken by modals. */
function popupBuild(title, body, kind, flashSub){
  G._buildQueue=G._buildQueue||[];
  const styled=`<div class="build-pop ${kind||''}">${body}</div>`;
  G._buildQueue.push({title, body:styled});
  // In-combat: fire a transient celebratory banner so the moment is FELT immediately.
  // The full modal still waits for battle end (no blocking modal mid-fight).
  if(G.battle && !G.battle.over){
    const fk={aff:'aff',synergy:'synergy',set:'set',relic:'relic',memory:'devour',level:'level'}[kind]||'synergy';
    (G.battle._buildFlash=G.battle._buildFlash||[]).push({label:title, sub:flashSub||'', kind:fk});
    SFX.play('levelup');
  }
  const m=document.getElementById('info-modal');
  const modalOpen=m && !m.classList.contains('hidden');
  if(!modalOpen && (!G.battle || G.battle.over)) drainBuildQueue();
}
// Clear the in-combat build-flash banners — called at the start of each player action so a
// celebration persists from when it was earned, through the enemy turn, until the player acts.
function clearBuildFlash(){ if(G.battle) G.battle._buildFlash=null; }
// Flash-only build celebration (no queued end-of-battle modal). For frequent events like level-up.
function flashBuild(label, sub, kind){
  if(G.battle && !G.battle.over){ (G.battle._buildFlash=G.battle._buildFlash||[]).push({label, sub:sub||'', kind:kind||'level'}); }
}
function drainBuildQueue(){
  if(G._stageHold) return;   // wait for the reveal stage to finish before the detail popup
  if(!G._buildQueue || !G._buildQueue.length) return;
  const next=G._buildQueue.shift();
  showInfo(next);
}
// REVEAL STAGE — full-viewport ceremony for moments the game used to whisper. 2.8s overlay,
// no click required, the modal-queue waits its turn so popupBuild()'s detail card still fires
// for the players who want to read the spec. Used for Devour evolutions, the Devour reveal,
// and Affinity tier-ups — three places where the build identity audibly clicks into place
// and the old presentation buried the moment in a build popup or a damage float.
function stageReveal(opts){
  opts=opts||{};
  const dur=opts.duration||2800;
  const color=opts.color||'purple';
  let el=document.getElementById('reveal-stage');
  if(!el){ el=document.createElement('div'); el.id='reveal-stage'; document.body.appendChild(el); }
  el.innerHTML=`<div class="reveal-card reveal-${color}">
    ${opts.kicker?`<div class="reveal-kicker">${opts.kicker}</div>`:''}
    <div class="reveal-title">${opts.title||''}</div>
    ${opts.formula?`<div class="reveal-formula">${opts.formula}</div>`:''}
    ${opts.body?`<div class="reveal-body">${opts.body}</div>`:''}
  </div>`;
  // restart the animation on re-fire by toggling the class
  el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
  try{ SFX.play(opts.sfx||'levelup'); }catch(e){}
  // Block the build queue from draining over the stage — drainBuildQueue checks _stageHold.
  G._stageHold=1;
  if(el._timer) clearTimeout(el._timer);
  el._timer=setTimeout(()=>{
    el.classList.remove('on'); el.innerHTML='';
    G._stageHold=0;
    // After the stage clears, the queued detail popup (if any) gets its turn.
    if(G._buildQueue && G._buildQueue.length){
      const modal=document.getElementById('info-modal');
      const modalOpen=modal && !modal.classList.contains('hidden');
      if(!modalOpen && (!G.battle || G.battle.over)) drainBuildQueue();
    }
  }, dur);
}
function relicNoteFor(name){const r=RELICS.find(x=>x.name===name);return r?r.note:'';}
function synergyDescFor(name){const s=SYNERGIES.find(x=>x.name===name);return s?s.desc:'';}
// Plain-text version for the title="" hover tooltip on pills and inventory rows. The browser
// strips HTML in a title attr, so this stays single-paragraph but uses bullets and dashes that
// at least separate tiers visually when the tooltip wraps.
function affinityTipFor(p,k){
  const m=AFF_META[k],t=p.affTier[k];
  const parts=[`${m.name} — ${p.aff[k]} points.`];
  const th=affThresh(k);
  for(let tier=1;tier<=AFF_TIER_MAX;tier++){
    const reached=t>=tier;
    const marker=reached?'[✓]':(tier===t+1?'[next]':'[ ]');
    parts.push(`${marker} T${tier} @ ${th[tier-1]}pts — ${AFF_TIER_TITLE[k][tier]}`);
  }
  return parts.join('\n');
}
// Rich-HTML version for the click-through modal. Each tier is its own block so the four
// readouts are not one wall of text. Colored marker (gold check / amber arrow / dim square),
// bold tier label, effect on its own line, threshold on the right.
function affinityModalHtml(p,k){
  const m=AFF_META[k],t=p.affTier[k]; const th=affThresh(k); const col=m.color;
  const head=`<div style="margin-bottom:10px;font-size:10px;color:#cfcbef"><b class="${col}">${m.name}</b> &mdash; <b>${p.aff[k]}</b> points</div>`;
  const rows=[];
  for(let tier=1;tier<=AFF_TIER_MAX;tier++){
    const reached=t>=tier; const isNext=(tier===t+1);
    const marker = reached ? '<span style="color:#5cff8f">✓</span>'
                 : isNext  ? `<span class="amber">▸</span>`
                 :           '<span style="color:#3a3a55">○</span>';
    const tierLabel=`<b class="${reached?col:isNext?'amber':'muted'}">T${tier}</b>`;
    const cost=`<span class="muted" style="font-size:8.5px;letter-spacing:.5px">${th[tier-1]} pts</span>`;
    const body=`<div style="font-size:9.5px;line-height:1.7;color:${reached?'#e6dcff':isNext?'#ffd87a':'#888'};margin-top:2px">${AFF_TIER_TITLE[k][tier]}</div>`;
    const bg = reached ? 'rgba(60,40,90,.22)' : isNext ? 'rgba(90,60,20,.20)' : 'rgba(20,20,32,.30)';
    const bd = reached ? '#5cff8f' : isNext ? '#ffcf4d' : '#2a2a40';
    rows.push(`<div style="display:block;padding:7px 10px;margin:5px 0;border-left:3px solid ${bd};background:${bg};border-radius:2px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span>${marker} &nbsp; ${tierLabel}</span>${cost}
      </div>
      ${body}
    </div>`);
  }
  return head+rows.join('');
}
function showRelicInfo(name){ showInfo({title:name,body:relicNoteFor(name)||'A relic of unknown power.'}); }
function showSynergyInfo(name){ const s=SYNERGIES.find(x=>x.name===name); showInfo({title:name,body:s?`${s.desc}<br><br><span class="muted">Formed by: ${s.need.join(' + ')}</span>`:'A relic synergy.'}); }
function showPathInfo(k){ if(!G.player)return; showInfo({title:AFF_META[k].name+' PATH',body:affinityModalHtml(G.player,k)}); }
/* HTML-attr-safe escape */
const escAttr=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function infoBtnHtml(key){
  return `<button class="info-btn" onclick="showInfo('${key}')" aria-label="What is this?" type="button">i</button>`;
}

function affinityBar(p){
  const earned=['w','g','v'].filter(k=>p.aff[k]>0);
  if(!earned.length && !(p.synergies&&p.synergies.length)) return '';
  const seg=k=>{ const m=AFF_META[k],t=p.affTier[k]; const roman=t>0?['I','II','III','IV'][t-1]:'';
    const next=t<AFF_TIER_MAX?affThresh(k)[t]:null; const prog=next?` ${p.aff[k]}/${next}`:' MAX';
    return `<span class="${m.color} tipline" title="${escAttr(affinityTipFor(p,k))}" data-info-path="${k}">${m.name}${t>0?' '+roman:''}${prog}</span>`; };
  let s=earned.length?`<div class="stats" style="font-size:8px">PATHS &middot; ${earned.map(seg).join(' &middot; ')}</div>`:'';
  if(p.synergies&&p.synergies.length) s+=`<div>${p.synergies.map(n=>
    `<span class="chip clickable" style="border-color:var(--teal);color:var(--teal)" title="${escAttr(synergyDescFor(n))}" data-info-synergy="${escAttr(n)}">&#10022; ${n}</span>`
  ).join('')}</div>`;
  return s;
}
function playerBar(p,full){
  // COMPACT out-of-combat strip. HP gets the visible bar; MP/ATK/DEF/etc. become inline text.
  // INVENTORY / SKILLS / SAGA live INSIDE this strip, on the same row as the stats — so they sit
  // inside the player's natural eye path (chamber title -> HP bar -> stats + actions -> doors)
  // instead of floating in the empty bottom-right corner where players stop scanning.
  const ec=effCrit(p),ed=effDodge(p); const ch=p._charge||0;
  const xpPct=clamp(p.xp/xpNeeded(p.level)*100,0,100);
  const mpPct=p.maxMana?clamp(p.mana/p.maxMana*100,0,100):0;
  const ultTag = ch>=100?' &middot; <span class="purple">&#10022; ULT READY</span>':'';
  // Affinity pills — inline at the end of the stats line so the HUD reads as ONE row, not three.
  // A path you haven't entered (tier 0, no points) is hidden — the row only shows what the build is
  // actually doing, which is what the player needs to track.
  const tierRoman=['','I','II','III','IV'];
  const affEntry=k=>{ const meta=AFF_META[k]; const t=p.affTier[k]; const pts=p.aff[k];
    if(t===0 && pts===0) return '';   // dead path — don't crowd the strip with it
    const next=t<AFF_TIER_MAX?affThresh(k)[t]:null;
    const lbl = t>0?` <span class="muted">${tierRoman[t]}</span>`:'';
    const prog = next!=null ? `<span class="muted">${pts}/${next}</span>` : `<span class="amber">MAX</span>`;
    return `<span class="aff-pill aff-${meta.color}" title="${escAttr(affinityTipFor(p,k))}" data-info-path="${k}" role="button" tabindex="0"><b>${meta.name}</b>${lbl} ${prog}</span>`; };
  const affPills = ['w','g','v'].map(affEntry).filter(s=>s).join('');
  // Each button TOGGLES its own view (tap again to close). The active view is highlighted so the strip
  // doubles as the tab bar — no in-panel tabs needed.
  const onInv=G.screen==='inventory'; const cv=G._invView||'gear';
  const act=v=>onInv&&cv===v?' on':'';
  const invBtns = `<div class="hud-actions">
    <button class="hud-btn${act('gear')}" onclick="openInventory('gear')" title="Your gear &amp; sets (i)"><span>&#9776;</span> INVENTORY <span class="hud-k">i</span></button>
    <button class="hud-btn hud-skills${act('powers')}" onclick="openInventory('powers')" title="Your skills, paths, relics &amp; synergies"><span>&#10022;</span> SKILLS</button>
    <button class="hud-btn hud-saga${act('saga')}" onclick="openInventory('saga')" title="Bestiary &amp; your Saga"><span>&#128220;</span> SAGA</button>
    <button class="hud-btn hud-help" onclick="showGlossary()" title="Glossary &mdash; learn every system">?</button>
  </div>`;
  // Potion pips — Slay-the-Spire-style explicit slot view.  Show up to 5 pips;
  // anything past that condenses to "+N".  Filled = available, empty = consumed
  // (visualises max-potions-this-run progression from relics/events).
  const potShown = Math.max(p.potions||0, 1);
  const potCap = Math.min(5, Math.max(3, potShown));
  let potPips = '';
  for(let i=0;i<potCap;i++){
    const filled = i < (p.potions||0);
    potPips += `<span class="pot-pip ${filled?'on':'off'}" title="${filled?'Potion ready — heals ~30% HP':'Empty potion slot'}">+</span>`;
  }
  if((p.potions||0) > potCap) potPips += `<span class="pot-pip on more" title="${p.potions} potions">+${(p.potions)-potCap}</span>`;
  return `<div class="panel tight pstrip">
    <div class="bar mini" style="margin:0 0 4px"><div class="lbl"><span class="green">${CLASSES[p.cls].name} &middot; LV${p.level}</span><span>${p.hp}/${p.maxHp} HP${ultTag}</span></div>
      <div class="track"><div class="fill hp" style="width:${clamp(p.hp/p.maxHp*100,0,100)}%"></div></div>
      <div class="track xpline"><div class="fill mp" style="width:${mpPct}%"></div></div></div>
    <div class="pstrip-row">
      <div class="stats pstats">MP <b>${p.mana}/${p.maxMana}</b> &middot; ATK <b>${p.atk+p.weapon.dmg}</b> &middot; DEF <b>${p.def}</b> &middot; DODGE <b>${ed}%</b> &middot; CRIT <b>${ec}%</b>${p.lifesteal?' &middot; LS <b>'+p.lifesteal+'%</b>':''} &middot; <span class="amber" title="Gold — spend at merchants">${p.gold}g</span> &middot; <span class="teal" title="Soul Essence — spent at the Forge">${p.essence} ${ESS}</span>${p.relics.length?` &middot; <span class="purple" title="${p.relics.length} relic${p.relics.length===1?'':'s'} carried">&#9670;${p.relics.length}</span>`:''}${affPills?' &middot; '+affPills:''}</div>
      <div class="pot-row" title="Potions ready (heal ~30% HP each)">${potPips}</div>
      ${invBtns}
    </div>
  </div>`;
}
/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if((e.key==='i'||e.key==='I')&&G.player){ if(G.screen==='inventory')closeInventory(); else if(['corridor','room','event','reward','triumph'].includes(G.screen))openInventory(); return; }
  const btns=[...document.querySelectorAll('.btn:not([disabled])')];
  const n=parseInt(e.key,10); if(!isNaN(n)&&n>=1&&n<=btns.length){btns[n-1].click();return;}
  if(e.key==='Enter'&&btns.length)btns[0].click(); });

/* ---------- audio init on first gesture + subtle click sfx ---------- */
function _audioGo(){ SFX.init(); SFX.refreshUI(); setMusicForScreen();
  document.removeEventListener('pointerdown',_audioGo,true);
  document.removeEventListener('keydown',_audioGo,true);
  document.removeEventListener('touchstart',_audioGo,true); }
document.addEventListener('pointerdown',_audioGo,true);
document.addEventListener('keydown',_audioGo,true);
document.addEventListener('touchstart',_audioGo,true);
document.addEventListener('click',e=>{
  const t=e.target.closest('.btn:not([disabled])'); if(t) SFX.play('click');
});
/* delegated handler for chip/info-button clicks (tap-friendly on mobile) */
document.addEventListener('click',e=>{
  const ic=e.target.closest('[data-info-concept]');
  if(ic){ const key=ic.getAttribute('data-info-concept');
    // Live-computed concept entries — content depends on the current run state.
    if(key==='ascension_active'){ showInfo(ascActiveInfo()); return; }
    showInfo(key); return; }
  const r=e.target.closest('[data-info-relic]');
  if(r){ showRelicInfo(r.getAttribute('data-info-relic')); return; }
  const s=e.target.closest('[data-info-synergy]');
  if(s){ showSynergyInfo(s.getAttribute('data-info-synergy')); return; }
  const p=e.target.closest('[data-info-path]');
  if(p){ showPathInfo(p.getAttribute('data-info-path')); return; }
});
/* Escape closes the info modal — through closeInfo so the queue drains */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ const m=document.getElementById('info-modal'); if(m&&!m.classList.contains('hidden')){ closeInfo(); } }
});
SFX.refreshUI();

render();
</script>
</body>
</html>
