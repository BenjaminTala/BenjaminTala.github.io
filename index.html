       if(r.deepest<RUN_LENGTH) return '<span class="shout">"Once."</span> He does not look up. <span class="shout-red">"Never again."</span> He does not say why.';
       return `<span class="shout">"Once."</span> Now he looks up. "You have been further than me, you know. Past the throne." <span class="shout-red">"There is a thing in the cold below the throne. It does not have a name. Even the dragon would not look at it."</span>`;}},
     {label:'Buy a partial map (-40 gold)',desc:'Next 2 corridors hit louder loot',run:p=>{if(p.gold<40)return 'He shrugs without looking up.';p.gold-=40;G._luckBoom=2; const n=npcState('cartog');
       if((n.bought||0)===0){ npcSet('cartog',{bought:1}); return 'The lines on the paper he gives you twitch and resettle as you watch. The next two chambers feel... helpful.'; }
       npcSet('cartog',{bought:(n.bought||0)+1}); return `"You buy these every time." He hands you a fresh sheet. "I do not know if they are different. They feel different to draw."`;}},
   ]},
  // === FURNACE EVENTS — stoke the Heat meter through chamber events too ===
  {id:'valve',title:'THE VALVE BURSTS',zone:1,art:"  ###    \n  )()(   \n  )()(   \n  ###    ",
   text:'A copper valve embedded in the wall coughs once, then explodes. A wave of dry heat washes over the chamber.',
   options:[
     {label:'Push through fast',desc:'+10 Heat, get out clean',run:p=>{addHeat(10);return 'You sprint past the wound in the wall. Your skin tightens. The Furnace stirs (+10 Heat).';}},
     {label:'Try to seal it',desc:'-12 HP, +4 Heat, find scrap',run:p=>{const c=12;selfHurt(p,c,'hazard');addHeat(4);p.gold+=18;return `You jam your cloak in the breach. It works long enough to gather ${18} loose scrap — but you are scorched (-${c} HP, +4 Heat).`;}},
     {label:'Back out',desc:'No reward, no cost',run:p=>'You back away. The valve keeps coughing behind you. Whatever was in there stays there.'},
   ]},
  {id:'forge_run',title:'THE FORGE OPERATES',zone:1,art:"   /-\\   \n  |fffi   \n  |[##]| \n   |  |  ",
   text:'You find a working forge — bellows wheezing, sparks falling, no smith in sight. The fire is doing the work alone.',
   options:[
     {label:'Temper a piece of armor',desc:'+3 DEF, +5 Heat',run:p=>{p.def+=3;addHeat(5);return 'You hold a plate into the flame until your palms blister. Your armor drinks the fire (+3 DEF, +5 Heat).';}},
     {label:'Pour your essence in',desc:'-15 essence, +5 ATK, +6 Heat',run:p=>{if(p.essence<15)return 'The forge waits. Your essence does not.';p.essence-=15;p.atk+=5;addHeat(6);return `The forge accepts ${15} essence and turns it back as fire (+5 ATK, +6 Heat).`;}},
     {label:'Pour water on it',desc:'-15 Heat, lose 1 potion',run:p=>{if(!p.potions)return 'You have nothing to pour.';p.potions--;coolHeat(15);return 'The forge goes dark with a long animal sound. Your skin loosens (-15 Heat, -1 potion).';}},
   ]},
  {id:'magma',title:'THE MAGMA CHANNEL',zone:1,art:"  ~~~~   \n ~~~~~   \n  ~~~    \n   ~     ",
   text:'A trench in the floor is full of slow-moving fire. Something glints at the bottom — gold, or a relic, or a face.',
   options:[
     {label:'Reach in for it',desc:'-22 HP, +12 Heat, big loot',run:p=>{const c=22;selfHurt(p,c,'hazard');addHeat(12);const g=40+rnd(40);p.gold+=g;return `You plunge your arm in. You take it. Whatever it was, it weighs less than you expected (-${c} HP, +12 Heat, +${g} gold).`;}},
     {label:'Pry it out with a blade',desc:'-8 HP, +6 Heat, small loot',run:p=>{const c=8;selfHurt(p,c,'hazard');addHeat(6);const g=18+rnd(20);p.gold+=g;return `You hook the glint out. Your arm still smokes (-${c} HP, +6 Heat, +${g} gold).`;}},
     {label:'Leave it',desc:'Nothing happens',run:p=>'You step around the channel. The Furnace keeps its trinkets.'},
   ]},
  {id:'priest',title:'THE DYING PRIEST',zone:0,sprite:{src:'assets/players/warrior.png',tint:'tint-grey'},art:"  .--.\n ( || )\n  )/\\(\n  |  |",
   text:'A robed man slumps against a half-broken shrine. He looks up and his eyes widen — with relief.',
   options:[
     {label:'"Father — are you hurt?"',desc:'Tend to him &middot; +1 potion &middot; he may teach you',run:p=>{p.potions++;let extra='';if(!p.memory && chance(60)){grantMemory(p,'tithe');extra=' He whispers a phrase you do not understand, but you will not forget it.';}return '"Another champion. Good. The last three never returned. Do not be the fourth." He presses a cold vial into your hand and is still. (+1 potion)'+extra;}},
     {label:'"What is down here?"',desc:'Press him &middot; he says little',run:p=>'"What is always down here." He shrugs as if you should know. "Just descend." He will say no more.'},
     {label:'Leave him to his god',desc:'Walk past &middot; small gold',run:p=>{const g=8+rnd(12);p.gold+=g;return `You leave him to his rattle. A small purse slips from his sleeve — ${g} gold.`;}},
   ]},
  {id:'oldmerc',title:'THE OLD MERCHANT',zone:0,sprite:{src:'assets/monsters/goblin.png',tint:'tint-gold'},art:"  .---.\n ( o-o )\n  )===( \n  |$$$|",
   text:'A bent old trader rummages through a chest, then peers up at you. He does not greet you. He just looks.',
   options:[
     {label:'"Have we met?"',desc:'Buy a curio — 14 gold',run:p=>{if(p.gold<14)return 'He glances at your empty purse and looks away.';p.gold-=14;p.maxHp+=8;heal(p,8);return '"You have the look. Same eyes as the others." He hands you a strange charm. (+8 max HP)';}},
     {label:'"Other champions came through?"',desc:'Listen',run:p=>'"All of them, son. Same face, different cloak." He laughs at his own joke. You do not.'},
     {label:'Walk away',desc:'No purchase',run:p=>'You leave. He does not ask your name. Nobody ever does, you realize.'},
   ]},
  {id:'burnedkt',title:'THE BURNED KNIGHT',zone:1,sprite:{src:'assets/players/warrior.png',tint:'tint-red'},art:"  ,---,\n  [o_o]\n  )/|\\(\n  /| |\\",
   text:'A knight in fire-blackened plate sits against a column. He raises his head — and goes very still.',
   options:[
     {label:'"Who are you?"',desc:'Press him',run:p=>{return '<span class="shout-red">"You wear his face."</span> He says it very quietly. <span class="shout-red">"The last one. That is all."</span> He refuses to look at you again.';}},
     {label:'"I have never been here before."',desc:'Insist &middot; he may teach you',run:p=>{p.atk+=2;let extra='';if(!p.memory && chance(55)){grantMemory(p,'ember');extra=' He sketches a flame-sigil in the ash; you feel it lodge in your hands.';}return '"...of course you have not." His voice is gentle. He hands you the hilt of a snapped sword. (+2 ATK)'+extra;}},
     {label:'Leave him to his armor',desc:'Walk past',run:p=>'You step past. Behind you, you hear him laugh once, quietly, in disbelief.'},
   ]},
  {id:'cultist',title:'THE DRAGON CULTIST',zone:1,sprite:{src:'assets/monsters/demon.png',tint:'tint-amber'},art:"  ,___,\n  ( ^ )\n  /\\=/\\\n  d   b",
   text:'A figure in scaled robes kneels at the lip of the Furnace, palms up. They do not turn to look at you.',
   options:[
     {label:'"What are you praying for?"',desc:'Listen',run:p=>'"That you will turn back." The cultist does not raise their head. "The Warden lets you pass eventually &mdash; that is the cruelty." A pause. "The first door is not the last door."'},
     {label:'"Not AGAIN? What does that mean?"',desc:'Demand an answer',run:p=>'They go silent. The silence is the answer.'},
     {label:'Kick them aside',desc:'+8 gold, -6 HP',run:p=>{const c=6;selfHurt(p,c,'hazard');p.gold+=8;return `You shove past. The cultist topples in. Their purse — ${8} gold — lies abandoned (-${c} HP, scuffle).`;}},
   ]},
  {id:'frozenchild',title:'THE FROZEN CHILD',zone:2,sprite:{src:'assets/players/ranger.png',tint:'tint-blue'},art:"   o\n  /|\\\n   |\n  / \\",
   text:'A child stands ankle-deep in frost, staring at you with patient, unsurprised eyes. They do not seem cold.',
   options:[
     {label:'"You\'re back."',desc:'Wait — what?',run:p=>{addMiasma(4);return '<span class="shout-purple">"You always come back. We have done this so many times now."</span> They smile, sadly. The child is gone before you can speak again. (the cold thickens)';}},
     {label:'"I don\'t know you."',desc:'Insist &middot; they may teach you',run:p=>{heal(p,Math.round(p.maxHp*0.12));let extra='';if(!p.memory && chance(55)){grantMemory(p,'hollow');extra=' Before they vanish, they show you how to step outside a moment.';}return '"...oh." The child looks down. "I am sorry. I thought you were ready." They press warm hands to your wound and walk into the wall. (heal)'+extra;}},
     {label:'Walk through them',desc:'They were never there',run:p=>{addMiasma(8);return 'There was no child. Of course there was no child. The Miasma is doing its work. (the cold thickens)';}},
   ]},
  {id:'scholar',title:'THE FROZEN SCHOLAR',zone:2,npc:'scholar',sprite:{src:'assets/players/mage.png',tint:'tint-purple'},art:"  [_=_]\n  ( o )\n  )===( \n  /| |\\",
   text:p=>{ const r=loadRecords(); const n=npcState('scholar');
     if(n.met<=1) return 'A scholar sits at a desk of ice, ledgers spread before her. She finishes a sentence before she looks up.';
     return `The scholar is on a new ledger. There are ${Math.max(0,(r.runs||1)-1)} closed ones stacked beside her, each one bound in pale leather. She does not look up. She is already writing your name.`;
   },
   options:[
     {label:'"What are you writing?"',desc:'Read the page',run:p=>{p.maxMana+=8;p.mana=clamp(p.mana+8,0,p.maxMana);addMiasma(3); npcSet('scholar',{stage:Math.max(1,npcState('scholar').stage),read:1});
       if(paleRumor()) return '"A record of every champion who came this far." She runs a finger down a column. <span class="shout-purple">"I keep a column for how each of you ends. The cold. The King. Your own greed."</span> A pause. <span class="shout-purple">"For a few, the column is blank. Not unknown &mdash; blank. As though no death was ever owed. As though there had been no one to die."</span> (+8 max mana, the cold thickens)';
       const r=loadRecords(); const showHand=(G.miasma>=18 || (r.runs||0)>=2);
       const punch = showHand
         ? `She turns the ledger. Your name is there ${(r.runs||0)>=2?`<b>${r.runs} times</b>`:'<b>once</b>'}. <b>In your handwriting.</b> The most recent entry is dated today.`
         : 'She turns the ledger. There are a great many names.';
       return `"A record of every champion who came this far." ${punch} (+8 max mana, the cold thickens)`;}},
     {label:'"Have you remembered yet?"',desc:'She asked you',run:p=>'<span class="shout-purple">"...then there is still time."</span> She does not look sad. She looks tired. She closes the ledger and is gone.'},
     {label:'Leave her',desc:'No questions',run:p=>'You walk on. The desk and the scholar are not behind you when you glance back.'},
   ]},
  {id:'elderecho',title:'AN ELDER ECHO',zone:3,sprite:{src:'assets/monsters/ghost.png',tint:'tint-purple'},art:"  .---.\n ( ??? )\n  )___(\n  /| |\\",
   text:'An old, old echo waits at a crossroads in the dark. It is not surprised to see you. It is counting.',
   options:[
     {label:'"How many times has it been?"',desc:'Ask',run:p=>{addMiasma(6);return '"...I lost the number around three hundred. After that I only counted in zones." It tilts its head. "We have been doing this for a while, you and I." (the cold thickens)';}},
     {label:'"I am the first."',desc:'Insist',run:p=>{return '"That is what every one of us says." It does not argue further. It just waits for you to leave.';}},
     {label:'Cut it down',desc:'Lay the echo to rest &middot; +essence',run:p=>{p.essence+=12;return `You cut the echo down. It does not resist. "Good," it says, very quietly. "Good." (+12 ${ESS})`;}},
   ]},
  {id:'lostchamp',title:'A LOST CHAMPION',zone:3,sprite:{src:'assets/players/warrior.png',tint:'tint-shadow'},art:"  .---,\n  ( ?? )\n  /|##|\\\n   |  |\n  _|  |_",
   text:'A champion stands at the lip of the Deep, looking down. They do not turn when you arrive.',
   options:[
     {label:'"Who were you?"',desc:'Ask',run:p=>'"We all thought we were heroes." They say it softly, without bitterness. "Even now. Even here." They will not say more.'},
     {label:'"What is at the bottom?"',desc:'Press',run:p=>{discoverLore('l15');return '"...the rest of you." They glance at you for the first time. "Go on. We have been waiting."';}},
     {label:'Step away from the edge',desc:'Take their relic if you can',run:p=>{const r=grantRandomRelic(p);return r?`You pull them back from the lip. They press a relic into your hands and sit. (relic: ${r})`:'You pull them back. They thank you with a relic you already carry — and refuse to take it back.';}},
   ]},
  // === DEVOUR-GATED — only surface once you have actually started eating things ===
  {id:'watcher',title:'THE WATCHFUL PRISONER',zone:2,npc:'watcher',available:p=>p.memory && p.memory.path && p.memory.path.length>=2,
   sprite:{src:'assets/players/mage.png',tint:'tint-purple'},art:"  ,---,\n  |[ ]|\n  ( - )\n  )===( \n  /| |\\",
   text:p=>{ const n=npcState('watcher');
     if(n.met<=1) return 'A man sits chained to a pillar of black iron. The chains are old. So is he. He watches you walk in, and his face goes very still — not afraid, exactly. Recognising something.';
     return 'The chained man is still there. Of course he is. He watches you come in and something that is almost a smile crosses him. "Back," he says. "More of him in you than last time. I can count it now, nearly."';
   },
   options:[
     {label:'"You know what I have been doing."',desc:'Acknowledge',run:p=>{discoverLore('l19');const fams=(p.memory.path||[]).slice(-2).join(', ');return `<span class="shout-purple">"I can taste it on you."</span> He does not flinch. <span class="shout-purple">"That is how He started. Small things. Then the ${fams}. Then everything else."</span> A long pause. "You should stop. You will not stop."`;}},
     {label:'"Who is HE?"',desc:'Press',run:p=>{discoverLore('l18');
       if(paleRumor()) return '"The one this place was built around." He grips the chain until it creaks. <span class="shout-red">"It does not &mdash; listen. It does not EAT you. Eating leaves something. A bone. A name said less and less."</span> His voice splinters. <span class="shout-red">"It un-happens you. I had a brother. I think. I cannot find the place where he was."</span>';
       return '"The one this place was built around." He nods toward the floor &mdash; downward. "We took him apart. We hid the pieces in the only place nothing leaves." He looks at you again. <span class="shout-red">"You have been finding them."</span>';}},
     {label:'"Break your chains?"',desc:'Free him &middot; +relic, +6 Miasma',run:p=>{const r=grantRandomRelic(p);addMiasma(6);return (r?`You snap the irons. He does not stand. He presses a small black relic into your hand &mdash; <b>${r}</b> &mdash; and closes his eyes. "Thank you. I have been here a long time."`:'You snap the irons. He does not stand. He presses something into your hand that you already carry, and closes his eyes.')+' (the cold thickens)';}},
     {label:'Walk past in silence',desc:'No reward, no cost',run:p=>'He watches you the whole way across the room. He does not call after you. He does not need to.'},
   ]},
  // ===== ORIGINAL EVENTS =====
  {id:'knight',title:'THE WOUNDED KNIGHT',sprite:{src:'assets/players/warrior.png',tint:'tint-grey'},art:"  ,---,\n  (x_x)\n  /|cross|\\\n   |   |",
   text:'A dying knight slumps against the wall. "Please... mend me, and take my blade."',
   options:[
     {label:'Heal him (-12 HP)',desc:'He gives you his weapon',run:p=>{selfHurt(p,12,'hazard');const w=makeItem('weapon',p.cls,G.depth+2);equipItem(p,w);return `You bind his wounds. He presses a ${w.name} (Lv${w.ilvl}) into your hands and fades away.`;}},
     {label:'Rob him',desc:'Take his gold, leave him',run:p=>{const g=25+rnd(30);p.gold+=g;return `You take ${g} gold from his pack. His eyes follow you into the dark.`;}},
     {label:'Leave him be',desc:'Walk away',run:p=>`You leave the knight to his fate.`},
   ]},
  {id:'imp',title:'THE GAMBLING IMP',sprite:{src:'assets/monsters/demon.png',tint:'tint-amber'},art:"  ^..^\n (?  ?)\n  )$$( ",
   text:'A grinning imp rattles a cup of dice. "Double or nothing, champion?"',
   options:[
     {label:'Bet 30 gold',desc:'50/50: win 60 or lose 30',run:p=>{if(p.gold<30)return 'You jingle empty pockets. The imp cackles and vanishes.';p.gold-=30;if(chance(50)){p.gold+=60;return 'The dice come up sevens! You pocket 60 gold.';}return 'Snake eyes. The imp snatches your coins and giggles away.';}},
     {label:'Bet everything',desc:'50/50: double all gold or lose it',run:p=>{if(p.gold<=0)return 'You have nothing to wager.';if(chance(48)){const g=p.gold;p.gold*=2;return `Fortune smiles! Your ${g} becomes ${p.gold} gold!`;}p.gold=0;return 'Disaster — you lose every coin to the cackling imp.';}},
     {label:'Refuse',desc:'Keep your gold',run:p=>'You decline. The imp sulks and disappears.'},
   ]},
  {id:'mirror2',title:'THE MIRROR CHAMBER',sprite:{src:'assets/players/mage.png',tint:'tint-purple'},art:"  +----+\n  | () |\n  |/||\\|\n  +----+",
   text:'Another champion stands across the chamber. Your face. Your scars. Your blade — held a heartbeat too late.',
   options:[
     {label:'Fuse with it',desc:'-25% max HP &middot; +6 ATK, +8% crit',run:p=>{const c=Math.round(p.maxHp*0.25);p.maxHp=Math.max(20,p.maxHp-c);p.hp=clamp(p.hp,1,p.maxHp);p.atk+=6;p.crit+=8;return `Skin to skin, soul to soul. The mirror is gone — -${c} max HP, +6 ATK, +8% crit.`;}},
     {label:'Challenge it',desc:'Fight a doppelganger; victory grants a random relic',run:p=>{const hp=Math.round(p.maxHp*1.05);const ene=freshEnemy({name:'Mirror Self',sprite:p.sprite||"  (??)\n /||\\\n  d b",hp,maxHp:hp,atk:Math.max(8,p.atk+2),def:Math.max(2,(p.def||0)+1),xp:38,_mirrorBoon:true});G.room={type:'enemy',_enemies:[ene]};startBattle('The mirror steps out — fight your own ghost!');return false;}},
     {label:'Shatter it',desc:'+14 essence, but the cold thickens',run:p=>{p.essence+=14;addMiasma(8);return `Glass rains down — +14 ${ESS}. The air sours where your reflection stood.`;}},
   ]},
  {id:'falseexit',title:'THE FALSE EXIT',art:"  /========\\\n  ||  ()  ||\n  || EXIT ||\n  || ____ ||\n  \\========/",
   text:'A door of warm gold light bars the corridor. It promises a way out — every coin you have, every kill you have made, safe and remembered.',
   options:[
     {label:'Step through &mdash; end the run now',desc:'Claim victory at current depth. The crypt forgets the rest.',run:p=>{G._falseExit=1;claimVictory();return false;}},
     {label:'Burn the door',desc:'Refuse &middot; +60% loot for the next 3 rooms',run:p=>{G._luckBoom=3;return 'You smash the gilded threshold. The light flares and dies — your luck swells for the next three rooms.';}},
     {label:'Touch the threshold',desc:'Risk Miasma; relic if it favors you',run:p=>{if(chance(55)){const r=grantRandomRelic(p);return r?`The gold flares — a relic forms in your hand: ${r}.`:'The gold flares — but you already carry every relic it knows.';}const c=12;addMiasma(12);selfHurt(p,c,'miasma');return `The threshold drinks from you (-${c} HP, the cold thickens).`;}},
   ]},
  {id:'mirror',title:'THE CURSED MIRROR',sprite:{src:'assets/players/mage.png',tint:'tint-blue'},art:"  +----+\n  | ?? |\n  | () |\n  +----+",
   text:'A tall mirror shows a warped reflection that moves a heartbeat too late.',
   options:[
     {label:'Gaze into it',desc:'Random boon or bane',run:p=>{const r=rnd(3);if(r===0){p.maxHp+=18;heal(p,18);return 'Your reflection grows stronger — +18 max HP!';}if(r===1){p.atk+=3;p.crit+=5;return 'It bares its teeth — +3 ATK, +5% crit!';}const c=Math.round(p.maxHp*0.12);selfHurt(p,c,'hazard');return `It lunges! You take ${c} damage from your own image.`;}},
     {label:'Shatter it',desc:'Gold among the shards',run:p=>{const g=20+rnd(25);p.gold+=g;if(chance(30)){p.dodge+=8;return `Glass rains down — ${g} gold, and shards grant +8% dodge.`;}return `It shatters into ${g} gold worth of glittering shards.`;}},
     {label:'Walk past',desc:'Trust nothing',run:p=>'You avert your eyes and move on.'},
   ]},
  {id:'altar',title:'THE BLOOD ALTAR',sprite:{src:'assets/monsters/demonlord.png',tint:'tint-red'},art:"   _____\n  |/+\\|\n  | V |\n  |___|",
   text:'A stone altar, still slick. It hungers, and offers power for pain.',
   options:[
     {label:'Offer blood (-20 max HP)',desc:'Gain a relic',run:p=>{p.maxHp=Math.max(20,p.maxHp-20);p.hp=clamp(p.hp,1,p.maxHp);const r=grantRandomRelic(p);return r?`The altar drinks deep. A relic forms: ${r}.`:'The altar drinks deep, but you already hold every relic it knows.';}},
     {label:'Offer gold (40)',desc:'Permanent +4 ATK',run:p=>{if(p.gold<40)return 'Not enough gold to satisfy the altar.';p.gold-=40;p.atk+=4;return 'Coins sizzle away. Strength floods your arms — +4 ATK.';}},
     {label:'Pray quietly',desc:'Small heal, leave',run:p=>{heal(p,Math.round(p.maxHp*0.2));return 'You pray. A faint warmth mends you a little.';}},
   ]},
  {id:'campfire',title:'A DYING CAMPFIRE',art:"   (~)\n  ( ~ )\n  /\\_/\\\n  |fire|",
   text:'Embers glow in an abandoned camp. You could rest, or pick through the gear.',
   options:[
     {label:'Rest by the fire',desc:'Heal 35% HP & mana',run:p=>{heal(p,Math.round(p.maxHp*0.35));p.mana=clamp(p.mana+Math.round(p.maxMana*0.35),0,p.maxMana);return 'You warm yourself and recover. (HP & mana restored)';}},
     {label:'Scavenge',desc:'Gold, maybe a potion',run:p=>{const g=12+rnd(18);p.gold+=g;let extra='';if(chance(45)){p.potions++;extra=' and a health potion';}return `You find ${g} gold${extra} among the packs.`;}},
     {label:'Douse it & move',desc:'Leave no trace',run:p=>'You scatter the embers and slip onward unseen.'},
   ]},
  {id:'spring',title:'THE ENCHANTED SPRING',sprite:{src:'assets/monsters/ghost.png',tint:'tint-blue'},art:"  .~~~.\n (~ + ~)\n  '~~~'",
   text:'Crystal water hums with magic. You could temper your weapon in it.',
   options:[
     {label:'Temper weapon',desc:'+5 weapon damage',run:p=>{p.weapon.dmg+=5;p.weapon.stats.dmg=(p.weapon.stats.dmg||0)+5;return `Your ${p.weapon.name} glows — its damage rises by 5!`;}},
     {label:'Drink deeply',desc:'Restore & +6 max mana',run:p=>{p.maxMana+=6;p.mana=p.maxMana;heal(p,Math.round(p.maxHp*0.25));return 'The waters refresh body and mind. (+6 max mana, restored)';}},
     {label:'Fill a flask',desc:'Gain a potion',run:p=>{p.potions++;return 'You bottle the glowing water as a potion.';}},
   ]},
  {id:'library',title:'THE FORGOTTEN LIBRARY',sprite:{src:'assets/players/mage.png',tint:'tint-purple'},art:"  [|||||]\n  [|||||]\n  [|||||]",

/* ============================================================
   LORE CODEX — fragments uncovered at story beats, collected across runs.
   Pulls the player deeper: find the next piece, learn how it ends.
   ============================================================ */
const LORE=[
  {id:'l1',t:'The Descent',x:'Everyone who comes here is told the same thing in town: go down, take the power, come back rich. Nobody in town has ever met someone who did the last part. You go down anyway. So did they.'},
  {id:'l2',t:'The Warm Crypt',x:'The upper halls were a prison, then a tomb, then forgotten. The warmth was never comfort. It was containment. Something down here has been kept warm on purpose.'},
  {id:'l3',t:'The Furnace',x:'Below the tombs, the heat is deliberate. Someone lit a fire and fed it for an age. Fire is a lock. Heat is a warning. The hotter it burns, the closer you are to the thing it cages.'},
  {id:'l4',t:'The Warden',x:'The dragon is older than the crypt around it. It does not move from its door. It does not call itself a guardian — it calls itself something gentler, which is somehow worse. Champions never quite know what to make of that, and they do not get the chance to ask twice.'},
  {id:'l5',t:'What the Cold Is',x:'When the Warden falls the fire goes out all at once, like a held breath let go. The cold that comes up the stairs to meet you is not the cold of a dead hearth. It is the cold of something that was running a temperature, and has just gone still.'},
  {id:'l6',t:'Miasma',x:'The cold is not weather. It is appetite. It does not freeze the body — it erodes the memory of being alive. Down here, wounds forget how to close.'},
  {id:'l7',t:'The Echoes',x:'The dead you meet were champions like you. The crypt did not eat their bodies — it kept their last moment, looping, lying. Speak gently. They misremember everything now.'},
  {id:'l8',t:'Time Debt',x:'Power taken early is existence borrowed late. The Collector keeps perfect accounts. It does not want your gold. It wants the years you will never get to live.'},
  {id:'l9',t:'The Silent Deep',x:'Beneath everything, reality runs thin. There are no walls here, only the suggestion of them. The Deep is where possibility goes to be unmade.'},
  {id:'l10',t:'The Devourer',x:'It does not eat flesh. It eats what you might have become. Every champion it takes is un-happened. That is why none of them are remembered — not even by their mothers.'},
  {id:'l11',t:'The Phantom Forge',x:'The smith works a metal that throws no heat. He never looks up from the anvil &mdash; except once, when you turned to leave, and his hammer went quiet behind you. He did not say anything. He has not got a name on him anywhere, and he hammers like a man making sure he is still here.'},
  {id:'l12',t:'Why You Persist',x:'You return because the crypt let exactly one possibility survive: yours. Each run, a little more of the story stays with you. The crypt is learning you. You are learning it.'},
  {id:'l13',t:'The Forgotten King',x:'There is a throne set directly over the dark, and a man in it who has not stood in longer than the crypt has had a name. He is not guarding it. He is just heavy, and tired, and he has forgotten there was ever a choice in sitting down.'},
  {id:'l14',t:'The Last Truth',x:'The crypt opens. Something inside you does not leave. Every champion who escapes carries a sliver of the Deep back into the light. That is how it spreads. That is how it always wins.'},
  {id:'l15',t:'The Lie You Were Told',x:'You came down to kill it. You are sure of that. But every door opens for you, every chain was sized for your wrists, and the pieces you keep finding fit your hands like they were measured. You are not closing in on it. You are gathering it. You have always been gathering it.'},
  {id:'l16',t:'Why You Persist (the real reason)',x:'You keep a tally in the back of your skull that you never started. It only goes up. The Echoes count too &mdash; you have caught them mouthing your number under their breath. One of them stopped at the bottom and would not take another step. You understand him better than you would like.'},
  {id:'l17',t:'The Seventh Expedition',x:'There are records of six descents in the upper archives. The seventh is mentioned only in the margins, in the same hand, getting smaller. Nobody knows what happened to them. Nobody quite knows what happened to the records, either.'},
  {id:'l18',t:'Chambers Older Than the Crypt',x:'Some rooms down here are carved from a darker stone than the rest of the crypt. The cartographer claims those chambers do not stay in the same place between maps. The smith claims they were here before the door was. Whoever is right, the implication is unkind.'},
  {id:'l19',t:'Rumours of the Pale',x:'The smith says fire wins against everything except one thing. The cardinal says her god does not enter the lower chambers. The cartographer mapped the bottom once and refuses to do so again. None of them say the same name for it. None of them say its name aloud.'},
  {id:'l20',t:'The Thing Before',x:'The lowest stone is colder than ice has any right to make it, and it is older than the marks the masons left. They did not build a cage down here. They built around something they found and could not move. Even the Devourer was cut from it. Even the Devourer is a splinter.'},
];
function loadLore(){ try{ return JSON.parse(localStorage.getItem('crypt_lore')||'[]'); }catch(e){ return []; } }
function discoverLore(id){ if(!LORE.find(l=>l.id===id))return false; const k=loadLore(); if(k.includes(id))return false; k.push(id); try{localStorage.setItem('crypt_lore',JSON.stringify(k));}catch(e){} const l=LORE.find(x=>x.id===id); const msg='&#128220; LORE UNCOVERED — '+l.t; if(G.screen==='battle')blog(msg,'lvl'); else G._loreMsg=msg;
  // l15 is "The Lie You Were Told" — the truth about the Champion. At that moment,
  // Harvest Essence renames itself to DEVOUR.
  if(id==='l15' && G.player) try{ revealDevour(); }catch(e){}
  return true; }
function loadRecords(){ try{ return Object.assign({deepest:0,runs:0,wins:0},JSON.parse(localStorage.getItem('crypt_records')||'{}')); }catch(e){ return {deepest:0,runs:0,wins:0}; } }
function recordRun(win){ const r=loadRecords(); r.runs=(r.runs||0)+1; if(win)r.wins=(r.wins||0)+1; r.deepest=Math.max(r.deepest||0,G.depth); try{localStorage.setItem('crypt_records',JSON.stringify(r));}catch(e){} }
// Cross-run Time Debt ledger — feeds the Collector's "you again" recognition.
function noteBorrow(amt){ const r=loadRecords(); r.borrowedTotal=(r.borrowedTotal||0)+amt; try{localStorage.setItem('crypt_records',JSON.stringify(r));}catch(e){} }
function noteCollector(){ const r=loadRecords(); r.collectorMet=(r.collectorMet||0)+1; try{localStorage.setItem('crypt_records',JSON.stringify(r));}catch(e){} }
/* ============================================================
   NPC MEMORY — recurring characters that REMEMBER you between runs.
   Each anchor NPC stores a small per-NPC blob (stage, met-count, last-line) so a
   second meeting can land differently from a first. Persists in crypt_npc.
   ============================================================ */
function loadNpc(){ try{ return JSON.parse(localStorage.getItem('crypt_npc')||'{}'); }catch(e){ return {}; } }
function saveNpc(s){ try{ localStorage.setItem('crypt_npc',JSON.stringify(s)); }catch(e){} }
// Read this NPC's state (always returns an object with `met` and `stage` defined).
function npcState(id){ const s=loadNpc(); return Object.assign({met:0,stage:0},s[id]||{}); }
// Advance one or more fields on this NPC's persistent record.
function npcSet(id, patch){ const s=loadNpc(); s[id]=Object.assign({met:0,stage:0},s[id]||{},patch); saveNpc(s); return s[id]; }
// Called the first time the player opens an anchor NPC's screen this run — bumps the
// truthful lifetime meeting counter and stamps which run-number this meeting happened on.
function npcMeet(id){ const r=loadRecords(); const s=loadNpc(); const cur=Object.assign({met:0,stage:0},s[id]||{});
  cur.met=(cur.met||0)+1; cur.lastRun=r.runs||0; s[id]=cur; saveNpc(s); return cur; }
// Human-readable ordinal for run/meeting counters: 1st, 2nd, 3rd, 4th...
function ordinal(n){ n=n|0; const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
/* ============================================================
   THE PALE — myth seeding. References to the thing at the bottom are RARE and grow slightly
   more frequent the deeper the player has historically gone. A true first-timer hears nothing
   (the world greets them before it warns them); by the time someone nears the Abyss they have
   caught fragments from frightened mouths — but never the whole truth. Voices stay distinct;
   nothing ever states what it IS.
   ============================================================ */
function paleRumorChance(){ const d=(loadRecords().deepest)||0;
  if(d<11) return 0;            // run 1 / barely descended — let the world be ordinary first
  if(d>=RUN_LENGTH) return 48;  // reached the throne — the deep is openly afraid for you now
  if(d>=30) return 36;          // far into the cold
  if(d>=18) return 23;          // past the Warden
  return 11; }                  // a faint, rare fragment
function paleRumor(){ return chance(paleRumorChance()); }
/* atmospheric whispers — drip the world into the player run by run */
const WHISPERS={
  0:['You hear something turn over in its sleep, far below.','Dust falls in still air. The crypt is listening.','A name is scratched into the stone — you do not know it. Yet.','The torches here are newer than the tombs.','A single boot lies forgotten. Its owner did not walk back this way.'],
  1:['Iron sweats. The Furnace is testing you.','A draught carries the smell of cooked metal.','Something hammers in time with your heart.','The walls remember being warmer than this.','A handprint, melted into the stone, fingers spread wide.'],
  2:['Your breath is the loudest sound in the world now.','Frost forms on the rim of your eye.','A whisper, barely there: "you opened it."','Wounds you do not remember taking weep slowly.','You think you saw your own reflection turn a corner ahead.'],
  3:['Reality grows thin like worn cloth.','You step where there is no floor and do not fall.','You catch yourself thinking thoughts that are not yours.','The Deep has been waiting a very long time. It is patient.','A voice that sounds like yours says: "we are almost home."'],
};
// Rare wall-inscriptions about the Pale — only deep (zone 3 / Abyss) and double-gated so even
// there they are uncommon. The walls themselves are too afraid to say it plainly.
const PALE_INSCRIPTIONS=[
  'Scratched into the wall, very small: "IT IS COLDER FURTHER DOWN. IT IS COLDER THAN DOWN."',
  'Someone has written, crossed out, and written again: "do not name it · do not name it · do not"',
  'Gouged deep into the stone: "the dragon could look at anything. it would not look at this."',
  'Words worn nearly smooth: "before hunger had a name, this was already hungry."',
  'Tally marks, then a final line struck clean through all of them, then nothing at all.',

// ABYSS WHISPERS — past the throne the world stops behaving. These never appear in a normal run;
// the deeper you go, the less the dark pretends to be a dungeon.
const ABYSS_WHISPERS=[
  'The chambers have stopped numbering themselves. The floor tag is guessing now.',
  'You pass a door you have already opened. It is still closed. Both are true.',
  'Your shadow arrives a moment before you do, and waits for you to catch up.',

  'You hear the surface, very faintly &mdash; the way you hear a place you only invented.',
  'You meet yourself going the other way. Neither of you is surprised. Neither of you stops.',

function whisperFor(d){
  if((G.abyss || zoneOf(d)>=3) && paleRumor() && chance(40)) return pick(PALE_INSCRIPTIONS);
  if(G.abyss) return chance(60)?pick(ABYSS_WHISPERS):pick(WHISPERS[3]);
  return pick(WHISPERS[zoneOf(d)]||WHISPERS[0]); }

const BOSS_BIO={
  ogre:'An old warlord who chose this crypt over a soft death. He keeps the gate as a kindness — to himself.',
  gobking:'The last of his kin who could read. He has no kingdom left, only loyal teeth.',
  spider:'Her children are old enough to walk now. She is hungry from the long wait.',
  warden:"Older than the crypt around it. It sleeps in front of one specific door and will not let it open. It does not move. It does not eat. It does not blink. Champions who pause to ask what it is doing there rarely come back to argue.",
  necro:'Holds court over a parliament that no longer remembers being alive.',
  titan:'Stone hauled into this shape by hands that have since forgotten how.',
  tyrant:'It rules the dark by the simple right of being there longest.',
  demon:'Brought down here in chains by a champion none remember. It outlived them.',
  lich:'Studied immortality for so long it forgot to study mercy.',
  flameknight:'Asked to die for a kingdom that no longer existed, and refused.',
  king:'He sat. The Deep stayed shut. He has been sitting for an age and a half.',

  devourer:'It does not eat flesh. It eats every future that ever could have been.',
  remembered:'A figure that waits at the bottom. It does not introduce itself, and it does not need to: it speaks as if it has known you for centuries. Believe what it says, or do not.',

// BOSS AWARENESS — at most one extra line, reacting to HOW the player arrived: overheated, frozen,
// deep in Devour, or returning to a boss that has killed them before. Makes bosses feel aware of
// the run without changing their mechanics. Returns '' for an ordinary arrival.
function bossAwareLine(key){
  const p=G.player; if(!p) return '';
  const r=loadRecords(); const bd=(r.bossDeaths&&r.bossDeaths[key])||0;
  const wrap=(cls,t)=>`<p class="${cls}" style="font-size:11px;line-height:1.7;margin-bottom:8px">${t}</p>`;
  // Prior-death recognition wins over arrival-state — being remembered is the stronger beat.
  if(bd>=2) return wrap('shout-purple','It regards you the way you regard a door you have already walked through. "You. Again. We both know how this goes."');
  if(key==='warden'){
    if(heatTier()>=4) return wrap('shout-red','Steam screams off your armour as you near it. The Warden\'s head turns, slow and deliberate. "You come carrying the Furnace itself. Good. It will be quicker for both of us."');
    if(G.heat<=8) return wrap('shout','"You came cold." It sounds, almost, disappointed. "The others ran hot. They burned out before the door. You... you might make me move."');
  }
  if(key==='remembered' && miasmaActive() && miasmaTier()>=4) return wrap('shout-purple','"You are mostly cold now. Good. There is so much less of you to argue with this time."');
  if((key==='king'||key==='dragon'||key==='devourer') && p.memory && p.memory.path && p.memory.path.length>=3) return wrap('shout-red','It sees what you have been eating on the way down. It goes very still. "...oh. You are doing it on purpose this time."');
  if(key==='devourer' && (G.debt||0)>=60) return wrap('shout-purple','"You owe so much already. Borrowing against a future you will not be allowed to keep." It almost sounds kind.');
  return '';

  // Net verdict — answers "is this an upgrade?" so players don't have to do the math.
  let verdict=''; if(cur){ const ds=gearScore(it)-gearScore(cur);
    verdict = ds>1.5 ? ' &middot; <span class="green">UPGRADE</span>'
            : ds<-1.5 ? ' &middot; <span class="red">DOWNGRADE</span>'
            : ' &middot; <span class="muted">SIDEGRADE</span>'; }
  return parts.join(' &middot; ')+verdict+itemExtraText(it); }
function itemLabel(it){ return `<span class="${RARITY[it.rarity].cls}">${it.name}</span> <span class="muted">Lv${it.ilvl}</span>`; }
function itemStatsText(it){ const parts=[]; const lbl={dmg:'DMG',atk:'ATK',def:'DEF',maxHp:'HP',maxMana:'MP',crit:'CRIT%',dodge:'DODGE%',lifesteal:'LS%',regen:'RGN'};
  for(const k in it.stats){ parts.push(`+${it.stats[k]} ${lbl[k]||k}`); }
  let s=parts.join(', ');
  if(it.passiveDesc)s+=` &middot; <span class="amber">${it.passiveDesc}</span>`;
  if(it.trait&&WEAPON_TRAITS[it.trait]){ const t=WEAPON_TRAITS[it.trait]; s+=` &middot; <span class="${t.color}">&#10070; ${t.name}</span>`; }
  if(it.set)s+=` &middot; <span class="teal">${it.set} set</span>`;
  return s; }

function depthFactor(){ const d=Math.max(0,G.depth-1); return 1+d*0.10+d*d*0.0065; }
function scaleHpVal(base){ return Math.round(base*depthFactor()*G.mods.eHp); }
function depthLabel(){ if(G.abyss){ return `<span class="purple">THE ABYSS</span> &middot; DEPTH ${G.depth-RUN_LENGTH}`; } const z=ZONES[zoneOf(G.depth)]; return `<span class="${z.color}">${z.name}</span> &middot; CHAMBER ${G.depth}/${RUN_LENGTH}`; }
function omenTag(){ return G.omen&&G.omen.id!=='none'?`<div class="omentag">&#10022; OMEN: ${G.omen.name}</div>`:''; }
function worldBar(){ const parts=[];
  if(heatActive()&&G.heat>0){ const t=heatTier(); const lbl=['',' WARM',' ASHEN',' MOLTEN',' BLAZING',' OVERHEAT'][t]; const c=['#ffcf4d','#ffcf4d','#ff9a3c','#ff5c6a','#ff2a2a','#ff0028'][t];
    const hp=t>=3?' pulse-heat':'';   // the Furnace turns hostile — the meter throbs from MOLTEN up
    parts.push(`<span class="wmeter clickable${hp}" data-info-concept="heat" style="color:${c}">&#128293; HEAT ${G.heat}/${HEAT_MAX}${lbl?' — '+lbl.trim():''}</span>`); }
  if(miasmaActive()&&G.miasma>0){ const t=miasmaTier(); const lbl=['','WATCHED','WOUNDS RESIST','HUNGERING','SOUL ROT','BLEEDING','DECAYING'][Math.min(6,t)];
    const c=['#b394d9','#c47bff','#b454f0','#a23add','#8a1ec6','#7800b8','#6a009a'][Math.min(6,t)];
    const pulse=t>=2?' pulse-mia':'';   // the corruption is in your blood — it throbs from tier 2 up
    parts.push(`<span class="wmeter clickable purple${pulse}" data-info-concept="miasma" style="color:${c}">&#9763; MIASMA ${G.miasma}/99${lbl?' &mdash; '+lbl:''}</span>`); }
  if(G.debt>0){ parts.push(`<span class="wmeter clickable amber" data-info-concept="timedebt">&#8987; DEBT ${G.debt}${G.collectorEta>0?' — Collector ETA '+G.collectorEta:''}</span>`); }
  if(!parts.length)return '';
  const pulse=G._worldPulse?' worldpulse':''; G._worldPulse=0;
  return `<div class="omentag${pulse}">${parts.join(' &nbsp;&middot;&nbsp; ')}</div>`; }

function makeGroup(depth){
  let count=1; const r=rnd(100);
  if(depth>=12){ count=r<12?1:r<46?2:r<84?3:4; }
  else if(depth>=6){ count=r<26?1:r<64?2:r<92?3:4; }
  else if(depth>=3){ count=r<44?1:r<84?2:3; }
  else { count=r<68?1:2; }
  count+=G.mods.packBonus; count=clamp(count,1,4);
  return Array.from({length:count},()=>({base:pick(ENEMIES),affix:rollAffix(depth)}));
}
function rollAffix(depth){
  let p=4+depth*1.1; p*=G.mods.eliteMul;
  return chance(p)?pick(AFFIXES):null;
}

function discoveryRoom(depth){

  // breaking. Per-corridor + rarity + condition gates still keep abyss discoveries occasional.
  if((G._discoveryEntered && !G.abyss) || BOSS_CHAMBERS[depth]!==undefined) return null;
  for(const d of DISCOVERIES){
    if(d.once && discSeen(d.id)) continue;
    if(!d.when()) continue;
    if(!rarityRoll(d.tier)) continue;
    const ev=d.build();

function makeRoom(depth){
  if(BOSS_CHAMBERS[depth]!==undefined){ const key=pick(BOSS_POOL[BOSS_CHAMBERS[depth]]);
    return {type:'enemy',boss:key,peek:peek(depth===RUN_LENGTH?'bossFinal':'boss')}; }

  const greedy=G.mods.greedy;

  if(r<(greedy?58:62)){ const g=makeGroup(depth); return {type:'enemy',group:g,peek:groupPeek(g)}; }
  if(r<(greedy?72:74)) return {type:'chest',peek:peek('chest')};
  if(r<82) return {type:'relic',peek:peek('relic')};
  if(r<90) return {type:'event',ev:pickEvent(),peek:peek('event')};
  if(r<(greedy?94:93)) return {type:'merchant',peek:peek('merchant')};
  if(r<95) return {type:'forge',peek:peek('forge')};
  if(r<97) return {type:'shrine',peek:peek('shrine')};

function pickEvent(){
  const p=G.player;
  const gateOk=e=>!e.available || e.available(p);
  let avail=EVENTS.filter(e=>!G.seenEvents.includes(e.id) && gateOk(e));
  if(!avail.length){ G.seenEvents=[]; avail=EVENTS.filter(gateOk); }
  if(!avail.length) avail=EVENTS;
  // Mystery zone-bias: ~78% chance the event is one tagged for THIS zone (the NPC drip).
  // The mystery layer needs to actually surface — these encounters carry the story.
  const z=G.abyss?3:zoneOf(G.depth);
  const zoneMatch=avail.filter(e=>e.zone===z);
  if(zoneMatch.length && chance(78)) avail=zoneMatch;
  const e=pick(avail); G.seenEvents.push(e.id); return e;
}

function newStatus(){ return {burn:0,burnT:0,poison:0,poisonT:0,weak:0,weakT:0,vuln:0,vulnT:0,stunT:0,regen:0,regenT:0}; }

/* ---------- EVENTS ---------- */
function renderEvent(){
  const r=G.room,ev=r.ev,p=G.player;
  // First reveal of an anchor NPC this room — bump their persistent meet counter once.
  // Doors get re-rendered; without this guard the counter would tick on every render call.
  // The counter MUST tick before any text is computed so the intro reflects this meeting.
  if(!r._npcMet && ev.npc){ npcMeet(ev.npc); r._npcMet=1; }
  // Anchor NPCs put their intro text in a function so it reads current persistence; ordinary
  // events keep using a plain string. Resolve either form here.
  const evText = (typeof ev.text==='function') ? ev.text(p) : ev.text;
  const art=ev.sprite
    ?`<img class="ev-sprite ${ev.sprite.tint||''}" src="${ev.sprite.src}" alt="${ev.title}" draggable="false">`
    :`<pre class="sprite teal">${ev.art}</pre>`;
  if(r.outcome){
    app.innerHTML=`<div class="floortag">${depthLabel()}</div>${omenTag()}${worldBar()}${playerBar(p)}
      <div class="panel fade room-in"><h3 class="center teal" style="margin-bottom:8px">${ev.title}</h3>
        ${art}
        <p class="evtext center">${r.outcome}</p>
        <button class="btn center" onclick="proceed()"><span class="k">&#9654;</span>CONTINUE</button>
        <button class="btn muted center" onclick="openInventory()"><span class="k">&#9776;</span>INVENTORY (i)</button></div>`;
    return;
  }
  const opts=ev.options.map((o,i)=>`<button class="btn" onclick="chooseEvent(${i})"><span class="k teal">[${i+1}]</span>${o.label}<small>${o.desc}</small></button>`).join('');
  app.innerHTML=`<div class="floortag">${depthLabel()}</div>${omenTag()}${worldBar()}${playerBar(p)}
    <div class="panel fade room-in"><h3 class="center teal" style="margin-bottom:8px">${ev.title}</h3>
      ${art}
      <p class="evtext center">${evText}</p>${opts}
      <button class="btn muted center" onclick="openInventory()"><span class="k">&#9776;</span>INVENTORY (i)</button></div>`;
}
function chooseEvent(i){ const r=G.room,res=r.ev.options[i].run(G.player);
  if(res===false) return;            // a battle was started
  r.outcome=res; render();
  // CONSEQUENCE POPUP — any event outcome should be impossible to miss.
  // Pops the outcome up in a modal so the player has to register what just happened.
  if(typeof res==='string' && res.length){
    showInfo({title:r.ev.title+' &mdash; outcome',body:`<p class="shout" style="font-size:11px;line-height:1.8">${res}</p>`});
  }
}

function buy(kind){ const p=G.player,st=G.room.stock; let bought=false; const mc=b=>Math.round(b*(st.pm||1));

/* ---------- THE FORGE (spend Soul Essence to grow OP) ---------- */
function upgradeGear(p,slot){ const it=p.equip[slot]; if(!it)return false;
  applyItemStats(p,it,-1);
  const oldIl=it.ilvl,newIl=oldIl+2,f=(1+(newIl-1)*0.10)/(1+(oldIl-1)*0.10);
  for(const k in it.stats) it.stats[k]=Math.max(it.stats[k]+1,Math.round(it.stats[k]*f));
  it.ilvl=newIl; if(slot==='weapon')it.dmg=it.stats.dmg||it.dmg;
  applyItemStats(p,it,+1); recomputeSets(p); recomputeAffinity(p); return true; }
function forgeUpgrade(slot){ const p=G.player,it=p.equip[slot]; if(!it)return false;
  const cost=14+it.ilvl*2; if(p.essence<cost)return false; p.essence-=cost; return upgradeGear(p,slot); }
function forgeReforge(slot){ const p=G.player,it=p.equip[slot]; if(!it||it.rarity>=4)return false;
  const cost=30+it.rarity*16; if(p.essence<cost)return false; p.essence-=cost;
  applyItemStats(p,it,-1);
  // Subtract the OLD passive's stat contribution before scaling, so reforging doesn't
  // permanently bake +12 crit / +22 mana from a prior affix into the base item.
  if(it._passiveStats){ for(const k in it._passiveStats){ it.stats[k]=Math.max(0,(it.stats[k]||0)-it._passiveStats[k]); } it._passiveStats=null; }
  // Clear any existing passive flag so a higher rarity can roll a new one.
  // Previously: items that already had a passive at Rare could never gain one at Epic/Legendary,
  // and the player silently paid essence for stat bumps only.
  if(it.passiveFlag){ removeFlag(p,it.passiveFlag); it.passiveFlag=null; it.passiveDesc=null; }
  const oldR=it.rarity,newR=oldR+1,f=RARITY[newR].mult/RARITY[oldR].mult;
  for(const k in it.stats) it.stats[k]=Math.max(it.stats[k]+1,Math.round(it.stats[k]*f));
  it.rarity=newR; let newFlag=null;
  if(RARITY[newR].passive&&!it.proc&&!it.set&&PASSIVES[passPool(slot)]){
    const pas=pick(PASSIVES[passPool(slot)]);
    if(pas.stat){ for(const k in pas.stat)it.stats[k]=(it.stats[k]||0)+pas.stat[k]; it._passiveStats=Object.assign({},pas.stat); }
    if(pas.proc&&slot==='weapon')it.proc=pas.proc;
    if(pas.flag){it.passiveFlag=pas.flag;newFlag=pas.flag;}
    it.passiveDesc=pas.desc; it.name=(pas.prefix||'')+it.name+(pas.suffix||''); }
  if(slot==='weapon')it.dmg=it.stats.dmg||it.dmg;
  applyItemStats(p,it,+1); if(newFlag)addFlag(p,newFlag); recomputeSets(p); recomputeAffinity(p); return true; }
function forgeImbue(){ const p=G.player,w=p.weapon,cost=24; if(p.essence<cost||w.proc)return false; p.essence-=cost;
  const o=pick([{proc:{burn:[7,3,55]},name:'Flaming',d:'hits may BURN'},{proc:{poison:[7,3,55]},name:'Venomous',d:'hits may POISON'},{proc:{vuln:[2]},name:'Sundering',d:'hits apply VULNERABLE'}]);
  w.proc=o.proc; w.passiveDesc=o.d; if(!/^(Flaming|Venomous|Sundering)/.test(w.name))w.name=o.name+' '+w.name; return true; }
// SOUL ESSENCE -> AFFINITY: a late-game sink that feeds the identity system instead of capping out.
function forgeAttune(path){ const p=G.player,cost=40; if(p.essence<cost)return false; p.essence-=cost;
  addAffinity(p,{[path]:2}); checkAffinityTiers(p); return true; }
function fAttune(path){ SFX.play(forgeAttune(path)?'upgrade':'fail'); renderForge(); }
function fUpgrade(s){ SFX.play(forgeUpgrade(s)?'upgrade':'fail'); renderForge(); }
function fReforge(s){ SFX.play(forgeReforge(s)?'upgrade':'fail'); renderForge(); }
function fImbue(){ SFX.play(forgeImbue()?'upgrade':'fail'); renderForge(); }

function renderForge(){ const p=G.player; discoverLore('l11');

    return fb(`Reforge ${s.toUpperCase()}: <span class="${RARITY[it.rarity].cls}">${RARITY[it.rarity].name}</span> &rarr; <span class="${RARITY[it.rarity+1].cls}">${RARITY[it.rarity+1].name}</span>`,c,'raise rarity; may grant a passive',`fReforge('${s}')`,p.essence>=c);}).join('');

      <h3 class="center amber" style="margin:8px 0">THE SOUL FORGE</h3>
      <p class="muted center" style="font-size:9px">A phantom smith hammers starlight. Spend <span class="teal">${p.essence} ${ESS} essence</span> to grow stronger.</p>

      <button class="btn muted center" onclick="openInventory()"><span class="k">&#9776;</span>INVENTORY (i)</button></div>${statusFooter()}`;
}

/* ============================================================

   ============================================================ */
function startBattle(intro){
  const r=G.room; const enemies=r._enemies?r._enemies:buildEnemies(r);
  // Ultimate charge persists across fights — saving up matters.
  const carriedCharge=(G.player&&G.player._charge!=null)?G.player._charge:0;
  G.battle={enemies,target:0,pdef:0,pdefTurns:0,evade:0,evadeTurns:0,guardDown:0,barrier:0,charge:carriedCharge,
    over:false,anim:'',animIdx:-1,usedSecond:false,floats:[],fx:[],
    pst:newStatus(),hadBoss:enemies.some(e=>e.boss),isFinal:!G.abyss&&enemies.some(e=>BOSSES.dragon.name===e.name||BOSSES.king.name===e.name)&&G.depth>=RUN_LENGTH};
  const p=G.player;
  if(p.flags.combatRegen||p.affTier.v>=2){ G.battle.pst.regen=Math.max(2,Math.round(p.maxHp*(p.affTier.v>=2?0.045:0.04))); G.battle.pst.regenT=999; }
  let bar=0; if(p.affTier.v>=3)bar+=Math.round(p.maxHp*0.22); if(p.flags.gearBarrier)bar+=Math.round(p.maxHp*0.12); G.battle.barrier=bar;
  // If the player walks in already under 25% HP, fire the heartbeat now so the warning isn't
  // skipped just because no incoming hit crossed the boundary.
  checkLowHpHeartbeat(p);
  G.log=[];
  if(intro) blog(intro,'info');
  blog(enemies.length>1?`${enemies.length} foes block your path!`:`A ${enemies[0].name} appears!`,'info');
  const bk=enemies.find(e=>e.boss); G._curBossKey=(bk&&bk._key)||null;   // for "you again" death recognition
  const bossE=enemies.find(e=>e.boss&&e.cry); if(bossE){ blog(bossE.cry,'crit'); if(bossE._key)showBossIntro(bossE._key); }
  const heatFed=enemies.find(e=>e._heatFed); if(heatFed){ blog(`&#128293; The Furnace howls &mdash; its keeper feeds on the heat you carried in. (+${Math.round((heatFed-2)*20)}% HP & ATK)`,'crit'); }
  G.battle.intro=true;
  // First-round intents — the player sees what every foe plans before they act.
  G.battle.enemies.forEach(e=>{ e._alive=0; planIntent(e,G.battle); });
  G.screen='battle'; render(); playTransition(G.battle.hadBoss?'#6e0d1a':'#3a1622');
}
function blog(t,c=''){ G.log.push({text:t,cls:c}); if(G.log.length>40)G.log.shift(); }
function living(){ return G.battle.enemies.filter(e=>e.hp>0); }
function allDead(){ return G.battle.enemies.every(e=>e.hp<=0); }
function ensureTarget(){ const b=G.battle; if(!b.enemies[b.target]||b.enemies[b.target].hp<=0){ const i=b.enemies.findIndex(e=>e.hp>0); b.target=i<0?0:i; } }

/* ============================================================
   ENEMY INTENT — every foe telegraphs its next move so the player
   can decide who to silence, burst, or stun.  Roles fall out of the
   stats: casters cast, low-HP enemies enrage, bosses occasionally
   charge a big attack over two turns.
   ============================================================ */
const INTENT_DISPLAY={
  attack: {ico:'&#9876;', cls:''},
  heavy:  {ico:'&#9888;', cls:'i-danger'},
  charge: {ico:'&#9889;', cls:'i-charge'},
  unleash:{ico:'&#9760;', cls:'i-danger'},
  burn:   {ico:'&#128293;', cls:'i-cast'},
  poison: {ico:'&#9763;', cls:'i-cast'},
  weak:   {ico:'&#8595;', cls:'i-cast'},
  vuln:   {ico:'&#10687;', cls:'i-cast'},
  stun:   {ico:'&#9889;', cls:'i-cast'},
  heal:   {ico:'&#10010;', cls:'i-heal'},
  armor:  {ico:'&#128737;', cls:'i-armor'},
  enrage: {ico:'!!', cls:'i-enrage'},
  manaburn:{ico:'&#8709;', cls:'i-cast'},
};
function planIntent(e,b){
  if(!e || e.hp<=0){ e.intent=null; return; }
  // If a multi-turn charge is locked in, advance it.
  if(e.intent && e.intent.kind==='charge' && e.intent.turns>1){
    e.intent={kind:'charge', label:`CHARGING &mdash; ${e.intent.turns-1} turn(s)`, value:e.intent.value, turns:e.intent.turns-1};
    return;
  }
  if(e.intent && e.intent.kind==='charge' && e.intent.turns===1){
    e.intent={kind:'unleash', label:`UNLEASH ${e.intent.value}`, value:e.intent.value};
    return;
  }
  // Bosses can begin a cataclysm — telegraphed 2 turns.
  // Sim showed bosses folded to a single ult window (99% kill rate). Cataclysm now RE-ARMS
  // at <40% HP for a phase-2 spike, so bosses can't be safely whittled down.
  if(e.boss && e._alive>=2){
    const wantPhase2 = e._chargedOnce && !e._chargedTwice && e.hp <= e.maxHp*0.40 && chance(50);
    const wantPhase1 = !e._chargedOnce && chance(28);
    if(wantPhase2 || wantPhase1){
      if(wantPhase2) e._chargedTwice=true; else e._chargedOnce=true;
      const dmg=Math.round(e.atk*(wantPhase2?3.0:2.6));
      e.intent={kind:'charge', label:`CATACLYSM ${dmg} &mdash; 2 turns`, value:dmg, turns:2};
      return;
    }
  }
  // Caster healing a wounded ally (PRIEST role).
  if(e.caster){
    const wounded=(b.enemies||[]).find(x=>x.hp>0 && x.hp<x.maxHp*0.55 && x!==e);
    if(wounded && chance(45)){
      // Priest heals are now a real threat (30% of ally maxHP, was 20%) so killing the healer
      // FIRST becomes a genuine target-priority decision instead of always hitting lowest HP.
      const h=Math.max(10,Math.round(wounded.maxHp*0.30));
      e.intent={kind:'heal', label:`HEAL ally +${h}`, value:h, targetIdx:b.enemies.indexOf(wounded)};
      return;
    }
  }
  // Wounded — chance to enrage (CULTIST / boss enrage phase).
  if(e.hp <= e.maxHp*0.45 && !e._enraged && chance(30 + (e.boss?20:0))){
    e._enraged=true;
    const buff=Math.max(2,Math.round(e.atk*0.30));
    e.intent={kind:'enrage', label:`ENRAGE +${buff} ATK`, value:buff};
    return;
  }
  // Healthy heavy-armor types throw up a guard (GUARDIAN role).
  if(e.hp > e.maxHp*0.6 && (e.def||0)<10 && chance(15 + (e.boss?10:0))){
    e.intent={kind:'armor', label:'+6 DEF', value:6};
    return;
  }
  // Casters lean toward statuses.
  if(e.caster && chance(55)){
    const choices=[];
    if(e.burnAtk||e.poison){ if(e.burnAtk) choices.push({kind:'burn', label:`BURN ${e.burnAtk[0]}/${e.burnAtk[1]}t`, value:[e.burnAtk[0],e.burnAtk[1]]}); if(e.poison) choices.push({kind:'poison', label:`PSN ${e.poison[0]}/${e.poison[1]}t`, value:[e.poison[0],e.poison[1]]}); }
    choices.push({kind:'weak', label:'WEAKEN 2t', value:2});
    choices.push({kind:'vuln', label:'VULN 2t',  value:2});
    if(e.manaburn) choices.push({kind:'manaburn', label:'BURN MANA', value:1});
    e.intent=pick(choices);
    return;
  }
  // Default: variation between basic and heavy attack.
  const willHeavy=(e.boss && chance(38)) || chance(16);
  const dmg=willHeavy?Math.round(e.atk*1.6+rnd(4)):e.atk+rnd(5);
  e.intent={kind:willHeavy?'heavy':'attack', label:`${willHeavy?'HEAVY ':'ATK '}${dmg}`, value:dmg};
}

  if(st.weakT>0)   c+=`<span class="chip c-weak" title="WEAKEN — outgoing damage reduced by ~40%. ${st.weakT} turn(s) left.">WEAK ${st.weakT}</span>`;

function addWeak(st,t){ t+=statusBonusTurns(st); st.weak=0.4; st.weakT=Math.max(st.weakT,t); }
function addVuln(st,t){ t+=statusBonusTurns(st); st.vuln=0.25; st.vulnT=Math.max(st.vulnT,t); }

function playerDamageMult(e){ const p=G.player,f=p.flags; let m=G.mods.pDmg;

  if(f.glassCannon)m*=1.35; if(f.stoneSkin)m*=0.8;
  if(f.berserker)m*=1+(1-p.hp/p.maxHp)*0.8;
  // Executioner threshold tightened: 0.20 base / 0.30 with Glass Reaper synergy.
  // The old 0.30/0.45 stacked with Wrath capstones to a sustained 5-7x.
  const et=f.synReaper?0.30:0.20;
  if(f.executioner&&!G._noExecute&&e.hp<=e.maxHp*et)m*=2;   // ult sets _noExecute so it doesn't double-dip its own missing-HP scaling
  if(p.affTier.w>=1)m*=1.12; if(p.affTier.w>=2)m*=1.12; if(p.affTier.w>=3)m*=1.15;

function dealToEnemy(idx,dmg,label,crit){ const b=G.battle,e=b.enemies[idx],p=G.player; if(!e||e.hp<=0)return 0;

function basicHit(idx,isExtra){ const p=G.player,b=G.battle;

// Hallucination lines fire at high Miasma — flavor only, no mechanical effect.
const HALLUCINATIONS=[
  'A face you do not recognise mouths your name from the edge of your eye.',
  'Your weapon is weightless for a heartbeat, then heavy again.',
  'Someone is breathing in your other ear.',
  'A second shadow follows yours, an instant late.',
  'The walls remember being warmer than this. So do you.',
  'You catch yourself thinking thoughts that are not yours.',
  'A voice that sounds like yours says: "we are almost home."',
  'You blink and your enemy is one step closer than it should be.',
  'You taste copper. You have not been hit.',
  'Something in the floor opens an eye, then closes it.',
];
function afterPlayer(){ const b=G.battle;
  b.enemies.forEach(e=>{ if(e.hp>0){ tickDoT(e,e.st,e.name); if(e.hp<=0)onEnemyDeath(e); } });
  if(allDead()){ winBattle(); return; }
  // Hallucinations measured at ~1.77/run — frequent enough to feel like a mechanic rather than a
  // creeping dread. Trimmed to ~7%/turn (~1/run) so they stay unsettling-but-rare. Heat ambience
  // (0.37/run) was already fine; left as-is. Still one-or-the-other per turn, never both.
  if(miasmaActive() && miasmaTier()>=3 && chance(7)) blog(pick(HALLUCINATIONS),'info');
  else if(heatActive() && heatTier()>=3 && chance(11)) blog(pick(HEAT_AMBIENT),'info');
  render(); setTimeout(enemyTurn,560); }
// One-shot physical hit pipeline. Used by attack/heavy/unleash intents.
function applyEnemyHit(e,p,b,baseDmg,label,kind){
  let dmg=baseDmg;
  if(e.st.weakT>0)dmg=Math.round(dmg*(1-e.st.weak));
  if(e._frostRamp) dmg=Math.round(dmg*(1+e._frostRamp));
  dmg=Math.round(dmg*G.mods.eDmg);
  const mt2=miasmaActive()?miasmaTier():0;
  if(mt2>=2){ const before=dmg; dmg=Math.round(dmg*(1+Math.min(0.25,mt2*0.045)));
    if(chance(22) && dmg>before) blog(`&#9763; MIASMA &mdash; the cold lets it land harder (+${dmg-before}).`,'dmg'); }
  // Dodge capped at 55% (was 50, was originally 60). The 50 cap nuked ranger too hard;
  // 55 keeps Evade meaningful without making physical hits no-ops.
  const dodgeChance=Math.max(0,Math.min(55,effDodge(p)+(b.evadeTurns>0?b.evade:0))-(e.pierceDodge||0));
  if(chance(dodgeChance)){ SFX.play('dodge'); blog(`You dance aside &mdash; ${e.name} misses!`,'info'); if(p.flags.shadowDodge)b.shadowCrit=1; return; }
  // RANGER SURVIVAL FLOOR — Wind Step (Evade) also grazes the blows that DO land. The fairness
  // review found ranger's only mitigation was the dodge coin-flip, so a defensively-played ranger
  // still rotted out to variance. A small guaranteed reduction while Evade is up gives skilled,
  // careful ranger play a real floor without raising the dodge cap (which would make it un-hittable).
  if(p.cls==='ranger' && b.evadeTurns>0){ dmg=Math.max(1, dmg-(4+Math.floor(p.level/2))); }
  let red=(b.pdefTurns>0?b.pdef:0);
  // Shield Wall is the deliberate answer to a telegraphed HEAVY/UNLEASH — guard blocks far more of
  // a big, announced blow than of a basic swing. Now seeing "UNLEASH" is a reason to raise guard.
  if(red>0 && (kind==='heavy'||kind==='unleash')){ red=Math.min(0.85, red+0.20); blog('Your guard catches the brunt of it!','info'); }
  dmg=Math.round(dmg*(1-red)); dmg=Math.max(1, dmg-Math.min(p.def,Math.floor(dmg*0.6)));
  if(b.guardDown>0)dmg=Math.round(dmg*1.3);
  if(b.pst.vulnT>0)dmg=Math.round(dmg*1.25);
  if(b.barrier>0&&dmg>0){ const ab=Math.min(b.barrier,dmg); b.barrier-=ab; dmg-=ab; blog(`Barrier absorbs ${ab}.`,'info'); }
  if((p.cls==='mage'||p.flags.gearManaShield)&&p.mana>0){ const frac=e.manaburn?0.40:0.52; const ab=Math.min(p.mana,Math.ceil(dmg*frac)); if(ab>0){p.mana-=ab;dmg-=ab;blog(`Mana Shield soaks ${ab}.`,'info'); if(dmg<=0&&p.flags.aegisStun&&e.hp>0){addStun(e.st,1);blog(`Aegis! ${e.name} is STUNNED!`,'info');}} }
  if(e.manaburn&&p.mana>0){ const mb=Math.min(p.mana,Math.round(p.maxMana*0.12)); if(mb>0){p.mana-=mb;blog(`${e.name} devours ${mb} mana!`,'info');} }
  let lethal=p.hp-dmg<=0;
  if(lethal&&b.lastStand>0){ dmg=Math.max(0,p.hp-1); lethal=false; blog('LAST STAND holds &mdash; the blow cannot fell you!','crit'); }
  if(lethal&&p.flags.secondWind&&!p._phoenixUsed){ p._phoenixUsed=1;
    // Attribute the lethal hit to enemy so cause-of-death is honest even if Phoenix saved you.
    // The previous formula (lost0 - p.hp) went negative when revive HP > current HP and credited 0.
    attrib('enemy', Math.max(0, p.hp));
    p.hp=Math.max(1,Math.round(p.maxHp*0.25));
    SFX.play('levelup'); blog('PHOENIX FEATHER! You cheat death! (the feather burns away &mdash; one charge, this run.)','lvl'); }
  else { const before=p.hp; p.hp=clamp(p.hp-dmg,0,p.maxHp); attrib('enemy',before-p.hp); SFX.play(dmg>0?'hurt':'dodge'); blog(`${label} for ${dmg}!`,'dmg'); if(dmg>0){gainCharge(9);(b.floats=b.floats||[]).push({idx:-1,text:'-'+dmg,cls:'pdmg'});pushFx(-1,'pdmg');} }
  if(e.leech){ const h=Math.max(1,Math.round(dmg*0.4)); e.hp=clamp(e.hp+h,0,e.maxHp); blog(`${e.name} drains ${h} HP.`,'heal'); }
  if(e.poison&&chance(e.poison[2])){ addPoison(b.pst,e.poison[0],e.poison[1]); blog(`You are POISONED!`,'info'); }
  if(e.burnAtk&&chance(e.burnAtk[2])){ addBurn(b.pst,e.burnAtk[0],e.burnAtk[1]); blog(`You are set ABLAZE!`,'info'); }
  if(p.flags.thorns&&e.hp>0){ const rf=Math.max(1,Math.round(dmg*0.3)); e.hp=clamp(e.hp-rf,0,e.maxHp); blog(`Thorns reflect ${rf} to ${e.name}.`,'heal'); if(p.flags.synFrost)addWeak(e.st,2); if(e.hp<=0)onEnemyDeath(e); }
  // Heart of Iron Flame — burning armor sears any attacker that strikes you.
  if(p._burningArmor>0 && e.hp>0){ addBurn(e.st,7,3); blog(`Your burning armor sears ${e.name}!`,'info'); }
}
function executeIntent(e,p,b){
  const it=e.intent; if(!it) return;
  switch(it.kind){
    case 'charge':
      blog(`${e.name} is charging &mdash; ${it.turns} turn(s) until it lands. STUN it, break it with a heavy blow, or raise your guard!`,'info');
      return;
    case 'enrage':
      e.atk += it.value;
      blog(`${e.name} ENRAGES &mdash; +${it.value} ATK for the rest of the fight!`,'crit');
      return;
    case 'armor':
      e.def = (e.def||0)+it.value;
      blog(`${e.name} hardens its stance (+${it.value} DEF).`,'info');
      return;
    case 'heal': {
      const t=b.enemies[it.targetIdx]||e;
      if(t && t.hp>0){ const h=Math.min(it.value, t.maxHp-t.hp); if(h>0){ t.hp+=h; blog(`${e.name} heals ${t===e?'itself':t.name} (+${h} HP).`,'heal'); } else { blog(`${e.name} tries to heal &mdash; nothing to mend.`,'info'); } }
      return;
    }
    case 'burn':  addBurn(b.pst, it.value[0], it.value[1]); blog(`${e.name} sets you ABLAZE! (BURN ${it.value[0]}/${it.value[1]}t)`,'dmg'); return;
    case 'poison':addPoison(b.pst,it.value[0], it.value[1]); blog(`${e.name} POISONS you. (PSN ${it.value[0]}/${it.value[1]}t)`,'dmg'); return;
    case 'weak':  addWeak(b.pst, it.value); blog(`${e.name} WEAKENS your strikes!`,'info'); return;
    case 'vuln':  addVuln(b.pst, it.value); blog(`${e.name} marks you VULNERABLE!`,'info'); return;
    case 'manaburn':{ const mb=Math.min(p.mana,Math.round(p.maxMana*0.20)+4); if(mb>0){p.mana-=mb; blog(`${e.name} BURNS ${mb} mana from you!`,'dmg');} else blog(`${e.name} reaches for mana you do not have.`,'info'); return; }
    case 'unleash':
      applyEnemyHit(e,p,b,it.value,`${e.name} UNLEASHES its cataclysm`,'unleash');
      // Combo phase still applies post-unleash for late-game bosses
      return;
    case 'heavy':
      applyEnemyHit(e,p,b,it.value,`${e.name} HEAVY strike`,'heavy');
      return;
    case 'attack':
    default:
      applyEnemyHit(e,p,b,it.value,`${e.name} strikes`);
      return;
  }
}
function enemyTurn(){ const p=G.player,b=G.battle; if(b.over)return;
  if(b.hollowSkip>0){ b.hollowSkip--; blog('The world is pausing &mdash; your enemies miss this beat.','info'); render(); return; }
  if(b.emberTurns>0)b.emberTurns--;
  const zone=zoneOf(G.depth);
  for(const e of b.enemies){
    if(e.hp<=0)continue; if(p.hp<=0)break;
    if(e.st.stunT>0){ blog(`${e.name} is stunned and cannot act!`,'info'); e.st.stunT--;
      // Stun is a true interrupt — it CANCELS a telegraphed charge/cataclysm. (Boss phase-2 can
      // still re-arm later, so this rewards the interrupt without trivializing the boss.)
      if(e.intent && (e.intent.kind==='charge'||e.intent.kind==='unleash')){
        blog(`${e.name}'s ${e.intent.kind==='unleash'?'cataclysm':'charge'} is INTERRUPTED by the stun!`,'crit'); e.intent=null;
      }
      continue; }
    e._alive=(e._alive||0)+1;
    if(zone>=2 && e._alive===3){ blog(`${e.name} steadies its stance &mdash; growing more dangerous.`,'info'); }
    if(zone>=2 && e._alive>=3 && !e.boss){
      const ramp=Math.min(0.50, (e._alive-2)*0.10);
      e._frostRamp=ramp;
    }
    if(!e.intent) planIntent(e,b);
    executeIntent(e,p,b);
    // Late-game bosses follow up after a real hit (combo phase)
    if(p.hp>0 && e.boss && G.depth>=26 && e.hp<=e.maxHp*0.40 && (e.intent&&(e.intent.kind==='attack'||e.intent.kind==='heavy'||e.intent.kind==='unleash')) && chance(35)){
      applyEnemyHit(e,p,b,Math.round(e.atk*1.0),`${e.name} follows up`);
    }
    if(p.hp<=0)break;
  }
  // player DoT + regen tick
  tickDoT(p,b.pst,'you');
  b.enemies.forEach(e=>{ if(e.st.weakT>0)e.st.weakT--; if(e.st.vulnT>0)e.st.vulnT--; });
  if(b.pst.vulnT>0)b.pst.vulnT--;
  if(b.pdefTurns>0)b.pdefTurns--; if(b.evadeTurns>0)b.evadeTurns--; if(b.guardDown>0)b.guardDown--;
  if(b.lastStand>0){ b.lastStand--; if(b.lastStand===0 && b.lastVuln>0){ addVuln(b.pst,b.lastVuln); b.lastVuln=0; blog('Last Stand fades — you are VULNERABLE.','info'); } }
  // SATURATED — recovery period after harvesting a fragment.
  if(p._saturated>0){ p._saturated--; if(p._saturated===0) blog('You are no longer Saturated &mdash; you can harvest again.','info'); }
  // Heart of Iron Flame — burning armor fades after 3 turns, removing its DEF bonus.
  if(p._burningArmor>0){ p._burningArmor--; if(p._burningArmor===0){ p.def=Math.max(0,(p.def||0)-8); blog('Your burning armor cools.','info'); } }
  p.mana=clamp(p.mana+p.regen,0,p.maxMana);
  flash('playerHit');
  if(p.hp<=0){ b.over=true; if(b.hadBoss&&G._curBossKey)noteBossDeath(G._curBossKey); SFX.play('death'); render(); setTimeout(()=>{G.screen='gameover';render();},800); return; }
  if(allDead()){ winBattle(); return; }
  // Plan the next round of intents so the player can see what is coming on their turn.
  b.enemies.forEach(e=>{ if(e.hp>0) planIntent(e,b); else e.intent=null; });
  render(); }
function flash(kind){ const scene=$('scene');
  if(kind==='enemyHit'){ G.battle.anim=''; }
  else { G.battle.anim='shake flash'; if(scene){scene.classList.remove('shake','flash');void scene.offsetWidth;scene.classList.add('shake','flash');} }
  setTimeout(()=>{ if(G.battle){G.battle.anim='';G.battle.animIdx=-1;} },300); }
function winBattle(){ const b=G.battle,p=G.player; b.over=true;
  G._curBossKey=null;   // survived — a later mob death must not attribute to this boss
  // carry ultimate charge to the next fight
  p._charge=clamp(b.charge||0,0,100);
  // Eternal Cyclone stacks per-fight ATK that must be unwound at battle end.
  if(b._cycloneAtk){ p.atk-=b._cycloneAtk; b._cycloneAtk=0; }
  // ECHO LOOT — if you killed an Echo, the gear it carried (and its relic) drops to you.
  // Weapons from a different class are reskinned to your own, same rarity/ilvl.
  const echoEnemyKilled=b.enemies.find(e=>e._echo);
  if(echoEnemyKilled){ const ec=echoEnemyKilled._echo;
    if(ec.item){ let it=null; try{ it=JSON.parse(JSON.stringify(ec.item)); }catch(e){}
      if(it&&it.slot==='weapon'&&ec.cls&&ec.cls!==p.cls){ it=makeItem('weapon',p.cls,Math.max(1,it.ilvl),{rarity:it.rarity,ilvl:it.ilvl}); }
      if(it){ equipItem(p,it); blog(`You loot the echo's ${it.name} (Lv${it.ilvl}).`,'lvl'); } }
    if(ec.relic){ const r=RELICS.find(x=>x.name===ec.relic); if(r){ const gained=gainRelic(p,r); if(gained) blog(`You take the echo's relic: ${ec.relic}.`,'lvl'); } }
  }
  let gold=(8+rnd(12))+G.depth*2+(b.enemies.length-1)*6;
  b.enemies.forEach(e=>{ if(e.goldBonus)gold+=e.goldBonus; });
  gold=Math.round(gold*G.mods.goldMul); p.gold+=gold;
  // fighting stokes the Furnace / deepens the cold's hold
  // Heat from battles was too steep (4+elites*2) — players hit HEAT 30+ involuntarily by mid-zone.
  // Trimmed so a careful player can stay below the cliff without skipping fights.
  const elites=b.enemies.filter(e=>e.elite).length;
  addHeat(2+elites); addMiasma(3+elites);
  // Dragon Warden's death collapses the world into the cold
  if(!G.collapsed && b.enemies.some(e=>e.name===BOSSES.warden.name)){ G.collapsed=1; blog(BOSS_DEATHCRY.warden,'crit'); blog('The warmth dies with it. A cold older than fire floods in from below...','lvl'); discoverLore('l4'); discoverLore('l5'); G._pendingBossDeath='warden'; }
  // Devour can already have captured these bosses (via processDevourCast). Skip the legacy memory
  // grant in that case so the player only sees ONE fragment popup per boss.
  const dvb=G._devouredBosses||{};
  if(b.enemies.some(e=>e.name===BOSSES.dragon.name)){ blog(BOSS_DEATHCRY.dragon,'crit'); discoverLore('l4'); if(!dvb[BOSSES.dragon.name] && (!p.memory||p.memory.id!=='hoard')) grantMemory(p,'hoard'); G._pendingBossDeath='dragon'; }
  if(b.enemies.some(e=>e.name===BOSSES.king.name)){ blog(BOSS_DEATHCRY.king,'crit'); discoverLore('l13'); if(!dvb[BOSSES.king.name] && (!p.memory||p.memory.id!=='decree')) grantMemory(p,'decree'); G._pendingBossDeath='king'; }
  if(b.enemies.some(e=>e.name===BOSSES.devourer.name)){ blog(BOSS_DEATHCRY.devourer,'crit'); discoverLore('l10'); discoverLore('l15'); if(!dvb[BOSSES.devourer.name] && (!p.memory||p.memory.id!=='devour')) grantMemory(p,'devour'); G._pendingBossDeath='devourer'; }
  if(b.enemies.some(e=>e.name===BOSSES.remembered.name)){ blog(BOSS_DEATHCRY.remembered,'crit'); discoverLore('l15'); discoverLore('l16'); G._rememberedSlain=1; if(!dvb[BOSSES.remembered.name] && (!p.memory||p.memory.id!=='curse')) grantMemory(p,'curse'); G._pendingBossDeath='remembered'; }
  if(b.enemies.some(e=>e.name===BOSSES.paledevourer.name)){ blog(BOSS_DEATHCRY.paledevourer,'crit'); discoverLore('l19'); discoverLore('l20'); G._paleSlain=1; G._pendingBossDeath='paledevourer'; }
  if(b.enemies.some(e=>e.name===BOSSES.warden.name) && !dvb[BOSSES.warden.name] && (!p.memory||p.memory.id!=='ember')){ grantMemory(p,'ember'); }
  // SECRET BEAT — devouring a boss is not the same as killing one. The world keeps a different count.
  if(Object.keys(dvb).length && b.enemies.some(e=>e.boss && dvb[e.name])){
    blog('You did not defeat it. You took it INTO you. Somewhere far below, something that keeps count adjusts the number down by one, and settles back to wait.','crit');
  }
  G._devouredBosses=null;
  // Whoever the final-chamber boss was — king, dragon, or otherwise — the lie cracks. But we delay the
  // discoverLore('l15') by one chamber so the boss's own intimate death-cry doesn't get crushed
  // under the bigger meta-reveal. Flagged here, fired in proceed().
  if(b.isFinal){ G._pendingTruth=1; }
  // Defeating the Collector burns away your debt
  if(b.enemies.some(e=>e._collector)){ G.debt=0; G.collectorEta=0; blog('The Collector shatters — your debt dies with it.','lvl'); discoverLore('l8'); }
  SFX.play(b.hadBoss?'win':'gold');
  blog('The chamber is clear!','info'); render();
  setTimeout(()=>{
    if(G._pendingBossDeath){ showBossDeath(G._pendingBossDeath); G._pendingBossDeath=null; }
    // Fire the truth-of-the-throne reveal right before triumph (not in proceed, which is never
    // called on the final-boss path). Still ordered after the boss-death modal so the King's
    // intimate beat lands first.
    if(G._pendingTruth){ G._pendingTruth=0; discoverLore('l15'); blog('Something in the stone exhales. The story you were told... is not the story.','crit'); }
    if(b.isFinal){ SFX.play('win'); p.won=true; G.screen='triumph'; return render(); }
    G.pending={source:'battle',boss:b.hadBoss,gold}; G.screen='reward'; buildRewards(); render(); playTransition('#5a4410');
    // Drain multi-essence / fragment / build popups that queued during the fight.
    // Multi-essence first (pick which family from a multi-kill), then per-fragment popups,
    // then the rest of the build progression queue.
    setTimeout(()=>{
      const m=document.getElementById('info-modal'); const open=m&&!m.classList.contains('hidden');
      if(open)return;
      if(G._multiEssenceFams && G._multiEssenceFams.length){ showMultiEssenceChoice(); }
      else if(G._fragQueue && G._fragQueue.length){ showFragmentChoice(); }
      else if(G._buildQueue && G._buildQueue.length){ drainBuildQueue(); }
    }, 350);
  },900); }

function buildRewards(){ const p=G.player,isBoss=G.pending&&G.pending.boss,blessed=G.pending&&G.pending.blessed; const d=G.depth; const opts=[];
  // two gear picks of differing slots — the rarity-vs-level dilemma emerges from random rolls
  const slots=shuffle(SLOTS); const bump=(isBoss||blessed)?{rarity:clamp(rollRarity(d)+1,0,4)}:{};
  opts.push({kind:'gear',data:makeItem(slots[0],p.cls,d,bump)});
  opts.push({kind:'gear',data:makeItem(slots[1],p.cls,d,blessed?{rarity:clamp(rollRarity(d)+1,0,4)}:{})});
  opts.push({kind:'upgrade',data:shuffle(UPGRADES)[0]});
  if(isBoss){ const rp=relicPool(p); if(rp.length)opts.push({kind:'relic',data:pick(rp)}); }
  let n=3; if(G.mods.luck||blessed)n=4;
  G.pending.options=shuffle(opts).slice(0,Math.min(n,opts.length)); }

      <button class="btn muted center" onclick="takeReward(-1)">${pd.source==='chest'?'Leave it all':'Skip (take nothing)'}</button>
      <button class="btn muted center" onclick="openInventory()"><span class="k">&#9776;</span>INVENTORY (i)</button></div>`;

function takeReward(i){ const p=G.player,pd=G.pending;
