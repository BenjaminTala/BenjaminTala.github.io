<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRYPT OF THE CHAMPION</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0c1d; --panel:#16142b; --panel2:#1f1c3a; --ink:#e8e6f5;
    --green:#5cff8f; --amber:#ffcf4d; --red:#ff5c6a; --blue:#6cb8ff;
    --purple:#c06cff; --dim:#6f6a9a; --line:#3a356b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Press Start 2P',monospace; font-size:12px; line-height:1.8;
    display:flex; justify-content:center; align-items:flex-start;
    padding:18px 10px 40px; image-rendering:pixelated; -webkit-font-smoothing:none;
  }
  #app{width:100%;max-width:660px}
  h1,h2,h3{margin:0;font-weight:400}
  .title{text-align:center;color:var(--amber);font-size:22px;line-height:1.5;
    text-shadow:3px 3px 0 #000, 0 0 14px rgba(255,207,77,.35);margin:14px 0 6px;}
  .subtitle{text-align:center;color:var(--dim);font-size:9px;margin-bottom:22px}
  .blink{animation:blink 1s steps(2,start) infinite}
  @keyframes blink{to{visibility:hidden}}
  .panel{background:var(--panel);border:3px solid var(--line);
    box-shadow:0 0 0 3px #000, 6px 6px 0 rgba(0,0,0,.5);padding:16px;margin-bottom:14px;}
  .panel.tight{padding:12px}
  .center{text-align:center}
  .muted{color:var(--dim)}
  .green{color:var(--green)} .amber{color:var(--amber)} .red{color:var(--red)}
  .blue{color:var(--blue)} .purple{color:var(--purple)}
  pre.sprite{margin:0;font-family:'Press Start 2P',monospace;line-height:1.25;
    font-size:11px;white-space:pre;text-align:center;color:var(--green);
    text-shadow:0 0 6px rgba(92,255,143,.4);}
  .btn{display:block;width:100%;text-align:left;cursor:pointer;font-family:inherit;
    font-size:11px;color:var(--ink);background:var(--panel2);border:3px solid var(--line);
    padding:12px 14px;margin:8px 0;line-height:1.5;transition:transform .05s, background .1s, border-color .1s;}
  .btn:hover{background:#2a265080;border-color:var(--amber);color:#fff}
  .btn:active{transform:translate(2px,2px)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn .k{color:var(--amber);margin-right:8px}
  .btn small{display:block;color:var(--dim);font-size:9px;margin-top:6px;line-height:1.6}
  .btn:hover small{color:#b9b4e6}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row .btn{flex:1;min-width:120px}
  .grid3{display:flex;gap:10px;flex-wrap:wrap}
  .grid3 .card{flex:1;min-width:150px}
  .bar{margin:6px 0}
  .bar .lbl{font-size:9px;display:flex;justify-content:space-between;margin-bottom:3px}
  .bar .track{background:#000;border:2px solid var(--line);height:14px;padding:1px}
  .bar.mini .track{height:9px}
  .bar .fill{height:100%;transition:width .35s ease}
  .fill.hp{background:linear-gradient(var(--green),#2faf5a)}
  .fill.mp{background:linear-gradient(var(--blue),#356fbf)}
  .fill.boss{background:linear-gradient(var(--red),#a82f3a)}
  .stats{font-size:9px;line-height:2;color:var(--dim)}
  .stats b{color:var(--ink)}
  .chip{display:inline-block;background:#000;border:2px solid var(--line);padding:3px 7px;margin:3px 3px 3px 0;font-size:8px}
  .relics{margin-top:6px}
  .relics .chip{border-color:var(--purple);color:var(--purple)}
  .enemies-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:flex-end}
  .enemy-cell{flex:1;min-width:120px;max-width:200px;border:3px solid transparent;padding:6px;transition:border-color .1s}
  .enemy-cell.target{border-color:var(--amber);background:#00000055}
  .enemy-cell.dead{opacity:.28;filter:grayscale(1)}
  .enemy-cell pre.sprite{font-size:9px;color:var(--red)}
  .tgt{width:100%;font-family:inherit;font-size:8px;cursor:pointer;color:var(--ink);
    background:#000;border:2px solid var(--line);padding:4px;margin-top:4px}
  .tgt.on{border-color:var(--amber);color:var(--amber)}
  .tgt:hover{border-color:var(--amber)}
  .log{background:#000;border:3px solid var(--line);padding:10px;height:108px;overflow:hidden;
    font-size:9px;line-height:1.7;margin:12px 0;display:flex;flex-direction:column;justify-content:flex-end;}
  .log div{opacity:.55}
  .log div:last-child{opacity:1;color:#fff}
  .log .dmg{color:var(--red)} .log .heal{color:var(--green)} .log .info{color:var(--amber)} .log .crit{color:var(--purple)}
  .shake{animation:shake .3s}
  @keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-4px,1px)}80%{transform:translate(4px,-1px)}}
  .flash{animation:flash .3s}
  @keyframes flash{0%,100%{filter:none}50%{filter:brightness(2.2) sepia(1) hue-rotate(-50deg) saturate(6)}}
  .hitpop{animation:hitpop .25s}
  @keyframes hitpop{0%{transform:scale(1)}50%{transform:scale(1.14)}100%{transform:scale(1)}}
  .fade{animation:fade .4s}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .floortag{text-align:center;font-size:9px;letter-spacing:1px;margin-bottom:10px}
  .hr{border:none;border-top:2px dashed var(--line);margin:14px 0}
  .menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .menu-grid .btn{margin:0}
  .footer{text-align:center;color:var(--dim);font-size:8px;margin-top:8px}
  a{color:var(--blue)}
  ::selection{background:var(--amber);color:#000}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ============================================================
   CRYPT OF THE CHAMPION — text roguelike (v2: zones, mobs, relics)
   ============================================================ */
const $ = id => document.getElementById(id);
const app = $('app');
const rnd = n => Math.floor(Math.random()*n);
const pick = arr => arr[rnd(arr.length)];
const clamp = (v,lo,hi) => Math.max(lo,Math.min(hi,v));
const chance = p => Math.random()*100 < p;
const RUN_LENGTH = 18;
const BOSS_CHAMBERS = {6:'b1', 12:'b2', 18:'final'};

const ZONES = [
  {name:'THE CATACOMBS', color:'green'},
  {name:'THE CAVERNS',   color:'blue'},
  {name:'THE INFERNO',   color:'red'},
];
const zoneOf = d => d<=6?0 : d<=12?1 : 2;

/* ---------- classes ---------- */
const CLASSES = {
  mage: {
    name:'MAGE', color:'purple', affinity:'ARCANE',
    affinityText:'Spell power scales with MAX MANA. Mana also soaks incoming damage (Mana Shield), and refills fast.',
    hp:70, mana:120, atk:5, def:0, dodge:0, crit:5, lifesteal:0, regen:14,
    weapon:{name:'Apprentice Wand', dmg:5, type:'magic'},
    sprite:"   /\\\n  (oo)\n <(  )>\n   ||\n  _||_",
    skills:[
      {id:'bolt', name:'Arcane Bolt', cost:10, desc:'Single-target magic, scales w/ mana.'},
      {id:'fire', name:'Fireball',    cost:24, aoe:true, desc:'Hits ALL foes + BURN.'},
      {id:'frost',name:'Frost Nova',  cost:18, aoe:true, desc:'Dmg ALL + weaken their attacks.'},
    ],
  },
  warrior: {
    name:'WARRIOR', color:'red', affinity:'FURY',
    affinityText:'Brutal attacks. Build TANK (defense + Shield Wall) or LIFESTEAL (vampiric gear).',
    hp:120, mana:30, atk:12, def:4, dodge:0, crit:8, lifesteal:0, regen:4,
    weapon:{name:'Rusty Sword', dmg:8, type:'melee'},
    sprite:"  _____\n [_+_]\n  (oo)\n /|##|\\\n  d  b",
    skills:[
      {id:'power', name:'Power Strike', cost:8,  desc:'Heavy single blow (x1.9).'},
      {id:'shield',name:'Shield Wall',  cost:6,  desc:'Brace: take 65% less for 2 turns.'},
      {id:'reck',  name:'Whirlwind',    cost:12, aoe:true, desc:'Hit ALL foes hard, but drop guard.'},
    ],
  },
  ranger: {
    name:'RANGER', color:'green', affinity:'WIND STEP',
    affinityText:'High DODGE — chance to fully avoid hits. Evade stacks it even higher.',
    hp:120, mana:30, atk:10, def:2, dodge:25, crit:18, lifesteal:0, regen:5,
    weapon:{name:'Short Bow', dmg:7, type:'ranged'},
    sprite:"   o\n  /|)\n  /|\n  ( )\n  d b",
    skills:[
      {id:'aim',  name:'Aimed Shot', cost:8,  desc:'Single shot, very high crit.'},
      {id:'evade',name:'Evade',      cost:6,  desc:'+45% dodge for 2 turns.'},
      {id:'volley',name:'Volley',    cost:12, aoe:true, desc:'3 arrows across the foes.'},
    ],
  },
};

/* ---------- enemies ---------- */
const ENEMIES = [
  {name:'Giant Rat',   hp:24, atk:7,  def:0, sprite:"  (\\_/)\n  (. .)\n  c(\")(\")"},
  {name:'Goblin',      hp:32, atk:9,  def:1, sprite:"  ,_,\n (O,O)\n (   )>\n  \" \""},
  {name:'Cave Bat',    hp:22, atk:8,  def:0, dodgy:true, sprite:" /\\   /\\\n( ^.^ )\n  \\v/"},
  {name:'Slime',       hp:42, atk:7,  def:2, sprite:"  .--.\n (o  o)\n (~~~~)"},
  {name:'Skeleton',    hp:36, atk:11, def:1, sprite:"  (.-.)\n /|||\\\n  | |"},
  {name:'Imp',         hp:28, atk:12, def:0, caster:true, sprite:"  ^..^\n (>  <)\n  v  v"},
  {name:'Ghoul',       hp:48, atk:11, def:1, sprite:"  (xx)\n /|--|\\\n  |  |"},
  {name:'Orc Brute',   hp:60, atk:13, def:3, sprite:"  \\___/\n  (>.<)\n /|---|\\"},
  {name:'Venomspitter',hp:40, atk:10, def:1, caster:true, sprite:"  (~~~)\n  (o o)\n  >vvv<"},
  {name:'Dark Acolyte',hp:46, atk:12, def:1, caster:true, sprite:"   ^\n  /o\\\n (_|_)\n  | |"},
  {name:'Wraith',      hp:50, atk:14, def:0, dodgy:true, sprite:"  .vvv.\n ( -- )\n  \\__/"},
  {name:'Stone Golem', hp:80, atk:12, def:5, sprite:" [#####]\n [ o o ]\n [#####]\n  ]   ["},
];
const BOSSES = {
  b1:  {name:'OGRE WARLORD', hp:150, atk:16, def:4, boss:true,
        sprite:"  .-\"\"\"-.\n /  o o  \\\n |  ___  |\n  \\ \\_/ /\n  /|   |\\\n  d|___|b"},
  b2:  {name:'THE NECROMANCER', hp:210, atk:16, def:3, boss:true, caster:true,
        adds:['Skeleton','Skeleton'],
        sprite:"   ___\n  /   \\\n |() ()|\n  \\ ~ /\n  /| |\\\n  J | L"},
  final:{name:'THE CRYPT DRAGON', hp:380, atk:24, def:7, boss:true,
        sprite:"   /\\   /\\\n  /  \\_/  \\\n  \\ x   x /\n   ) ___ (\n  /_/   \\_\\\n (_)     (_)"},
};

/* ---------- loot ---------- */
const WEAPONS = {
  mage:[
    {name:'Crystal Staff',  dmg:11, type:'magic', note:'+12 max mana', mana:12},
    {name:'Flameheart Rod', dmg:14, type:'magic', note:'attacks may BURN', burn:true},
    {name:'Frostbite Cane', dmg:13, type:'magic', note:'+8 regen', regen:8},
    {name:'Void Scepter',   dmg:18, type:'magic', note:'+22 max mana', mana:22},
  ],
  warrior:[
    {name:'Iron Greatsword', dmg:15, type:'melee', note:'+2 atk', atk:2},
    {name:'Vampiric Blade',  dmg:13, type:'melee', note:'+25% lifesteal', lifesteal:25},
    {name:'Bulwark Axe',     dmg:14, type:'melee', note:'+3 def', def:3},
    {name:'Berserker Maul',  dmg:22, type:'melee', note:'+4 atk, -2 def', atk:4, def:-2},
  ],
  ranger:[
    {name:'Hunter Longbow',  dmg:13, type:'ranged', note:'+10% crit', crit:10},
    {name:'Windforce',       dmg:14, type:'ranged', note:'+10% dodge', dodge:10},
    {name:'Venom Crossbow',  dmg:16, type:'ranged', note:'attacks may BURN', burn:true},
    {name:'Stormpiercer',    dmg:18, type:'ranged', note:'+6% crit, +6% dodge', crit:6, dodge:6},
  ],
};
const UPGRADES = [
  {name:'Vital Charm',  apply:p=>{p.maxHp+=22; heal(p,22);}, note:'+22 max HP, heal'},
  {name:'Mana Crystal', apply:p=>{p.maxMana+=18; p.mana+=18;}, note:'+18 max mana'},
  {name:'Whetstone',    apply:p=>{p.atk+=3;}, note:'+3 attack'},
  {name:'Iron Plating', apply:p=>{p.def+=3;}, note:'+3 defense'},
  {name:'Lucky Coin',   apply:p=>{p.crit+=10;}, note:'+10% crit'},
  {name:'Shadow Cloak', apply:p=>{p.dodge+=10;}, note:'+10% dodge'},
  {name:'Leech Rune',   apply:p=>{p.lifesteal+=15;}, note:'+15% lifesteal'},
  {name:'Focus Idol',   apply:p=>{p.regen+=4;}, note:'+4 mana regen'},
];

/* ---------- relics: permanent playstyle modifiers ---------- */
const RELICS = [
  {id:'battery', name:'Arcane Battery',    note:'+45 max mana, +6 regen', apply:p=>{p.maxMana+=45;p.mana+=45;p.regen+=6;}},
  {id:'glass',   name:'Glass Cannon',      note:'+50% damage dealt, -35% max HP', apply:p=>{p.flags.glassCannon=true; const c=Math.round(p.maxHp*0.35); p.maxHp-=c; p.hp=clamp(p.hp,1,p.maxHp);}},
  {id:'stone',   name:'Stone Skin',        note:'+6 DEF, but -20% damage dealt', apply:p=>{p.def+=6; p.flags.stoneSkin=true;}},
  {id:'berserk', name:"Berserker's Heart",  note:'deal up to +80% dmg the lower your HP', apply:p=>{p.flags.berserker=true;}},
  {id:'exec',    name:'Executioner',       note:'x2 damage to foes below 30% HP', apply:p=>{p.flags.executioner=true;}},
  {id:'thorns',  name:'Thornmail',         note:'+3 DEF, reflect 30% of damage taken', apply:p=>{p.def+=3; p.flags.thorns=true;}},
  {id:'vamp',    name:'Vampiric Aura',     note:'+20% lifesteal', apply:p=>{p.lifesteal+=20;}},
  {id:'swift',   name:'Swift Boots',       note:'+15% dodge, +8% crit', apply:p=>{p.dodge+=15;p.crit+=8;}},
  {id:'blood',   name:'Blood Pact',        note:'heal 8% max HP on every kill', apply:p=>{p.flags.bloodpact=true;}},
  {id:'twin',    name:'Twin Fang',         note:'35% chance basic attacks strike twice', apply:p=>{p.flags.doubleStrike=true;}},
];

/* ============================================================
   STATE
   ============================================================ */
let G = null;
function newGame(){ G = {screen:'title', player:null, depth:0, doors:[], room:null, battle:null, pending:null, log:[]}; }
newGame();

function makePlayer(key){
  const c = CLASSES[key];
  return {
    cls:key, color:c.color, sprite:c.sprite, affinity:c.affinity,
    hp:c.hp, maxHp:c.hp, mana:c.mana, maxMana:c.mana,
    atk:c.atk, def:c.def, dodge:c.dodge, crit:c.crit, lifesteal:c.lifesteal, regen:c.regen,
    weapon:{...c.weapon}, skills:c.skills.map(s=>({...s})),
    potions:1, gold:0, kills:0, relics:[], flags:{},
  };
}
function heal(p,n){ p.hp = clamp(p.hp+n, 0, p.maxHp); }
function equip(p,w){
  const o=p.weapon;
  if(o.atk)p.atk-=o.atk; if(o.def)p.def-=o.def; if(o.crit)p.crit-=o.crit;
  if(o.dodge)p.dodge-=o.dodge; if(o.lifesteal)p.lifesteal-=o.lifesteal; if(o.regen)p.regen-=o.regen;
  if(o.mana){p.maxMana-=o.mana; p.mana=clamp(p.mana,0,p.maxMana);}
  p.weapon={...w};
  if(w.atk)p.atk+=w.atk; if(w.def)p.def+=w.def; if(w.crit)p.crit+=w.crit;
  if(w.dodge)p.dodge+=w.dodge; if(w.lifesteal)p.lifesteal+=w.lifesteal; if(w.regen)p.regen+=w.regen;
  if(w.mana){p.maxMana+=w.mana; p.mana+=w.mana;}
}

/* ============================================================
   RENDER ROUTER
   ============================================================ */
function render(){
  ({title:renderTitle, class:renderClassSelect, corridor:renderCorridor, room:renderRoom,
    battle:renderBattle, reward:renderReward, merchant:renderMerchant, gameover:()=>renderEnd(false),
    victory:()=>renderEnd(true)}[G.screen])();
}
function go(s){ G.screen=s; render(); }

/* ---------- TITLE ---------- */
function renderTitle(){
  app.innerHTML = `
    <h1 class="title fade">CRYPT OF<br>THE CHAMPION</h1>
    <div class="subtitle">an 8-bit text roguelike &middot; v2</div>
    <div class="panel center fade">
      <pre class="sprite">    .-=========-.
    \\'-=======-'/
    _|   .=.   |_
   ((|  (o)  |))
    \\|   /|\\   |/
     \\__ 'O' __/
       '-----'</pre>
      <p class="muted" style="font-size:9px;line-height:2">
        Descend ${RUN_LENGTH} chambers through 3 zones.<br>
        Face packs of monsters, claim relics that reshape<br>your build, and slay 3 bosses.
      </p>
      <button class="btn center" onclick="go('class')"><span class="blink">&#9654;</span> PRESS START</button>
    </div>
    <div class="footer">number keys or click &middot; Enter = first option</div>`;
}

/* ---------- CLASS SELECT ---------- */
function renderClassSelect(){
  const card = key=>{
    const c=CLASSES[key];
    return `<div class="panel tight">
      <h3 class="${c.color}" style="font-size:13px;margin-bottom:8px">${c.name}</h3>
      <pre class="sprite" style="font-size:9px;color:var(--${c.color})">${c.sprite}</pre>
      <div class="stats" style="margin-top:8px">
        <b class="red">HP</b> ${c.hp} &nbsp; <b class="blue">MP</b> ${c.mana}<br>
        <b>ATK</b> ${c.atk} &nbsp; <b>DEF</b> ${c.def} &nbsp; <b>DODGE</b> ${c.dodge}%
      </div>
      <div class="chip ${c.color}">${c.affinity}</div>
      <div class="muted" style="font-size:8px;line-height:1.8">${c.affinityText}</div>
      <button class="btn center" onclick="chooseClass('${key}')">CHOOSE</button>
    </div>`;
  };
  app.innerHTML = `<h1 class="title" style="font-size:16px">CHOOSE YOUR CHAMPION</h1>
    <div class="subtitle">All wield mana &amp; health — each in their own way</div>
    <div class="grid3 fade">${card('mage')}${card('warrior')}${card('ranger')}</div>`;
}
function chooseClass(key){ G.player=makePlayer(key); G.depth=0; nextCorridor(); G.screen='corridor'; render(); }

/* ============================================================
   DUNGEON / CORRIDOR
   ============================================================ */
function depthLabel(){ const z=ZONES[zoneOf(G.depth)]; return `<span class="${z.color}">${z.name}</span> &middot; CHAMBER ${G.depth}/${RUN_LENGTH}`; }

function makeGroup(depth){
  let count=1;
  if(depth>=11){ const r=rnd(100); count = r<38?1 : r<78?2 : 3; }
  else if(depth>=5){ count = rnd(100)<58?1:2; }
  return Array.from({length:count}, ()=>pick(ENEMIES));
}
function makeRoom(depth){
  if(BOSS_CHAMBERS[depth]) return {type:'enemy', boss:BOSS_CHAMBERS[depth],
    peek: depth===RUN_LENGTH?'A monstrous roar shakes dust from the ceiling...':'Something powerful stirs beyond this door.'};
  const r=rnd(100);
  if(r<42){ const g=makeGroup(depth); return {type:'enemy', group:g, peek:groupPeek(g)}; }
  if(r<60) return {type:'chest',    peek:pick(['A glint of gold catches your eye.','An old chest sits in the corner.','A latched strongbox waits.'])};
  if(r<70) return {type:'relic',    peek:'An ancient pedestal hums with power.'};
  if(r<80) return {type:'merchant', peek:'A hooded figure beckons from the shadows.'};
  if(r<88) return {type:'shrine',   peek:'A faint glow pulses from a cracked altar.'};
  if(r<95) return {type:'fountain', peek:'A strange, shimmering fountain bubbles here.'};
  return {type:'empty', peek:'Cold, empty stone. A moment to breathe.'};
}
function groupPeek(g){
  if(g.length===1) return `A ${g[0].name.toLowerCase()} lurks within.`;
  const counts={}; g.forEach(e=>counts[e.name]=(counts[e.name]||0)+1);
  const txt=Object.entries(counts).map(([n,c])=>c>1?`${c} ${n}s`:`a ${n}`).join(' and ');
  return `A pack: ${txt}.`;
}
function doorHint(room){
  return {enemy: room.boss?'DANGER — overwhelming presence':'You sense hostile creatures',
    chest:'Smells of dust and... treasure?', relic:'A humming, ancient power',
    merchant:'Coins clink in the dark', shrine:'A faint, calming glow',
    fountain:'Glittering, sweet-smelling water', empty:'Quiet. Probably safe.'}[room.type];
}
function nextCorridor(){
  G.depth++;
  if(BOSS_CHAMBERS[G.depth]) G.doors=[makeRoom(G.depth)];
  else { const n=2+rnd(2); G.doors=Array.from({length:n},()=>makeRoom(G.depth)); }
}
function renderCorridor(){
  const isBoss=G.doors.length===1 && G.doors[0].boss;
  const doors=G.doors.map((d,i)=>`<button class="btn" onclick="openDoor(${i})">
      <span class="k">${isBoss?'&#9760;':'['+(i+1)+']'}</span>${isBoss?'THE FINAL DOOR':'Door '+(i+1)}
      <small>${doorHint(d)}</small></button>`).join('');
  app.innerHTML = `<div class="floortag">${depthLabel()}</div>${playerBar(G.player)}
    <div class="panel fade">
      <p class="muted" style="font-size:9px">${isBoss?'The corridor narrows to one path. No turning back.':'You reach a junction. Which way?'}</p>
      ${doors}
    </div>${statusFooter()}`;
}
function statusFooter(){ const p=G.player;
  return `<div class="footer">HP ${p.hp}/${p.maxHp} &middot; MP ${p.mana}/${p.maxMana} &middot; ${p.potions} potion(s) &middot; ${p.gold}g &middot; ${p.relics.length} relic(s)</div>`; }
function openDoor(i){ G.room=G.doors[i]; G.screen='room'; render(); }

/* ============================================================
   SCALING / PREVIEW
   ============================================================ */
function freshEnemy(o){ return {...o, burn:0, burnTurns:0, weak:0, weakTurns:0, _dead:false}; }
function scaleEnemy(base, depth){
  const f = 1 + Math.max(0,depth-1)*0.15;
  return freshEnemy({
    name:base.name, sprite:base.sprite,
    hp:Math.round(base.hp*f), maxHp:Math.round(base.hp*f),
    atk:Math.round(base.atk*f), def:base.def||0,
    dodgy:base.dodgy, caster:base.caster, boss:false,
  });
}
function cloneBoss(key){ const b=BOSSES[key]; return freshEnemy({...b, maxHp:b.hp}); }
function findBase(name){ return ENEMIES.find(e=>e.name===name); }
function buildEnemies(room){
  if(room.boss){
    const list=[cloneBoss(room.boss)];
    (BOSSES[room.boss].adds||[]).forEach(n=>list.push(scaleEnemy(findBase(n), Math.max(1,G.depth-3))));
    return list;
  }
  return room.group.map(b=>scaleEnemy(b, G.depth));
}

/* ============================================================
   ROOM RESOLUTION
   ============================================================ */
function renderRoom(){
  const r=G.room, p=G.player; let body='';
  if(r.type==='enemy'){
    const list = buildEnemies(r);
    const cells = list.map(e=>`<div class="enemy-cell">
        <pre class="sprite red">${e.sprite}</pre>
        <div class="center" style="font-size:9px;margin-top:4px">${e.name}${e.boss?' <span class="red">[BOSS]</span>':''}</div>
        <div class="center stats">HP ~${e.maxHp} &middot; ATK ~${e.atk}</div>
      </div>`).join('');
    body = `<div class="enemies-row">${cells}</div>
      <p class="muted center" style="font-size:9px;margin-top:10px">${r.peek}</p>
      <div class="row" style="margin-top:12px">
        <button class="btn center red" onclick="startBattle()"><span class="k">&#9876;</span>FIGHT</button>
        ${r.boss?'':`<button class="btn center" onclick="avoidRoom()"><span class="k">&#10551;</span>SNEAK PAST</button>`}
      </div>`;
  } else if(r.type==='chest'){
    body = `<pre class="sprite amber">  ______\n /      \\\n |[]##[]|\n |  __  |\n \\______/</pre>
      <h3 class="center amber" style="margin:8px 0">A CHEST</h3>
      <p class="muted center" style="font-size:9px">${r.peek}</p>
      <div class="row" style="margin-top:12px">
        <button class="btn center amber" onclick="openChest()"><span class="k">&#128273;</span>OPEN IT</button>
        <button class="btn center" onclick="leaveRoom()"><span class="k">&#10551;</span>LEAVE IT</button>
      </div>`;
  } else if(r.type==='relic'){
    if(!r.options){ r.options=[...RELICS].sort(()=>Math.random()-.5).slice(0,3); }
    const owned=new Set(p.relics);
    const cards=r.options.map((rl,i)=>{
      const have=owned.has(rl.name);
      return `<button class="btn" ${have?'disabled':''} onclick="takeRelic(${i})">
        <span class="k purple">&#9670;</span>${rl.name}${have?' (owned)':''}<small>${rl.note}</small></button>`;
    }).join('');
    body = `<pre class="sprite purple">  __||__\n |[####]|\n |[ &#9670; ]|\n |[####]|\n  \\____/</pre>
      <h3 class="center purple" style="margin:8px 0">PEDESTAL OF POWER</h3>
      <p class="muted center" style="font-size:9px">Claim ONE relic. It will reshape how you fight.</p>
      ${cards}
      <button class="btn muted center" onclick="leaveRoom()">Touch nothing, move on</button>`;
  } else if(r.type==='merchant'){ return renderMerchant();
  } else if(r.type==='shrine'){
    body = `<pre class="sprite purple">   _/\\_\n  /    \\\n |  *   |\n |______|</pre>
      <h3 class="center purple" style="margin:8px 0">CRACKED ALTAR</h3>
      <p class="muted center" style="font-size:9px">Offer your strength to mend, or your blood for power.</p>
      <button class="btn" onclick="shrine('heal')"><span class="k">&#10010;</span>Pray — restore 45% HP &amp; MP</button>
      <button class="btn" onclick="shrine('power')"><span class="k">&#9876;</span>Blood pact — +4 ATK, lose 12 HP</button>
      <button class="btn" onclick="shrine('ward')"><span class="k">&#128737;</span>Ward — +3 DEF &amp; +6 max HP</button>`;
  } else if(r.type==='fountain'){
    body = `<pre class="sprite blue">  .-~~~-.\n (~ ~ ~ ~)\n  \\~~~~~/\n   |   |\n  /_____\\</pre>
      <h3 class="center blue" style="margin:8px 0">SHIMMERING FOUNTAIN</h3>
      <p class="muted center" style="font-size:9px">The water glows. It could heal you greatly... or curse you. A gamble.</p>
      <div class="row" style="margin-top:12px">
        <button class="btn center blue" onclick="drinkFountain()"><span class="k">&#9760;</span>DRINK</button>
        <button class="btn center" onclick="leaveRoom()"><span class="k">&#10551;</span>WALK AWAY</button>
      </div>`;
  } else {
    body = `<pre class="sprite muted">  . . . .\n .       .\n  empty\n .       .\n  . . . .</pre>
      <h3 class="center muted" style="margin:8px 0">EMPTY CHAMBER</h3>
      <p class="muted center" style="font-size:9px">${r.peek} You catch your breath. (+10 HP, +8 MP)</p>
      <button class="btn center" onclick="restEmpty()"><span class="k">&#9654;</span>MOVE ON</button>`;
  }
  app.innerHTML = `<div class="floortag">${depthLabel()}</div>${playerBar(p)}<div class="panel fade">${body}</div>`;
}

function avoidRoom(){
  const p=G.player, extra=(G.room.group?G.room.group.length-1:0);
  const base = p.cls==='ranger'?88:60;
  if(chance(base - extra*8)){ proceed('You slip past unseen.'); }
  else { const dmg=6+rnd(8)+G.depth; p.hp=clamp(p.hp-dmg,0,p.maxHp);
    if(p.hp<=0){ G.screen='gameover'; return render(); }
    proceed(`Caught! You take ${dmg} escaping.`); }
}
function leaveRoom(){ proceed('You move on.'); }
function restEmpty(){ heal(G.player,10); G.player.mana=clamp(G.player.mana+8,0,G.player.maxMana); proceed(); }
function shrine(k){ const p=G.player;
  if(k==='heal'){ heal(p,Math.round(p.maxHp*0.45)); p.mana=clamp(p.mana+Math.round(p.maxMana*0.45),0,p.maxMana); }
  if(k==='power'){ p.atk+=4; p.hp=clamp(p.hp-12,1,p.maxHp); }
  if(k==='ward'){ p.def+=3; p.maxHp+=6; heal(p,6); }
  proceed(); }
function takeRelic(i){ const p=G.player, rl=G.room.options[i];
  if(p.relics.includes(rl.name)) return;
  rl.apply(p); p.relics.push(rl.name); proceed(`Relic claimed: ${rl.name}!`); }
function drinkFountain(){ const p=G.player;
  const roll=rnd(100);
  if(roll<55){ const h=Math.round(p.maxHp*0.45); heal(p,h); p.mana=clamp(p.mana+Math.round(p.maxMana*0.4),0,p.maxMana); proceed(`Blessed water! +${h} HP and mana restored.`); }
  else if(roll<80){ const c=Math.round(p.maxHp*0.18); p.hp=clamp(p.hp-c,1,p.maxHp); proceed(`Cursed! The water burns for ${c}.`); }
  else { p.maxHp+=10; heal(p,10); p.atk+=2; proceed('A surge of vigor! +10 max HP, +2 ATK.'); }
}

/* ---------- CHEST ---------- */
function openChest(){
  if(rnd(100)<15){
    const m=freshEnemy({name:'MIMIC', sprite:"  ______\n /<><><>\\\n | (oo) |\n  \\vvvv/", hp:50+G.depth*5, maxHp:50+G.depth*5, atk:11+G.depth, def:1});
    G.room={type:'enemy', _enemies:[m]};
    startBattle('The chest was a MIMIC!'); return;
  }
  G.pending={source:'chest'}; G.screen='reward'; buildRewards(); render();
}

/* ---------- MERCHANT ---------- */
function renderMerchant(){
  const p=G.player;
  const item=(label,cost,sub,fn,can)=>`<button class="btn" ${can?'':'disabled'} onclick="${fn}">
    <span class="k amber">${cost}g</span>${label}<small>${sub}</small></button>`;
  app.innerHTML = `<div class="floortag">${depthLabel()}</div>${playerBar(p)}
    <div class="panel fade">
      <pre class="sprite amber">  ,---.\n  (o o)\n /|MERCH|\\\n  |   |</pre>
      <h3 class="center amber" style="margin:8px 0">THE MERCHANT</h3>
      <p class="muted center" style="font-size:9px">"Coin for comfort, traveler." &middot; You have ${p.gold}g</p>
      ${item('Health Potion', 25, '+1 potion (heals 40% in battle)', "buy('potion')", p.gold>=25)}
      ${item('Healing Draught', 18, 'restore 50% HP now', "buy('heal')", p.gold>=18)}
      ${item('Mana Tonic', 14, 'fully restore mana now', "buy('mana')", p.gold>=14)}
      ${item('Mystery Upgrade', 40, 'a random permanent upgrade', "buy('upgrade')", p.gold>=40)}
      <button class="btn muted center" onclick="leaveRoom()"><span class="k">&#10551;</span>LEAVE SHOP</button>
    </div>${statusFooter()}`;
}
function buy(kind){ const p=G.player;
  if(kind==='potion'&&p.gold>=25){ p.gold-=25; p.potions++; }
  if(kind==='heal'&&p.gold>=18){ p.gold-=18; heal(p,Math.round(p.maxHp*0.5)); }
  if(kind==='mana'&&p.gold>=14){ p.gold-=14; p.mana=p.maxMana; }
  if(kind==='upgrade'&&p.gold>=40){ p.gold-=40; pick(UPGRADES).apply(p); }
  renderMerchant();
}

/* ============================================================
   BATTLE
   ============================================================ */
function startBattle(intro){
  const r=G.room;
  const enemies = r._enemies ? r._enemies : buildEnemies(r);
  G.battle = { enemies, target:0, pdef:0, pdefTurns:0, evade:0, evadeTurns:0, guardDown:0,
    over:false, anim:'', animIdx:-1, hadBoss:enemies.some(e=>e.boss), isFinal:enemies.some(e=>e.name===BOSSES.final.name) };
  G.log=[];
  if(intro) blog(intro,'info');
  blog(enemies.length>1?`${enemies.length} foes block your path!`:`A ${enemies[0].name} appears!`,'info');
  G.screen='battle'; render();
}
function blog(t,c=''){ G.log.push({text:t,cls:c}); if(G.log.length>30) G.log.shift(); }
function living(){ return G.battle.enemies.filter(e=>e.hp>0); }
function allDead(){ return G.battle.enemies.every(e=>e.hp<=0); }
function ensureTarget(){ const b=G.battle; if(!b.enemies[b.target]||b.enemies[b.target].hp<=0){ const i=b.enemies.findIndex(e=>e.hp>0); b.target=i<0?0:i; } }
function setTarget(i){ if(G.battle.enemies[i].hp>0){ G.battle.target=i; render(); } }

function renderBattle(){
  const p=G.player, b=G.battle; ensureTarget();
  const multi = b.enemies.length>1;
  const cells = b.enemies.map((e,i)=>{
    const dead=e.hp<=0;
    const st = (e.burnTurns>0?'<span class="chip amber">BURN</span>':'')+(e.weakTurns>0?'<span class="chip purple">WEAK</span>':'');
    return `<div class="enemy-cell ${i===b.target&&!dead?'target':''} ${dead?'dead':''}">
      <div class="bar mini"><div class="lbl"><span class="red">${e.name}</span><span>${Math.max(0,e.hp)}/${e.maxHp}</span></div>
        <div class="track"><div class="fill ${e.boss?'boss':'hp'}" style="width:${clamp(e.hp/e.maxHp*100,0,100)}%"></div></div></div>
      <pre class="sprite red ${b.animIdx===i?'hitpop':''}">${e.sprite}</pre>
      <div class="center">${dead?'<span class="muted" style="font-size:8px">DEFEATED</span>':st}</div>
      ${(multi&&!dead)?`<button class="tgt ${i===b.target?'on':''}" onclick="setTarget(${i})">${i===b.target?'&#9654; TARGET':'aim'}</button>`:''}
    </div>`;
  }).join('');
  const logHtml=G.log.slice(-6).map(l=>`<div class="${l.cls}">${l.text}</div>`).join('');
  const pStatus=(b.pdefTurns>0?`<span class="chip blue">GUARD ${b.pdefTurns}</span>`:'')
    +(b.evadeTurns>0?`<span class="chip green">EVADE ${b.evadeTurns}</span>`:'')
    +(b.guardDown>0?`<span class="chip red">EXPOSED</span>`:'');
  const skills=p.skills.map(s=>`<button class="btn" ${p.mana<s.cost?'disabled':''} onclick="playerSkill('${s.id}')">
      <span class="k blue">${s.cost}MP</span>${s.name}${s.aoe?' <span class="amber">(AOE)</span>':''}<small>${s.desc}</small></button>`).join('');
  app.innerHTML = `<div class="floortag">${b.hadBoss?'<span class="red">BOSS BATTLE</span>':depthLabel()}</div>
    <div class="panel ${b.anim}" id="scene">
      <div class="enemies-row">${cells}</div>
      <div class="log">${logHtml}</div>
      <pre class="sprite" style="font-size:9px;color:var(--${p.color})">${p.sprite}</pre>
      <div class="center">${pStatus}</div>
      ${playerBar(p,true)}
    </div>
    ${b.over?'':`<div class="panel tight">
      <div class="menu-grid">
        <button class="btn" onclick="playerAttack()"><span class="k">&#9876;</span>ATTACK<small>${p.weapon.name} (${p.atk+p.weapon.dmg} pow)</small></button>
        <button class="btn" onclick="useItem()" ${p.potions?'':'disabled'}><span class="k green">&#10010;</span>POTION<small>${p.potions} left &middot; heal 40%</small></button>
      </div>
      <hr class="hr">${skills}
      <button class="btn muted" onclick="fleeBattle()"><span class="k">&#10551;</span>FLEE<small>${b.hadBoss?'cannot flee a boss!':'risky — foes may strike'}</small></button>
    </div>`}`;
}

/* ----- damage helpers ----- */
function playerDamageMult(e){
  const p=G.player, f=p.flags; let m=1;
  if(f.glassCannon) m*=1.5;
  if(f.stoneSkin)  m*=0.8;
  if(f.berserker)  m*= 1 + (1-p.hp/p.maxHp)*0.8;
  if(f.executioner && e.hp<=e.maxHp*0.3) m*=2;
  return m;
}
function rollCrit(){ return chance(G.player.crit); }
function onEnemyDeath(e){
  if(e._dead) return; e._dead=true;
  blog(`${e.name} is defeated!`,'info');
  G.player.kills++;
  if(G.player.flags.bloodpact){ const h=Math.round(G.player.maxHp*0.08); heal(G.player,h); blog(`Blood Pact heals ${h}.`,'heal'); }
}
function dealToEnemy(idx, dmg, label, crit){
  const b=G.battle, e=b.enemies[idx], p=G.player;
  if(!e||e.hp<=0) return;
  dmg = Math.max(1, Math.round(dmg*playerDamageMult(e) - (e.def||0)));
  e.hp=clamp(e.hp-dmg,0,e.maxHp);
  b.animIdx=idx;
  const tag=b.enemies.length>1?` [${e.name}]`:'';
  blog(`${label} for ${dmg}${crit?' (CRIT!)':''}!${tag}`, crit?'crit':'dmg');
  if(p.lifesteal>0){ const ls=Math.max(1,Math.round(dmg*p.lifesteal/100)); heal(p,ls); blog(`You drain ${ls} HP.`,'heal'); }
  if(e.hp<=0) onEnemyDeath(e);
}
function applyBurn(idx,n){ const e=G.battle.enemies[idx]; if(e&&e.hp>0){ e.burn=n; e.burnTurns=3; blog(`${e.name} is set ABLAZE!`,'info'); } }

function basicHit(idx){
  const p=G.player; let d=p.atk+p.weapon.dmg+rnd(4); let c=rollCrit(); if(c)d*=1.8;
  dealToEnemy(idx,d,`You strike with ${p.weapon.name}`,c);
  if(p.weapon.burn && chance(45)) applyBurn(idx,4);
}
function playerAttack(){
  const p=G.player,b=G.battle; if(b.over)return;
  ensureTarget(); basicHit(b.target);
  if(p.flags.doubleStrike && chance(35) && living().length){ ensureTarget(); blog('Twin Fang! A second strike!','info'); basicHit(b.target); }
  afterPlayer();
}
function aoeHit(fn){ G.battle.enemies.forEach((e,i)=>{ if(e.hp>0) fn(i); }); }

function playerSkill(id){
  const p=G.player,b=G.battle; const s=p.skills.find(x=>x.id===id);
  if(!s||p.mana<s.cost||b.over) return; p.mana-=s.cost; ensureTarget();
  const mm=p.maxMana;
  switch(id){
    case 'bolt':{ let d=10+Math.round(mm*0.16)+p.weapon.dmg; let c=rollCrit(); if(c)d*=1.8; dealToEnemy(b.target,d,'Arcane Bolt blasts',c); break; }
    case 'fire':{ blog('Fireball erupts across the foes!','info'); aoeHit(i=>{ let d=14+Math.round(mm*0.11)+p.weapon.dmg; dealToEnemy(i,d,'Flames engulf'); }); aoeHit(i=>applyBurn(i,5)); break; }
    case 'frost':{ blog('Frost Nova chills the room!','info'); aoeHit(i=>{ let d=7+Math.round(mm*0.07); dealToEnemy(i,d,'Frost bites'); const e=b.enemies[i]; if(e.hp>0){e.weak=0.4;e.weakTurns=2;} }); blog('Enemies are WEAKENED!','info'); break; }
    case 'power':{ let d=(p.atk+p.weapon.dmg)*1.9+rnd(4); let c=rollCrit(); if(c)d*=1.7; dealToEnemy(b.target,d,'Power Strike crushes',c); break; }
    case 'shield':{ b.pdef=0.65; b.pdefTurns=2; blog('You raise your guard! (65% block, 2 turns)','info'); break; }
    case 'reck':{ blog('You spin into a whirlwind!','info'); aoeHit(i=>{ let d=(p.atk+p.weapon.dmg)*1.5+rnd(5); let c=rollCrit(); if(c)d*=1.5; dealToEnemy(i,d,'Whirlwind rends',c); }); b.guardDown=1; blog('...but you are left EXPOSED!','info'); break; }
    case 'aim':{ let d=(p.atk+p.weapon.dmg)*1.6; let c=chance(p.crit+30); if(c)d*=2; dealToEnemy(b.target,d,'Aimed Shot pierces',c); break; }
    case 'evade':{ b.evade=45; b.evadeTurns=2; blog('Wind Step! Dodge greatly increased.','info'); break; }
    case 'volley':{ blog('You loose a volley of arrows!','info'); for(let k=0;k<3;k++){ const liv=living(); if(!liv.length)break; const e=pick(liv); const idx=b.enemies.indexOf(e); let d=(p.atk*0.6+p.weapon.dmg)+rnd(3); let c=rollCrit(); if(c)d*=1.8; dealToEnemy(idx,d,'Arrow hits',c); } break; }
  }
  afterPlayer();
}
function useItem(){ const p=G.player,b=G.battle; if(!p.potions||b.over)return; p.potions--; const h=Math.round(p.maxHp*0.4); heal(p,h); blog(`You quaff a potion. +${h} HP.`,'heal'); afterPlayer(); }
function fleeBattle(){ const p=G.player,b=G.battle;
  if(b.hadBoss){ blog('There is no escape from this foe!','info'); return render(); }
  if(p.cls==='ranger'?chance(85):chance(55)){ blog('You break away and flee!','info'); b.over=true; render(); setTimeout(()=>proceed('You escaped — no loot.'),700); }
  else { blog('You failed to flee!','info'); enemyTurn(); }
}

function afterPlayer(){
  const b=G.battle;
  b.enemies.forEach(e=>{ if(e.hp>0 && e.burnTurns>0){ e.hp=clamp(e.hp-e.burn,0,e.maxHp); blog(`Burn sears ${e.name} for ${e.burn}.`,'dmg'); e.burnTurns--; if(e.hp<=0)onEnemyDeath(e); } });
  if(allDead()){ winBattle(); return; }
  render(); setTimeout(enemyTurn,600);
}
function enemyTurn(){
  const p=G.player,b=G.battle; if(b.over)return;
  for(const e of b.enemies){
    if(e.hp<=0) continue; if(p.hp<=0) break;
    let dmg=e.atk+rnd(5), label=`${e.name} attacks`;
    if(e.caster&&chance(40)){ dmg=Math.round(e.atk*1.4); label=`${e.name} casts dark magic`; }
    if(e.boss&&chance(35)){ dmg=Math.round(e.atk*1.6); label=`${e.name} unleashes a savage blow`; }
    if(e.weakTurns>0) dmg=Math.round(dmg*(1-e.weak));
    const dodgeChance=p.dodge+(b.evadeTurns>0?b.evade:0);
    if(chance(dodgeChance)){ blog(`You dance aside — ${e.name} misses!`,'info'); continue; }
    let red=(b.pdefTurns>0?b.pdef:0);
    dmg=Math.max(1, Math.round(dmg*(1-red))-p.def);
    if(b.guardDown>0) dmg=Math.round(dmg*1.3);
    if(p.cls==='mage'&&p.mana>0){ const ab=Math.min(p.mana,Math.ceil(dmg*0.5)); if(ab>0){ p.mana-=ab; dmg-=ab; blog(`Mana Shield soaks ${ab}.`,'info'); } }
    p.hp=clamp(p.hp-dmg,0,p.maxHp);
    blog(`${label} for ${dmg}!`,'dmg');
    if(p.flags.thorns && e.hp>0){ const rf=Math.max(1,Math.round(dmg*0.3)); e.hp=clamp(e.hp-rf,0,e.maxHp); blog(`Thorns reflect ${rf} to ${e.name}.`,'heal'); if(e.hp<=0)onEnemyDeath(e); }
  }
  b.enemies.forEach(e=>{ if(e.weakTurns>0)e.weakTurns--; });
  if(b.pdefTurns>0)b.pdefTurns--; if(b.evadeTurns>0)b.evadeTurns--; if(b.guardDown>0)b.guardDown--;
  p.mana=clamp(p.mana+p.regen,0,p.maxMana);
  flash('playerHit');
  if(p.hp<=0){ b.over=true; render(); setTimeout(()=>{G.screen='gameover';render();},800); return; }
  if(allDead()){ winBattle(); return; }
  render();
}
function flash(kind){
  const scene=$('scene');
  if(kind==='enemyHit'){ G.battle.anim=''; }
  else { G.battle.anim='shake flash'; if(scene){ scene.classList.remove('shake','flash'); void scene.offsetWidth; scene.classList.add('shake','flash'); } }
  setTimeout(()=>{ if(G.battle){ G.battle.anim=''; G.battle.animIdx=-1; } },300);
}
function winBattle(){
  const b=G.battle,p=G.player; b.over=true;
  const gold=(8+rnd(12))+G.depth*2+(b.enemies.length-1)*6; p.gold+=gold;
  blog('The chamber is clear!','info'); render();
  setTimeout(()=>{ if(b.isFinal){ G.screen='victory'; return render(); }
    G.pending={source:'battle', boss:b.hadBoss, gold}; G.screen='reward'; buildRewards(); render(); },900);
}

/* ============================================================
   REWARDS
   ============================================================ */
function buildRewards(){
  const p=G.player, isBoss=G.pending&&G.pending.boss;
  const wpool=WEAPONS[p.cls].filter(w=>w.name!==p.weapon.name);
  const opts=[];
  if(wpool.length) opts.push({kind:'weapon', data: isBoss?wpool.reduce((a,b)=>b.dmg>a.dmg?b:a):pick(wpool)});
  const ups=[...UPGRADES].sort(()=>Math.random()-.5);
  opts.push({kind:'upgrade', data:ups[0]}); opts.push({kind:'upgrade', data:ups[1]});
  G.pending.options=opts.sort(()=>Math.random()-.5).slice(0,3);
}
function renderReward(){
  const p=G.player, pd=G.pending;
  const src=pd.source==='chest'?'THE CHEST CONTAINS':'SPOILS OF BATTLE';
  const gold=pd.gold?`<p class="center amber" style="font-size:9px">+${pd.gold} gold &middot; ${p.gold}g total</p>`:'';
  const cards=pd.options.map((o,i)=>o.kind==='weapon'
    ? `<button class="btn" onclick="takeReward(${i})"><span class="k amber">&#9876;</span>${o.data.name}<small>${o.data.dmg} dmg &middot; ${o.data.type}${o.data.note?' &middot; '+o.data.note:''}</small></button>`
    : `<button class="btn" onclick="takeReward(${i})"><span class="k green">&#9650;</span>${o.data.name}<small>${o.data.note}</small></button>`).join('');
  app.innerHTML = `<div class="floortag">${depthLabel()}</div>${playerBar(p)}
    <div class="panel fade">
      <h3 class="center amber" style="margin-bottom:6px">${src}</h3>${gold}
      <p class="muted center" style="font-size:9px">Choose one reward:</p>${cards}
      ${pd.source==='chest'?`<button class="btn muted center" onclick="takeReward(-1)">Leave it all</button>`:''}
    </div>`;
}
function takeReward(i){ const p=G.player, pd=G.pending;
  if(i>=0){ const o=pd.options[i]; if(o.kind==='weapon') equip(p,o.data); else o.data.apply(p); }
  if(pd.boss) p.potions++;
  G.pending=null; proceed();
}

/* ============================================================
   FLOW / END
   ============================================================ */
function proceed(msg){
  if(G.depth>=RUN_LENGTH){ G.screen='victory'; return render(); }
  nextCorridor(); G.screen='corridor'; render();
  if(msg){ const f=document.querySelector('.footer'); if(f) f.innerHTML=`<span class="amber">${msg}</span>`; }
}
function renderEnd(win){
  const p=G.player;
  app.innerHTML = `<h1 class="title" style="color:var(--${win?'green':'red'})">${win?'VICTORY!':'YOU DIED'}</h1>
    <div class="panel center fade">
      <pre class="sprite ${win?'green':'red'}">${win?"  \\o/   \\o/\n   |     |\n  / \\   / \\\n THE DRAGON FALLS":"   _____\n  /     \\\n | x   x |\n  \\  _  /\n   |||||\n   R.I.P"}</pre>
      <p style="font-size:10px;line-height:2">
        ${win?'You conquered the Crypt of the Champion!':'Your journey ends in the dark.'}<br>
        <span class="muted">Class:</span> ${CLASSES[p.cls].name}<br>
        <span class="muted">Chamber reached:</span> ${G.depth}/${RUN_LENGTH}<br>
        <span class="muted">Enemies slain:</span> ${p.kills}<br>
        <span class="muted">Gold gathered:</span> ${p.gold}<br>
        <span class="muted">Relics:</span> ${p.relics.length?p.relics.join(', '):'none'}
      </p>
      <button class="btn center" onclick="restart()"><span class="k">&#8635;</span>PLAY AGAIN</button>
    </div>`;
}
function restart(){ newGame(); render(); }

/* ---------- shared UI ---------- */
function playerBar(p, full){
  const relics=p.relics.length?`<div class="relics">${p.relics.map(r=>`<span class="chip">&#9670; ${r}</span>`).join('')}</div>`:'';
  return `<div class="panel tight">
    <div class="bar"><div class="lbl"><span class="green">HP ${CLASSES[p.cls].name}</span><span>${p.hp}/${p.maxHp}</span></div>
      <div class="track"><div class="fill hp" style="width:${clamp(p.hp/p.maxHp*100,0,100)}%"></div></div></div>
    <div class="bar"><div class="lbl"><span class="blue">MP</span><span>${p.mana}/${p.maxMana}</span></div>
      <div class="track"><div class="fill mp" style="width:${p.maxMana?clamp(p.mana/p.maxMana*100,0,100):0}%"></div></div></div>
    ${full?`<div class="stats">ATK <b>${p.atk+p.weapon.dmg}</b> &middot; DEF <b>${p.def}</b> &middot; DODGE <b>${p.dodge}%</b> &middot; CRIT <b>${p.crit}%</b>${p.lifesteal?' &middot; LIFESTEAL <b>'+p.lifesteal+'%</b>':''}</div>`:''}
    ${full?relics:''}
  </div>`;
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e=>{
  const btns=[...document.querySelectorAll('.btn:not([disabled])')];
  const n=parseInt(e.key,10);
  if(!isNaN(n)&&n>=1&&n<=btns.length){ btns[n-1].click(); return; }
  if(e.key==='Enter'&&btns.length) btns[0].click();
});

render();
</script>
</body>
</html>
