<script>
"use strict";
/* ============================================================
   CRYPT OF THE CHAMPION  —  text roguelike  (v3)
   zones · packs · relics · omens · events · statuses · levels
   ============================================================ */
const $=id=>document.getElementById(id);
const app=$('app');
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const chance=p=>Math.random()*100<p;
const shuffle=a=>[...a].sort(()=>Math.random()-.5);

/* ============================================================
   AUDIO  —  chiptune SFX + music (WebAudio synth, no assets)
   ============================================================ */
const SFX=(()=>{
  const sg=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
  const ss=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
  let ctx=null,master=null,musicGain=null,musicWet=null,sfxGain=null;
  let muted=sg('crypt_muted')==='1', musicMuted=sg('crypt_music_muted')==='1';
  let currentMusic=null,musicTimer=null;
  const init=()=>{
    if(ctx){if(ctx.state==='suspended')ctx.resume();return;}
    try{
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
      ctx=new AC();
      master=ctx.createGain();master.gain.value=0.55;master.connect(ctx.destination);
      musicGain=ctx.createGain();musicGain.gain.value=musicMuted?0:0.16;musicGain.connect(master);
      sfxGain=ctx.createGain();sfxGain.gain.value=muted?0:0.45;sfxGain.connect(master);
      /* synthesized reverb impulse — music sends through this, SFX stays dry */
      const sr=ctx.sampleRate, irLen=Math.floor(sr*1.6);
      const ir=ctx.createBuffer(2,irLen,sr);
      for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);
        for(let i=0;i<irLen;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/irLen,2.6);}
      const conv=ctx.createConvolver(); conv.buffer=ir;
      musicWet=ctx.createGain(); musicWet.gain.value=0.32;
      conv.connect(musicWet); musicWet.connect(master);
      musicGain.connect(conv);
      if(ctx.state==='suspended')ctx.resume();
    }catch(e){ctx=null;}
  };
  const tone=(freq,dur,o)=>{
    if(!ctx)return; o=o||{};
    const t0=o.when||ctx.currentTime, type=o.type||'square';
    const osc=ctx.createOscillator();osc.type=type;osc.frequency.setValueAtTime(freq,t0);
    if(o.slide)osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.slide),t0+dur);
    const g=ctx.createGain(); const v=o.vol!=null?o.vol:0.3;
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(v,t0+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    osc.connect(g);g.connect(o.dest||sfxGain);
    osc.start(t0);osc.stop(t0+dur+0.03);
  };
  const noise=(dur,vol)=>{
    if(!ctx)return; vol=vol||0.2;
    const bs=Math.max(1,Math.floor(ctx.sampleRate*dur));
    const buf=ctx.createBuffer(1,bs,ctx.sampleRate); const d=buf.getChannelData(0);
    for(let i=0;i<bs;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/bs,1.6);
    const s=ctx.createBufferSource();s.buffer=buf;
    const g=ctx.createGain();g.gain.value=vol;
    s.connect(g);g.connect(sfxGain);s.start();
  };
  const aft=(ms,fn)=>setTimeout(fn,ms);
  const DEFS={
    click:  ()=>tone(1100,0.03,{type:'square',vol:0.12}),
    hit:    ()=>{tone(220,0.06,{type:'square',vol:0.3,slide:90});noise(0.08,0.18);},
    crit:   ()=>{tone(660,0.06,{type:'square',vol:0.3});aft(40,()=>tone(1175,0.1,{type:'square',vol:0.3}));aft(95,()=>tone(2349,0.10,{type:'square',vol:0.22}));noise(0.14,0.22);},
    hurt:   ()=>{tone(160,0.18,{type:'sawtooth',vol:0.28,slide:70});noise(0.18,0.18);},
    heartbeat:()=>{tone(96,0.24,{type:'sine',vol:0.36,slide:-30});aft(160,()=>tone(72,0.28,{type:'sine',vol:0.34,slide:-22}));},
    dodge:  ()=>tone(660,0.06,{type:'sine',vol:0.22,slide:1320}),
    heal:   ()=>{[523,659,784].forEach((f,i)=>aft(i*55,()=>tone(f,0.1,{type:'sine',vol:0.25})));},
    potion: ()=>{[440,659,880].forEach((f,i)=>aft(i*55,()=>tone(f,0.08,{type:'triangle',vol:0.26})));},
    skill:  ()=>{[440,587,740].forEach((f,i)=>aft(i*40,()=>tone(f,0.07,{type:'square',vol:0.26})));},
    fire:   ()=>{noise(0.35,0.22);tone(180,0.35,{type:'sawtooth',vol:0.18,slide:60});},
    frost:  ()=>{[1175,988,784,659].forEach((f,i)=>aft(i*50,()=>tone(f,0.1,{type:'triangle',vol:0.22})));},
    arrow:  ()=>{tone(1320,0.05,{type:'square',vol:0.2,slide:660});noise(0.06,0.12);},
    kill:   ()=>{tone(196,0.18,{type:'sawtooth',vol:0.22,slide:80});noise(0.16,0.12);},
    levelup:()=>{[523,659,784,1046,1318].forEach((f,i)=>aft(i*70,()=>tone(f,0.14,{type:'square',vol:0.3})));},
    death:  ()=>{[440,392,349,294,247,196,165].forEach((f,i)=>aft(i*120,()=>tone(f,0.22,{type:'sawtooth',vol:0.3})));},
    win:    ()=>{[523,659,784,1046,1318,1568].forEach((f,i)=>aft(i*110,()=>tone(f,0.18,{type:'square',vol:0.3})));},
    gold:   ()=>{tone(1568,0.05,{type:'square',vol:0.22});aft(50,()=>tone(2093,0.08,{type:'square',vol:0.22}));},
    chest:  ()=>{tone(659,0.07,{type:'square',vol:0.25});aft(60,()=>tone(880,0.07,{type:'square',vol:0.25}));aft(120,()=>tone(1175,0.12,{type:'square',vol:0.25}));},
    relic:  ()=>{[659,880,1046,1318,1568].forEach((f,i)=>aft(i*70,()=>tone(f,0.13,{type:'triangle',vol:0.27})));},
    status: ()=>tone(330,0.08,{type:'sawtooth',vol:0.18,slide:220}),
    door:   ()=>{tone(110,0.12,{type:'square',vol:0.2,slide:70});noise(0.05,0.1);},
    fail:   ()=>tone(220,0.15,{type:'square',vol:0.24,slide:110}),
    upgrade:()=>{[523,659,880].forEach((f,i)=>aft(i*55,()=>tone(f,0.1,{type:'square',vol:0.25})));},
  };
  const play=(name)=>{if(!ctx)return; const fn=DEFS[name]; if(fn)fn();};
  /* music tracks: melody (square) + bass arp (triangle) + optional kick.
     Dead Cells "Prisoner's Awakening" style: rolling 16th-note arpeggios that
     never stop, sparse held lead on top, minor-key questing vibe. */
  /* arp helper: 8 sixteenths over 2 beats for one chord [root, fifth, octave] */
  const arp2=(c)=>[
    [c[0],0.25],[c[1],0.25],[c[2],0.25],[c[1],0.25],
    [c[0],0.25],[c[1],0.25],[c[2],0.25],[c[1],0.25]];
  /* 16ths for 1 beat */
  const arp1=(c)=>[[c[0],0.25],[c[1],0.25],[c[2],0.25],[c[1],0.25]];
  const M={
    /* TITLE — A minor adventure call, sparse held lead (138 BPM) */
    title:{bpm:138,
      melody:[
        [440,1.5],[523,0.5],[659,2],
        [349,1.5],[440,0.5],[523,2],
        [392,1],[440,1],[523,0.5],[587,0.5],[659,1],
        [587,1],[523,1],[440,2]],
      bass:[
        ...arp2([110,165,220]),  // Am
        ...arp2([87,131,174]),   // F
        ...arp2([131,196,262]),  // C
        ...arp2([98,147,196])],  // G
      kick:0},
    /* EXPLORE — the main "questing" track, C minor cycle (142 BPM) */
    explore:{bpm:142,
      melody:[
        [523,1.5],[466,0.5],
        [392,1.5],[466,0.5],
        [523,1],[622,0.5],[698,0.5],
        [622,1],[466,1],
        [698,1],[622,0.5],[523,0.5],
        [466,1],[523,0.5],[622,0.5],
        [415,1],[466,0.5],[523,0.5],
        [392,1],[349,1]],
      bass:[
        ...arp2([131,196,311]),  // Cm   (C Eb G)
        ...arp2([117,175,294]),  // Bb   (Bb D F)
        ...arp2([104,156,262]),  // Ab   (Ab C Eb)
        ...arp2([156,233,392]),  // Eb   (Eb G Bb)
        ...arp2([131,196,311]),  // Cm
        ...arp2([117,175,294]),  // Bb
        ...arp2([104,156,262]),  // Ab
        ...arp2([156,233,392])], // Eb
      kick:0},
    /* BATTLE — pressing D minor charge, faster arps (160 BPM) */
    battle:{bpm:160,
      melody:[
        [587,0.5],[698,0.5],[880,1],
        [932,0.5],[880,0.5],[698,1],
        [698,0.5],[587,0.5],[523,1],
        [587,1],[440,1],
        [880,0.5],[1046,0.5],[1175,1],
        [1046,0.5],[880,0.5],[698,1],
        [587,0.5],[523,0.5],[440,1],
        [392,2]],
      bass:[
        ...arp2([147,220,294]),  // Dm
        ...arp2([117,175,233]),  // Bb
        ...arp2([87,131,174]),   // F
        ...arp2([110,165,220]),  // A
        ...arp2([147,220,294]),
        ...arp2([117,175,233]),
        ...arp2([87,131,174]),
        ...arp2([110,165,220])],
      kick:2},  // soft kick every half-measure (downbeat)
    /* BOSS — heavy heroic descent, C minor / Eb major (148 BPM) */
    boss:{bpm:148,
      melody:[
        [523,1],[622,1],
        [587,0.5],[698,0.5],[784,1],
        [831,1],[698,0.5],[622,0.5],
        [466,1],[523,1],
        [622,1],[784,0.5],[932,0.5],
        [1046,1],[932,0.5],[784,0.5],
        [698,0.5],[622,0.5],[523,1],
        [466,1],[523,1]],
      bass:[
        ...arp2([131,196,311]),  // Cm
        ...arp2([98,147,196]),   // G
        ...arp2([104,156,262]),  // Ab
        ...arp2([156,233,392]),  // Eb
        ...arp2([131,196,311]),
        ...arp2([98,147,196]),
        ...arp2([104,156,262]),
        ...arp2([156,233,392])],
      kick:1},  // kick every beat for boss intensity
    /* VICTORY — bright C major fanfare with arp continuation (152 BPM) */
    victory:{bpm:152,
      melody:[
        [523,0.5],[659,0.5],[784,1],
        [880,0.5],[1046,0.5],[1318,1],
        [1568,0.5],[1318,0.5],[1046,1],
        [1568,2]],
      bass:[
        ...arp1([131,196,262]),  // C
        ...arp1([87,131,174]),   // F
        ...arp1([98,147,196]),   // G
        ...arp1([131,196,262])], // C
      kick:1},
  };
  const stopMusic=()=>{if(musicTimer){clearTimeout(musicTimer);musicTimer=null;}currentMusic=null;};
  /* piano-style note: layered triangle+sine oscillators with low-pass + piano envelope.
     Replaces the chiptune square/triangle "tone" for music — gives a softer, resonant timbre
     that feeds the reverb send for spatial depth. */
  const piano=(freq,dur,when,vol,dest)=>{
    if(!ctx||!dest)return;
    const o1=ctx.createOscillator(); o1.type='triangle'; o1.frequency.setValueAtTime(freq,when);
    const o2=ctx.createOscillator(); o2.type='sine';     o2.frequency.setValueAtTime(freq*2,when);
    const o3=ctx.createOscillator(); o3.type='sine';     o3.frequency.setValueAtTime(freq*3,when);
    const o4=ctx.createOscillator(); o4.type='sine';     o4.frequency.setValueAtTime(freq*0.5,when);
    /* harmonic mix */
    const h2=ctx.createGain(); h2.gain.value=0.30;
    const h3=ctx.createGain(); h3.gain.value=0.12;
    const h4=ctx.createGain(); h4.gain.value=0.18;
    /* low-pass for warmth, brighter for high notes */
    const lp=ctx.createBiquadFilter(); lp.type='lowpass';
    lp.frequency.setValueAtTime(Math.min(7000,freq*7.5),when); lp.Q.value=0.6;
    /* piano envelope: instant attack, fast initial decay, long tail */
    const g=ctx.createGain();
    g.gain.setValueAtTime(0.0001,when);
    g.gain.exponentialRampToValueAtTime(vol,when+0.006);
    g.gain.exponentialRampToValueAtTime(vol*0.55,when+Math.min(0.12,dur*0.25));
    g.gain.exponentialRampToValueAtTime(0.0001,when+dur+0.05);
    o1.connect(lp);
    o2.connect(h2); h2.connect(lp);
    o3.connect(h3); h3.connect(lp);
    o4.connect(h4); h4.connect(lp);
    lp.connect(g); g.connect(dest);
    const stop=when+dur+0.12;
    o1.start(when); o2.start(when); o3.start(when); o4.start(when);
    o1.stop(stop); o2.stop(stop); o3.stop(stop); o4.stop(stop);
  };
  /* schedule a short kick drum at time t (low sine + noise burst) */
  const kickAt=(t)=>{
    if(!ctx||!musicGain)return;
    const o=ctx.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(45,t+0.09);
    const g=ctx.createGain();
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.13,t+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.12);
    o.connect(g); g.connect(musicGain);
    o.start(t); o.stop(t+0.14);
    /* tiny noise click for snap */
    const bs=Math.max(1,Math.floor(ctx.sampleRate*0.02));
    const buf=ctx.createBuffer(1,bs,ctx.sampleRate); const d=buf.getChannelData(0);
    for(let i=0;i<bs;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/bs,3);
    const s=ctx.createBufferSource(); s.buffer=buf;
    const ng=ctx.createGain(); ng.gain.value=0.025;
    s.connect(ng); ng.connect(musicGain); s.start(t);
  };
  const setMusic=(name)=>{
    if(!ctx)return;
    if(currentMusic===name)return;
    stopMusic();
    if(!name||!M[name])return;
    currentMusic=name;
    const track=M[name], beat=60/track.bpm;
    let mi=0,bi=0,ki=0;
    let mNext=ctx.currentTime+0.1, bNext=ctx.currentTime+0.1, kNext=ctx.currentTime+0.1;
    const tick=()=>{
      if(currentMusic!==name)return;
      const look=ctx.currentTime+0.3;
      while(mNext<look){
        const n=track.melody[mi%track.melody.length], f=n[0], d=n[1];
        if(f>0)piano(f,d*beat*1.4,mNext,0.18,musicGain);  /* lead piano */
        mNext+=d*beat; mi++;
      }
      while(bNext<look){
        const n=track.bass[bi%track.bass.length], f=n[0], d=n[1];
        if(f>0)piano(f,d*beat*1.1,bNext,0.10,musicGain);  /* arp piano */
        bNext+=d*beat; bi++;
      }
      if(track.kick){
        while(kNext<look){ kickAt(kNext); kNext+=track.kick*beat; ki++; }
      }
      musicTimer=setTimeout(tick,80);
    };
    tick();
  };

};
const AFFIX_TAGS=['Armored','Frenzied','Vampiric','Toxic','Brutal'];
// Every way an enemy name can be PREFIXED at spawn — elite affixes (AFFIXES),
// counter-affixes (COUNTERS), Heat-tier threat words, and the metal-room tag.
// Prefixes stack (e.g. "Iron-Clad Relentless Gargoyle"), so stripAffix loops.
// Built lazily + cached because COUNTERS is defined further down the file.
let _affixPrefixes=null;
function affixPrefixes(){
  if(_affixPrefixes) return _affixPrefixes;
  const list=[];
  for(const t of AFFIX_TAGS) list.push(t+' ');
  try{ for(const k in COUNTERS) list.push(COUNTERS[k].prefix); }catch(e){}
  // Heat-tier + metal-room words (hardcoded at their apply-sites, no table to read)
  ['Ashen ','Molten ','Blazing ','Living Furnace ','Iron-Clad '].forEach(p=>list.push(p));
  // longest-first so multi-word prefixes strip before any shorter prefix of them
  _affixPrefixes = list.sort((a,b)=>b.length-a.length);
  return _affixPrefixes;
}
function stripAffix(name){
  const pre=affixPrefixes();
  let changed=true;
  while(changed){ changed=false;
    for(const p of pre){ if(name.startsWith(p)){ name=name.slice(p.length); changed=true; break; } }
  }
  return name;
}
function spriteKeyFor(name){
  const s=stripAffix(name);
  return BOSS_SPRITE[s]||BOSS_SPRITE[name]||ENEMY_SPRITE[s]||ENEMY_SPRITE[name]||null;
}
function enemySpriteHtml(e,depth){
  const key=spriteKeyFor(e.name); if(!key) return null;
  const cls=['sprite-enemy'];
  if(e.boss) cls.push('boss');
  const z=typeof depth==='number'?zoneOf(depth):(G&&G.depth?zoneOf(G.depth):0);
  if(z>0) cls.push('tier-'+z);
  return `<img class="${cls.join(' ')}" src="assets/monsters/${key}.png" alt="${e.name}" draggable="false">`;
}
const CLASS_SPRITE_CLASS={warrior:'sprite-player warrior',ranger:'sprite-player ranger',mage:'sprite-player mage'};
function playerSpriteHtml(p,opts){
  const cls=CLASS_SPRITE_CLASS[p.cls]; if(!cls) return null;
  const dead=opts&&opts.dead?' dead':'';
  return `<div class="${cls}${dead}" role="img" aria-label="${p.cls}"></div>`;
}
/* item icons — pick a cell by slot/type/passive */
function iconClassesFor(item){
  if(!item) return null;
  const r=RARITY[item.rarity]?'r-'+['com','unc','rare','epic','leg'][item.rarity]:'';
  if(item.slot==='weapon'){
    const t=item.type||'melee';
    const key=t==='magic'?(item.rarity>=3?'magic2':'magic'):t==='ranged'?'ranged':(item.rarity>=3?'melee2':'melee');
    return `iicon wpn ${key} ${r}`;
  }
  if(item.slot==='ring'){
    const n=(item.name||'').toLowerCase();
    let key='ring';   // dedicated trinkets sheet (ring / amulet / charm)
    if(n.includes('amulet')||n.includes('pendant')||n.includes('orb')||n.includes('locket')) key='amulet';
    else if(n.includes('cloak')||n.includes('charm')||n.includes('idol')||n.includes('talisman')||n.includes('sigil')) key='charm';
    return `iicon trk t-${key} ${r}`;
  }
  if(item.slot==='head'||item.slot==='chest'||item.slot==='legs'||item.slot==='boots'){
    // Row is chosen by SLOT (head/chest/boots/legs each get their own row in
    // armr.png); the material keyword picks the column within that row so an
    // iron helm and a cloth hood look different but both still read as helmets.
    // Match on the BASE name only — using the full prefixed name made things
    // like "Bulwark Leather Vest" read as heavy iron because the BULWARK
    // PASSIVE prefix triggered the heavy regex. The leather vest is leather.
    const n=(item.baseName||item.name||'').toLowerCase();
    let mat='light';
    if(/robe|cloth|wizard|hood|silk|veil/.test(n)) mat='robe';
    else if(/plate|chain|iron|breast|steel|greave|sabaton|plated|brigandine/.test(n)) mat='heavy';
    return `iicon arm a-${item.slot}-${mat} ${r}`;
  }
  return null;
}
function itemIconHtml(item,lg){
  const c=iconClassesFor(item); if(!c) return '';
  return `<span class="${c}${lg?' lg':''}"></span>`;
}

function bossCryFor(key){
  // Falls through to BOSS_CRY[key] for any boss not in BOSS_CRY_PROGRESSION (e.g. paledevourer,
  // whose silence is intentional). Returns one of 7 progression entries based on cumulative
  // milestones in records. Stage tiers are CUMULATIVE — once the player has hit a milestone
  // (Devour revealed, Devourer killed, Pale slain), every boss they fight starts at that stage
  // or higher. Stage 6 is an alternate post-Pale variant that rolls ~35% of meetings.
  const prog=BOSS_CRY_PROGRESSION[key]; if(!prog||!prog.length) return BOSS_CRY[key]||'';
  let r={}; try{ r=loadRecords(); }catch(e){}
  const kills=(r.bossKills&&r.bossKills[key])||0;
  const deaths=(r.bossDeaths&&r.bossDeaths[key])||0;
  const wins=r.wins||0;
  const devourRevealed=!!r.devourRevealed;
  const devourerKills=(r.bossKills&&r.bossKills.devourer)||0;
  const paleKills=(r.bossKills&&r.bossKills.paledevourer)||0;
  let stage=0;
  if(kills>=1||deaths>=1) stage=1;
  if(wins>=1) stage=Math.max(stage,2);
  if(devourRevealed) stage=Math.max(stage,3);
  if(devourerKills>=1) stage=Math.max(stage,4);
  if(paleKills>=1){
    stage=Math.max(stage,5);
    if(prog.length>=7 && chance(35)) stage=6;
  }
  return prog[Math.min(stage, prog.length-1)] || prog[0] || '';
}

/* COUNTER-AFFIXES — partial answers to your build. The deeper you commit to one
   axis, the more often the crypt grows something that resists it (never 100%). */
const COUNTERS={
  stoic:      {prefix:'Stoic ',      short:'TOUGH',       label:'shrugs off raw force (you deal ~40% less)', apply:e=>{e.resist=0.6;}},
  coldblooded:{prefix:'Coldblooded ',short:'CRIT-WARD',   label:'crits glance off it (crit bonus halved)',   apply:e=>{e.noCrit=1;}},
  relentless: {prefix:'Relentless ', short:'UNERRING',    label:'its blows are hard to evade (-22% dodge vs it)', apply:e=>{e.pierceDodge=22;}},
  bloodless:  {prefix:'Bloodless ',  short:'BLOODLESS',   label:'no blood to drain (your lifesteal fails)',  apply:e=>{e.bloodless=1;}},
  manasever:  {prefix:'Mana-Sever ', short:'MANA-EATER',  label:'devours your mana and pierces the Mana Shield', apply:e=>{e.manaburn=1;}},
  warded:     {prefix:'Warded ',     short:'STATUS-WARD', label:'resists burn & poison (DoT halved)',         apply:e=>{e.statusWard=1;}},
};
function pickCounter(p){ if(!p)return {key:null,score:0};
  const s={ stoic:p.affTier.w*3.5+(p.flags.glassCannon?3:0)+(p.flags.berserker?2:0)+Math.max(0,(p.atk-12)/2),
    coldblooded:Math.max(0,(effCrit(p)-25)/3),
    relentless:Math.max(0,(effDodge(p)-25)/3),
    bloodless:Math.max(0,(p.lifesteal-15)/3),
    manasever:(p.cls==='mage'?4:0)+(p.flags.gearManaShield?3:0)+Math.max(0,(p.maxMana-100)/40),
    warded:(p.flags.toxic?3:0)+(p.flags.frostbrand?2:0)+(p.flags.sunder?2:0)+((p.weapon&&p.weapon.proc)?3:0)+(p.affTier.g>=2?2:0) };
  // Track best AND second-best in a single pass so callers can ask for the runner-up axis when they
  // want pressure without a perfect shutdown (see A3 elite-counter handling below).
  let best=null,bv=0,second=null,sv=0;
  for(const k in s){ if(s[k]>bv){ second=best; sv=bv; bv=s[k]; best=k; } else if(s[k]>sv){ sv=s[k]; second=k; } }
  return {key:best,score:bv,key2:second,score2:sv}; }
function maybeCounter(e,bossier){ let c=pickCounter(G.player); if(!c.key)return;
  let ch=clamp((c.score-3)*(bossier?4.5:3.5),0,bossier?38:25);
  // Ascension 3 (The Crypt Sharpens): elites ALWAYS carry a counter — but to the SECOND-strongest
  // axis of your build, not the strongest. Pressure still ratchets up (every elite is a partial
  // wall) without the double-punish of "100% chance x perfect-fit" that flattened A3+ win-rates.
  if(G.mods&&G.mods.eliteCounter && e.elite){
    if(c.key2){ c={key:c.key2,score:c.score2}; }
    ch=100;
  }
  if(!chance(ch))return;
  COUNTERS[c.key].apply(e); e.name=COUNTERS[c.key].prefix+e.name; e.counter=c.key; e.xp=(e.xp||6)+8; e.goldBonus=(e.goldBonus||0)+6; }

// Affinity tier thresholds — PER PATH, tuned against measured accumulation (1176-run sweeps).
// Veil points flow ~1.7x faster than Wrath/Guile (armor carries v; 4 armor slots vs 1 weapon
// slot), so a flat threshold was simultaneously too low for Veil and unreachable for Wrath/Guile
// (empirical: ALL organic T4s were Veil). Veil pays more per tier; Wrath/Guile pay what their
// economy supplies. Measured outcomes at these values: exactly-one-T4 19% of runs (the committed
// build), two+ T4 0.9%, all-three-T3+ 10.3% (was 100%-ish under the old 3/6/9 flat curve).

function npcBuildTail(p, who){
  if(!p) return '';
  const tiers=(p.affTier&&((p.affTier.w|0)+(p.affTier.g|0)+(p.affTier.v|0)))||0;
  const dom=dominantAff(p);
  const sets=(p.sets&&p.sets.length)||0;
  const dualOwned=(p.relics||[]).filter(rn=>(RELICS.find(r=>r.name===rn)||{}).dual).length;
  // Each NPC gets its own voice for these tails.
  if(who==='lantern'){
    if(dualOwned) return ' "There is a green light on your belt that I did not light. Someone else did. I do not know them."';
    if(tiers>=4) return ' "You are walking deeper into yourself this time. The lanterns recognise that posture."';
    if(dom==='v') return ' He looks at the weight of you and nods. "Quiet champions last longer. The crypt is louder than them."';
    if(dom==='w') return ' "The fast ones burn out first. You burn quickly." It is not a compliment.';
    if(dom==='g') return ' "The clever ones come back the most. I am not sure that is a kindness."';
    return '';
  }
  if(who==='cardinal'){
    if(dualOwned>=2) return ' His unface registers your build. "Two opposed paths in one body. Which one are you wearing today?"';
    if(sets>=1) return ' "You have armoured a story onto yourself. We will see if the crypt believes it."';
    if(tiers>=5) return ' "You have committed. The gods that were going to notice already have."';
    return '';
  }
  if(who==='wsmith'){
    if(sets>=2) return ' He weeps over the bellows when he sees your gear. "Two of those came out of HIS forge. He was a kinder smith than I am."';
    if(dom==='w') return ' "You bring the heat with you." A long pause. "Do not ask me to forge it cooler."';
    if(dom==='v') return ' "Heavy gear suits heavy souls. Stand still — let me see the seams."';
    if(p.weapon && p.weapon.trait) return ` "Your blade carries a trait the old smiths called <i>${p.weapon.trait}</i>. We do not forge those anymore. We are not allowed to."`;
    return '';
  }
  if(who==='cartog'){
    const r=loadRecords();
    if((r.deepest||0)>=20) return ' "Most maps end at chamber twenty. I have a partial of yours."';
    if(dom==='g') return ' She watches the way you stand. "You walk like someone who would rather dodge a fight than win it. Useful, down here."';
    if(tiers>=3) return ' "You know what you ARE this time. Half of you do not." She makes a small mark on the parchment.';
    return '';
  }
  if(who==='scholar'){
    const path=(p.memory&&p.memory.path)||[];
    if(path.length>=3) return ` "You have eaten three families. The ink remembers you as a <i>${path.slice(-1)[0]}-eater</i>."`;
    if(dualOwned) return ' "That artifact in your pack — its description has two sentences. Only one is the truth. I have not figured out which."';
    if(dom==='v') return ' "Veil-bound. Good. The cold does not finish you as fast. We can talk."';
    return '';
  }
  return '';
}

       if(n.met<=2) return '"This." He gestures at the wall. "It is not where it was yesterday." He goes back to his sketching, unbothered.';
       return '"This." He gestures at the wall. A pause. "And you. I started mapping you about three of your visits ago. You take the same wrong turn at the same corner, every time. I find it comforting."';}},
     {label:'"Have you mapped the bottom?"',desc:'Press',run:p=>{discoverLore('l19'); const r=loadRecords(); npcSet('cartog',{stage:Math.max(1,npcState('cartog').stage),askedBottom:1});
       if(paleRumor()) return '<span class="shout">"Mapped it?"</span> He turns to the last page. It is blank. He taps it. <span class="shout-red">"My pen will not go here. Not will not &mdash; cannot. The ink dries before it lands. The paper already knows to leave it out."</span> He turns the page back, quickly.';
       if(r.deepest<RUN_LENGTH) return '<span class="shout">"Once."</span> He does not look up. <span class="shout-red">"Never again."</span> He does not say why.';
       return `<span class="shout">"Once."</span> Now he looks up. "You have been further than me, you know. Past the throne." <span class="shout-red">"There is a thing in the cold below the throne. It does not have a name. Even the dragon would not look at it."</span>`;}},
     {label:'Buy a partial map (-40 gold)',desc:'Next 2 corridors hit louder loot',run:p=>{if(p.gold<40)return 'He shrugs without looking up.';p.gold-=40;G._luckBoom=2; const n=npcState('cartog');
       if((n.bought||0)===0){ npcSet('cartog',{bought:1}); return 'The lines on the paper he gives you twitch and resettle as you watch. The next two chambers feel... helpful.'; }
       npcSet('cartog',{bought:(n.bought||0)+1}); return `"You buy these every time." He hands you a fresh sheet. "I do not know if they are different. They feel different to draw."`;}},
   ]},
  // === FURNACE EVENTS — stoke the Heat meter through chamber events too ===
  {id:'valve',title:'THE VALVE BURSTS',zone:1,sprite:{src:'assets/events/valve.png',tint:'tint-natural'},art:"  ###    \n  )()(   \n  )()(   \n  ###    ",
   text:'A copper valve embedded in the wall coughs once, then explodes. A wave of dry heat washes over the chamber.',
   options:[
     {label:'Push through fast',desc:'+10 Heat, get out clean',run:p=>{addHeat(10);return 'You sprint past the wound in the wall. Your skin tightens. The Furnace stirs (+10 Heat).';}},
     {label:'Try to seal it',desc:'-12 HP, +4 Heat, find scrap',run:p=>{const c=12;selfHurt(p,c,'hazard');addHeat(4);p.gold+=18;return `You jam your cloak in the breach. It works long enough to gather ${18} loose scrap — but you are scorched (-${c} HP, +4 Heat).`;}},
     {label:'Back out',desc:'No reward, no cost',run:p=>'You back away. The valve keeps coughing behind you. Whatever was in there stays there.'},
   ]},
  {id:'forge_run',title:'THE FORGE OPERATES',zone:1,sprite:{src:'assets/events/forge_run.png',tint:'tint-amber'},art:"   /-\\   \n  |fffi   \n  |[##]| \n   |  |  ",
   text:'You find a working forge — bellows wheezing, sparks falling, no smith in sight. The fire is doing the work alone.',
   options:[
     {label:'Temper a piece of armor',desc:'+3 DEF, +5 Heat',run:p=>{p.def+=3;addHeat(5);return 'You hold a plate into the flame until your palms blister. Your armor drinks the fire (+3 DEF, +5 Heat).';}},
     {label:'Pour your essence in',desc:'-15 essence, +5 ATK, +6 Heat',run:p=>{if(p.essence<15)return 'The forge waits. Your essence does not.';p.essence-=15;p.atk+=5;addHeat(6);return `The forge accepts ${15} essence and turns it back as fire (+5 ATK, +6 Heat).`;}},
     {label:'Pour water on it',desc:'-15 Heat, lose 1 potion',run:p=>{if(!p.potions)return 'You have nothing to pour.';p.potions--;coolHeat(15);return 'The forge goes dark with a long animal sound. Your skin loosens (-15 Heat, -1 potion).';}},
   ]},
  {id:'magma',title:'THE MAGMA CHANNEL',zone:1,sprite:{src:'assets/events/magma.png',tint:'tint-red'},art:"  ~~~~   \n ~~~~~   \n  ~~~    \n   ~     ",
   text:'A trench in the floor is full of slow-moving fire. Something glints at the bottom — gold, or a relic, or a face.',
   options:[
     {label:'Reach in for it',desc:'-22 HP, +12 Heat, big loot',run:p=>{const c=22;selfHurt(p,c,'hazard');addHeat(12);const g=40+rnd(40);p.gold+=g;return `You plunge your arm in. You take it. Whatever it was, it weighs less than you expected (-${c} HP, +12 Heat, +${g} gold).`;}},
     {label:'Pry it out with a blade',desc:'-8 HP, +6 Heat, small loot',run:p=>{const c=8;selfHurt(p,c,'hazard');addHeat(6);const g=18+rnd(20);p.gold+=g;return `You hook the glint out. Your arm still smokes (-${c} HP, +6 Heat, +${g} gold).`;}},
     {label:'Leave it',desc:'Nothing happens',run:p=>'You step around the channel. The Furnace keeps its trinkets.'},
   ]},
  {id:'priest',title:'THE DYING PRIEST',zone:0,sprite:{src:'assets/monsters/cultist.png',tint:'tint-grey'},art:"  .--.\n ( || )\n  )/\\(\n  |  |",
   text:'A robed man slumps against a half-broken shrine. He looks up and his eyes widen — with relief.',
   options:[
     {label:'"Father — are you hurt?"',desc:'Tend to him &middot; +1 potion &middot; he may teach you',run:p=>{p.potions++;let extra='';if(!p.memory && chance(60)){grantMemory(p,'tithe');extra=' He whispers a phrase you do not understand, but you will not forget it.';}return '"Another champion. Good. The last three never returned. Do not be the fourth." He presses a cold vial into your hand and is still. (+1 potion)'+extra;}},
     {label:'"What is down here?"',desc:'Press him &middot; he says little',run:p=>'"What is always down here." He shrugs as if you should know. "Just descend." He will say no more.'},
     {label:'Leave him to his god',desc:'Walk past &middot; small gold',run:p=>{const g=8+rnd(12);p.gold+=g;return `You leave him to his rattle. A small purse slips from his sleeve — ${g} gold.`;}},
   ]},
  {id:'oldmerc',title:'THE OLD MERCHANT',zone:0,sprite:{src:'assets/monsters/goblin.png',tint:'tint-gold'},art:"  .---.\n ( o-o )\n  )===( \n  |$$$|",
   text:'A bent old trader rummages through a chest, then peers up at you. He does not greet you. He just looks.',
   options:[
     {label:'"Have we met?"',desc:'Buy a curio — 14 gold',run:p=>{if(p.gold<14)return 'He glances at your empty purse and looks away.';p.gold-=14;p.maxHp+=8;heal(p,8);return '"You have the look. Same eyes as the others." He hands you a strange charm. (+8 max HP)';}},
     {label:'"Other champions came through?"',desc:'Listen',run:p=>'"All of them, son. Same face, different cloak." He laughs at his own joke. You do not.'},
     {label:'Walk away',desc:'No purchase',run:p=>'You leave. He does not ask your name. Nobody ever does, you realize.'},
   ]},
  {id:'burnedkt',title:'THE BURNED KNIGHT',zone:1,sprite:{src:'assets/monsters/golem.png',tint:'tint-red'},art:"  ,---,\n  [o_o]\n  )/|\\(\n  /| |\\",
   text:'A knight in fire-blackened plate sits against a column. He raises his head — and goes very still.',
   options:[
     {label:'"Who are you?"',desc:'Press him',run:p=>{return '<span class="shout-red">"You wear his face."</span> He says it very quietly. <span class="shout-red">"The last one. That is all."</span> He refuses to look at you again.';}},
     {label:'"I have never been here before."',desc:'Insist &middot; he may teach you',run:p=>{p.atk+=2;let extra='';if(!p.memory && chance(55)){grantMemory(p,'ember');extra=' He sketches a flame-sigil in the ash; you feel it lodge in your hands.';}return '"...of course you have not." His voice is gentle. He hands you the hilt of a snapped sword. (+2 ATK)'+extra;}},
     {label:'Leave him to his armor',desc:'Walk past',run:p=>'You step past. Behind you, you hear him laugh once, quietly, in disbelief.'},
   ]},
  {id:'cultist',title:'THE DRAGON CULTIST',zone:1,sprite:{src:'assets/monsters/cultist.png',tint:'tint-amber'},art:"  ,___,\n  ( ^ )\n  /\\=/\\\n  d   b",
   text:'A figure in scaled robes kneels at the lip of the Furnace, palms up. They do not turn to look at you.',
   options:[
     {label:'"What are you praying for?"',desc:'Listen',run:p=>'"That you will turn back." The cultist does not raise their head. "The Warden lets you pass eventually &mdash; that is the cruelty." A pause. "The first door is not the last door."'},
     {label:'"Not AGAIN? What does that mean?"',desc:'Demand an answer',run:p=>'They go silent. The silence is the answer.'},
     {label:'Kick them aside',desc:'+8 gold, -6 HP',run:p=>{const c=6;selfHurt(p,c,'hazard');p.gold+=8;return `You shove past. The cultist topples in. Their purse — ${8} gold — lies abandoned (-${c} HP, scuffle).`;}},
   ]},
  {id:'frozenchild',title:'THE FROZEN CHILD',zone:2,sprite:{src:'assets/monsters/child.png',tint:'tint-blue'},art:"   o\n  /|\\\n   |\n  / \\",
   text:'A child stands ankle-deep in frost, staring at you with patient, unsurprised eyes. They do not seem cold.',
   options:[
     {label:'"You\'re back."',desc:'Wait — what?',run:p=>{addMiasma(4);return '<span class="shout-purple">"You always come back. We have done this so many times now."</span> They smile, sadly. The child is gone before you can speak again. (the cold thickens)';}},
     {label:'"I don\'t know you."',desc:'Insist &middot; they may teach you',run:p=>{heal(p,Math.round(p.maxHp*0.12));let extra='';if(!p.memory && chance(55)){grantMemory(p,'hollow');extra=' Before they vanish, they show you how to step outside a moment.';}return '"...oh." The child looks down. "I am sorry. I thought you were ready." They press warm hands to your wound and walk into the wall. (heal)'+extra;}},
     {label:'Walk through them',desc:'They were never there',run:p=>{addMiasma(8);return 'There was no child. Of course there was no child. The Miasma is doing its work. (the cold thickens)';}},
   ]},
  {id:'scholar',title:'THE FROZEN SCHOLAR',zone:2,npc:'scholar',sprite:{src:'assets/monsters/darkacolyte.png',tint:'tint-purple'},art:"  [_=_]\n  ( o )\n  )===( \n  /| |\\",
   text:p=>{ const r=loadRecords(); const n=npcState('scholar'); const tail=npcBuildTail(p,'scholar');
     if(n.met<=1) return 'A scholar sits at a desk of ice, ledgers spread before her. She finishes a sentence before she looks up.'+tail;
     return `The scholar is on a new ledger. There are ${Math.max(0,(r.runs||1)-1)} closed ones stacked beside her, each one bound in pale leather. She does not look up. She is already writing your name.`+tail;
   },
   options:[
     {label:'"What are you writing?"',desc:'Read the page',run:p=>{p.maxMana+=8;p.mana=clamp(p.mana+8,0,p.maxMana);addMiasma(3); npcSet('scholar',{stage:Math.max(1,npcState('scholar').stage),read:1});
       if(paleRumor()) return '"A record of every champion who came this far." She runs a finger down a column. <span class="shout-purple">"I keep a column for how each of you ends. The cold. The King. Your own greed."</span> A pause. <span class="shout-purple">"For a few, the column is blank. Not unknown &mdash; blank. As though no death was ever owed. As though there had been no one to die."</span> (+8 max mana, the cold thickens)';
       const r=loadRecords(); const showHand=(G.miasma>=18 || (r.runs||0)>=2);
       const punch = showHand
         ? `She turns the ledger. Your name is there ${(r.runs||0)>=2?`<b>${r.runs} times</b>`:'<b>once</b>'}. <b>In your handwriting.</b> The most recent entry is dated today.`
         : 'She turns the ledger. There are a great many names.';
       return `"A record of every champion who came this far." ${punch} (+8 max mana, the cold thickens)`;}},
     {label:'"Have you remembered yet?"',desc:'She asked you',run:p=>'<span class="shout-purple">"...then there is still time."</span> She does not look sad. She looks tired. She closes the ledger and is gone.'},
     {label:'Leave her',desc:'No questions',run:p=>'You walk on. The desk and the scholar are not behind you when you glance back.'},
   ]},
  {id:'elderecho',title:'AN ELDER ECHO',zone:3,sprite:{src:'assets/monsters/ghost.png',tint:'tint-purple'},art:"  .---.\n ( ??? )\n  )___(\n  /| |\\",
   text:'An old, old echo waits at a crossroads in the dark. It is not surprised to see you. It is counting.',
   options:[
     {label:'"How many times has it been?"',desc:'Ask',run:p=>{addMiasma(6);return '"...I lost the number around three hundred. After that I only counted in zones." It tilts its head. "We have been doing this for a while, you and I." (the cold thickens)';}},
     {label:'"I am the first."',desc:'Insist',run:p=>{return '"That is what every one of us says." It does not argue further. It just waits for you to leave.';}},
     {label:'Cut it down',desc:'Lay the echo to rest &middot; +essence',run:p=>{p.essence+=12;return `You cut the echo down. It does not resist. "Good," it says, very quietly. "Good." (+12 ${ESS})`;}},
   ]},
  {id:'lostchamp',title:'A LOST CHAMPION',zone:3,sprite:{src:'assets/monsters/ghost.png',tint:'tint-shadow'},art:"  .---,\n  ( ?? )\n  /|##|\\\n   |  |\n  _|  |_",
   text:'A champion stands at the lip of the Deep, looking down. They do not turn when you arrive.',
   options:[
     {label:'"Who were you?"',desc:'Ask',run:p=>'"We all thought we were heroes." They say it softly, without bitterness. "Even now. Even here." They will not say more.'},
     {label:'"What is at the bottom?"',desc:'Press',run:p=>{discoverLore('l15');return '"...the rest of you." They glance at you for the first time. "Go on. We have been waiting."';}},
     {label:'Step away from the edge',desc:'Take their relic if you can',run:p=>{const r=grantRandomRelic(p);return r?`You pull them back from the lip. They press a relic into your hands and sit. (relic: ${r})`:'You pull them back. They thank you with a relic you already carry — and refuse to take it back.';}},
   ]},
  // === DEVOUR-GATED — only surface once you have actually started eating things ===
  {id:'watcher',title:'THE WATCHFUL PRISONER',zone:2,npc:'watcher',available:p=>p.memory && p.memory.path && p.memory.path.length>=2,
   sprite:{src:'assets/monsters/zombie.png',tint:'tint-purple'},art:"  ,---,\n  |[ ]|\n  ( - )\n  )===( \n  /| |\\",
   text:p=>{ const n=npcState('watcher');
     if(n.met<=1) return 'A man sits chained to a pillar of black iron. The chains are old. So is he. He watches you walk in, and his face goes very still — not afraid, exactly. Recognising something.';
     return 'The chained man is still there. Of course he is. He watches you come in and something that is almost a smile crosses him. "Back," he says. "More of him in you than last time. I can count it now, nearly."';
   },
   options:[
     {label:'"You know what I have been doing."',desc:'Acknowledge',run:p=>{discoverLore('l19');const fams=(p.memory.path||[]).slice(-2).join(', ');return `<span class="shout-purple">"I can taste it on you."</span> He does not flinch. <span class="shout-purple">"That is how He started. Small things. Then the ${fams}. Then everything else."</span> A long pause. "You should stop. You will not stop."`;}},
     {label:'"Who is HE?"',desc:'Press',run:p=>{discoverLore('l18');
       // Second meeting onwards: the Pale reveal is guaranteed — this is the single line that names
       // what the Pale actually does, and the Watcher is the one NPC who would know.
       const n=npcState('watcher');
       if(n.met>=2 || paleRumor()){ noteRumor('pale'); return '"The one this place was built around." He grips the chain until it creaks. <span class="shout-red">"It does not &mdash; listen. It does not EAT you. Eating leaves something. A bone. A name said less and less."</span> His voice splinters. <span class="shout-red">"It un-happens you. I had a brother. I think. I cannot find the place where he was."</span>'; }
       return '"The one this place was built around." He nods toward the floor &mdash; downward. "We took him apart. We hid the pieces in the only place nothing leaves." He looks at you again. <span class="shout-red">"You have been finding them."</span>';}},
     {label:'"Break your chains?"',desc:'Free him &middot; +relic, +6 Miasma',run:p=>{const r=grantRandomRelic(p);addMiasma(6);return (r?`You snap the irons. He does not stand. He presses a small black relic into your hand &mdash; <b>${r}</b> &mdash; and closes his eyes. "Thank you. I have been here a long time."`:'You snap the irons. He does not stand. He presses something into your hand that you already carry, and closes his eyes.')+' (the cold thickens)';}},
     {label:'Walk past in silence',desc:'No reward, no cost',run:p=>'He watches you the whole way across the room. He does not call after you. He does not need to.'},
   ]},
  // === REACTIVE — the crypt has a figure for every path the player commits to. Surfaces only when
  // the player has actually picked a side (T1+ in a path) and shows them the road they DIDN'T take.
  // The mechanical reward leans into the OTHER lesson — small but real, so refusing the build is a
  // valid trade rather than a tax. Gated to once per run via id and zone, so the mirror does not
  // become a trope.
  {id:'opposite', title:'THE OPPOSITE NUMBER', zone:2,
   available:p=> p.affTier.w>=1 || p.affTier.g>=1 || p.affTier.v>=1,
   sprite:{src:'assets/monsters/cultist.png',tint:'tint-grey'}, art:"  ,---,\n  ( o )\n  )===( \n  /| |\\",
   text:p=>{ const dom=dominantAff(p);
     if(dom==='w') return 'A figure sits cross-legged in the centre of the chamber, eyes closed, hands open and empty. They speak without looking up. <span class="shout">"You taught yourself to break things. I taught myself to mend them. You are louder. I lasted longer."</span>';
     if(dom==='g') return 'A heavy figure stands in the middle of the chamber, armoured to the eyes, one straight blade pointed at the floor. <span class="shout">"Tricks. Feints. Angles. So much work, all of it, to avoid the thing the rest of us learned to take."</span> A long breath through the helm. <span class="shout">"I walk in straight lines now. It is simpler."</span>';
     if(dom==='v') return 'Someone has stripped to nothing in the cold. They are not shivering. <span class="shout">"You wear walls. You read the room before you enter it. I learned the opposite — I walk in first and worry about it after."</span> They smile. <span class="shout">"We are afraid of the same thing. We only picked different doors."</span>';
     return 'Someone is sitting against the wall. They look up when you arrive. <span class="shout">"I never picked a path. I just kept walking. It got me here."</span> A pause. <span class="shout">"I am not sure what it got you."</span>';
   },
   options:[
     {label:'Walk past in silence', desc:'+6 HP &middot; nothing changes',
       run:p=>{ heal(p,6); return 'You step around them without slowing. They do not call after you. The cold gets a little less close. (+6 HP)'; }},
     {label:'Take what they offer', desc:'Learn the OTHER lesson',
       run:p=>{ const dom=dominantAff(p);
         if(dom==='w'){ p.def+=2; addFlag(p,'combatRegen'); return 'They press their palm to your chest. Something settles where there was only weight. (+2 DEF; wounds close while the fight is still going on.)'; }
         if(dom==='g'){ p.atk+=2; return 'They press the hilt of their blade into your hand and curl your fingers around it. <span class="shout">"Hit the centre. Less to remember."</span> (+2 ATK.)'; }
         if(dom==='v'){ p.dodge+=8; p.crit+=4; return 'They smile, bare and cold. <span class="shout">"Stop tasting the air. Just step in."</span> (+8 DODGE, +4 CRIT.)'; }
         p.maxHp+=8; heal(p,8); return 'They simply tell you to keep walking. Something tightens in your chest the rest of the way down. (+8 MAX HP.)';
       }},
     {label:'Ask why', desc:'A line you can carry',
       run:p=>{ discoverLore('l18'); const dom=dominantAff(p);
         if(dom==='w') return '<span class="shout-red">"Because there is one thing down here that does not bleed."</span> They open their eyes. <span class="shout-red">"Hurting it is not how it ends."</span>';
         if(dom==='g') return '<span class="shout-red">"Because there is one thing down here you cannot read."</span> They tap the blade once. <span class="shout-red">"It has no intention. There is no feint that helps."</span>';
         if(dom==='v') return '<span class="shout-red">"Because there is one thing down here that does not arrive."</span> They smile. <span class="shout-red">"Guarding against it is funny. It is already in the room."</span>';
         return '<span class="shout-red">"Because every door I did not pick is still here."</span> They look at you, then away. <span class="shout-red">"I just had to come back to see them."</span>';
       }},
   ]},
  // ===== ORIGINAL EVENTS =====
  {id:'knight',title:'THE WOUNDED KNIGHT',sprite:{src:'assets/monsters/golem.png',tint:'tint-grey'},art:"  ,---,\n  (x_x)\n  /|cross|\\\n   |   |",
   text:'A dying knight slumps against the wall. "Please... mend me, and take my blade."',

     {label:'Heal him (-12 HP)',desc:'He gives you his weapon',run:p=>{selfHurt(p,12,'hazard');const w=makeItem('weapon',p.cls,G.depth+2);equipItem(p,w);return `You bind his wounds. He presses a ${w.name} (Lv${w.ilvl}) into your hands and fades away.`;}},
     {label:'Rob him',desc:'Take his gold, leave him',run:p=>{const g=25+rnd(30);p.gold+=g;return `You take ${g} gold from his pack. His eyes follow you into the dark.`;}},

  {id:'imp',title:'THE GAMBLING IMP',sprite:{src:'assets/monsters/imp.png',tint:'tint-amber'},art:"  ^..^\n (?  ?)\n  )$$( ",

     {label:'Bet everything',desc:'50/50: double all gold or lose it',run:p=>{if(p.gold<=0)return 'You have nothing to wager.';if(chance(48)){const g=p.gold;p.gold*=2;return `Fortune smiles! Your ${g} becomes ${p.gold} gold!`;}p.gold=0;return 'Disaster — you lose every coin to the cackling imp.';}},
     {label:'Refuse',desc:'Keep your gold',run:p=>'You decline. The imp sulks and disappears.'},

  {id:'mirror2',title:'THE MIRROR CHAMBER',sprite:{mirrorPlayer:true,tint:'tint-purple'},art:"  +----+\n  | () |\n  |/||\\|\n  +----+",
   text:'Another champion stands across the chamber. Your face. Your scars. Your blade — held a heartbeat too late.',
   options:[
     {label:'Fuse with it',desc:'-25% max HP &middot; +6 ATK, +8% crit',run:p=>{const c=Math.round(p.maxHp*0.25);p.maxHp=Math.max(20,p.maxHp-c);p.hp=clamp(p.hp,1,p.maxHp);p.atk+=6;p.crit+=8;return `Skin to skin, soul to soul. The mirror is gone — -${c} max HP, +6 ATK, +8% crit.`;}},

     {label:'Shatter it',desc:'+14 essence, but the cold thickens',run:p=>{p.essence+=14;addMiasma(8);return `Glass rains down — +14 ${ESS}. The air sours where your reflection stood.`;}},
   ]},
  {id:'falseexit',title:'THE FALSE EXIT',sprite:{src:'assets/events/falseexit.png',tint:'tint-natural'},art:"  /========\\\n  ||  ()  ||\n  || EXIT ||\n  || ____ ||\n  \\========/",
   text:'A door of warm gold light bars the corridor. It promises a way out — every coin you have, every kill you have made, safe and remembered.',
   options:[
     {label:'Step through &mdash; end the run now',desc:'Claim victory at current depth. The crypt forgets the rest.',run:p=>{G._falseExit=1;claimVictory();return false;}},
     {label:'Burn the door',desc:'Refuse &middot; +60% loot for the next 3 rooms',run:p=>{G._luckBoom=3;return 'You smash the gilded threshold. The light flares and dies — your luck swells for the next three rooms.';}},
     {label:'Touch the threshold',desc:'Risk Miasma; relic if it favors you',run:p=>{if(chance(55)){const r=grantRandomRelic(p);return r?`The gold flares — a relic forms in your hand: ${r}.`:'The gold flares — but you already carry every relic it knows.';}const c=12;addMiasma(12);selfHurt(p,c,'miasma');return `The threshold drinks from you (-${c} HP, the cold thickens).`;}},

  {id:'mirror',title:'THE CURSED MIRROR',sprite:{mirrorPlayer:true,tint:'tint-blue'},art:"  +----+\n  | ?? |\n  | () |\n  +----+",
   text:'A tall mirror shows a warped reflection that moves a heartbeat too late.',

     {label:'Shatter it',desc:'Gold among the shards',run:p=>{const g=20+rnd(25);p.gold+=g;if(chance(30)){p.dodge+=8;return `Glass rains down — ${g} gold, and shards grant +8% dodge.`;}return `It shatters into ${g} gold worth of glittering shards.`;}},

  {id:'altar',title:'THE BLOOD ALTAR',sprite:{src:'assets/monsters/demonlord.png',tint:'tint-red'},art:"   _____\n  |/+\\|\n  | V |\n  |___|",

   options:[

     {label:'Offer gold (40)',desc:'Permanent +4 ATK',run:p=>{if(p.gold<40)return 'Not enough gold to satisfy the altar.';p.gold-=40;p.atk+=4;return 'Coins sizzle away. Strength floods your arms — +4 ATK.';}},
     {label:'Pray quietly',desc:'Small heal, leave',run:p=>{heal(p,Math.round(p.maxHp*0.2));return 'You pray. A faint warmth mends you a little.';}},
   ]},
  {id:'campfire',title:'A DYING CAMPFIRE',sprite:{src:'assets/events/campfire.png',tint:'tint-amber'},art:"   (~)\n  ( ~ )\n  /\\_/\\\n  |fire|",
   text:'Embers glow in an abandoned camp. You could rest, or pick through the gear.',
   options:[
     {label:'Rest by the fire',desc:'Heal 35% HP & mana',run:p=>{heal(p,Math.round(p.maxHp*0.35));p.mana=clamp(p.mana+Math.round(p.maxMana*0.35),0,p.maxMana);return 'You warm yourself and recover. (HP & mana restored)';}},
     {label:'Scavenge',desc:'Gold, maybe a potion',run:p=>{const g=12+rnd(18);p.gold+=g;let extra='';if(chance(45)){p.potions++;extra=' and a health potion';}return `You find ${g} gold${extra} among the packs.`;}},
     {label:'Douse it & move',desc:'Leave no trace',run:p=>'You scatter the embers and slip onward unseen.'},

  {id:'spring',title:'THE ENCHANTED SPRING',sprite:{src:'assets/events/spring.png',tint:'tint-natural'},art:"  .~~~.\n (~ + ~)\n  '~~~'",
   text:'Crystal water hums with magic. You could temper your weapon in it.',
   options:[
     {label:'Temper weapon',desc:'+5 weapon damage',run:p=>{p.weapon.dmg+=5;p.weapon.stats.dmg=(p.weapon.stats.dmg||0)+5;return `Your ${p.weapon.name} glows — its damage rises by 5!`;}},
     {label:'Drink deeply',desc:'Restore & +6 max mana',run:p=>{p.maxMana+=6;p.mana=p.maxMana;heal(p,Math.round(p.maxHp*0.25));return 'The waters refresh body and mind. (+6 max mana, restored)';}},
     {label:'Fill a flask',desc:'Gain a potion',run:p=>{p.potions++;return 'You bottle the glowing water as a potion.';}},

  {id:'library',title:'THE FORGOTTEN LIBRARY',sprite:{src:'assets/monsters/darkacolyte.png',tint:'tint-purple'},art:"  [|||||]\n  [|||||]\n  [|||||]",
   text:'Dust-choked shelves of forbidden tomes loom in the gloom.',
   options:[
     {label:'Study the tomes',desc:'+12 max mana, +4 regen',run:p=>{p.maxMana+=12;p.mana+=12;p.regen+=4;return 'Arcane knowledge seeps in — +12 max mana, +4 regen.';}},
     {label:'Search for treasure',desc:'Gold, risk a paper cut curse',run:p=>{const g=18+rnd(22);p.gold+=g;if(chance(35)){const c=8+rnd(8);selfHurt(p,c,'hazard');return `You find ${g} gold, but a warded page bites for ${c} damage.`;}return `Tucked in a tome: ${g} gold.`;}},

  {id:'goblin',title:'THE TREASURE GOBLIN',sprite:{src:'assets/monsters/goblin.png',tint:'tint-gold'},art:"  ,$$,\n (>o o<)\n  )$$$(\n  d   b",
   text:'A fat goblin lugging a bulging sack of gold spots you — and bolts!',

     {label:'Chase it down!',desc:'Fight for a big purse',run:p=>{const gob=freshEnemy({name:'Treasure Goblin',sprite:"  ,$$,\n (>o o<)\n  )$$$(\n  d   b",hp:scaleHpVal(55),maxHp:scaleHpVal(55),atk:Math.round(8*depthFactor()),def:2,xp:20,goldBonus:90+rnd(60),dodgy:true});
        G.room={type:'enemy',_enemies:[gob]};startBattle('You corner the treasure goblin!');return false;}},
     {label:'Let it go',desc:'Not worth the risk',run:p=>'You watch the jingling sack vanish around the corner. A shame.'},

  {id:'beggar',title:'THE HOODED BEGGAR',sprite:{src:'assets/monsters/cultist.png',tint:'tint-shadow'},art:"  .-.\n ( o )\n /| |\\\n  | |",
   text:'A frail beggar extends a trembling bowl. "Spare some coin, hero?"',
   options:[
     {label:'Give 25 gold',desc:'Kindness may be repaid',run:p=>{if(p.gold<25)return 'Your purse is too light to give.';p.gold-=25;const roll=rnd(3);if(roll===0){const r=grantRandomRelic(p);return r?`The beggar throws off the cloak — a spirit! It gifts you: ${r}.`:'The beggar smiles warmly and blesses your path.';}if(roll===1){p.maxHp+=16;heal(p,16);return 'A warm blessing settles on you — +16 max HP.';}return 'The beggar blesses you. You feel... luckier.';}},
     {label:'Give everything',desc:'A true sacrifice',run:p=>{if(p.gold<=0)return 'You have nothing to give.';const g=p.gold;p.gold=0;p.maxHp+=Math.min(40,Math.round(g/2));heal(p,99);return `You give all ${g} gold. The beggar weeps — and your vitality blooms (+max HP, full heal).`;}},
     {label:'Ignore',desc:'Move along',run:p=>'You step around the beggar without a word.'},
   ]},
  {id:'fork',title:'THE FORKING PATH',sprite:{src:'assets/events/fork.png',tint:'tint-natural'},art:"  /   \\\n |  Y  |\n  \\   /",
   text:'The passage splits. Scratched runes hint at what lies down each way.',
   options:[
     {label:'Left: "riches"',desc:'Likely gold',run:p=>{const g=30+rnd(35);p.gold+=g;return `The left path opens onto a coin-strewn alcove — ${g} gold!`;}},
     {label:'Right: "power"',desc:'A stat boost',run:p=>{const r=rnd(3);if(r===0){p.atk+=3;return 'A weapon rack — you take the best piece. +3 ATK.';}if(r===1){p.def+=3;return 'Discarded armor plates — +3 DEF.';}p.maxMana+=14;p.mana+=14;return 'A humming font of mana — +14 max mana.';}},
     {label:'Straight: "safety"',desc:'Heal & move on',run:p=>{heal(p,Math.round(p.maxHp*0.3));return 'The middle road is quiet. You rest and recover.';}},
   ]},
  {id:'shrine2',title:'THE TWIN STATUES',sprite:{src:'assets/events/shrine2.png',tint:'tint-natural'},art:" [o]  [o]\n  |    |\n /_\\  /_\\",
   text:'Two statues face each other — one of a warrior, one of a mage.',
   options:[
     {label:'Honor the Warrior',desc:'+3 ATK, +2 DEF',run:p=>{p.atk+=3;p.def+=2;return 'The warrior statue glows. +3 ATK, +2 DEF.';}},
     {label:'Honor the Mage',desc:'+16 max mana, +4 regen',run:p=>{p.maxMana+=16;p.mana+=16;p.regen+=4;return 'The mage statue glows. +16 max mana, +4 regen.';}},
     {label:'Topple both',desc:'Gold beneath them',run:p=>{const g=22+rnd(28);p.gold+=g;return `You shove the statues aside — ${g} gold hidden beneath.`;}},
   ]},
  {id:'trap',title:'THE TRAPPED CORRIDOR',sprite:{src:'assets/events/trap.png',tint:'tint-natural'},art:"  /|||||\\\n  X X X X\n  \\|||||/",
   text:'Blades and tripwires bristle across a narrow corridor.',
   options:[
     {label:'Disarm carefully',desc:'Dodge-based; reward if clean',run:p=>{const ok=chance(40+p.dodge);if(ok){const g=20+rnd(20);p.gold+=g;return `Nimble hands! You disarm it and loot ${g} gold from the mechanism.`;}const c=10+rnd(12);selfHurt(p,c,'hazard');return `A wire snaps — blades graze you for ${c} damage.`;}},
     {label:'Sprint through',desc:'Take a hit, save time',run:p=>{const c=6+rnd(8);selfHurt(p,c,'hazard');return `You barrel through, taking ${c} damage but losing nothing.`;}},
     {label:'Find another way',desc:'Safe, no reward',run:p=>'You backtrack and find a safer route around.'},
   ]},
  {id:'pit',title:'THE PIT OF COINS',sprite:{src:'assets/events/pit.png',tint:'tint-natural'},art:"  \\_____/\n  |$ $ $|\n  |$ $ $|",
   text:'A deep pit glitters with centuries of fallen coins.',
   options:[
     {label:'Dive in!',desc:'Lots of gold, some damage',run:p=>{const g=40+rnd(45);p.gold+=g;const c=8+rnd(10);selfHurt(p,c,'hazard');return `You scoop ${g} gold but bruise yourself badly (${c} damage).`;}},
     {label:'Climb down slowly',desc:'Less gold, no harm',run:p=>{const g=18+rnd(18);p.gold+=g;return `Careful does it — ${g} gold, no scratches.`;}},
     {label:'Leave it',desc:'Greed is a trap',run:p=>'You resist temptation and walk on.'},
   ]},
  {id:'witch',title:'THE WANDERING WITCH',sprite:{src:'assets/monsters/witch.png',tint:'tint-natural'},art:"   /^\\\n  ( o )\n  /|~|\\\n   | |",
   text:'A witch stirs a bubbling cauldron. "A brew for a price, dearie?"',
   options:[
     {label:'Buy a brew (35g)',desc:'Random powerful boon',run:p=>{if(p.gold<35)return 'The witch frowns at your thin purse and shoos you off.';p.gold-=35;const r=rnd(4);if(r===0){p.lifesteal+=15;return 'A crimson brew — +15% lifesteal!';}if(r===1){p.crit+=12;return 'A sparkling brew — +12% crit!';}if(r===2){p.dodge+=12;return 'A misty brew — +12% dodge!';}p.regen+=6;p.maxMana+=12;p.mana+=12;return 'A glowing brew — +12 max mana, +6 regen!';}},
     {label:'Trade your blood (-15 HP)',desc:'Free relic from her shelf',run:p=>{selfHurt(p,15,'hazard');const r=grantRandomRelic(p);return r?`She draws your blood and hands you: ${r}.`:'She draws your blood but her shelves are bare of new relics.';}},
     {label:'Decline politely',desc:'Move on',run:p=>'You thank the witch and continue down the hall.'},
   ]},
  {id:'soulwell',title:'THE SOUL WELL',sprite:{src:'assets/monsters/ghost.png',tint:'tint-blue'},art:"  .===.\n  |~~~|\n  |~~~|",
   text:'A well brimming with swirling, half-remembered souls. They whisper of power... and hunger.',
   options:[
     {label:'Draw essence',desc:'Gain Soul Essence',run:p=>{const e=18+rnd(24);p.essence+=e;return `You draw ${e} ${ESS} essence from the well.`;}},
     {label:'Plunge your arm in',desc:'More essence, but it bites',run:p=>{const e=42+rnd(34);p.essence+=e;const c=Math.round(p.maxHp*0.12);selfHurt(p,c,'hazard');return `Souls swarm your arm — +${e} ${ESS} essence, but they tear ${c} HP away.`;}},
     {label:'Leave it',desc:'Souls are not toys',run:p=>'You back away from the whispering dark.'},
   ]},
  {id:'oldforge',title:'AN ABANDONED FORGE',sprite:{src:'assets/events/oldforge.png',tint:'tint-natural'},art:"  ( ) ( )\n  )_____(\n  |[#=#]|\n  |_____|",
   text:'A cold forge, embers long dead — yet one last working still hums in the bellows.',
   options:[
     {label:'Reforge your weapon',desc:'+2 weapon levels, free',run:p=>{upgradeGear(p,'weapon');return `You stoke the bellows; your ${p.weapon.name} comes out keener than ever (Lv${p.weapon.ilvl}).`;}},
     {label:'Reinforce your armor',desc:'+2 levels to a worn armor piece',run:p=>{const worn=ARMOR_SLOTS.filter(s=>p.equip[s]);if(!worn.length)return 'You wear no armor to improve.';const s=pick(worn);upgradeGear(p,s);return `Your ${p.equip[s].name} is hammered thick and true (Lv${p.equip[s].ilvl}).`;}},
     {label:'Scavenge the scrap',desc:'Essence from old metal',run:p=>{const e=16+rnd(18);p.essence+=e;return `You strip the forge for ${e} ${ESS} essence.`;}},
   ]},
  {id:'prisoner',title:'THE STARVED PRISONER',sprite:{src:'assets/monsters/zombie.png',tint:'tint-shadow'},art:"  ,---,\n  (- -)\n  /|=|\\\n   | |",
   text:'A champion who came before you, chained and wasted to bone. "Free me... or take what little I have left."',
   options:[
     {label:'Break the chains',desc:'A grateful gift',run:p=>{const roll=rnd(3);if(roll===0){const r=grantRandomRelic(p);return r?`Freed, the champion presses a relic into your hand: ${r}.`:'Freed, the champion blesses your blade. (+3 ATK)'+(p.atk+=3,'');}if(roll===1){p.maxHp+=20;heal(p,20);return 'Freed, the champion shares their last vigor — +20 max HP.';}p.essence+=40;return 'As the chains fall, the champion dissolves into 40 '+ESS+' essence and a whispered thanks.';}},
     {label:'Take their gear',desc:'Loot the doomed',run:p=>{const w=makeItem(pick(SLOTS),p.cls,G.depth+1);equipItem(p,w);return `You pry loose their ${w.name} (Lv${w.ilvl}). Their eyes never leave you.`;}},
     {label:'End their suffering',desc:'Mercy, and a dark gift',run:p=>{p.essence+=26;const fam='Undead';p.slayer[fam]=(p.slayer[fam]||0)+2;return `You grant mercy. Their released soul steels you — +26 ${ESS} essence.`;}},
   ]},
  // ===== ADDITIONAL EVENTS — retention pool expansion =====
  // Zone 0 — Warm Crypt: low-stakes flavour, small numbers, the crypt feels still and observed.
  {id:'pews',title:'THE EMPTY PEWS',zone:0,sprite:{src:'assets/monsters/cultist.png',tint:'tint-grey'},art:"  /---\\\n  |   |\n  |===|\n  |   |",
   text:'A long room of stone pews faces an altar that has been smashed flat. Every pew is occupied by a folded cloak. No bodies. Just the cloaks.',
   options:[
     {label:'Search the cloaks',desc:'Pocket what was left behind',run:p=>{const g=10+rnd(14);p.gold+=g;return `Each cloak holds a few coins, carefully arranged. They were expecting to be back. (+${g} gold)`;}},
     {label:'Sit in one of the pews',desc:'Listen to the room',run:p=>{p.maxHp+=6;heal(p,6);return 'You sit. The pew is warm. Whoever was here last was here long enough to leave a mark in the wood. (+6 max HP)';}},
     {label:'Walk past',desc:'Disturb nothing',run:p=>'You walk the centre aisle without looking at the cloaks. The cloaks do not move. You are very sure they would have, if you had looked.'},
   ]},
  {id:'doorman',title:'THE DOORMAN',zone:0,sprite:{src:'assets/monsters/skeleton.png',tint:'tint-grey'},art:"  ,---,\n  ( - )\n  )===( \n   key \n  /| |\\",
   text:'A skeleton in a porter\'s coat stands beside a door that has no wall around it. He bows to you as you arrive. He has been bowing for a long time.',
   options:[
     {label:'"What is the door for?"',desc:'Ask',run:p=>'He gestures, palm up, to the empty space the door is set in. "It used to lead somewhere. I open it anyway. It is what I do." He bows again. He waits.'},
     {label:'Tip him (-10 gold)',desc:'Take what he offers',run:p=>{if(p.gold<10)return 'He bows to your empty hand. He does not stop bowing.';p.gold-=10;p.potions++;return 'The coin is gone before it touches him. He produces a small green vial from inside his coat and holds it out. He does not stand up from his bow until you take it. (+1 potion)';}},
     {label:'Walk past',desc:'Leave him to his post',run:p=>'You walk past the door. The doorman bows lower as you go. He stays that way long after you have stopped looking back.'},
   ]},
  {id:'rooks',title:'THE TWO ROOKS',zone:0,sprite:{src:'assets/monsters/bloodbat.png',tint:'tint-shadow'},art:"  ^   ^\n ( ) ( )\n  v   v",
   text:'Two black birds sit on a tomb watching you. Between them is a small flat stone with a single die on it.',
   options:[
     {label:'Roll the die',desc:'Small wager &middot; one way or the other',run:p=>{const r=rnd(6)+1;if(r<=2){const c=6+rnd(6);selfHurt(p,c,'hazard');return `A two. One of the birds opens its beak. The other does not. Something nips you in the dark (-${c} HP).`;}if(r<=4){const g=14+rnd(12);p.gold+=g;return `A four. Both birds tip their heads. A small coin pouch is where the die was. (+${g} gold)`;}p.crit+=4;return 'A six. Both birds bow. You feel a small sharpening behind your eyes that does not leave. (+4 CRIT)';}},
     {label:'Take the die',desc:'Keep the wager closed',run:p=>{p.gold+=4;return 'You pocket the die. The birds do not stop you. The die is warm. There is a small coin underneath where it was. (+4 gold)';}},
     {label:'Leave them to their game',desc:'Pass without rolling',run:p=>'You step around the tomb. As you pass, you hear the die clatter. You do not look back to see what they rolled it for.'},
   ]},
  {id:'wellboy',title:'THE BOY AT THE WELL',zone:0,sprite:{src:'assets/monsters/child.png',tint:'tint-grey'},art:"   o\n  /|\\\n  /=\\\n  |.|",
   text:'A boy sits on the lip of a dry well, kicking his heels. He raises a hand to you in the small, formal wave a child uses for a stranger.',
   options:[
     {label:'"Are you alone down here?"',desc:'Ask',run:p=>'"My da is fetching water." He looks down into the dry well. "He has been a while." He kicks his heels again. He does not seem worried. That is the part that stays with you.'},
     {label:'Drop a coin in (-5 gold)',desc:'Make a wish',run:p=>{if(p.gold<5)return 'He watches your empty fingers go over the lip. He nods, like he understands. "Next time, then."';p.gold-=5;heal(p,Math.round(p.maxHp*0.15));return 'You drop the coin. It does not make a sound landing. The boy smiles at you for the first time. Something in your chest loosens. (heal)';}},
     {label:'Lift him down and walk on',desc:'Leave the well alone',run:p=>'You go to lift him. He is not there to lift. He waves at you again, from where he is still sitting on the lip, and you walk on.'},
   ]},
  // Zone 1 — Furnace: heat-themed, fire as lock/warning, the dragon under everything.
  {id:'bellman',title:'THE BELL THAT WILL NOT RING',zone:1,sprite:{src:'assets/monsters/flameknight.png',tint:'tint-amber'},art:"   /-\\\n  |   |\n  | o |\n   \\-/\n    |",
   text:'A great brass bell hangs at the end of the corridor. A man in scorched armour is pulling on the rope. The bell does not move. He looks at you the way a tired man looks at help arriving late.',
   options:[
     {label:'Pull with him',desc:'Lend your weight',run:p=>{const c=8;selfHurt(p,c,'hazard');addHeat(4);p.atk+=2;return `You set your shoulder under the rope. Heat boils off the bell as you pull. It still does not ring &mdash; but something in your arms learns the weight (-${c} HP, +4 Heat, +2 ATK).`;}},
     {label:'"What were you ringing for?"',desc:'Ask',run:p=>{discoverLore('l3');return '"To warn them." He keeps pulling. "I do not remember which them. I have been at it long enough that it does not matter." A breath. <span class="shout-red">"The bell stopped working the day the fire took. I have not stopped pulling, in case it starts."</span>';}},
     {label:'Walk past',desc:'Leave him to the rope',run:p=>'You step around him. He does not look up. The rope creaks. The bell does not.'},
   ]},
  {id:'salaman',title:'THE SALAMANDER COURT',zone:1,sprite:{src:'assets/monsters/hellhound.png',tint:'tint-red'},art:"  ~.~.~\n  ( o )\n  ~~v~~",
   text:'A circle of small fire-lizards sit watching a larger one die. The larger one is curled around something bright. None of them move when you enter.',
   options:[
     {label:'Take what it is guarding',desc:'Approach the dying one',run:p=>{const c=14;selfHurt(p,c,'hazard');addHeat(8);const r=grantRandomRelic(p);return r?`The small ones hiss but do not move. You take the bright thing from under the dying one. It cools in your hands. ${r}. (-${c} HP, +8 Heat)`:`The small ones hiss but do not move. The bright thing is something you already carry. The dying one closes its eyes anyway. (-${c} HP, +8 Heat)`;}},
     {label:'Sit with them a while',desc:'Wait',run:p=>{addHeat(3);p.maxHp+=8;return 'You sit on the edge of the circle. The big one breathes out. The little ones breathe in. By the time the big one is finished, your chest is moving with theirs, and something in you has gone steadier. (+8 max HP, +3 Heat)';}},
     {label:'Walk past',desc:'Leave the court',run:p=>'You step around them. None of the small ones turn their heads. They are not looking at you. They have already lost interest in everything but the one they are watching.'},
   ]},
  {id:'bellows',title:'THE BELLOWS ROOM',zone:1,sprite:{src:'assets/events/forge_run.png',tint:'tint-red'},art:"  )/\\(\n  )||(\n  )/\\(\n  ====",
   text:'A chamber of huge leather bellows works itself. Each breath of them sends a wave of hot wind down the corridor behind you. There is no operator. Something deeper down is breathing through them.',
   options:[
     {label:'Cut the lines',desc:'Stop whatever is breathing',run:p=>{p.atk+=2;p.def+=2;return 'You slash the cords. The bellows sag like lungs going still. The corridor behind you cools. Somewhere further down, something does not get its next breath. You feel taller for it. (+2 ATK, +2 DEF)';}},
     {label:'Climb inside one',desc:'Ride the breath down',run:p=>{const c=18;selfHurt(p,c,'hazard');addHeat(12);const g=30+rnd(30);p.gold+=g;return `You step into a bellows on the upstroke. It compresses around you and spits you out the other end into a chamber the maps do not have. You crawl back coughing, with what you found. (-${c} HP, +12 Heat, +${g} gold)`;}},
     {label:'Leave the room to its work',desc:'Walk on',run:p=>'You back out into the corridor. The hot wind catches you in the back as you go. Something further down keeps breathing.'},
   ]},
  {id:'effigy',title:'THE BURNING EFFIGY',zone:1,sprite:{src:'assets/events/campfire.png',tint:'tint-red'},art:"   /-\\\n  | o |\n  |fire|\n   \\-/",
   text:'A straw figure the rough size of a man burns slowly in the middle of the chamber. It has been burning a long time. The straw is not getting any shorter.',
   options:[
     {label:'"Who is it meant to be?"',desc:'Ask the empty room',run:p=>{discoverLore('l4');addHeat(3);return 'The straw turns its head a little toward your voice. It does not have a face. It does not need one. You understand, with the clarity of a thing told to you when you were very small, that it is meant to be the Warden. (+3 Heat)';}},
     {label:'Throw your cloak on it',desc:'Smother it &middot; -1 potion',run:p=>{if(!p.potions)return 'You have nothing to spare to smother it with. The effigy keeps burning.';p.potions--;coolHeat(10);p.def+=2;return 'You pull a cloth from your pack and bury the effigy in it. The flame goes out. Whatever the effigy was meant to do, it stops doing it. (-15 Heat undone, +2 DEF, -1 potion)';}},
     {label:'Add a stick to the fire',desc:'Feed it',run:p=>{addHeat(8);p.atk+=3;return 'You feed the straw man a piece of wood. He takes it gratefully. The wood goes immediately. The straw is not getting any shorter. Your arms feel a great deal heavier on the way out. (+3 ATK, +8 Heat)';}},
     {label:'Walk past',desc:'Do not touch it',run:p=>'You step around the effigy. As you pass, you feel its straw head turn to follow you. You do not look back.'},
   ]},
  {id:'ashking',title:'THE KING IN ASH',zone:1,sprite:{src:'assets/monsters/fallenchampion.png',tint:'tint-amber'},art:"  ,---,\n  | + |\n  )===( \n  /|=|\\\n   ash",
   text:'A crowned figure sits at the bottom of a low pit of warm ash, up to his chest. He does not look up when you arrive. He is sifting the ash through his fingers as if looking for something.',
   options:[
     {label:'"What did you lose?"',desc:'Ask',run:p=>'"My hands." He shows them to you. They are still attached. "Not these. The other ones." He goes back to sifting. He does not explain.'},
     {label:'Reach in and help him search',desc:'-12 HP, find something for yourself',run:p=>{const c=12;selfHurt(p,c,'hazard');addHeat(5);const e=22+rnd(20);p.essence+=e;return `You kneel and put your arms into the ash. It is the temperature of an animal. You do not find what he is looking for, but you find something. (-${c} HP, +${e} ${ESS}, +5 Heat)`;}},
     {label:'Take his crown',desc:'He will not stop you',run:p=>{p.atk+=2;p.maxHp-=10;p.hp=clamp(p.hp,1,p.maxHp);return 'You lift the crown off his head. He does not look up. He does not seem to notice. It is heavier than a crown should be. Wearing it costs you something you do not get back. (+2 ATK, -10 max HP)';}},
     {label:'Leave him to sift',desc:'Walk on',run:p=>'You leave the king in his ash. He keeps sifting. You hear him a long way down the corridor.'},

  {id:'snowfield',title:'THE BLOOD ON THE SNOW',zone:2,sprite:{src:'assets/events/trap.png',tint:'tint-blue'},art:"  . . . .\n  . x . .\n  . . . .\n  . . x .",
   text:'A patch of frost has frozen red. The pattern is wrong &mdash; the spatter goes outward from the centre, but there is nothing in the centre. Just clean stone.',

     {label:'Press your palm to the stone',desc:'Listen',run:p=>{addMiasma(6);heal(p,Math.round(p.maxHp*0.12));return 'The stone is colder than the air. Something passes through you, soft as a name nearly remembered. Your wounds close a little out of pity. (heal, the cold thickens)';}},

  {id:'duet',title:'THE TWO WHO ARE THE SAME',zone:2,sprite:{src:'assets/monsters/zombie.png',tint:'tint-purple'},art:"  o o\n /|=|\\\n  | |\n /| |\\",

  {id:'unwedding',title:'THE UNWEDDING',zone:2,sprite:{src:'assets/monsters/ghost.png',tint:'tint-blue'},art:"  o   o\n /|---|\\\n  |   |\n / \\ / \\",
