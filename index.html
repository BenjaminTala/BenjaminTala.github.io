/* ============================================================
   LORE CODEX — fragments uncovered at story beats, collected across runs.
   Pulls the player deeper: find the next piece, learn how it ends.
   ============================================================ */
const LORE=[
  {id:'l1',t:'The Descent',x:'Everyone who comes here is told the same thing in town: go down, take the power, come back rich. Nobody in town has ever met someone who did the last part. You go down anyway. So did they.'},
  {id:'l2',t:'The Warm Crypt',x:'The upper halls were a prison, then a tomb, then forgotten. The warmth was never comfort. It was containment. Something down here has been kept warm on purpose.'},
  {id:'l3',t:'The Furnace',x:'Below the tombs, the heat is deliberate. Someone lit a fire and fed it for an age. Fire is a lock. Heat is a warning. The hotter it burns, the closer you are to the thing it cages.'},
  {id:'l4',t:'The Warden',x:'The dragon is older than the crypt around it. It does not move from its door. It does not call itself a guardian — it calls itself something gentler, which is somehow worse. Champions never quite know what to make of that, and they do not get the chance to ask twice.'},
  {id:'l5',t:'What the Cold Is',x:'When the Warden falls the fire goes out all at once, like a held breath let go. The cold that comes up the stairs to meet you is not the cold of a dead hearth. It is the cold of something that was running a temperature, and has just gone still.'},
  {id:'l6',t:'Miasma',x:'The cold is not weather. It is appetite. It does not freeze the body — it erodes the memory of being alive. Down here, wounds forget how to close.'},
  {id:'l7',t:'The Echoes',x:'The dead you meet were champions like you. The crypt did not eat their bodies — it kept their last moment, looping, lying. Speak gently. They misremember everything now.'},
  {id:'l8',t:'Time Debt',x:'Power taken early is existence borrowed late. The Collector keeps perfect accounts. It does not want your gold. It wants the years you will never get to live.'},
  {id:'l9',t:'The Silent Deep',x:'Beneath everything, reality runs thin. There are no walls here, only the suggestion of them. The Deep is where possibility goes to be unmade.'},
  {id:'l10',t:'The Devourer',x:'It does not eat flesh. It eats what you might have become. Every champion it takes is un-happened. That is why none of them are remembered — not even by their mothers.'},
  {id:'l11',t:'The Phantom Forge',x:'The smith works a metal that throws no heat. He never looks up from the anvil &mdash; except once, when you turned to leave, and his hammer went quiet behind you. He did not say anything. He has not got a name on him anywhere, and he hammers like a man making sure he is still here.'},
  {id:'l12',t:'Why You Persist',x:'You return because the crypt let exactly one possibility survive: yours. Each run, a little more of the story stays with you. The crypt is learning you. You are learning it.'},
  {id:'l13',t:'The Forgotten King',x:'There is a throne set directly over the dark, and a man in it who has not stood in longer than the crypt has had a name. He is not guarding it. He is just heavy, and tired, and he has forgotten there was ever a choice in sitting down.'},
  {id:'l14',t:'The Last Truth',x:'The crypt opens. Something inside you does not leave. Every champion who escapes carries a sliver of the Deep back into the light. That is how it spreads. That is how it always wins.'},
  {id:'l15',t:'The Lie You Were Told',x:'You came down to kill it. You are sure of that. But every door opens for you, every chain was sized for your wrists, and the pieces you keep finding fit your hands like they were measured. You are not closing in on it. You are gathering it. You have always been gathering it.'},
  {id:'l16',t:'Why You Persist (the real reason)',x:'You keep a tally in the back of your skull that you never started. It only goes up. The Echoes count too &mdash; you have caught them mouthing your number under their breath. One of them stopped at the bottom and would not take another step. You understand him better than you would like.'},
  {id:'l17',t:'The Seventh Expedition',x:'There are records of six descents in the upper archives. The seventh is mentioned only in the margins, in the same hand, getting smaller. Nobody knows what happened to them. Nobody quite knows what happened to the records, either.'},
  {id:'l18',t:'Chambers Older Than the Crypt',x:'Some rooms down here are carved from a darker stone than the rest of the crypt. The cartographer claims those chambers do not stay in the same place between maps. The smith claims they were here before the door was. Whoever is right, the implication is unkind.'},
  {id:'l19',t:'Rumours of the Pale',x:'The smith says fire wins against everything except one thing. The cardinal says her god does not enter the lower chambers. The cartographer mapped the bottom once and refuses to do so again. None of them say the same name for it. None of them say its name aloud.'},
  {id:'l20',t:'The Thing Before',x:'The lowest stone is colder than ice has any right to make it, and it is older than the marks the masons left. They did not build a cage down here. They built around something they found and could not move. Even the Devourer was cut from it. Even the Devourer is a splinter.'},
];
function loadLore(){ try{ return JSON.parse(localStorage.getItem('crypt_lore')||'[]'); }catch(e){ return []; } }
function discoverLore(id){ if(!LORE.find(l=>l.id===id))return false; const k=loadLore(); const already=k.includes(id);
  // l15 is "The Lie You Were Told" — the truth about the Champion. At that moment,
  // Harvest Essence renames itself to DEVOUR. The reveal is PER-RUN state (p.memory.revealed),
  // so re-trigger it every time, even if the codex already has l15 from a previous run —
  // otherwise the rename only ever happens on the player's very first l15 discovery and every
  // subsequent run leaves the 4th skill stuck on "Harvest Essence". (revealDevour is idempotent.)
  if(id==='l15' && G.player) try{ revealDevour(); }catch(e){}
  if(already) return false;
  k.push(id); try{localStorage.setItem('crypt_lore',JSON.stringify(k));}catch(e){} const l=LORE.find(x=>x.id===id); const msg='&#128220; LORE UNCOVERED — '+l.t; if(G.screen==='battle')blog(msg,'lvl'); else G._loreMsg=msg;
  return true; }
function loadRecords(){ try{ return Object.assign({deepest:0,runs:0,wins:0},JSON.parse(localStorage.getItem('crypt_records')||'{}')); }catch(e){ return {deepest:0,runs:0,wins:0}; } }
function recordRun(win){ const r=loadRecords(); const prevDeepest=r.deepest||0; r.runs=(r.runs||0)+1; if(win)r.wins=(r.wins||0)+1; r.deepest=Math.max(prevDeepest,G.depth); if(G.depth>prevDeepest)memoir().wentDeeper=true; try{localStorage.setItem('crypt_records',JSON.stringify(r));}catch(e){} }
// Cross-run Time Debt ledger — feeds the Collector's "you again" recognition.
function noteBorrow(amt){ const r=loadRecords(); r.borrowedTotal=(r.borrowedTotal||0)+amt; try{localStorage.setItem('crypt_records',JSON.stringify(r));}catch(e){} }
function noteCollector(){ memoir().collectorMet=true; const r=loadRecords(); r.collectorMet=(r.collectorMet||0)+1; try{localStorage.setItem('crypt_records',JSON.stringify(r));}catch(e){} }
// Boss kills (mirror of bossDeaths) — feeds the Saga tab's THE FALLEN section so the player sees
// their lifetime hunt count next to each boss's death count. Bumped once per boss-kill via winBattle.
function noteBossKill(key){ if(!key)return; const m=memoir(); if(m.bosses.indexOf(key)<0)m.bosses.push(key); const r=loadRecords(); r.bossKills=r.bossKills||{}; r.bossKills[key]=(r.bossKills[key]||0)+1; try{localStorage.setItem('crypt_records',JSON.stringify(r));}catch(e){} }
// Rumor fragments collected — the Saga tab surfaces "you've heard 5 things about the Pale Devourer"
// without revealing what those things are. Bumped at the existing fragment-emission sites.
function noteRumor(topic){ if(!topic)return; memoir().rumors++; const r=loadRecords(); r.rumors=r.rumors||{}; r.rumors[topic]=(r.rumors[topic]||0)+1; try{localStorage.setItem('crypt_records',JSON.stringify(r));}catch(e){} }
// Collector resolution counters — bumped from collectorPay so the Saga can show items vs tribute vs fought.
function noteCollectorPaid(kind){ const r=loadRecords(); r.collectorPaid=r.collectorPaid||{}; r.collectorPaid[kind]=(r.collectorPaid[kind]||0)+1; try{localStorage.setItem('crypt_records',JSON.stringify(r));}catch(e){} }
// PER-RUN MEMOIR — what happened THIS run, used by the death-screen "epitaph hook" so failure feels
// like investment (a new beat the crypt remembers) instead of a stat reset. Initialized at run start.
// Bumped from the existing recording sites so nothing new fires; just one extra field write each.
function memoir(){ return G._memoir = G._memoir || {met:[],rumors:0,bosses:[],collectorMarked:false,collectorMet:false,devourRevealed:false,wentDeeper:false,depthStart:G.depth||0,deepestAtStart:(loadRecords().deepest||0)}; }
// ============================================================
// FIRST-RUN ONBOARDING — true the first time anyone opens the game (before any run has recorded).
// Used to: skip the Omen screen, gate a guaranteed early relic + event, soften enemies ~12%, and
// delay system-tutorial dogpiles so the player learns COMBAT before SYSTEMS.
// ============================================================
function isFirstRun(){ try{ return (loadRecords().runs||0)===0; }catch(e){ return false; } }
function firstRunMul(){ return isFirstRun()?0.88:1; }   // enemy HP/ATK softener; off forever after run 1
/* ============================================================
   NPC MEMORY — recurring characters that REMEMBER you between runs.
   Each anchor NPC stores a small per-NPC blob (stage, met-count, last-line) so a
   second meeting can land differently from a first. Persists in crypt_npc.
   ============================================================ */
function loadNpc(){ try{ return JSON.parse(localStorage.getItem('crypt_npc')||'{}'); }catch(e){ return {}; } }
function saveNpc(s){ try{ localStorage.setItem('crypt_npc',JSON.stringify(s)); }catch(e){} }
// Read this NPC's state (always returns an object with `met` and `stage` defined).
function npcState(id){ const s=loadNpc(); return Object.assign({met:0,stage:0},s[id]||{}); }
// Advance one or more fields on this NPC's persistent record.
function npcSet(id, patch){ const s=loadNpc(); s[id]=Object.assign({met:0,stage:0},s[id]||{},patch); saveNpc(s); return s[id]; }
// Called the first time the player opens an anchor NPC's screen this run — bumps the
// truthful lifetime meeting counter and stamps which run-number this meeting happened on.
function npcMeet(id){ const m=memoir(); if(m.met.indexOf(id)<0)m.met.push(id);
  const r=loadRecords(); const s=loadNpc(); const cur=Object.assign({met:0,stage:0},s[id]||{});
  cur.met=(cur.met||0)+1; cur.lastRun=r.runs||0; s[id]=cur; saveNpc(s); return cur; }
// Human-readable ordinal for run/meeting counters: 1st, 2nd, 3rd, 4th...
function ordinal(n){ n=n|0; const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
/* ============================================================
   THE PALE — myth seeding. References to the thing at the bottom are RARE and grow slightly
   more frequent the deeper the player has historically gone. A true first-timer hears nothing
   (the world greets them before it warns them); by the time someone nears the Abyss they have
   caught fragments from frightened mouths — but never the whole truth. Voices stay distinct;
   nothing ever states what it IS.
   ============================================================ */
function paleRumorChance(){ const d=(loadRecords().deepest)||0;
  if(d<11) return 0;            // run 1 / barely descended — let the world be ordinary first
  if(d>=RUN_LENGTH) return 48;  // reached the throne — the deep is openly afraid for you now
  if(d>=30) return 36;          // far into the cold
  if(d>=18) return 23;          // past the Warden
  return 11; }                  // a faint, rare fragment
function paleRumor(){ const hit=chance(paleRumorChance()); if(hit)noteRumor('pale'); return hit; }

// PLAYER INNER VOICE — first-person fragments the champion catches themselves thinking. Tonally
// distinct from world-voice whispers: anxious, short, intimate. Gated to ~20% of whisper rolls so
// the world's own voice still dominates, but the player has SOMEONE in the dark who sounds like
// them. Six lines, drawn from late-zone-1 onward (the first chamber should feel like the world
// noticing you, not you noticing yourself).
const INNER_VOICE=[
  'I keep waiting to hear footsteps that are not mine.',
  'I am still carrying things I would not have picked up the first time.',
  'Tell me I get to sit down soon.',
  'Past the place I died. The walls look the same.',
  'My hands smell like something I did not eat.',
  'I keep going back. I do not remember choosing to.',
];
function whisperFor(d){
  if((G.abyss || zoneOf(d)>=3) && paleRumor() && chance(40)){ return pick(PALE_INSCRIPTIONS); }   // paleRumor() already noteRumor'd — don't double-count
  if(d>=4 && chance(20)) return pick(INNER_VOICE);   // the player's own voice, occasionally
  if(G.abyss) return chance(60)?pick(ABYSS_WHISPERS):pick(WHISPERS[3]);
  return pick(WHISPERS[zoneOf(d)]||WHISPERS[0]); }

function bossAwareLine(key){
  const p=G.player; if(!p) return '';
  const r=loadRecords(); const bd=(r.bossDeaths&&r.bossDeaths[key])||0;
  const wrap=(cls,t)=>`<p class="${cls}" style="font-size:11px;line-height:1.7;margin-bottom:8px">${t}</p>`;
  let out='';
  // Prior-death taunt — fires for ANY boss the player has died to (bd>=1). Random of 5 per boss.
  if(bd>=1 && BOSS_TAUNT_DEAD[key]){
    const pool=BOSS_TAUNT_DEAD[key];
    out += wrap('shout-purple', pool[Math.floor(Math.random()*pool.length)]);
  }
  // Arrival-state lines — STACK with the taunt above when both apply. Named bosses get extra
  // recognition for HOW the player arrived (heat, miasma, devour path, debt).
  if(key==='warden'){
    if(heatTier()>=4) out += wrap('shout-red','Steam screams off your armour as you near it. The Warden\'s head turns, slow and deliberate. "You come carrying the Furnace itself. Good. It will be quicker for both of us."');
    else if(G.heat<=8) out += wrap('shout','"You came cold." It sounds, almost, disappointed. "The others ran hot. They burned out before the door. You... you might make me move."');
  }
  if(key==='remembered' && miasmaActive() && miasmaTier()>=4) out += wrap('shout-purple','"You are mostly cold now. Good. There is so much less of you to argue with this time."');
  if((key==='king'||key==='dragon'||key==='devourer') && p.memory && p.memory.path && p.memory.path.length>=3) out += wrap('shout-red','It sees what you have been eating on the way down. It goes very still. "...oh. You are doing it on purpose this time."');
  if(key==='devourer' && (G.debt||0)>=60) out += wrap('shout-purple','"You owe so much already. Borrowing against a future you will not be allowed to keep." It almost sounds kind.');
  return out;
}
function showBossIntro(key){ if(BOSS_BIO[key]===undefined||!BOSSES[key])return;
  // Per-run gate: every new run reintroduces every boss you face. The lines should be impossible to miss.
  G._seenBoss=G._seenBoss||{}; if(G._seenBoss[key])return; G._seenBoss[key]=1;
  const aware=bossAwareLine(key);
  // Omit the cry paragraph if BOSS_CRY is empty so silence reads as silence, not as a layout glitch.
  const cryText=bossCryFor(key);
  const cry=cryText?`<p class="shout-red" style="font-size:12px;line-height:1.8">${cryText}</p>`:'';
  const bio=BOSS_BIO[key]?`<p style="font-size:10px;line-height:1.9;color:#cfcbef;margin-top:10px">${BOSS_BIO[key]}</p>`:'';
  showInfo({title:BOSSES[key].name,body:aware+cry+bio}); }
// Persisted per-boss death tally — feeds bossAwareLine's "you again" recognition.
function noteBossDeath(key){ if(!key)return; const r=loadRecords(); r.bossDeaths=r.bossDeaths||{}; r.bossDeaths[key]=(r.bossDeaths[key]||0)+1; try{localStorage.setItem('crypt_records',JSON.stringify(r));}catch(e){} }

  showInfo({title:BOSSES[key].name+' — falls',body:`<p class="shout-red" style="font-size:12px;line-height:1.8">${BOSS_DEATHCRY[key]}</p>`}); }
let G=null;
function defaultMods(){ return {eDmg:1.06,eHp:1.06,pDmg:1.00,goldMul:1,skillCost:1,essMul:1,greedy:0,luck:0,eliteMul:1.22,packBonus:0,roamRegen:0,slayFast:0,ultFast:0,
  // Ascension-driven knobs (default = neutral; ASCENSION tiers ramp these)
  priceMul:1, eliteCounter:0, potionPenalty:0}; }

/* ============================================================
   ASCENSION — stratified post-victory difficulty (Slay the Spire's
   Ascension / Hades' Heat / Monster Train's Covenant).  Per the design
   research this is the single highest-leverage "one more run" hook we were
   missing.  Each tier adds ONE stacking rule; a run at ascension N applies
   tiers 1..N.  The max tier the player has UNLOCKED persists in localStorage
   (crypt_ascension), and unlocks one step per Triumph.  Tiers are tuned to
   change WHICH strategies work (more elites, forced counters, leaner economy)
   rather than only inflating HP — the lazy version the research warns against.
   ============================================================ */
const ASCENSION=[
  null, // index 0 = no ascension
  // Trimmed from 10 tiers to 4 (reviewer feedback: long ladders cap engagement; each tier should
  // FEEL like a step, not a half-percent nudge). Each tier now combines 2–3 of the old steps so
  // the player gets a real difficulty bump per unlock. Existing saves with ASC > 4 are clamped
  // down silently by loadAscension().
  {n:1, name:'Tougher Hide',
    desc:'Enemies have +8% HP. Merchant prices +18%.',
    apply:m=>{ m.eHp*=1.08; m.priceMul*=1.18; }},
  {n:2, name:'Restless Halls',
    desc:'Start each run with 1 fewer potion. Enemies deal +5% damage.',
    apply:m=>{ m.potionPenalty+=1; m.eDmg*=1.05; }},
  {n:3, name:'The Crypt Sharpens',
    desc:'+1 enemy in every pack. Enemies deal +8% damage. Elites always carry a Counter aimed at your second-strongest axis.',
    apply:m=>{ m.packBonus+=1; m.eDmg*=1.08; m.eliteCounter=1; }},
  {n:4, name:'The Hungering Crypt',
    desc:'Far more elites prowl. 12% less gold. Enemies gain +9% HP and +9% damage.',
    apply:m=>{ m.eliteMul*=1.32; m.goldMul*=0.88; m.eHp*=1.09; m.eDmg*=1.09; }},
];
const ASC_MAX = ASCENSION.length-1;   // 4
function loadAscension(){ try{ return Math.max(0, Math.min(ASC_MAX, parseInt(localStorage.getItem('crypt_ascension')||'0',10)||0)); }catch(e){ return 0; } }
function saveAscension(n){ try{ localStorage.setItem('crypt_ascension', String(Math.max(0,Math.min(ASC_MAX,n)))); }catch(e){} }
// Bump the unlocked ceiling by one (called on Triumph).  Returns the new ceiling.
function unlockNextAscension(){ const cur=loadAscension(); if(cur<ASC_MAX){ saveAscension(cur+1); return cur+1; } return cur; }
// Apply tiers 1..n onto the current G.mods.  Called from chooseClass AFTER defaultMods().
function applyAscension(n){ for(let i=1;i<=n && i<=ASC_MAX;i++){ try{ ASCENSION[i].apply(G.mods); }catch(e){} } }
function ascBadge(){ const n=G.ascension||0; if(!n) return '';
  // Click/hover shows the full active-modifier list via the existing INFO_TEXT system.
  const lines = []; for(let i=1;i<=n && i<=ASC_MAX;i++){ lines.push(`<b class="red">A${i} ${ASCENSION[i].name}</b> &mdash; ${ASCENSION[i].desc}`); }
  const tip = `Ascension ${n}: every tier 1-${n} is active this run. ` + lines.map(l=>l.replace(/<[^>]+>/g,'')).join(' / ');
  return `<span class="asc-badge clickable" data-info-concept="ascension_active" title="${escAttr(tip)}">&#9650; ASC ${n}</span>`; }
// Built fresh per render so the modal always reflects the CURRENT run's ascension stack.
function ascActiveInfo(){

      }).join('') + '</div>';

function newGame(){ try{clearTimeout(G&&G._navTimer);}catch(e){}   // don't orphan the prior run's nav-lock timer
  G={screen:'title',player:null,depth:0,abyss:0,doors:[],room:null,battle:null,pending:null,log:[],omen:null,mods:defaultMods(),omenChoices:[],seenEvents:[],

/* ============================================================
   WORLD SYSTEMS — Temperature Arc (Heat -> cold collapse -> Miasma)
   Heat answers "how fast can I push?"; Miasma answers "how long can I survive?"
   ============================================================ */
function heatActive(){ return !G.abyss && !G.collapsed && zoneOf(G.depth)===1; }       // the Furnace
function miasmaActive(){ return G.abyss || G.collapsed || zoneOf(G.depth)>=2; }          // Frozen Below + Silent Deep
const HEAT_MAX=50;
// 6 tiers: 0/1/2/3/4/5 at 0/10/20/30/40/50
function heatTier(){ const h=G.heat; return h>=50?5:h>=40?4:h>=30?3:h>=20?2:h>=10?1:0; }
function miasmaTier(){ const m=G.miasma; return m>=60?6:m>=50?5:m>=40?4:m>=30?3:m>=20?2:m>=10?1:0; }
// damage = heat - 3 when heat >= 10. Tightened from -5 — sim showed heat killed almost nobody
// (2 deaths out of 962). Now 10 Heat = 7 HP, 30 Heat = 27 HP, 50 Heat = 47 HP per chamber.
function heatChamberDamage(){ return Math.max(0, (G.heat||0) - 3); }
// THE DEEP COLD — the Abyss's own environmental clock and its answer to the Furnace's Heat. Unlike
// Miasma it CANNOT be cleansed; it only gets heavier the further you fall. This is what makes the
// deep a distinct phase rather than a longer dungeon: past a point the deep itself is killing you,
// not the monsters — a soft ceiling that even a perfect build eventually meets ("only how deep you
// fall"). Gentle until ~floor 8 so it diversifies how deep runs END without rebuilding the wall the
// scaling change just lowered. Around the Pale's depth (floor 22) it bites ~18/chamber.
function deepColdDamage(){ if(!G.abyss) return 0; const floor=G.depth-RUN_LENGTH; return floor<=8?0:Math.round((floor-8)*1.3); }
function dcTier(){ const dc=deepColdDamage(); return dc<=0?0:dc>=30?4:dc>=18?3:dc>=8?2:1; }   // 0 settling .. 4 absolute
function healFactor(){ const t=miasmaTier(); return t>=2?0.5:t>=1?0.78:1; }              // wounds stop closing in the cold
const HEAT_MSG=['','Metal begins to soften. The locals catch fire.','Your breath leaves sparks — the merchants gouge, but the loot runs hot.','The walls pulse. The Furnace begins to burn YOU.','FIRE INSTABILITY — the Furnace is trying to kill you!'];
const MIASMA_MSG=['','Your reflection blinks a half-second late.','Your wounds no longer close on their own.','The crypt tastes your soul.','SOUL ROT — the cold is eating your very substance.','The cold draws blood with every step.','You are coming undone.'];

//     If the cast killed multiple non-boss families, a multi-choice popup appears
//     and the player picks which essence to take.
//   - After taking any non-boss fragment, the player becomes SATURATED for 2 turns.
function processDevourCast(p, b){
  const kills=(b._castKills||[]).slice(); b._castKills=[];

  const path=p.memory.path||[];
  // Any kill of a real Devour family is eligible. EMPOWER always deepens the current path,
  // REPLACE always resets, and EVOLVE attempts last+new (cross OR same-family combo) — so
  // there's always something meaningful to offer. The old restriction silently swallowed
  // same-family kills that weren't consecutive (e.g. Undead in path → kill another Undead = nothing).
  const eligible=k=>k.boss || !!DEVOUR_FAMILIES[k.fam];
  // Boss fragments always go — Saturated never blocks a boss
  // Record the boss kill so winBattle's grantMemory call doesn't double-queue it.
  G._devouredBosses=G._devouredBosses||{};
  kills.filter(k=>k.boss).forEach(k=>{ G._devouredBosses[k.name]=1; });
  kills.filter(k=>k.boss && eligible(k)).forEach(k=>queueFragmentChoice(p, k.fam));

  if(p._saturated>0){

  } else {
    const nonBoss=kills.filter(k=>!k.boss && eligible(k));
    const fams=[...new Set(nonBoss.map(k=>k.fam))];
    if(fams.length===1){
      queueFragmentChoice(p, fams[0]);

  const item={slot,name,baseName:base.name,type:base.type,rarity,ilvl,stats,aff:base.aff||null,set:set||base.set||null};
  if(slot==='weapon'){ item.dmg=stats.dmg||0; if(passive&&passive.proc)item.proc=passive.proc;
    // WEAPON ARCHETYPE TRAIT — late-game weapons grow weird, tempting bad decisions.
    if(opts.trait){ item.trait=opts.trait; }
    else if(!item.proc && rarity>=2 && chance(22+Math.min(38,depth*2))){ item.trait=pick(WEAPON_TRAIT_KEYS); }
  }
  if(passive&&passive.flag)item.passiveFlag=passive.flag;
  if(passive)item.passiveDesc=passive.desc;
  // Snapshot the passive's stat contribution so forgeReforge can subtract it before re-rolling.
  // Without this, each reforge bakes the old passive's stats permanently into the item.
  if(passive&&passive.stat)item._passiveStats=Object.assign({},passive.stat);
  return item;
}
const STAT_LBL={dmg:'DMG',atk:'ATK',def:'DEF',maxHp:'HP',maxMana:'MP',crit:'CRIT',dodge:'DODGE',lifesteal:'LS',regen:'RGN'};
// Percentage stats — crit/dodge/lifesteal are chances/ratios, so their VALUE always carries a % no
// matter where it's shown. (gearCompareHtml and itemStatsText used to disagree: "DODGE 7" here vs
// "+7 DODGE%" there. Now both read "7%", consistent with the HUD and class-select.)
const PCT_STAT={crit:1,dodge:1,lifesteal:1};
function itemExtraText(it){ let s=''; if(it.passiveDesc)s+=` &middot; <span class="amber">${it.passiveDesc}</span>`;
  if(it.trait&&WEAPON_TRAITS[it.trait]){ const t=WEAPON_TRAITS[it.trait]; s+=` &middot; <span class="${t.color}">&#10070; ${t.name}</span><small class="muted" style="display:block">${t.desc}</small>`; }
  if(it.set)s+=` &middot; <span class="teal">${it.set} set</span>`; return s; }
// Rough power score for a gear comparison: weights each stat by how much it actually moves the needle.
function gearScore(it){ if(!it||!it.stats)return 0; const s=it.stats;
  return (s.dmg||0)*2.0 + (s.atk||0)*2.2 + (s.def||0)*1.4 + (s.maxHp||0)*0.12 + (s.maxMana||0)*0.18
       + (s.crit||0)*0.9 + (s.dodge||0)*0.8 + (s.lifesteal||0)*0.7 + (s.regen||0)*0.4; }
function gearCompareHtml(it,cur){ const keys=[...new Set([...Object.keys(it.stats||{}),...(cur?Object.keys(cur.stats||{}):[])])];
  const parts=keys.map(k=>{ const nv=it.stats[k]||0, ov=(cur&&cur.stats[k])||0, d=nv-ov; const pc=PCT_STAT[k]?'%':'';
    const dt=!cur?'':d>0?` <span class="green">&#9650;${d}${pc}</span>`:d<0?` <span class="red">&#9660;${-d}${pc}</span>`:'';
    return `${STAT_LBL[k]||k} <b>${nv}${pc}</b>${dt}`; });
  // Net verdict — answers "is this an upgrade?" so players don't have to do the math.
  let verdict=''; if(cur){ const ds=gearScore(it)-gearScore(cur);
    verdict = ds>1.5 ? ' &middot; <span class="green">UPGRADE</span>'
            : ds<-1.5 ? ' &middot; <span class="red">DOWNGRADE</span>'
            : ' &middot; <span class="muted">SIDEGRADE</span>'; }
  return parts.join(' &middot; ')+verdict+itemExtraText(it); }
// SYNERGY FLAGS — the Balatro/Spire "show the player the half-built combo" move.
// Given a reward option, returns a short coloured banner that fires ONLY when the
// reward would advance something the player has already started: complete an armor
// set, cross an affinity tier, or push a path toward its next capstone.  The whole
// point is that a reward stops being "+3 ATK" and starts being "this finishes my
// Shadowdancer build" — making the choice feel like a build commitment.
function rewardSynergyFlags(o,p){
  if(!o||!p) return '';
  const flags=[];
  const data=o.data||{};
  // ----- affinity tier progress (gear / relic / upgrade all carry `aff`) -----
  const aff=data.aff||{};
  for(const k in aff){
    const add=aff[k]||0; if(!add) continue;
    // For gear, the slot's current item's affinity would be replaced — net it out.
    let net=add;
    if(o.kind==='gear' && data.slot){ const cur=p.equip[data.slot]; if(cur&&cur.aff&&cur.aff[k]) net-=cur.aff[k]; }
    if(net===0) continue;
    const before=p.aff[k]||0, after=before+net;
    const tBefore=affTierOf(before,k), tAfter=affTierOf(after,k);
    const nm=AFF_META[k].name, col=AFF_META[k].color;
    if(tAfter>tBefore){
      flags.push(`<span class="syn syn-tier ${col}">&#10022; ${nm} ${['I','II','III','IV'][tAfter-1]} &mdash; TIER UP!</span>`);
    } else {
      const nextThresh = tAfter<AFF_TIER_MAX ? affThresh(k)[tAfter] : null;
      if(nextThresh!=null && after>before){
        flags.push(`<span class="syn ${col}">&#10022; ${nm} ${after}/${nextThresh}</span>`);
      }
    }
  }
  // ----- armor set completion / progress -----
  if(o.kind==='gear' && data.set){
    const set=SETS[data.set];
    if(set){
      // count pieces AFTER hypothetically equipping into this slot
      let cnt=0; SLOTS.forEach(s=>{ const it = s===data.slot ? data : p.equip[s]; if(it&&it.set===data.set) cnt++; });
      const have = p.sets&&p.sets.indexOf(data.set)>=0;
      if(cnt>=set.pieces && !have){
        flags.push(`<span class="syn syn-set teal">&#9670; COMPLETES ${data.set.toUpperCase()} (${set.pieces}pc)</span>`);
      } else if(cnt<set.pieces){
        flags.push(`<span class="syn teal">&#9670; ${data.set} ${cnt}/${set.pieces}</span>`);
      }
    }
  }
  return flags.length ? `<span class="syn-row">${flags.join(' ')}</span>` : '';
}
function affTierOf(pts,k){ let t=0; const th=affThresh(k||'w'); while(t<AFF_TIER_MAX && pts>=th[t]) t++; return t; }
function itemLabel(it){ return `<span class="${RARITY[it.rarity].cls}">${it.name}</span> <span class="muted">Lv${it.ilvl}</span>`; }
function itemStatsText(it){ const parts=[];
  for(const k in it.stats){ parts.push(`+${it.stats[k]}${PCT_STAT[k]?'%':''} ${STAT_LBL[k]||k}`); }
  let s=parts.join(', ');
  if(it.passiveDesc)s+=` &middot; <span class="amber">${it.passiveDesc}</span>`;
  if(it.trait&&WEAPON_TRAITS[it.trait]){ const t=WEAPON_TRAITS[it.trait]; s+=` &middot; <span class="${t.color}">&#10070; ${t.name}</span>`; }
  if(it.set)s+=` &middot; <span class="teal">${it.set} set</span>`;
  return s; }

      <div class="stats center" style="font-size:10px"><b class="red">YOU HP</b> ${p.hp}/${p.maxHp} &middot; <b class="green">POTIONS</b> ${p.potions}</div>

      <button class="btn red" onclick="tutorialAct('attack')"><span class="k">&#9876;</span>ATTACK<small>strike the goblin (about 3 will fell it)</small></button>
      <button class="btn green" onclick="tutorialAct('potion')" ${p.potions?'':'disabled'}><span class="k">&#10010;</span>POTION<small>heal ~30% of your max HP &middot; ${p.potions} left</small></button>
      <button class="btn muted" onclick="tutorialSkip()"><span class="k">&#9654;</span>SKIP TUTORIAL<small>go straight to the crypt</small></button>
    </div>
    <p class="muted center" style="font-size:8px;line-height:1.7;margin-top:8px;opacity:.85">Real combat adds your class SKILLS and a charging ULTIMATE &mdash; you'll meet them below the throne.</p>`;
}
function tutorialAct(action){ const p=G.player; const t=G._tutB; if(t.over) return; t.round++;
  // Player turn first
  if(action==='attack'){ const d=8+rnd(2); t.hp=Math.max(0,t.hp-d); SFX.play('hit'); t.msg=`You strike the goblin for <b>${d}</b>.`; }   // fixed teaching damage — the lesson must be the same for every class (goblin dies in ~3 attacks)
  else if(action==='potion'){
    if(!p.potions){ t.msg='You are out of potions.'; render(); return; }
    p.potions--; const before=p.hp; const h=Math.round(p.maxHp*0.30); p.hp=Math.min(p.maxHp,p.hp+h);
    SFX.play('potion'); t.msg=`You drink a potion and heal <b>${p.hp-before}</b>.`;
  }
  if(t.hp<=0){ tutorialWin(); return; }
  // Enemy reveals what it actually does, based on the intent it had telegraphed.
  // No more fake "you dodge" / "you guard" branches — the tutorial only teaches verbs that exist
  // in real combat (ATTACK + POTION + reading INTENT). The HEAVY beat still teaches "watch the
  // telegraph and heal in time" without inventing a universal block button.
  if(t.intent==='doze'){ t.msg+=' The goblin yawns and does nothing this round.'; }
  else { const willHeavy = t.intent==='heavy';
    const dmg = Math.max(1, willHeavy ? Math.round(t.atk*1.6) : t.atk);
    t.msg += ` The goblin hits you for <b>${dmg}</b>.`;
    p.hp = Math.max(1, p.hp - dmg);   // never lethal in the tutorial; floor 1 HP
  }
  // Re-telegraph next intent (rotating attack -> heavy -> doze -> attack so the player sees each)
  t.intent = t.intent==='attack' ? 'heavy' : t.intent==='heavy' ? 'doze' : 'attack';
  render();
}

function depthFactor(){ const d=Math.max(0,G.depth-1);
  // In the Abyss the quadratic term is FLATTENED past the throne (continuous at depth 40). Enemies
  // still scale hard — ~20x+ base at depth 70 — but no longer so explosively that raw burst is the
  // ONLY thing that can kill you. This is deliberate redistribution, not a blanket nerf: it makes
  // room for the deep's environmental clocks (Miasma soul-rot, Debt/Collector) to share the
  // lethality, and lets a near-perfect build descend far enough to actually reach the secret bosses.
  if(G.abyss){ const dd=RUN_LENGTH-1, extra=d-dd;
    return 1 + d*0.10 + dd*dd*0.0065 + extra*extra*0.0028 + extra*0.04; }
  return 1+d*0.10+d*d*0.0065; }
function scaleHpVal(base){ return Math.round(base*depthFactor()*G.mods.eHp); }
function depthLabel(){ const asc=ascBadge(); if(G.abyss){ return `<span class="purple">THE ABYSS</span> &middot; DEPTH ${G.depth-RUN_LENGTH}${asc}`; } const z=ZONES[zoneOf(G.depth)]; return `<span class="${z.color}">${z.name}</span> &middot; CHAMBER ${G.depth}/${RUN_LENGTH}${asc}`; }
// Spire-style 4-zone journey bar shown above the corridor's player strip.
// Visualises the whole descent: each zone is a coloured segment, boss
// chambers (10/20/30/40) are skull markers, and the player's position is a
// glowing pip.  Makes the run feel like a journey instead of an endless
// list of chambers — testers see at-a-glance "I'm in zone 1, halfway to the
// first boss, three quarters from the throne".  Suppressed in the Abyss
// because that descent has no segmented structure.
function journeyBar(){
  if(G.abyss) return '';
  // Collapsed to 4 zone-segments instead of 40 individual cells: each zone shows its name, a boss
  // skull (filled when cleared), and the current zone shows chamber progress inline. Removes 36
  // cells of HUD noise while preserving everything the player actually needs to read at a glance.
  const cur=G.depth; const curZone=zoneOf(cur);
  const segs=ZONES.map((z,zi)=>{
    const zStart=zi*10+1, zEnd=zi*10+10;
    const passed=cur>zEnd;
    const here=zi===curZone;
    const bossKilled=cur>zEnd;   // boss at end of zone — cleared if we're past it
    const lbl=z.name.replace(/^THE\s+/,'');
    const skull=bossKilled?'<span class="jz-boss done">&#9760;</span>':here?'<span class="jz-boss live">&#9760;</span>':'<span class="jz-boss">&#9760;</span>';
    const prog=here?`<span class="jz-prog">${cur-zStart+1}/10</span>`:'';
    const cls=['jz-seg','jz-'+z.color,here?'here':'',passed?'passed':''].filter(Boolean).join(' ');
    return `<span class="${cls}" title="${z.name} — chambers ${zStart}–${zEnd}"><span class="jz-lbl">${lbl}</span>${prog}${skull}</span>`;
  }).join('<span class="jz-link"></span>');
  return `<div class="journey-bar">${segs}</div>`;
}
function omenTag(){ return G.omen&&G.omen.id!=='none'?`<div class="omentag">&#10022; OMEN: ${G.omen.name}</div>`:''; }
// Slay-the-Spire-style mid-act boss preview: shows the player which chamber the
// next boss arrives in and (when the pool is unambiguous) the boss's name and
// portrait.  When there are multiple candidates in the pool, we show "Something
// stirs at chamber N" — preserves a small mystery while still warning the player.
function nextBossChamber(){
  if(G.abyss) return null;   // abyss has its own pacing
  for(let d = G.depth+1; d<=RUN_LENGTH; d++){ if(BOSS_CHAMBERS[d]!==undefined) return d; }
  return null;
}
function bossPreviewHtml(){
  const d = nextBossChamber(); if(!d) return '';
  const pool = BOSS_POOL[BOSS_CHAMBERS[d]] || [];
  const turns = d - G.depth;
  const single = pool.length===1 ? BOSSES[pool[0]] : null;
  const sprKey = single ? (BOSS_SPRITE[single.name] || 'demonlord') : 'demonlord';
  const portrait = single
    ? `<img class="bp-port" src="assets/monsters/${sprKey}.png" alt="${single.name}" draggable="false">`
    : `<span class="bp-port bp-mystery">?</span>`;
  const label = single
    ? `<span class="bp-name red">${single.name}</span>`
    : `<span class="bp-name muted">Something stirs</span>`;
  const subtitle = turns<=1
    ? `<span class="amber">NEXT CHAMBER</span>`
    : `at chamber ${d} <span class="muted">&middot; ${turns} away</span>`;
  return `<div class="boss-preview" title="Boss arrives at chamber ${d}${single?': '+single.name:''}">
    ${portrait}
    <div class="bp-text">${label}<br><span class="bp-sub">${subtitle}</span></div>
  </div>`;
}
function worldBar(){ const parts=[];
  if(heatActive()&&G.heat>0){ const t=heatTier(); const lbl=['',' WARM',' ASHEN',' MOLTEN',' BLAZING',' OVERHEAT'][t]; const c=['#ffcf4d','#ffcf4d','#ff9a3c','#ff5c6a','#ff2a2a','#ff0028'][t];
    const hp=t>=3?' pulse-heat':'';   // the Furnace turns hostile — the meter throbs from MOLTEN up
    parts.push(`<span class="wmeter clickable${hp}" data-info-concept="heat" style="color:${c}">&#128293; HEAT ${G.heat}/${HEAT_MAX}${lbl?' — '+lbl.trim():''}</span>`); }
  if(miasmaActive()&&G.miasma>0){ const t=miasmaTier(); const lbl=['','WATCHED','WOUNDS RESIST','HUNGERING','SOUL ROT','BLEEDING','DECAYING'][Math.min(6,t)];
    const c=['#b394d9','#c47bff','#b454f0','#a23add','#8a1ec6','#7800b8','#6a009a'][Math.min(6,t)];
    const pulse=t>=2?' pulse-mia':'';   // the corruption is in your blood — it throbs from tier 2 up
    parts.push(`<span class="wmeter clickable purple${pulse}" data-info-concept="miasma" style="color:${c}">&#9763; MIASMA ${G.miasma}/99${lbl?' &mdash; '+lbl:''}</span>`); }
  if(G.debt>0){ parts.push(`<span class="wmeter clickable amber" data-info-concept="timedebt">&#8987; DEBT ${G.debt}${G.collectorEta>0?' — Collector ETA '+G.collectorEta:''}</span>`); }
  if(G.abyss){ const dc=deepColdDamage(); const t=dcTier();
    const lbl=['SETTLING','CREEPING','DEEPENING','CRUSHING','ABSOLUTE'][t];

  if(!parts.length)return '';

function makeGroup(depth){
  let count=1; const r=rnd(100);
  if(depth>=12){ count=r<12?1:r<46?2:r<84?3:4; }
  else if(depth>=6){ count=r<26?1:r<64?2:r<92?3:4; }
  else if(depth>=3){ count=r<44?1:r<84?2:3; }
  else { count=r<68?1:2; }
  count+=G.mods.packBonus; count=clamp(count,1,4);
  return Array.from({length:count},()=>({base:pick(ENEMIES),affix:rollAffix(depth)}));
}
function rollAffix(depth){
  // Front-load: every run, the first elite of the run is guaranteed somewhere in chambers 3–5 so the
  // opening zone has at least one stranger-than-trash thing to chew on. Reviewer feedback was that
  // the opening felt too flat — pure-trash chamber 1, pure-trash chamber 2, fine. Pure-trash 3-4-5
  // breaks the rhythm. Once that first elite has been placed, the curve returns to normal.
  if(!G._earlyEliteSeen && depth>=3 && depth<=5){
    G._earlyEliteSeen=1; return pick(AFFIXES);
  }
  let p=4+depth*1.1; p*=G.mods.eliteMul;
  if(depth>=3 && depth<=6) p=Math.max(p,16);   // first-zone elite floor
  const a = chance(p)?pick(AFFIXES):null;
  if(a) G._earlyEliteSeen=1;
  return a;
}

    art:"  .-?-.\n ( >< )\n  )~~~( \n  /|x|\\",
    _peek:'Something ahead is shaped like an echo, but it is the wrong number of dimensions.',
    text:'It is one of you &mdash; you can tell by the walk, even folded wrong like this: too many joints, the face running a half-second behind the head. This far down, the echoes do not come back as people. They come back as the idea of having been one.',
    options:[
      {label:'"How far did you get?"',desc:'Ask',run:p=>'It answers in your own voice, a half-second before its mouth moves. <span class="shout-purple">"Further than this. Not far enough. There is no far enough &mdash; that is the joke."</span>'+knows},
      {label:'Consume it',desc:'It is a piece of you &middot; risk',run:p=>{ addMiasma(10); p.essence+=24; SFX.play('kill'); return 'You consume it. It does not scream &mdash; it agrees. For a moment you remember a chamber you have never walked, in detail, and then you do not. (+24 essence, the cold thickens)'; }},
      {label:'Walk through it',desc:'It is not really there',run:p=>'You step through the place it is standing. It does not move aside. You simply end up on the far side of it, and so does it, and neither of you remarks on the matter.'},
    ]}); }
function discoveryRoom(depth){
  if(G._discRolled) return null;     // at most ONE discovery attempt per corridor (first door only)
  G._discRolled=1;
  // The one-per-run cap is lifted in the Abyss — past the throne the world is SUPPOSED to keep
  // breaking. Per-corridor + rarity + condition gates still keep abyss discoveries occasional.
  if((G._discoveryEntered && !G.abyss) || BOSS_CHAMBERS[depth]!==undefined) return null;
  for(const d of DISCOVERIES){
    if(d.once && discSeen(d.id)) continue;
    if(!d.when()) continue;
    if(!rarityRoll(d.tier)) continue;
    const ev=d.build();
    return {type:'event', ev, peek:ev._peek||'Something here is not like the other rooms.', _discovery:1, _discId:d.id, _discOnce:!!d.once};
  }
  return null;
}
function makeRoom(depth){
  if(BOSS_CHAMBERS[depth]!==undefined){ const key=pick(BOSS_POOL[BOSS_CHAMBERS[depth]]);
    return {type:'enemy',boss:key,peek:peek(depth===RUN_LENGTH?'bossFinal':'boss')}; }
  // First-run scripted beats — at most one is taken from a corridor (the FIRST door rolled);
  // the rest of the corridor's doors keep their natural variety so the player still chooses.
  if(G._firstRelicQueued && depth===2 && !G._firstRelicPlaced){ G._firstRelicPlaced=1; G._firstRelicQueued=0;
    return {type:'relic',peek:peek('relic')}; }
  if(G._firstEventQueued && depth===4 && !G._firstEventPlaced){ G._firstEventPlaced=1; G._firstEventQueued=0;
    return {type:'event',ev:pickEvent(),peek:peek('event')}; }
  // The Abyss has its own signature room — a distorted echo turns up now and then in the deep, so the
  // endless game has a recurring face the main run never shows. Rare enough to stay unsettling (~8%).
  if(G.abyss && chance(4)){ const ev=distortedEchoEvent(); return {type:'event', ev, peek:ev._peek}; }
  const disc=discoveryRoom(depth); if(disc) return disc;
  if(!G.abyss&&G._echoPool&&G._echoPool.length&&chance(4)){ const e=pickEcho(depth); if(e)return {type:'echo',echo:e,peek:peek('echo')}; }
  const greedy=G.mods.greedy;
  const r=rnd(100);
  // Combat dominates. Lore is rare and special — meeting someone should mean something.
  if(r<(greedy?58:62)){ const g=makeGroup(depth); return {type:'enemy',group:g,peek:groupPeek(g)}; }
  if(r<(greedy?72:74)) return {type:'chest',peek:peek('chest')};
  if(r<82) return {type:'relic',peek:peek('relic')};
  if(r<90) return {type:'event',ev:pickEvent(),peek:peek('event')};
  if(r<(greedy?94:93)) return {type:'merchant',peek:peek('merchant')};
  if(r<95) return {type:'forge',peek:peek('forge')};
  if(r<97) return {type:'shrine',peek:peek('shrine')};
  if(r<99) return {type:'fountain',peek:peek('fountain')};
  return {type:'empty',peek:peek('empty')};
}
function pickEvent(){
  const p=G.player;
  const gateOk=e=>!e.available || e.available(p);
  let avail=EVENTS.filter(e=>!G.seenEvents.includes(e.id) && gateOk(e));
  if(!avail.length){ G.seenEvents=[]; avail=EVENTS.filter(gateOk); }
  if(!avail.length) avail=EVENTS;
  // Mystery zone-bias: ~78% chance the event is one tagged for THIS zone (the NPC drip).
  // The mystery layer needs to actually surface — these encounters carry the story.
  const z=G.abyss?3:zoneOf(G.depth);
  const zoneMatch=avail.filter(e=>e.zone===z);
  if(zoneMatch.length && chance(78)) avail=zoneMatch;
  const e=pick(avail); G.seenEvents.push(e.id); return e;
}

function loadLastDeath(){ try{ return JSON.parse(localStorage.getItem('crypt_last_death')||'null'); }catch(e){ return null; } }
function clearLastDeath(){ try{ localStorage.removeItem('crypt_last_death'); }catch(e){} }
function postDeathLine(d){
  if(!d) return null;
  // priority order: boss > abyss > victory > deep cause > shallow > class > generic
  const cands = [];
  if(d.boss && POST_DEATH_LINES['boss_'+d.boss]) cands.push(POST_DEATH_LINES['boss_'+d.boss]);
  if(d.abyss && POST_DEATH_LINES.abyss) cands.push(POST_DEATH_LINES.abyss);
  if(d.won && POST_DEATH_LINES.victory) cands.push(POST_DEATH_LINES.victory);
  if(d.depth <= 5 && POST_DEATH_LINES.shallow) cands.push(POST_DEATH_LINES.shallow);
  if(d.cause && POST_DEATH_LINES[d.cause]) cands.push(POST_DEATH_LINES[d.cause]);
  if(d.cls && POST_DEATH_LINES['cls_'+d.cls]) cands.push(POST_DEATH_LINES['cls_'+d.cls]);
  if(!cands.length) cands.push(POST_DEATH_LINES.null);
  // weight toward the most specific (first added)
  const idx = Math.min(cands.length-1, Math.floor(Math.random()*Math.random()*cands.length));
  return pick(cands[idx]);
}
// "THE DUNGEON REMEMBERS" — a single first-corridor line that surfaces a real
// stat from the player's run history.  Picks one of 4-5 facts about them and
// templates a whisper, so the very FIRST step into the crypt on run 2+ feels
// like the world acknowledges the previous attempts.  Returns null if there's
// nothing interesting to say (run 1) — caller checks.
function dungeonMemoryLine(){
  const r=loadRecords(); const runs=r.runs||0; if(runs<=0) return null;
  const wins=r.wins||0, deepest=r.deepest||0, deaths=Math.max(0,runs-wins);
  const bossKills=r.bossKills||{}, killedBosses=Object.keys(bossKills);
  const cands=[];
  if(wins>0) cands.push(`The crypt knows your face. It has watched you win before. <b class="amber">${wins}</b> time${wins===1?'':'s'}.`);
  if(deaths>=3) cands.push(`You have died here <b class="red">${deaths}</b> times. The stone is no longer surprised when you arrive.`);
  if(deaths===1) cands.push(`Last time, you did not climb back out. The crypt notices the difference.`);
  if(deepest>=15) cands.push(`Something in the deeper dark is sharpening. You have been there before. It remembers.`);
  if(deepest>0&&deepest<10) cands.push(`The first chambers know your weight. The deeper rooms have not met you yet.`);
  if(killedBosses.length>=2) cands.push(`Two of the wardens you have killed are still being mourned somewhere. You will not be mourned in here.`);
  if(killedBosses.includes('dragon')) cands.push(`The dragon-bones in the eighth chamber were once warm. You made them cold.`);
  if(killedBosses.includes('king')) cands.push(`The King's chair is empty because of you. The chair will be filled again. It always is.`);
  if(!cands.length) cands.push(`You have been here before. The walls have not.`);
  return '&#127744; ' + pick(cands);
}
function deathReturnHtml(){
  const d = loadLastDeath(); if(!d) return '';
  const line = postDeathLine(d); if(!line) return '';
  // The greeting header changes if the player WON the previous run vs DIED.
  const heading = d.won
    ? '<span class="amber">&#9819; THE CRYPT REMEMBERS YOUR VICTORY.</span>'
    : '<span class="purple">&#127744; THE CRYPT REMEMBERS YOUR DEATH.</span>';
  const where = d.won
    ? (d.abyss?`fell at depth ${d.depth}, beyond the throne`:`retired at chamber ${d.depth}`)
    : `died at chamber ${d.depth}`;
  // Mark the line as consumed so it doesn't fire twice for the same death.
  clearLastDeath();
  return `<div class="death-return fade">
    <div class="dr-head">${heading}</div>
    <div class="dr-where muted">A ${CLASSES[d.cls]?CLASSES[d.cls].name:'champion'} ${where}.</div>
    <div class="dr-line">&ldquo;${line}&rdquo;</div>
  </div>`;
}
function saveEcho(){ const p=G.player; if(!p)return; const cause=topCause();
  const items=SLOTS.map(s=>p.equip[s]).filter(Boolean).sort((a,b)=>(b.rarity*100+b.ilvl)-(a.rarity*100+a.ilvl));
  let item=null; try{ item=items[0]?JSON.parse(JSON.stringify(items[0])):null; }catch(e){}
  const snap={depth:G.depth,cls:p.cls,level:p.level,item,relic:p.relics.length?pick(p.relics):null,cause:cause||'null',line:echoLine(cause),monster:chance(15),t:Date.now()};
  let arr=loadEchoes(); arr.push(snap); if(arr.length>12)arr=arr.slice(-12);
  try{ localStorage.setItem('crypt_echoes',JSON.stringify(arr)); }catch(e){}
  // ALSO stash a single "last death" record so the title screen on the NEXT load can
  // greet the player with a Hades/Neow-style line keyed to how they died.  Per the
  // research report, "every death must fire at least one piece of content the player
  // hasn't seen" — this is the smallest viable lift of that idea (~50 lines of text,
  // no character system, no per-NPC tree).
  try{
    const last={ cause:cause||'null', depth:G.depth, cls:p.cls, won:!!p.won, abyss:!!G.abyss,
                 boss:G._pendingBossDeath||G._lastBossKilled||null, t:Date.now() };
    localStorage.setItem('crypt_last_death', JSON.stringify(last));
  }catch(e){}
}
function pickEcho(depth){ const pool=G._echoPool||[]; if(!pool.length)return null;

function statusFooter(){ const p=G.player; return `<div class="footer">LV ${p.level} &middot; HP ${p.hp}/${p.maxHp} &middot; MP ${p.mana}/${p.maxMana} &middot; ${p.potions} potion(s) &middot; <span class="amber">${p.gold}g</span> &middot; <span class="teal">${p.essence} ${ESS}</span> &middot; ${p.relics.length} relic(s)</div>`; }
function openDoor(i){ if(navBusy())return; const door=G.doors[i]; if(!door)return; navLock(door.boss?620:300); SFX.play('door'); G.room=door;
  // Fade the recency-weighted damage ledger each chamber so the death recap weighs the last few
  // chambers, not the whole run. ~0.45/chamber => effectively a 3-4 chamber window.
  if(G.dmgRecent){ for(const k in G.dmgRecent){ G.dmgRecent[k]*=0.45; if(G.dmgRecent[k]<0.5)delete G.dmgRecent[k]; } }
  // A rare discovery only "counts" against the one-per-run cap once the player actually enters it.
  if(G.room._discovery && !G._discoveryEntered){ G._discoveryEntered=1; if(G.room._discOnce)markDisc(G.room._discId); }
  // crossing a threshold stokes the Furnace / lets the cold seep deeper / debt compounds
  addHeat(2); addMiasma(1); tickDebt();
  if(worldOnEnter()){ return; }   // environmental hazards can be lethal
  if(G.room.type==='event'){ G.room.outcome=null; G.screen='event'; } else G.screen='room'; render(); playTransition(G.room.boss?'#6e0d1a':(ROOM_TINT[G.room.type]||'#1c1c30'), G.room.boss); }
/* environmental pressure applied on entering a chamber; returns true if it killed you.
   Every damaging tick fires a popup — the player must see what hit them. */
function worldOnEnter(){ const p=G.player; if(!p)return false; let dead=false,msg='',popups=[];
  if(heatActive() && G.heat>=10){
    const d=heatChamberDamage();
    dead=hurt(p,d,'heat');
    const t=heatTier();
    const verb=t>=5?'SCORCHES':t>=4?'BLAZES through':t>=3?'BAKES':t>=2?'sears':'singes';
    msg=`&#128293; HEAT ${G.heat} &mdash; the Furnace ${verb} you (-${d} HP).`;
    if(d>0){ SFX.play('hurt'); popups.push({title:'THE FURNACE BURNS YOU',body:`<p class="shout-red" style="font-size:12px;line-height:1.7">The Furnace ${verb} you for <b>${d} HP</b>.</p><p class="muted" style="font-size:10px;line-height:1.7;margin-top:6px">Heat ${G.heat} &mdash; chamber crossings cost <b>${d}</b> HP. Cool down or you die in your boots.</p>`}); }
  }
  if(!dead && miasmaActive()){ const t=miasmaTier();
    // ONE message per chamber, the tier the player is CURRENTLY at — not a stack of every
    // threshold they crossed. Balance is preserved: at t>=3 the rot still trims max HP; at t>=4+
    // we add the highest applicable hit on top of it (so a tier-6 chamber stings as before, but
    // the player sees one beat ("DECAY") instead of three queued popups in sequence).
    if(t>=3){
      const rot=2+Math.floor(t/2); p.maxHp=Math.max(24,p.maxHp-rot); p.hp=clamp(p.hp,0,p.maxHp);
      // Hit damage scales by tier: t6=18+rnd(10), t5=12+rnd(9), t4=7+rnd(7), t3=0 (rot only).
      let hit=0; if(t>=6)hit=18+rnd(10); else if(t>=5)hit=12+rnd(9); else if(t>=4)hit=7+rnd(7);
      if(hit>0) dead=hurt(p,hit,'miasma')||dead;
      SFX.play('hurt');
      // One title + body per tier — escalating, not stacking.
      const beats={
        3:{ title:'SOUL ROT',           msg:`&#9763; MIASMA &mdash; Soul Rot eats ${rot} from your max HP.`,
            body:`<p class="shout-purple" style="font-size:12px;line-height:1.7">The cold gnaws on you. You lose <b>${rot}</b> max HP &mdash; permanently, until you cleanse it.</p>` },
        4:{ title:'THE COLD DRINKS FROM YOU', msg:`&#9763; MIASMA &mdash; the cold drinks ${hit} HP and eats ${rot} from your max.`,
            body:`<p class="shout-purple" style="font-size:12px;line-height:1.7">The miasma reaches in and takes <b>${hit} HP</b>. <span class="muted">Your max HP drops by ${rot} until you cleanse.</span></p>` },
        5:{ title:'YOU COME UNDONE',    msg:`&#9763; MIASMA &mdash; you come undone (-${hit} HP, -${rot} max).`,
            body:`<p class="shout-purple" style="font-size:12px;line-height:1.7">The cold takes <b>${hit} HP</b>. You can feel the seams.<br><span class="muted">Your max HP rots by ${rot} until you cleanse.</span></p>` },
        6:{ title:'DECAY',              msg:`&#9763; MIASMA &mdash; the cold has nothing left of you (-${hit} HP, -${rot} max).`,
            body:`<p class="shout-purple" style="font-size:12px;line-height:1.7">There is more cold inside you than there is you. <b>${hit} HP</b>.<br><span class="muted">Max HP rots by ${rot}.</span></p>` }
      };
      const beat = beats[Math.min(6,t)];
      msg = beat.msg; popups.push({title:beat.title, body:beat.body});
    }
  }
  if(!dead && G.abyss){ const dc=deepColdDamage();
    if(dc>0){ dead=hurt(p,dc,'deepcold')||dead; const fl=G.depth-RUN_LENGTH;
      const verb=fl>=28?'crushes the last warmth out of you':fl>=20?'presses the heat from your bones':'leans on you, patient and total';
      msg=`&#10052; THE DEEP COLD ${verb} (-${dc} HP).`; SFX.play('hurt');
      popups.push({title:'THE DEEP COLD',body:`<p class="shout" style="font-size:12px;line-height:1.7;color:#bcd4ff">There is no fire to cool and no rot to cleanse &mdash; only the deep, and it is heavier here. <b>${dc} HP</b>.</p><p class="muted" style="font-size:10px;line-height:1.7;margin-top:6px">The Deep Cold cannot be removed. It only grows as you fall. This is how the Abyss ends every run, eventually.</p>`}); } }
  if(msg){ G._worldMsg=msg; }
  if(popups.length){
    // Show the first popup immediately. If the tick was lethal, the LAST popup is the killer —
    // pop that one so the gameover screen is preceded by an explanation of what killed you.
    const first = (p.hp<=0||dead) ? popups[popups.length-1] : popups.shift();
    if(!(p.hp<=0||dead) && popups.length){ G._modalQueue=G._modalQueue||[]; popups.forEach(pp=>G._modalQueue.push(pp)); }
    setTimeout(()=>showInfo(first), 60);
  }
  if(p.hp<=0||dead){ SFX.play('death'); G.screen='gameover'; render(); return true; }
  return false; }

/* ============================================================
   ENEMY BUILD / SCALING
   ============================================================ */
function newStatus(){ return {burn:0,burnT:0,poison:0,poisonT:0,weak:0,weakT:0,vuln:0,vulnT:0,stunT:0,regen:0,regenT:0}; }
function freshEnemy(o){ const m=firstRunMul();
  if(m!==1){ if(o.hp)o.hp=Math.max(1,Math.round(o.hp*m)); if(o.maxHp)o.maxHp=Math.max(1,Math.round(o.maxHp*m)); if(o.atk)o.atk=Math.max(1,Math.round(o.atk*m)); }
  return Object.assign({st:newStatus(),_dead:false},o); }
function applyAffix(e,affix){
  if(!affix) return e;
  e.name=affix.tag+' '+e.name; e.elite=true;
  e.maxHp=Math.round(e.maxHp*affix.hp); e.hp=e.maxHp;
  e.atk=Math.round(e.atk*affix.atk); e.def=(e.def||0)+(affix.def||0);
  if(affix.leech)e.leech=true; if(affix.poison)e.poison=affix.poison;
  e.xp=(e.xp||6)+12; e.goldBonus=(e.goldBonus||0)+10;
  return e;
}
function scaleEnemy(unit,depth){
  const b=unit.base||unit; const f=depthFactor()*debtMul();
  let e=freshEnemy({name:b.name,sprite:b.sprite,hp:Math.round(b.hp*f*G.mods.eHp),maxHp:Math.round(b.hp*f*G.mods.eHp),
    atk:Math.round(b.atk*f),def:b.def||0,dodgy:b.dodgy,caster:b.caster,poison:b.poison,burnAtk:b.burnAtk,xp:b.xp||6,boss:false});
  if(unit.affix) applyAffix(e,unit.affix);
  // FURNACE: Heat actively transforms the locals — visible at every tier.
  if(heatActive()){ const ht=heatTier();
    if(ht>=1){
      if(!e.burnAtk) e.burnAtk=[3+ht*2,2,28+ht*14];
      else e.burnAtk=[e.burnAtk[0]+ht,e.burnAtk[1],Math.min(85,e.burnAtk[2]+ht*8)];
      // At Heat 50+ the name carries the threat so the player can see it.
      if(ht>=2 && !e.name.match(/Ashen|Molten|Blazing|Living Furnace/)){
        const prefix=ht>=4?'Blazing ':ht>=3?'Molten ':'Ashen ';
        e.name=prefix+e.name;
      }
      // At Heat 50+ everyone hits harder.
      if(ht>=2) e.atk=Math.round(e.atk*(1+(ht-1)*0.08));
      // At Heat 75+ they're tougher too.
      if(ht>=3){ e.hp=Math.round(e.hp*1.1); e.maxHp=e.hp; }
    }
  }
  // FROZEN BELOW / DEEP: enemies are armored, hardier, and shrug off flame.
  // Ramp the buff in over the first few chambers of the zone so the ch21 transition isn't a wall
  // (full strength by ~4 chambers into the Frozen Below / always full in the Abyss).
  if(miasmaActive()){ e.frozen=true;
    const into = G.abyss ? 99 : Math.max(0, G.depth - 20);   // 1..n chambers into zone 2
    const ramp = Math.min(1, into/4);
    e.def=(e.def||0)+Math.round(3*ramp);
    const hpMul=1+0.15*ramp; e.maxHp=Math.round(e.maxHp*hpMul); e.hp=e.maxHp; }

}
function cloneBoss(key){ const b=BOSSES[key]; const e=Math.max(0,G.depth-10); const dm=debtMul();
  const hpF=(1+e*0.07+e*e*0.0058)*dm, atkF=(1+e*0.05+e*e*0.0033)*dm;
  const boss=freshEnemy({...b,hp:Math.round(b.hp*hpF),maxHp:Math.round(b.hp*hpF),atk:Math.round(b.atk*atkF),cry:bossCryFor(key),_key:key});
  // FURNACE BOSSES feed on Heat. Walk in hot and they hit harder, hold more HP, ignite you.
  if(heatActive() && heatTier()>=3 && (key==='warden'||key==='dragon')){
    const m=1+(heatTier()-2)*0.20;
    boss.atk=Math.round(boss.atk*m); boss.hp=Math.round(boss.hp*m); boss.maxHp=boss.hp;
    if(!boss.burnAtk) boss.burnAtk=[12,3,65];
    else boss.burnAtk=[boss.burnAtk[0]+4,boss.burnAtk[1],Math.min(90,boss.burnAtk[2]+15)];
    boss._heatFed=heatTier();

function findBase(n){ return ENEMIES.find(e=>e.name===n); }
function buildEnemies(room){
  let list;
  if(room.boss){ list=[cloneBoss(room.boss)];
    (BOSSES[room.boss].adds||[]).forEach(n=>list.push(scaleEnemy({base:findBase(n)},Math.max(1,G.depth-3)))); }
  else list=room.group.map(u=>scaleEnemy(u,G.depth));
  // ADJACENCY: a forge next door tempers them in metal; nearby fire ignites them
  if(room.metal) list.forEach(e=>{ e.def=(e.def||0)+4; e.name='Iron-Clad '+e.name; });
  if(room.ignited) list.forEach(e=>{ if(!e.burnAtk)e.burnAtk=[6,3,55]; });
  return list;
}

function avoidRoom(){ const p=G.player,extra=(G.room.group?G.room.group.length-1:0);
  const base=p.cls==='ranger'?70:42;
  if(chance(base-extra*10)){ SFX.play('door'); proceed('You slip past unseen.'); }
  else { const dmg=9+rnd(10)+Math.round(G.depth*1.8); SFX.play('hurt');
    if(hurt(p,dmg,'enemy')){SFX.play('death');G.screen='gameover';return render();}
    showInfo({title:'CAUGHT &mdash; SNEAK PAST FAILED',body:`<p class="shout-red" style="font-size:11px;line-height:1.8">They saw you turn your back. <b>You take ${dmg} damage</b> on the way out.</p>`});
    proceed(`Caught! You take ${dmg} escaping.`); } }
function leaveRoom(){ proceed('You move on.'); }
function restEmpty(){ heal(G.player,6); G.player.mana=clamp(G.player.mana+4,0,G.player.maxMana); proceed(); }
function shrine(k){ const p=G.player; let m='';
  if(k==='heal'){ if(miasmaActive()&&G.miasma>0){ cleanse(18); m=' The altar burns the corruption from you (-18 miasma).'; } heal(p,Math.round(p.maxHp*0.36)); p.mana=clamp(p.mana+Math.round(p.maxMana*0.36),0,p.maxMana); SFX.play('heal'); }
  if(k==='power'){ p.atk+=4; selfHurt(p,12,'self'); coolHeat(20); SFX.play('upgrade'); }
  if(k==='ward'){ p.def+=3; p.maxHp+=8; heal(p,8); SFX.play('upgrade'); }
  proceed(m); }
function takeRelic(i){ const rl=G.room.options[i]; gainRelic(G.player,rl); proceed(`Relic claimed: ${rl.name}!`); }
function drinkFountain(){ const p=G.player,roll=rnd(100); const cl=miasmaActive()&&G.miasma>0; const clTxt=()=>{ if(cl){cleanse(28);coolHeat(15);return ' Purified — the crypt loosens its grip (-28 miasma).';} coolHeat(20); return ''; };
  if(roll<50){ const h=Math.round(p.maxHp*0.38); heal(p,h); p.mana=clamp(p.mana+Math.round(p.maxMana*0.32),0,p.maxMana); SFX.play('heal'); proceed(`Blessed water! +${h} HP and mana restored.`+clTxt()); }
  else if(roll<80){ const c=Math.round(p.maxHp*0.20); hurt(p,c,'hazard'); if(p.hp<=0){SFX.play('death');G.screen='gameover';return render();} SFX.play('hurt');
    showInfo({title:'CURSED WATER',body:`<p class="shout-red" style="font-size:11px;line-height:1.8">The water turns to acid in your throat. <b>You take ${c} damage.</b></p>`});
    proceed(`Cursed! The water burns for ${c}.`); }
  else { p.maxHp+=12; heal(p,12); p.atk+=2; if(cl)cleanse(20); SFX.play('upgrade'); proceed('A surge of vigor! +12 max HP, +2 ATK.'+(cl?' (-20 miasma)':'')); } }

/* ---------- EVENTS ---------- */
function renderEvent(){
  const r=G.room,ev=r.ev,p=G.player;
  // First reveal of an anchor NPC this room — bump their persistent meet counter once.
  // Doors get re-rendered; without this guard the counter would tick on every render call.
  // The counter MUST tick before any text is computed so the intro reflects this meeting.
  if(!r._npcMet && ev.npc){ npcMeet(ev.npc); r._npcMet=1; }
  // Anchor NPCs put their intro text in a function so it reads current persistence; ordinary
  // events keep using a plain string. Resolve either form here.
  const evText = (typeof ev.text==='function') ? ev.text(p) : ev.text;
  // Mirror events show the player's OWN class sprite, not a hard-coded one — looking into a mirror
  // and seeing some other class was a placeholder that read as "the game forgot what I chose."
  const spriteSrc = ev.sprite && ev.sprite.mirrorPlayer ? `assets/players/${p.cls}.png` : (ev.sprite && ev.sprite.src);
  const art=ev.sprite
    ?`<img class="ev-sprite ${ev.sprite.tint||''}" src="${spriteSrc}" alt="${ev.title}" draggable="false">`
    :`<pre class="sprite teal ev-ascii">${ev.art}</pre>`;
  // Anchor NPCs (lantern keeper / cardinal / scholar / smith / prisoner / cartographer) get a teal
  // sigil + a faintly haloed panel so the player can FEEL "this is someone the crypt has been
  // keeping" without being told. Generic one-shot events keep the default look.
  const anchorMark = ev.npc ? `<div class="anchor-mark center" style="display:block;width:fit-content;margin:0 auto 6px">&#10070; RECURRING</div>` : '';
  const anchorCls  = ev.npc ? ' anchor-event' : '';
  if(r.outcome){
    app.innerHTML=`<div class="floortag">${depthLabel()}</div>${omenTag()}${worldBar()}${playerBar(p)}
      <div class="panel fade room-in${anchorCls}">${anchorMark}<h3 class="center teal" style="margin-bottom:8px">${ev.title}</h3>
        ${art}
        <p class="evtext center">${r.outcome}</p>
        <button class="btn center" onclick="proceed()"><span class="k">&#9654;</span>CONTINUE</button></div>`;
    return;
  }
  const opts=ev.options.map((o,i)=>`<button class="btn" onclick="chooseEvent(${i})"><span class="k teal">[${i+1}]</span>${o.label}<small>${o.desc}</small></button>`).join('');
  app.innerHTML=`<div class="floortag">${depthLabel()}</div>${omenTag()}${worldBar()}${playerBar(p)}
    <div class="panel fade room-in${anchorCls}">${anchorMark}<h3 class="center teal" style="margin-bottom:8px">${ev.title}</h3>
      ${art}
      <p class="evtext center">${evText}</p>${opts}
      </div>`;
}
function chooseEvent(i){ if(navBusy())return; navLock(); const r=G.room,res=r.ev.options[i].run(G.player);
  if(res===false) return;            // a battle was started
  r.outcome=res; render();
  // CONSEQUENCE POPUP — any event outcome should be impossible to miss.
  // Pops the outcome up in a modal so the player has to register what just happened.
  if(typeof res==='string' && res.length){
    showInfo({title:r.ev.title+' &mdash; outcome',body:`<p class="shout" style="font-size:11px;line-height:1.8">${res}</p>`});
  }
}

/* ---------- MERCHANT ---------- */
function renderMerchant(){
  const p=G.player;
  // First visit to this stall THIS run — bump the meet counter once. The merchant is now an anchor
  // NPC with persistent state in crypt_npc, same pattern as the Lantern Keeper / Cardinal / Scholar.
  if(!G.room._merchMet){ npcMeet('merchant'); G.room._merchMet=1; }
  if(!G.room.stock){ const rp=relicPool(p);
    // Build-biased merchant (Balatro/Spire anticipation principle): the slot the
    // merchant offers is weighted toward what the player is BUILDING.  Slots
    // that would complete a half-built armor set get a big bump; the player's
    // weapon slot gets a small bump if no weapon-upgrade has appeared yet.
    // Pure RNG is the fallback at ~30% so testers still get the occasional surprise.
    let gslot=null;
    if(chance(70)){
      const slotW={};
      // partial sets — for each set the player has 1/2 of, find the missing slot.
      const setCount={}; SLOTS.forEach(s=>{ const it=p.equip[s]; if(it&&it.set) setCount[it.set]=(setCount[it.set]||0)+1; });
      SET_ITEMS.forEach(si=>{
        const c=setCount[si.set]||0;
        if(c===1){ // we're 1 short of completing
          const have = SLOTS.some(s=>{ const it=p.equip[s]; return it&&it.set===si.set&&it.slot===si.slot; });
          if(!have) slotW[si.slot]=(slotW[si.slot]||0)+5;
        }
      });
      // empty slots get a moderate bump (filling a hole > sidegrading)
      SLOTS.forEach(s=>{ if(!p.equip[s]) slotW[s]=(slotW[s]||0)+2; });
      // affinity-matching slot bias — every slot has a base 1
      SLOTS.forEach(s=>{ slotW[s]=(slotW[s]||0)+1; });
      // weighted pick
      const keys=Object.keys(slotW); let tot=0; for(const k of keys)tot+=slotW[k];
      let r=Math.random()*tot; for(const k of keys){ if(r<slotW[k]){gslot=k;break;} r-=slotW[k]; }
    }
    if(!gslot) gslot=pick(SLOTS);
    let pm=(heatActive()&&heatTier()>=2)?1.3:1; if(G.room.discount)pm*=0.75; pm*=(G.mods.priceMul||1);   // Ascension 5: Greedy Stone
    G.room.stock={relic:rp.length?pick(rp):null, gear:makeItem(gslot,p.cls,G.depth+1), pm}; }
  const st=G.room.stock; const mc=b=>Math.round(b*(st.pm||1));
  // === THE MERCHANT'S VOICE — state-aware flavor that makes the stall feel like a person ===
  // Hook order: most psychologically loaded first.
  //   - in-debt visit (Collector marked or close)  - "your debt is showing"
  //   - many-times visitor                          - "you again. you owe a lot of people"
  //   - bought from him many times across runs     - "I'll be sad when something takes you"
  //   - skinflint (visited a lot, never bought)    - "you look but never buy"
  //   - returning this run vs returning at all     - "back so soon" vs "you. again."
  //   - first-ever visit                            - the original line
  const mst=npcState('merchant'); const met=mst.met||0; const buys=mst.buys||0; const spent=mst.spent||0;
  const runs=loadRecords().runs||0; const sameRun=(mst.lastBuyRun||0)===runs && buys>0;
  let greet, sub;
  if(G.collectorEta>0 && G.debt>=40){ greet='"Your debt is showing, traveler. I notice these things. They follow you in here too."'; sub='He does not stop arranging his wares. He does not need to look up.'; }
  else if(G.debt>=25 && met>=2){ greet='"Brave, what you owe. Or stupid. I respect both. The two are kin down here."'; sub='He weighs a coin in his palm and sets it back, gently, like a body.'; }
  else if(buys>=10){ greet='"I will be sad when something down here takes you. You are good for business, and I have stopped pretending otherwise."'; sub='He pours something into a small cup and hands it across without being asked. It is warm.'; }
  else if(met>=5 && buys<=1){ greet='"You look. You never buy. I am patient. The crypt is patient too &mdash; just slower about it."'; sub='He does not move from his stool. He has heard this conversation before.'; }
  else if(met>=4){ greet='"You again. You owe a lot of people on the surface, do not you? It is the way you stand."'; sub='He clears space on the table for you without being asked.'; }
  else if(sameRun){ greet='"Back so soon. You did not like my prices, or you found gold in something you killed?"'; sub='A small smile, the kind a man gives a regular.'; }
  else if(met===2 || met===3){ greet='"Ah. You. Coin for comfort, as we agreed."'; sub='He recognises you the way a riverbed recognises water.'; }
  else { greet='"Coin for comfort, traveler. I do not ask your name."'; sub='An old man at a stall in a place that should not have stalls.'; }
  const heatNote=(st.pm||1)>1?`<div class="center red" style="font-size:8px">The Furnace's heat has driven prices up <span class="muted">(+${Math.round(((st.pm||1)-1)*100)}%)</span>.</div>`:'';
  const item=(label,cost,sub,fn,can)=>`<button class="btn" ${can?'':'disabled'} onclick="${fn}"><span class="k amber">${cost}g</span>${label}<small>${sub}</small></button>`;
  const relicBtn=st.relic?item('Relic: '+st.relic.name,mc(70),st.relic.note,"buy('relic')",p.gold>=mc(70)):'';
  const gcost=st.gear?mc(40+st.gear.rarity*22):0;
  // Show the delta against what's equipped in that slot (same readout as the reward screen) so
  // the player can judge the buy without detouring through the inventory.
  const gearBtn=st.gear?item(itemIconHtml(st.gear)+st.gear.slot.toUpperCase()+': '+st.gear.name+' Lv'+st.gear.ilvl,gcost,gearCompareHtml(st.gear,p.equip[st.gear.slot]),"buy('gear')",p.gold>=gcost):'';
  const arrangement = (buys>=5) ? `<p class="muted center" style="font-size:8px;opacity:.75;margin-top:4px">&#9670; he has our arrangement &middot; ${spent}g spent here, across ${met} visits</p>` : '';
  app.innerHTML=`<div class="floortag">${depthLabel()}</div>${omenTag()}${worldBar()}${playerBar(p,true)}
    <div class="panel fade room-in shop-panel">
      <h3 class="center amber" style="margin:2px 0 2px">&#128176; THE MERCHANT</h3>
      <p class="evtext center" style="font-size:9px;line-height:1.7;margin:6px 4px 2px">${greet}</p>
      <p class="muted center" style="font-size:8px;line-height:1.6;opacity:.75">${sub}</p>
      <div class="coinbar"><span class="amber">&#128176; ${p.gold} GOLD</span><span class="teal">&#9670; ${p.essence}</span></div>${heatNote}
      <div class="shop-grid">
      ${item('Health Potion',mc(25),'+1 potion (40% heal in battle)',"buy('potion')",p.gold>=mc(25))}
      ${item('Healing Draught',mc(18),'restore 50% HP now',"buy('heal')",p.gold>=mc(18))}
      ${item('Mana Tonic',mc(14),'fully restore mana',"buy('mana')",p.gold>=mc(14))}
      ${item('Mystery Upgrade',mc(40),'a random permanent upgrade',"buy('upgrade')",p.gold>=mc(40))}
      </div>
      ${gearBtn}${relicBtn}
      ${arrangement}
      <button class="btn muted center" onclick="leaveRoom()"><span class="k">&#10551;</span>LEAVE SHOP</button></div>`;
}
function buy(kind){ const p=G.player,st=G.room.stock; let bought=false; let spent=0; const mc=b=>Math.round(b*(st.pm||1));

}

function upgradeGear(p,slot){ const it=p.equip[slot]; if(!it)return false;
  applyItemStats(p,it,-1);
  const oldIl=it.ilvl,newIl=oldIl+2,f=(1+(newIl-1)*0.10)/(1+(oldIl-1)*0.10);
  for(const k in it.stats) it.stats[k]=Math.max(it.stats[k]+1,Math.round(it.stats[k]*f));
  it.ilvl=newIl; if(slot==='weapon')it.dmg=it.stats.dmg||it.dmg;
  applyItemStats(p,it,+1); recomputeSets(p); recomputeAffinity(p); return true; }
function forgeUpgrade(slot){ const p=G.player,it=p.equip[slot]; if(!it)return false;
  const cost=14+it.ilvl*2; if(p.essence<cost)return false; p.essence-=cost; return upgradeGear(p,slot); }
function forgeReforge(slot){ const p=G.player,it=p.equip[slot]; if(!it||it.rarity>=4)return false;
  const cost=30+it.rarity*16; if(p.essence<cost)return false; p.essence-=cost;
  applyItemStats(p,it,-1);
  // Subtract the OLD passive's stat contribution before scaling, so reforging doesn't
  // permanently bake +12 crit / +22 mana from a prior affix into the base item.
  if(it._passiveStats){ for(const k in it._passiveStats){ it.stats[k]=Math.max(0,(it.stats[k]||0)-it._passiveStats[k]); } it._passiveStats=null; }
  // Clear any existing passive flag so a higher rarity can roll a new one.
  // Previously: items that already had a passive at Rare could never gain one at Epic/Legendary,
  // and the player silently paid essence for stat bumps only.
  if(it.passiveFlag){ removeFlag(p,it.passiveFlag); it.passiveFlag=null; it.passiveDesc=null; }
  const oldR=it.rarity,newR=oldR+1,f=RARITY[newR].mult/RARITY[oldR].mult;
  for(const k in it.stats) it.stats[k]=Math.max(it.stats[k]+1,Math.round(it.stats[k]*f));
  it.rarity=newR; let newFlag=null;
  if(RARITY[newR].passive&&!it.proc&&!it.set&&PASSIVES[passPool(slot)]){
    const pas=pick(PASSIVES[passPool(slot)]);
    if(pas.stat){ for(const k in pas.stat)it.stats[k]=(it.stats[k]||0)+pas.stat[k]; it._passiveStats=Object.assign({},pas.stat); }
    if(pas.proc&&slot==='weapon')it.proc=pas.proc;
    if(pas.flag){it.passiveFlag=pas.flag;newFlag=pas.flag;}
    it.passiveDesc=pas.desc; it.name=(pas.prefix||'')+it.name+(pas.suffix||''); }
  if(slot==='weapon')it.dmg=it.stats.dmg||it.dmg;
  applyItemStats(p,it,+1); if(newFlag)addFlag(p,newFlag); recomputeSets(p); recomputeAffinity(p); return true; }
function forgeImbue(){ const p=G.player,w=p.weapon,cost=24; if(p.essence<cost||w.proc)return false; p.essence-=cost;
  const o=pick([{proc:{burn:[7,3,55]},name:'Flaming',d:'hits may BURN'},{proc:{poison:[7,3,55]},name:'Venomous',d:'hits may POISON'},{proc:{vuln:[2]},name:'Sundering',d:'hits apply VULNERABLE'}]);
  w.proc=o.proc; w.passiveDesc=o.d; if(!/^(Flaming|Venomous|Sundering)/.test(w.name))w.name=o.name+' '+w.name; return true; }
// SOUL ESSENCE -> AFFINITY: a late-game sink that feeds the identity system instead of capping out.
function forgeAttune(path){ const p=G.player,cost=40; if(p.essence<cost)return false; p.essence-=cost;
  addAffinity(p,{[path]:2}); checkAffinityTiers(p); return true; }
// FORGE DEPTH — three new cheap-and-fast options so the Forge isn't just "upgrade your best gear":
//   SHARPEN  — escalating tiny weapon dmg bumps. 5 stacks per run, cost climbs each time.
//   WARD     — escalating tiny chest def + max-HP. 3 stacks per run, cost climbs each time.

//              Lets a high-essence build trade HP it doesn't need for more essence; pushes a

function startBattle(intro){
  const r=G.room; const enemies=r._enemies?r._enemies:buildEnemies(r);
  // Reset per-combat affinity rhythm counters so a build's beat starts fresh each fight (a Rending
  // Edge shouldn't carry over from a fight three chambers ago).
  if(G.player){ G.player._wrathStrikes=0; G.player._feintPrimed=0; G.player._veilHits=0; G.player._heatHits=0;
    // Dual artifacts — per-battle resets
    if(G.player._boneCrownStacks){ G.player.atk -= G.player._boneCrownStacks; G.player._boneCrownStacks=0; }   // strip last battle's stacks
    if(G.player.flags.mirrorVeil) G.player._mirrorPrimed=1;   // first hit of this combat is guaranteed crit
    G.player._sealedHits=0;   // Sealed Compact every-5th-hit counter
    G.player._sealedNextCrit=0;
  }
  // Ultimate charge persists across fights — saving up matters.
  const carriedCharge=(G.player&&G.player._charge!=null)?G.player._charge:0;
  G.battle={enemies,target:0,pdef:0,pdefTurns:0,evade:0,evadeTurns:0,guardDown:0,barrier:0,charge:carriedCharge,
    over:false,anim:'',animIdx:-1,usedSecond:false,floats:[],fx:[],
    stance:'bal', stanceLock:0,   // every fight starts neutral; switching commits you for 2 turns
    _bonusFragmentFired:0,        // non-boss bonus-engagement fragments capped at one per fight
    pst:newStatus(),hadBoss:enemies.some(e=>e.boss),isFinal:!G.abyss&&enemies.some(e=>BOSSES.dragon.name===e.name||BOSSES.king.name===e.name)&&G.depth>=RUN_LENGTH};
  const p=G.player;
  if(p.flags.combatRegen||p.affTier.v>=2){ G.battle.pst.regen=Math.max(2,Math.round(p.maxHp*(p.affTier.v>=4?0.065:p.affTier.v>=2?0.045:0.04))); G.battle.pst.regenT=999; }
  let bar=0; if(p.affTier.v>=3)bar+=Math.round(p.maxHp*(p.affTier.v>=4?0.44:0.22)); if(p.flags.gearBarrier)bar+=Math.round(p.maxHp*0.12); G.battle.barrier=bar;
  // If the player walks in already under 25% HP, fire the heartbeat now so the warning isn't
  // skipped just because no incoming hit crossed the boundary.
  checkLowHpHeartbeat(p);
  G.log=[];
  if(intro) blog(intro,'info');
  blog(enemies.length>1?`${enemies.length} foes block your path!`:`A ${enemies[0].name} appears!`,'info');
  const bk=enemies.find(e=>e.boss); G._curBossKey=(bk&&bk._key)||null;   // for "you again" death recognition

  const heatFed=enemies.find(e=>e._heatFed); if(heatFed){ blog(`&#128293; The Furnace howls &mdash; its keeper feeds on the heat you carried in. (+${Math.round((heatFed-2)*20)}% HP & ATK)`,'crit'); }
  G.battle.intro=true;
  // First-round intents — the player sees what every foe plans before they act.

}
